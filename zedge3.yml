          const FP_HC     = [2, 4, 4, 6, 8, 8, 12, 16];
          const FP_DM     = [2, 4, 4, 8, 8];
          function fpRand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
          // ─────────────────────────────────────────────────────────────

          (async () => {
            let browser = null;
            let context = null;

            // Profile count is set via the workflow "total_profiles" input (default: 3)
            let TOTAL_PROFILES = parseInt(process.env.TOTAL_PROFILES || "3", 10);
            if (!Number.isFinite(TOTAL_PROFILES) || TOTAL_PROFILES < 1) TOTAL_PROFILES = 1;
            let profileCountWarned = false; // Telegram warning sent once per run

            try {
              // 1. Check Limits & figure out how many uploads we can still do today
              const ZEDGE_DAILY_LIMIT = 3;
              const profileStateData = await getProfileState(TOTAL_PROFILES);
              // 3 runs per day (morning / noon / evening) - upload only 1 item per run.
              // Daily cap of ZEDGE_DAILY_LIMIT (3) is still enforced across all runs of the day.
              // v27.11: the gate raises this to 2 when a MISSED slot is merged into this window's run (UPLOADS_PER_RUN env);
              // the daily cap below still guarantees never more than 3 uploads a day.
              const UPLOADS_PER_RUN = Math.max(1, Math.min(ZEDGE_DAILY_LIMIT, parseInt(process.env.UPLOADS_PER_RUN || "1", 10) || 1));
              const remainingUploads = Math.min(UPLOADS_PER_RUN, ZEDGE_DAILY_LIMIT - profileStateData.state.totalUploadsToday);
              if (GATE_SLOTS.length) console.log(`GATE_SLOTS => this run serves schedule slot(s) [${GATE_SLOTS.map(s => "S" + (s + 1)).join(", ")}]${GATE_RETRY_SLOTS.length ? " | retry of [" + GATE_RETRY_SLOTS.map(s => "S" + (s + 1)).join(", ") + "]" : ""} | uploads this run: ${remainingUploads}`);
              let currentProfileIndex = profileStateData.nextProfileIndex;
              let perProfileLimit     = profileStateData.perProfileLimit;
              let currentState = profileStateData.state;

              console.log(`✅ Approved. Starting at profile index: ${currentProfileIndex}. Can do ${remainingUploads} upload(s) this run.`);

              // ── Read today's upload type from Firebase state ──────────────────────────────
              let dayType = profileStateData.state.uploadDayType || "AUDIO";
              const DAY_TYPE_LOGS = { AUDIO: "🎵 AUDIO (Ringtone)", WALLPAPER: "🖼️ WALLPAPER (Image)", WALLPAPER_24H: "🌅 DYNAMIC 24H WALLPAPER", WALLPAPER_DUAL: "🔒 DUAL WALLPAPER", WALLPAPER_BATTERY: "🔋 BATTERY WALLPAPER", LIVE_WALLPAPER: "🎬 LIVE WALLPAPER", CHARGING_ANIMATION: "⚡ CHARGING ANIMATION" };
              console.log(`📅 Today's upload type: ${DAY_TYPE_LOGS[dayType] || dayType} day`);

              // ── v25 MIX MODE settings (panel / app -> dashboardSettings/variety) ─────────────
              //   { enabled: bool, types: ["RINGTONE", "WALLPAPER", ...], strict: bool }
              //   enabled=false / missing -> classic one-content-type-per-day rotation above.
              let variety = null;
              try {
                const vRaw = await firebaseGet("dashboardSettings/variety");
                if (vRaw && vRaw.enabled === true) {
                  const KNOWN_CT = ["RINGTONE", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
                  let vTypes = Array.isArray(vRaw.types) ? vRaw.types.map(t => String(t || "").toUpperCase().replace(/^AUDIO$/, "RINGTONE")).filter(t => KNOWN_CT.includes(t)) : [];
                  vTypes = Array.from(new Set(vTypes));
                  if (vTypes.length < 2) vTypes = KNOWN_CT.slice();
                  const dhakaDayNo = Math.floor((Date.now() + 6 * 3600 * 1000) / 86400000);
                  const startAt = dhakaDayNo % vTypes.length;
                  const order = vTypes.map((_, i) => vTypes[(startAt + i) % vTypes.length]);
                  const vu = currentState.varietyUsed;
                  const usedToday = (vu && vu.date === currentState.lastUploadDate && Array.isArray(vu.types)) ? vu.types.slice() : [];
                  variety = { enabled: true, strict: vRaw.strict === true, types: vTypes, order, usedToday };
                  console.log(`🎨 MIX MODE ON => 3 slots = 3 different content types. Order today: ${order.join(" > ")} | used today: [${usedToday.join(", ") || "none"}] | strict: ${variety.strict}`);
                }
              } catch (vErr) {
                console.log(`variety settings read failed (${vErr.message}) - using normal day-type mode.`);
              }

              // 2. Filter UA pool by selected group then pick random fingerprint
              const UA_GROUP_SEL = (process.env.UA_GROUP || "random").toLowerCase();
              const UA_GROUPS_MAP = {
                chrome_windows: FP_USER_AGENTS.filter(u => u.includes("Windows") && u.includes("Chrome") && !u.includes("Edg/") && !u.includes("OPR/") && !u.includes("Brave") && !u.includes("Firefox")),
                edge_windows:   FP_USER_AGENTS.filter(u => u.includes("Edg/")),
                firefox:        FP_USER_AGENTS.filter(u => u.includes("Firefox")),
                chrome_macos:   FP_USER_AGENTS.filter(u => u.includes("Macintosh") && u.includes("Chrome") && !u.includes("Version/")),
                safari_macos:   FP_USER_AGENTS.filter(u => u.includes("Version/") && u.includes("Safari/605")),
                android_mobile: FP_USER_AGENTS.filter(u => u.includes("Android"))
              };
              const fpUAPool = (UA_GROUPS_MAP[UA_GROUP_SEL] && UA_GROUPS_MAP[UA_GROUP_SEL].length > 0)
                ? UA_GROUPS_MAP[UA_GROUP_SEL]
                : FP_USER_AGENTS;
              console.log(`🌐 UA Group: "${UA_GROUP_SEL}" → pool size: ${fpUAPool.length}`);
              const fpVP       = fpRand(FP_VIEWPORTS);
              const fpUA       = fpRand(fpUAPool);
              const fpHC       = fpRand(FP_HC);
              const fpDM       = fpRand(FP_DM);
              const fpRenderer = fpRand(FP_GL_RENDERERS);
              const fpVendor   = fpRand(FP_VENDORS);
              const fpNoise    = Array.from({ length: 8 }, () => Math.floor(Math.random() * 3));
              console.log(`🎭 Fingerprint: ${fpVP.width}x${fpVP.height} | HC:${fpHC} | DM:${fpDM}GB | UA:...${fpUA.slice(-50)}`);

              // 2. Start Browser ONCE for the whole run
              // ── Proxy connectivity check ──────────────────────────────
              // If a proxy was configured, verify it actually works BEFORE
              // doing anything else. If it is broken we hard-fail immediately
              // rather than silently falling back to a direct connection.
              if (proxy) {
                console.log("🔍 Verifying proxy connectivity...");
                let probeOk = false;
                let probeBrowser = null;
                try {
                  probeBrowser = await chromium.launch({
                    headless: true,
                    proxy,
                    args: ["--no-sandbox", "--disable-dev-shm-usage"]
                  });
                  const probeCtx = await probeBrowser.newContext({ ignoreHTTPSErrors: true });
                  const probePage = await probeCtx.newPage();
                  await probePage.goto("https://ipinfo.io/json", { waitUntil: "domcontentloaded", timeout: 30000 });
                  const bodyText = await probePage.locator("body").innerText();
                  if (!bodyText || !bodyText.trim().startsWith("{")) throw new Error("Unexpected response from proxy connectivity check");
                  await probeCtx.close();
                  await probeBrowser.close();
                  probeBrowser = null;
                  probeOk = true;
                  console.log("✅ Proxy connectivity verified.");
                } catch (probeErr) {
                  if (probeBrowser) await probeBrowser.close().catch(() => {});
                  console.error(`❌ Proxy connectivity check FAILED: ${probeErr.message}`);
                  console.error("🚫 A proxy was provided but is not working. Aborting — will NOT fall back to direct connection.");
                  process.exit(1);
                }
              }
              // ─────────────────────────────────────────────────────────────

              browser = await chromium.launch({
                headless: isHeadless,
                ...(proxy ? { proxy } : {}),
                args: [
                  "--no-sandbox",
                  "--disable-webrtc",
                  "--force-webrtc-ip-handling-policy=disable_non_proxied_udp",
                  "--webrtc-ip-handling-policy=disable_non_proxied_udp",
                  "--disable-blink-features=AutomationControlled",
                  "--disable-features=IsolateOrigins,site-per-process",
                  "--disable-dev-shm-usage",
                  "--no-first-run",
                  "--no-default-browser-check",
                  `--window-size=${fpVP.width},${fpVP.height}`
                ]
              });

              const tz = await getProxyTimezone(browser);

              context = await browser.newContext({
                viewport:            fpVP,
                locale:              "en-US",
                timezoneId:          tz,
                userAgent:           fpUA,
                colorScheme:         "light",
                ignoreHTTPSErrors:   true,
                recordVideo: { dir: "videos/", size: fpVP }
              });

              context.setDefaultTimeout(0);
              context.setDefaultNavigationTimeout(0);

              await context.addInitScript((fp) => {
                // Hide automation
                Object.defineProperty(navigator, "webdriver", { get: () => undefined });
                delete navigator.__proto__.webdriver;

                // Disable WebRTC
                Object.defineProperty(window, "RTCPeerConnection",       { value: undefined });
                Object.defineProperty(window, "webkitRTCPeerConnection", { value: undefined });
                Object.defineProperty(navigator, "mediaDevices",         { value: undefined });

                // Navigator fingerprint
                Object.defineProperty(navigator, "hardwareConcurrency", { get: () => fp.hc });
                Object.defineProperty(navigator, "deviceMemory",        { get: () => fp.dm });
                Object.defineProperty(navigator, "platform",            { get: () => "Win32" });
                Object.defineProperty(navigator, "languages",           { get: () => ["en-US", "en"] });
                Object.defineProperty(navigator, "language",            { get: () => "en-US" });
                Object.defineProperty(navigator, "vendor",              { get: () => "Google Inc." });
                Object.defineProperty(navigator, "maxTouchPoints",      { get: () => 0 });

                // Screen fingerprint
                Object.defineProperty(screen, "width",       { get: () => fp.sw });
                Object.defineProperty(screen, "height",      { get: () => fp.sh });
                Object.defineProperty(screen, "availWidth",  { get: () => fp.sw });
                Object.defineProperty(screen, "availHeight", { get: () => fp.sh - 40 });
                Object.defineProperty(screen, "colorDepth",  { get: () => 24 });
                Object.defineProperty(screen, "pixelDepth",  { get: () => 24 });

                // Canvas noise — subtle ±1-2 pixel shift on readback
                const _origGID = CanvasRenderingContext2D.prototype.getImageData;
                CanvasRenderingContext2D.prototype.getImageData = function(sx, sy, sw, sh) {
                  const id = _origGID.call(this, sx, sy, sw, sh);
                  const n = fp.noise;
                  for (let i = 0; i < id.data.length; i += 4) {
                    id.data[i]   = Math.min(255, id.data[i]   + n[i % 8]);
                    id.data[i+1] = Math.min(255, id.data[i+1] + n[(i+1) % 8]);
                    id.data[i+2] = Math.min(255, id.data[i+2] + n[(i+2) % 8]);
                  }
                  return id;
                };

                // WebGL vendor + renderer spoof
                const _origGP = WebGLRenderingContext.prototype.getParameter;
                WebGLRenderingContext.prototype.getParameter = function(param) {
                  if (param === 37445) return fp.vendor;    // UNMASKED_VENDOR_WEBGL
                  if (param === 37446) return fp.renderer;  // UNMASKED_RENDERER_WEBGL
                  return _origGP.call(this, param);
                };
                const _origGP2 = WebGL2RenderingContext.prototype.getParameter;
                WebGL2RenderingContext.prototype.getParameter = function(param) {
                  if (param === 37445) return fp.vendor;
                  if (param === 37446) return fp.renderer;
                  return _origGP2.call(this, param);
                };

                // Plugins spoof (non-empty list looks more human)
                Object.defineProperty(navigator, "plugins", {
                  get: () => {
                    const p = { length: 3, 0: { name: "Chrome PDF Plugin" }, 1: { name: "Chrome PDF Viewer" }, 2: { name: "Native Client" }, item: i => this[i], namedItem: n => null, refresh: () => {} };
                    return p;
                  }
                });

                // ── Font Fingerprint Noise ─────────────────────────────
                // Intercept measureText so font-probing scripts get
                // slightly randomised metrics instead of the real ones.
                const _origMT = CanvasRenderingContext2D.prototype.measureText;
                CanvasRenderingContext2D.prototype.measureText = function(text) {
                  const metrics = _origMT.call(this, text);
                  const noise = fp.noise[text.length % 8] * 0.05;
                  Object.defineProperty(metrics, "width", {
                    get: () => metrics.width + noise
                  });
                  return metrics;
                };

                // Block common font-detection APIs used by fingerprinters
                const _origFF = document.fonts ? document.fonts.check.bind(document.fonts) : null;
                if (_origFF && document.fonts) {
                  document.fonts.check = function(font, text) {
                    // Always return true — prevents font enumeration
                    return true;
                  };
                }

                // ── Audio Fingerprint Noise ────────────────────────────
                // Add imperceptible noise to AudioBuffer to break audio FP
                const _origCC = AudioBuffer.prototype.getChannelData;
                AudioBuffer.prototype.getChannelData = function(channel) {
                  const data = _origCC.call(this, channel);
                  const seed = fp.noise[channel % 8];
                  for (let i = 0; i < data.length; i += 100) {
                    data[i] += seed * 0.0000001;
                  }
                  return data;
                };

                // Also spoof AnalyserNode float data
                if (typeof AnalyserNode !== "undefined") {
                  const _origGA = AnalyserNode.prototype.getFloatFrequencyData;
                  AnalyserNode.prototype.getFloatFrequencyData = function(arr) {
                    _origGA.call(this, arr);
                    const seed = fp.noise[0] * 0.001;
                    for (let i = 0; i < arr.length; i++) {
                      arr[i] += seed;
                    }
                  };
                }

                // Background Modal/Popup Observer
                try {
                  const observer = new MutationObserver(() => {
                    try {
                      const selectors = [
                        '#didomi-host',
                        '.didomi-popup',
                        '[id*="didomi"]',
                        '[class*="didomi"]',
                        'dialog',
                        '[role="dialog"]',
                        '[class*="consent"]',
                        '[class*="cookie"]',
                        '[class*="privacy"]',
                        '[class*="modal"]',
                        '[class*="popup"]',
                        '[class*="dialog"]',
                        '[class*="overlay"]',
                        '[class*="backdrop"]',
                        '[class*="banner"]',
                        '[class*="notification"]',
                        '[class*="alert"]',
                        '[class*="announcement"]',
                        '[id*="consent"]',
                        '[id*="cookie"]',
                        '[id*="privacy"]',
                        '[id*="modal"]',
                        '[id*="popup"]',
                        '[id*="dialog"]',
                        '[id*="overlay"]',
                        '[id*="backdrop"]',
                        '[id*="banner"]'
                      ];

                      function isProtected(el) {
                        if (!el) return false;
                        if (el.querySelector("[data-hook]") || el.closest("[data-hook]")) return true;
                        
                        let current = el;
                        while (current) {
                          if (current.tagName === 'DIALOG' || 
                              current.getAttribute('role') === 'dialog' || 
                              current.classList.contains('sc-gKXOVf') ||
                              current.classList.contains('dwmyJL')) {
                            
                            if (current.id === 'didomi-host') return false;
                            
                            const text = (current.innerText || current.textContent || "").toLowerCase();
                            const uploadKeywords = [
                              "upload",
                              "wallpaper",
                              "ringtone",
                              "edit meta",
                              "publish",
                              "content policy",
                              "ownership",
                              "title",
                              "tags",
                              "category",
                              "description",
                              "success",
                              "pending",
                              "published"
                            ];
                            if (uploadKeywords.some(kw => text.includes(kw))) {
                              return true;
                            }
                          }
                          current = current.parentElement;
                        }
                        return false;
                      }

                      let killed = 0;

                      function checkAndNuke(root) {
                        if (!root) return;
                        selectors.forEach(sel => {
                          const els = root.querySelectorAll(sel);
                          els.forEach(el => {
                            if (!isProtected(el)) {
                              el.remove();
                              killed++;
                            }
                          });
                        });

                        // Traverse shadow DOMs recursively
                        const allEls = root.querySelectorAll('*');
                        allEls.forEach(el => {
                          if (el.shadowRoot) {
                            checkAndNuke(el.shadowRoot);
                          }
                        });
                      }

                      checkAndNuke(document);

                      if (killed > 0 || document.getElementById('didomi-host')) {
                        document.body.style.setProperty("overflow", "auto", "important");
                        document.documentElement.style.setProperty("overflow", "auto", "important");
                        document.body.style.setProperty("pointer-events", "auto", "important");
                        document.documentElement.style.setProperty("pointer-events", "auto", "important");
                      }
                    } catch (_) {}
                  });

                  if (document.documentElement) {
                    observer.observe(document.documentElement, { childList: true, subtree: true });
                  } else {
                    document.addEventListener("DOMContentLoaded", () => {
                      observer.observe(document.documentElement, { childList: true, subtree: true });
                    });
                  }
                } catch (_) {}
              }, {
                hc:       fpHC,
                dm:       fpDM,
                sw:       fpVP.width,
                sh:       fpVP.height,
                noise:    fpNoise,
                vendor:   fpVendor,
                renderer: fpRenderer
              });

              const page = await context.newPage();

              // Install persistent background watcher for Zedge privacy/cookie popups
              await installPrivacyPopupWatcher(page);

              await page.setExtraHTTPHeaders({
                "Accept-Language": "en-US,en;q=0.9"
              });

              // 3. BrowserLeaks check ONCE
              console.log("Opening BrowserLeaks");
              await page.goto("https://browserleaks.com/ip", { waitUntil: "domcontentloaded" });
              await page.waitForLoadState("networkidle");
              await scrollFullPage(page);
              await page.evaluate(() => window.scrollTo(0, 0));

              // 4. Login ONCE
              console.log("Opening Zedge");
              await page.goto("https://upload.zedge.net", { waitUntil: "domcontentloaded" });
              await page.waitForLoadState("networkidle");
              await page.waitForTimeout(2000);

              // Screenshot to capture exactly what the page shows before login attempt
              await page.screenshot({ path: "zedge-before-login.png", fullPage: true });
              console.log(`Page URL before login: ${page.url()}`);
              console.log(`Page title before login: ${await page.title()}`);

              // ── DIDOMI CONSENT POPUP HANDLER ──────────────────
              // Handles the Didomi cookie consent modal by clicking Accept/Close button
              // This ensures proper consent is registered with the website
              // ──────────────────────────────────────────────────────────────
              console.log("Checking for Didomi cookie consent modal...");
              
              try {
                // Wait for Didomi modal to appear (with timeout)
                const didomiModal = page.locator('#didomi-host');
                await didomiModal.waitFor({ state: 'attached', timeout: 5000 }).catch(() => {});
                const modalVisible = await didomiModal.isVisible().catch(() => false);
                
                if (modalVisible) {
                  console.log("✅ Didomi consent modal detected - handling cookie consent...");
                  
                  // Try to click Accept/Close button
                  const acceptButton = page.locator('#didomi-notice-agree-button');
                  const acceptExists = await acceptButton.isVisible({ timeout: 3000 }).catch(() => false);
                  
                  if (acceptExists) {
                    console.log('Clicking "Accept All Cookies" or "Close" button...');
                    await acceptButton.click();
                    await page.waitForTimeout(1000);
                    console.log('✅ Successfully clicked Accept/Close button');
                  } else {
                    // Fallback: Try "Do not Share/Sell" button if Accept not found
                    const learnMoreButton = page.locator('#didomi-notice-learn-more-button');
                    const learnMoreExists = await learnMoreButton.isVisible({ timeout: 2000 }).catch(() => false);
                    
                    if (learnMoreExists) {
                      console.log('Clicking "Do not Share or Sell my Personal Information" button...');
                      await learnMoreButton.click();
                      await page.waitForTimeout(1000);
                      console.log('✅ Successfully clicked "Do not Share or Sell" button');
                    } else {
                      console.log('⚠️ No clickable Didomi buttons found - modal may require manual intervention');
                    }
                  }
                  
                  // Verify modal is gone
                  await page.waitForTimeout(500);
                  const stillVisible = await didomiModal.isVisible().catch(() => false);
                  if (!stillVisible) {
                    console.log("✅ Didomi consent modal successfully dismissed");
                  } else {
                    console.log("⚠️ Modal may still be visible, proceeding anyway...");
                  }
                } else {
                  console.log("ℹ️ No Didomi consent modal detected (already dismissed or not present)");
                }
              } catch (err) {
                console.error("⚠️ Error handling Didomi consent:", err.message);
                console.log("Attempting to proceed with login anyway...");
              }

              // v27.11.4: network-level login confirmation (from HAR of a logged-in session). Right after a successful
              // login the SPA calls POST /auth/token -> {accessToken, expiresAt} and GET /auth/user-info?scope=user ->
              // {email, username, expiresAt}. Both are cookie-session based, so we listen for them AND poll user-info
              // ourselves from inside the page - this works even when the dashboard / bell icon renders late or not at all.
              const loginNet = { via: null, email: null, username: null };
              page.on("response", (res) => {
                try {
                  const u = res.url();
                  if (res.status() !== 200) return;
                  if (u.indexOf("upload.zedge.net/auth/user-info") >= 0) {
                    res.json().then((j) => { if (j && j.email) { loginNet.via = "network:/auth/user-info"; loginNet.email = j.email; loginNet.username = j.username || null; } }).catch(() => {});
                  } else if (u.indexOf("upload.zedge.net/auth/token") >= 0) {
                    res.json().then((j) => { if (j && j.accessToken) { if (!loginNet.via) loginNet.via = "network:/auth/token"; } }).catch(() => {});
                  }
                } catch (_) {}
              });

              await safeClickWithPopupRecovery(
                page,
                page.locator('[data-hook="za-login-email"]').first(),
                "Continue with Email",
                30000,
                5
              );

              await safeType(
                page.locator('[data-hook="form-field-email-input"]'),
                zedgeEmail,
                "email"
              );

              await safeClick(
                page.locator('button[data-hook="za-submit"]'),
                "Continue"
              );

              await safeType(
                page.locator('[data-hook="form-field-password-input"]'),
                zedgePassword,
                "password"
              );

              await safeClick(
                page.locator('button[data-hook="za-submit"]'),
                "Login"
              );

              console.log("Waiting for login success (auth/user-info API + dashboard / profiles / bell icon)");
              // v27.11.3/v27.11.4: the bell icon alone is NOT a reliable login signal. Login is confirmed by (in order):
              //   1. network: GET /auth/user-info?scope=user answered 200 with {email} (or POST /auth/token with accessToken)
              //   2. active probe: fetch("/auth/user-info?scope=user") from inside the page with the session cookie -> {email}
              //   3. DOM: "Dashboard" + input[name="period"], UNLOCKS/USERS/NET REVENUE cards, "All profiles" filter,
              //      Profiles nav link, /profiles URL, bell icon
              // A visible login error (wrong password, captcha, locked) fails fast instead of waiting 4 minutes.
              const loginSuccessSignal = () => {
                const vis = (el) => !!el && !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
                const txt = (el) => ((el && el.textContent) || "").replace(/\s+/g, " ").trim();
                const all = (sel) => Array.from(document.querySelectorAll(sel));
                const has = (sel, t) => all(sel).some((el) => vis(el) && (t ? txt(el).toUpperCase() === t : true));
                const body = ((document.body && document.body.innerText) || "").replace(/\s+/g, " ");
                const loginFormOpen = has('[data-hook="form-field-password-input"]') || has('[data-hook="form-field-email-input"]') || has('[data-hook="za-login-email"]');
                if (has('input[name="period"]') && /\bDashboard\b/.test(body)) return "dom:dashboard-period-picker";
                if (has("span", "NET REVENUE") || has("span", "UNLOCKS") || has("span", "USERS")) return "dom:dashboard-revenue-cards";
                if (has('input[name="profiles"]') || /\bAll profiles\b/.test(body)) return "dom:dashboard-profiles-filter";
                if (has('svg[data-icon="bell"]')) return "dom:bell-icon";
                if (!loginFormOpen && all('a[href*="/profiles"]').some(vis)) return "dom:profiles-nav-link";
                if (!loginFormOpen && /\/profiles(\/|$)/.test(location.pathname)) return "dom:profiles-url";
                const err = body.match(/(invalid (email|password|credentials)|incorrect (email|password)|wrong password|password (is|was) (incorrect|invalid)|account (is |has been )?(locked|disabled|suspended)|too many attempts|verify your email|captcha)/i);
                if (err && loginFormOpen) return "ERROR:" + err[0];
                return false;
              };
              // Probe runs inside the page so the httpOnly session cookie is sent automatically.
              const probeUserInfo = () => fetch("/auth/user-info?scope=user", { credentials: "include", cache: "no-store", headers: { "content-type": "application/json" } })
                .then((r) => (r.ok ? r.json().then((j) => ({ status: r.status, email: j && j.email || null, username: j && j.username || null })) : { status: r.status, email: null }))
                .catch((e) => ({ status: 0, email: null, err: String(e && e.message || e) }));
              let loginSignal = null;
              let loginUser = null;
              const loginDeadline = Date.now() + 4 * 60 * 1000;
              let loginProbes = 0;
              while (!loginSignal && Date.now() < loginDeadline) {
                if (loginNet.via && (loginNet.email || loginNet.via === "network:/auth/token")) {
                  loginSignal = loginNet.via; loginUser = loginNet.email;
                  if (!loginUser) { const p = await page.evaluate(probeUserInfo).catch(() => null); if (p && p.email) { loginUser = p.email; loginSignal = "network:/auth/token+probe"; } }
                  break;
                }
                const probe = await page.evaluate(probeUserInfo).catch(() => null);
                loginProbes++;
                if (probe && probe.email) { loginSignal = "api:/auth/user-info"; loginUser = probe.email; break; }
                const dom = await page.evaluate(loginSuccessSignal).catch(() => false);
                if (dom) { loginSignal = dom; break; }
                if (loginProbes % 10 === 1) console.log("  ...still waiting for login (user-info status " + (probe ? probe.status : "n/a") + ", url " + page.url() + ")");
                await page.waitForTimeout(2000);
              }
              if (!loginSignal) {
                await page.screenshot({ path: "zedge-login-stuck.png", fullPage: true }).catch(() => {});
                const bodyText = await page.evaluate(() => (document.body && document.body.innerText || "").slice(0, 400)).catch(() => "");
                throw new Error("LOGIN_STUCK => Zedge did not confirm login within 4 min (no /auth/user-info session, no dashboard). Possible captcha / verification / wrong password / site slow. URL: " + page.url() + (bodyText ? " | page: " + bodyText.replace(/\s+/g, " ").slice(0, 300) : ""));
              }
              if (typeof loginSignal === "string" && loginSignal.indexOf("ERROR:") === 0) {
                await page.screenshot({ path: "zedge-login-stuck.png", fullPage: true }).catch(() => {});
                throw new Error("LOGIN_FAILED => Zedge showed a login error: \"" + loginSignal.slice(6) + "\" (check ZEDGE_EMAIL / ZEDGE_PASSWORD secrets). URL: " + page.url());
              }
              console.log("✅ Login success detected via: " + loginSignal + (loginUser ? " (account " + loginUser + ")" : ""));
              await page.screenshot({ path: "zedge-after-login.png", fullPage: true });

              // ─────────────────────────────────────────────────────────────
              // 5. UPLOAD LOOP — repeat up to remainingUploads times
              // ─────────────────────────────────────────────────────────────
              let successCount = 0;
              let failedCount = 0;
              let removedCount = 0;
              const runStartedAt = Date.now();
              const runLabel = process.env.FOLDER_NAME || "Zedge Bot";
              const DAILY_LIMIT_UI = 3; // matches ZEDGE_DAILY_LIMIT
              const DAY_TYPE_BN = { AUDIO: "🎵 রিংটোন ডে", WALLPAPER: "🖼️ ওয়ালপেপার ডে", WALLPAPER_24H: "🌅 ২৪ ঘণ্টার ওয়ালপেপার ডে", WALLPAPER_DUAL: "🔒 ডুয়াল ওয়ালপেপার ডে", WALLPAPER_BATTERY: "🔋 ব্যাটারি ওয়ালপেপার ডে", LIVE_WALLPAPER: "🎬 লাইভ ওয়ালপেপার ডে", CHARGING_ANIMATION: "⚡ চার্জিং অ্যানিমেশন ডে" };
              const CTYPE_BN = {
                RINGTONE: "অডিও (রিংটোন)",
                WALLPAPER: "ওয়ালপেপার",
                WALLPAPER_24H: "২৪ ঘণ্টার ওয়ালপেপার সেট",
                WALLPAPER_DUAL: "ডুয়াল ওয়ালপেপার সেট",
                WALLPAPER_BATTERY: "ব্যাটারি ওয়ালপেপার সেট",
                LIVE_WALLPAPER: "লাইভ ওয়ালপেপার",
                CHARGING_ANIMATION: "চার্জিং অ্যানিমেশন"
              };
              const STATUS_UI = {
                PUBLISHED: "✅ PUBLISHED", "IN REVIEW": "🔍 IN REVIEW", PENDING: "⏳ PENDING", REJECTED: "⛔ REJECTED", UNKNOWN: "❓ UNKNOWN"
              };
              const ctypeLabel = (qi) => CTYPE_BN[qi?.contentType] || (qi?.isMp3 ? CTYPE_BN.RINGTONE : CTYPE_BN.WALLPAPER);
              // v25: Telegram day label - mix mode shows the mode + this slot's content type instead of the day type
              const dayLabelBn = (qi) => (variety && variety.enabled)
                ? `🎨 মিক্স মোড${qi && qi.varietyType ? " · " + (CTYPE_BN[qi.varietyType] || qi.varietyType) : ""}`
                : (DAY_TYPE_BN[dayType] || dayType);
              // Card-style message builder: header line + key/value rows + footer
              const tgCard = (header, rows, footer) => {
                const body = rows.filter(r => r && r[1] !== undefined && r[1] !== null && r[1] !== "").map(([k, v]) => `${k} ${v}`).join("\n");
                return [header, "━━━━━━━━━━━━━━━━", body, footer ? `\n${footer}` : ""].filter(Boolean).join("\n");
              };

              for (let i = 0; i < remainingUploads; i++) {
                let queueItem = null;
                const uploadNum = i + 1;

                console.log(`\n========================================`);
                console.log(`Upload ${uploadNum} of ${remainingUploads} | Profile Index: ${currentProfileIndex}`);
                console.log(`========================================`);

                try {
                  // Fetch the next queued item
                  const dayTypeLocked = Boolean(currentState.dayTypeLockedDate) && currentState.dayTypeLockedDate === currentState.lastUploadDate;
                  queueItem = await getNextWallpaperFromRealtimeDB(dayType, dayTypeLocked, variety);
                  if (queueItem.dayTypeSwitchedTo && queueItem.dayTypeSwitchedTo !== dayType) {
