                  }
                } catch (e) {
                  const reason = e && e.message ? e.message : String(e);
                  console.log(`Nothing to upload after ${successCount} upload(s): ${reason}`);
                  console.log("Stopping loop.");
                  // Tell the user WHY nothing was uploaded (only when this run did nothing at all)
                  if (successCount === 0 && i === 0) {
                    let why = "কিউতে আপলোড করার মতো কোনো ফাইল নেই।";
                    let hint = "💡 ড্যাশবোর্ড থেকে নতুন ফাইল অ্যাড করুন।";
                    if (/WAIT_FOR_STOCK/.test(reason)) {
                      const waitingList = (reason.match(/Waiting: \[([^\]]*)\]/) || [])[1] || "";
                      why = "কোনো কনটেন্ট টাইপের পুরো এক দিনের স্টক (৩টি ফাইল) নেই।";
                      hint = `⏳ অপেক্ষায়: <code>${tgEscape(waitingList || "-")}</code>\n💡 আরও ফাইল অ্যাড করুন অথবা ক্যালেন্ডারে ম্যানুয়ালি পিন করুন।`;
                    } else if (/DAY_LOCKED/.test(reason)) {
                      why = "আজকের কনটেন্ট টাইপের আর কোনো ফাইল কিউতে নেই। দিনের টাইপ লক থাকায় অন্য টাইপ নেওয়া হয়নি।";
                      hint = "💡 আগামীকাল রোটেশন স্বাভাবিকভাবে পরের টাইপে যাবে।";
                    }
                    if (/NO_METADATA => (\d+)/.test(reason)) {
                      const n = (reason.match(/NO_METADATA => (\d+)/) || [])[1] || "?";
                      hint += `\n⚠️ <b>${n} টি ফাইল মেটাডাটা (title/tags/category) না থাকায় স্কিপ হয়েছে</b> - অ্যাপ/প্যানেল থেকে মেটাডাটা দিন।`;
                    }
                    const idleMsg = tgCard(
                      `ℹ️ <b>আজ কোনো আপলোড হয়নি</b>`,
                      [
                        ["📁 প্রজেক্ট:", tgEscape(runLabel)],
                        ["📅 আজকের ডে:", dayLabelBn(typeof queueItem !== "undefined" ? queueItem : null)],
                        ["📝 কারণ:", why],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      hint
                    );
                    await sendTelegramNotification(idleMsg);
                  }
                  // v27.11: report the slot(s) this run could not fill so the gate retries them (if files get added later)
                  await markRemainingGateSlots(i, { status: "idle", error: String(reason).replace(/\s+/g, " ").slice(0, 200) });
                  break;
                }

                try {
                  // Navigate back to Zedge portal for each upload
                  console.log("Navigating to Zedge upload portal");
                  await page.goto("https://upload.zedge.net", { waitUntil: "domcontentloaded" });
                  await page.waitForLoadState("networkidle");

                  // Click Profiles tab
                  await safeClick(
                    page.locator('a:has-text("Profiles")').first(),
                    "Profiles"
                  );

                  // ── Profile-count guard ───────────────────────────────────────────
                  // Count how many profile cards REALLY exist on this account and never
                  // click an index that does not exist (e.g. total_profiles=3 but the
                  // account only has 1 profile -> nth(1) timeout).
                  const profileCards = page.locator('[data-hook="profile-list"] > div');
                  try { await profileCards.first().waitFor({ state: "visible", timeout: 30000 }); } catch (_) {}
                  const actualProfiles = await profileCards.count();
                  console.log(`Profiles on account: ${actualProfiles} | configured total_profiles: ${TOTAL_PROFILES}`);
                  if (actualProfiles === 0) {
                    throw new Error("No profile found on the Zedge Profiles page ([data-hook=\"profile-list\"] is empty). Create/approve a profile first.");
                  }
                  if (actualProfiles < TOTAL_PROFILES) {
                    const configured = TOTAL_PROFILES;
                    TOTAL_PROFILES = actualProfiles;
                    perProfileLimit = Math.ceil(ZEDGE_DAILY_LIMIT / TOTAL_PROFILES);
                    console.warn(`⚠️ total_profiles=${configured} but only ${actualProfiles} profile(s) exist. Using ${actualProfiles}; per-profile limit is now ${perProfileLimit}.`);
                    if (currentProfileIndex >= TOTAL_PROFILES) {
                      const fixedIdx = getNextAvailableProfile(TOTAL_PROFILES - 1, currentState.profileUploadCounts, TOTAL_PROFILES, perProfileLimit);
                      currentProfileIndex = fixedIdx === -1 ? 0 : fixedIdx;
                      console.warn(`⚠️ Profile index adjusted to ${currentProfileIndex}`);
                    }
                    if (!profileCountWarned) {
                      profileCountWarned = true;
                      try {
                        await sendTelegramNotification(tgCard(
                          `⚠️ <b>প্রোফাইল সংখ্যা মিলছে না</b>`,
                          [
                            ["📁 প্রজেক্ট:", tgEscape(runLabel)],
                            ["⚙️ total_profiles ইনপুট:", String(configured)],
                            ["👤 অ্যাকাউন্টে আছে:", String(actualProfiles)],
                            ["🕒 সময়:", fmtDhakaTime()]
                          ],
                          `✅ বট নিজে থেকে ${actualProfiles} টি প্রোফাইল ধরে চলছে।\n💡 পরের বার workflow চালানোর সময় <code>total_profiles = ${actualProfiles}</code> দিন।`
                        ));
                      } catch (_) {}
                    }
                  }
                  // ─────────────────────────────────────────────────────────────────

                  // Click the correct rotated profile
                  await safeClick(
                    profileCards.nth(currentProfileIndex),
                    `Profile Index ${currentProfileIndex}`
                  );

                  // Wait for the profile page to fully render before touching anything.
                  await page.waitForLoadState("networkidle");
                  await page.waitForTimeout(1500);

                  // Navigate directly to the correct content-type URL so we never need to
                  // interact with the unreliable type-selection modal.
                  // URL shape: .../profiles/<profileId>/content/WALLPAPER  (or AUDIO)
                  const profilePageUrl = page.url();
                  const profileBase    = profilePageUrl.replace(/\/content\/[^\/].*$/, "");
                  const ZEDGE_TYPE_URLS = {
                    RINGTONE: "AUDIO",
                    WALLPAPER: "WALLPAPER",
                    WALLPAPER_24H: "DYNAMIC_24H_WALLPAPER",
                    WALLPAPER_DUAL: "DYNAMIC_DUAL_LOCK_WALLPAPER",
                    WALLPAPER_BATTERY: "DYNAMIC_BATTERY_LEVEL_WALLPAPER",
                    LIVE_WALLPAPER: "LIVE_WALLPAPER",
                    CHARGING_ANIMATION: "CHARGE_SCREEN"
                  };
                  const itemCType = queueItem.contentType || (queueItem.isMp3 ? "RINGTONE" : "WALLPAPER");
                  const targetType = ZEDGE_TYPE_URLS[itemCType] || (queueItem.isMp3 ? "AUDIO" : "WALLPAPER");
                  const targetContentUrl = `${profileBase}/content/${targetType}`;
                  console.log(`Navigating directly to ${targetType} page: ${targetContentUrl}`);
                  await page.goto(targetContentUrl, { waitUntil: "domcontentloaded" });
                  await page.waitForLoadState("networkidle");
                  await page.waitForTimeout(1000);

                  // Click the Upload (+) button — now already on the right content-type page
                  await safeClick(
                    page.locator("svg.fa-plus").first(),
                    "Upload plus icon"
                  );

                  // Wait for upload dialog to appear
                  await page.waitForTimeout(800);
                  await page.screenshot({ path: `zedge-upload-menu-${uploadNum}.png`, fullPage: false });

                  // Upload the file(s) - 24H sets pass all 4 images at once
                  const filesForUpload = (queueItem.localFiles && queueItem.localFiles.length) ? queueItem.localFiles : queueItem.localFile;
                  await uploadWallpaperInDialog(page, filesForUpload);

                  // Fill in meta (title, tags, category, description)
                  await fillMetaDialog(page, {
                    title:       queueItem.title,
                    tags:        queueItem.tags,
                    category:    queueItem.category,
                    description: queueItem.description,
                    coverImage:  queueItem.localThumb || null
                  });

                  // Check publish status — returns {removed, statusName} instead of throwing
                  const publishResult = await verifyPublishStatus(page);

                  const finalShotPath = `zedge-final-${uploadNum}.png`;
                  await page.screenshot({ path: finalShotPath, fullPage: true });

                  // Always delete from Firebase queue and count the upload on the profile,
                  // regardless of whether it was PUBLISHED or removed (PENDING/IN REVIEW/REJECTED).
                  // Only a true technical error (catch block) skips this.
                  await markWallpaperDoneAndDelete(queueItem.id, queueItem.name, (queueItem.fileUrls && queueItem.fileUrls.length) ? queueItem.fileUrls : queueItem.fileUrl);
                  await updateProfileStateAfterUpload(currentState, currentProfileIndex);

                  // LOCK today's day type after the first rotation (non-pinned) upload,
                  // so the type can never switch mid-day.
                  // v25 MIX MODE: remember which types were uploaded today (so the other slots pick different ones)
                  if (queueItem.varietyType && variety) {
                    variety.usedToday.push(queueItem.varietyType);
                    await firebasePatch("uploadState", { varietyUsed: { date: currentState.lastUploadDate, types: variety.usedToday, updatedAt: Date.now() } });
                    console.log(`🎨 Mix mode: ${queueItem.varietyType} done - used today: [${variety.usedToday.join(", ")}]`);
                  } else if (!queueItem.isPinnedPick && currentState.dayTypeLockedDate !== currentState.lastUploadDate) {
                    await firebasePatch("uploadState", { dayTypeLockedDate: currentState.lastUploadDate });
                    currentState = { ...currentState, dayTypeLockedDate: currentState.lastUploadDate };
                    console.log(`🔒 Day type ${dayType} locked for today.`);
                  }

                  // Advance local state for next iteration
                  const profileUploadCounts = { ...(currentState.profileUploadCounts || {}) };
                  profileUploadCounts[currentProfileIndex] = (profileUploadCounts[currentProfileIndex] || 0) + 1;
                  currentState = {
                    ...currentState,
                    totalUploadsToday: currentState.totalUploadsToday + 1,
                    lastUsedProfileIndex: currentProfileIndex,
                    profileUploadCounts
                  };

                  successCount++;

                  // v27.11: confirm the REAL upload to the gate (this is what "slot done" means from now on)
                  await markGateSlot(i, { status: "uploaded", itemId: queueItem.id || null, title: String(queueItem.title || queueItem.name || "").slice(0, 120), contentType: queueItem.contentType || (queueItem.isMp3 ? "RINGTONE" : "WALLPAPER"), publish: (publishResult && publishResult.statusName) || null, uploadedDhaka: fmtDhakaTime() });
                  if (GATE_RETRY_SLOTS.includes(gateSlotFor(i))) {
                    const sN = gateSlotFor(i) + 1, t = String(queueItem.title || queueItem.name || "file").slice(0, 80);
                    await pushPanelAlert("ok", `Slot ${sN} recovered: "${t}" was uploaded at ${fmtDhakaTime()} (retry).`, `স্লট ${sN} রিকভার হয়েছে: "${t}" ${fmtDhakaTime()} এ আপলোড হয়ে গেছে (retry)।`, { slot: sN - 1, itemId: queueItem.id || null });
                  }

                  const fileTypeLabel = ctypeLabel(queueItem);
                  const greeting = getDhakaGreeting();
                  const statusLine = `<b>${STATUS_UI[publishResult.statusName] || tgEscape(publishResult.statusName)}</b>`;
                  const todayProgress = `${currentState.totalUploadsToday}/${DAILY_LIMIT_UI}`;
                  const itemTitle = tgEscape(queueItem.title || queueItem.name);
                  let notifyMsg = "";
                  if (publishResult.removed) {
                    removedCount++;
                    notifyMsg = tgCard(
                      `⚠️ <b>Zedge কনটেন্ট সরিয়ে দিয়েছে</b>`,
                      [
                        ["👋", `${greeting}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", fileTypeLabel],
                        ["🏷 টাইটেল:", `<b>“${itemTitle}”</b>`],
                        ["📌 Zedge স্ট্যাটাস:", statusLine],
                        ["📅 আজকের ডে:", `${dayLabelBn(queueItem)} · আপলোড ${todayProgress}`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      "💡 ফাইলটি কিউ থেকে সরানো হয়েছে এবং আজকের আপলোড লিমিটে গণনা করা হয়েছে। Zedge এটি রিভিউয়ে রেখেছে/রিজেক্ট করেছে — কনটেন্ট গাইডলাইন চেক করে দেখুন।"
                    );
                    console.log(`⚠️ Upload ${uploadNum} was removed from Zedge (Status: ${publishResult.statusName}). Counted as upload attempt. (${successCount} this run)`);
                  } else {
                    notifyMsg = tgCard(
                      `✅ <b>আপলোড সম্পন্ন</b>`,
                      [
                        ["👋", `${greeting}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", fileTypeLabel],
                        ["🏷 টাইটেল:", `<b>“${itemTitle}”</b>`],
                        ["📌 Zedge স্ট্যাটাস:", statusLine],
                        ["📅 আজকের ডে:", `${dayLabelBn(queueItem)} · আপলোড ${todayProgress}`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      publishResult.statusName === "PUBLISHED"
                        ? "🎉 কনটেন্টটি এখন Zedge-এ লাইভ।"
                        : "⏳ Zedge রিভিউ শেষ হলে লাইভ হবে।"
                    );
                    console.log(`✅ Upload ${uploadNum} complete! Status: ${publishResult.statusName}. (${successCount} this run)`);
                  }
                  
                  if (publishResult.statusName === "PUBLISHED" || publishResult.statusName === "IN REVIEW" || publishResult.statusName === "REJECTED") {
                    await sendTelegramAttachment(finalShotPath, "image", notifyMsg);
                  } else {
                    await sendTelegramNotification(notifyMsg);
                  }

                } catch (uploadErr) {
                  console.error(`❌ Upload ${uploadNum} failed with a technical error: ${uploadErr.message}`);
                  if (queueItem?.id) {
                    await markWallpaperFailed(queueItem.id, uploadErr.message).catch(() => {});
                  }
                  // Take a failure screenshot and continue to next upload
                  const errShotPath = `zedge-error-upload-${uploadNum}.png`;
                  await page.screenshot({ path: errShotPath, fullPage: true }).catch(() => {});
                  console.log("Continuing to next upload despite error...");
                  // Notify user of upload failure
                  failedCount++;
                  await markGateSlot(i, { status: "failed", error: String(uploadErr.message || "technical error").replace(/\s+/g, " ").slice(0, 200) });   // v27.11 -> gate retries this slot
                  try {
                    const errSnippet = tgEscape(String(uploadErr.message || "Unknown error").slice(0, 160));
                    const uploadErrMsg = tgCard(
                      `❌ <b>আপলোড ব্যর্থ</b>`,
                      [
                        ["👋", `${getDhakaGreeting()}।`],
                        ["📁 প্রজেক্ট:", `${tgEscape(runLabel)} · প্রোফাইল #${currentProfileIndex}`],
                        ["🗂 কনটেন্ট:", ctypeLabel(queueItem)],
                        ["🏷 টাইটেল:", `<b>“${tgEscape(queueItem?.title || queueItem?.name || "N/A")}”</b>`],
                        ["🧩 ত্রুটি:", `<code>${errSnippet}</code>`],
                        ["🕒 সময়:", fmtDhakaTime()]
                      ],
                      "🔁 ফাইলটি কিউতে <b>failed</b> মার্ক করা হয়েছে (ড্যাশবোর্ড থেকে requeue করতে পারেন)। পরবর্তী ফাইলে যাচ্ছি…"
                    );
                    if (fs.existsSync(errShotPath)) {
                      await sendTelegramAttachment(errShotPath, "image", uploadErrMsg);
                    } else {
                      await sendTelegramNotification(uploadErrMsg);
                    }
                  } catch (_) {}
                }

                // Advance to the next profile still under its per-profile limit.
                // Successful uploads increment profileUploadCounts and will be skipped once at limit.
                // Failed uploads do NOT increment the count so they may be retried on a future run.
                currentProfileIndex = getNextAvailableProfile(currentProfileIndex, currentState.profileUploadCounts, TOTAL_PROFILES, perProfileLimit);
                if (currentProfileIndex === -1) {
                  console.log("All profiles have uploaded today. No further uploads this run.");
                  await markRemainingGateSlots(i + 1, { status: "skipped-limit", error: "all profiles reached their daily limit" });   // v27.11
                  break;
                }

                // Small pause between uploads to avoid looking like a bot
                if (i < remainingUploads - 1) {
                  console.log("Waiting 3 seconds before next upload...");
                  await page.waitForTimeout(3000);
                }
              }

              console.log(`\n🏁 Run complete. ${successCount} upload(s) succeeded.`);

              /* MH-EARNINGS: read the payout state in this same browser */
              try {
                console.log("\n\uD83D\uDCB0 Collecting the Zedge earnings report...");
                await collectEarnings(page);
              } catch (earnErr) {
                console.warn("\u26A0\uFE0F earnings report skipped: " + (earnErr && earnErr.message));
              }

              // Save video recording before closing browser
              console.log("\n📹 Saving screen recording...");
              let savedVideoPath = "";
              try {
                const pages = context.pages();
                if (pages.length > 0) {
                  const videoPath = await pages[0].video()?.path();
                  if (videoPath) {
                    console.log(`✅ Video saved to: ${videoPath}`);
                    savedVideoPath = videoPath;
                  }
                }
              } catch (videoErr) {
                console.warn("⚠️ Could not retrieve video path:", videoErr.message);
              }

              await context.close();
              // Wait 2 seconds for video to finish writing to disk
              await new Promise(resolve => setTimeout(resolve, 2000));
              console.log("✅ Video recording finalized.");

              if (savedVideoPath) {
                console.log("Sending video to Telegram...");
                const attempted = successCount + failedCount;
                const published = successCount - removedCount;
                const runHeader = failedCount === 0
                  ? `🏁 <b>রান সম্পন্ন</b>`
                  : `🏁 <b>রান শেষ — আংশিক সফল</b>`;
                const videoCaption = tgCard(
                  runHeader,
                  [
                    ["👋", `${getDhakaGreeting()}।`],
                    ["📁 প্রজেক্ট:", tgEscape(runLabel)],
                    ["📅 আজকের ডে:", dayLabelBn(typeof queueItem !== "undefined" ? queueItem : null)],
                    ["📊 ফলাফল:", `${published} লাইভ/রিভিউ · ${removedCount} সরানো · ${failedCount} ব্যর্থ (মোট ${attempted})`],
                    ["📈 আজ মোট:", `${currentState.totalUploadsToday}/${DAILY_LIMIT_UI} আপলোড`],
                    ["⏱ সময় লেগেছে:", fmtDuration(Date.now() - runStartedAt)],
                    ["🕒 শেষ:", fmtDhakaTime()]
                  ],
                  "🎬 পুরো রানের স্ক্রিন রেকর্ডিং সংযুক্ত।"
                );
                await sendTelegramAttachment(savedVideoPath, "video", videoCaption, { width: fpVP.width, height: fpVP.height });
              }

              await browser.close();
              
              // Exit cleanly
              process.exit(0);

            } catch (err) {
              console.error("BOT FATAL ERROR:", err);
              // v27.11: every slot this run had not finished is reported as failed -> the gate retries it
              await markRemainingGateSlots(0, { status: "failed", error: ("fatal: " + String((err && err.message) || err || "unknown")).replace(/\s+/g, " ").slice(0, 200) }).catch(() => {});
              // Notify user of fatal crash before exiting
              try {
                const crashFolder = process.env.FOLDER_NAME || "Zedge Bot";
                const crashSnippet = tgEscape(String(err?.message || err || "Unknown fatal error").slice(0, 200));
                const fatalMsg = [
                  `🚨 <b>সিস্টেম ক্র্যাশ রিপোর্ট</b>`,
                  "━━━━━━━━━━━━━━━━",
                  `👋 ${getDhakaGreeting()}।`,
                  `📁 প্রজেক্ট: ${tgEscape(crashFolder)}`,
                  `📝 অবস্থা: রান চলাকালে মারাত্মক ত্রুটি — রান বন্ধ হয়ে গেছে।`,
                  `🧩 ত্রুটি: <code>${crashSnippet}</code>`,
                  `🕒 সময়: ${fmtDhakaTime()}`,
                  "",
                  "🔎 GitHub Actions লগ দেখুন। ক্র্যাশ রেকর্ডিং থাকলে পরের মেসেজে পাবেন।"
                ].join("\n");
                await sendTelegramNotification(fatalMsg);
              } catch (_) {}

              let fatalVideoPath = "";
              try {
                if (context) {
                  const pages = context.pages();
                  if (pages.length > 0) {
                    fatalVideoPath = await pages[0].video()?.path() || "";
                  }
                }
              } catch (_) {}

              if (context) await context.close().catch(() => {});
              if (fatalVideoPath) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                const crashFolder = process.env.FOLDER_NAME || "Zedge Bot";
                const videoCaption = `🎬 <b>ক্র্যাশ রেকর্ডিং</b> · ${tgEscape(crashFolder)} · ${fmtDhakaTime()}`;
                await sendTelegramAttachment(fatalVideoPath, "video", videoCaption).catch(() => {});
              }
              if (browser) await browser.close().catch(() => {});
              process.exit(1);
            }
          })();
          '@ | Set-Content bot.js

      - name: Run bot
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        env:
          # v24: set by the VPN step (VPN_ACTIVE=1 when a tunnel is up)
          VPN_ACTIVE: ${{ env.VPN_ACTIVE }}
          VPN_TYPE: ${{ env.VPN_TYPE }}
          VPN_PROFILE_NAME: ${{ env.VPN_PROFILE_NAME }}
          VPN_PUBLIC_IP: ${{ env.VPN_PUBLIC_IP }}
          VPN_KEEP_PROXY: ${{ env.VPN_KEEP_PROXY }}
          PROXY_SERVER: ${{ github.event.inputs.proxy_server }}
          PROXY_USER: ${{ github.event.inputs.proxy_user }}
          PROXY_PASS: ${{ github.event.inputs.proxy_pass }}
          # v28: login from the dispatch inputs, or (safer) from the GitHub secrets ZEDGE3_EMAIL / ZEDGE3_PASSWORD
          ZEDGE_EMAIL: ${{ github.event.inputs.zedge_email || secrets.ZEDGE3_EMAIL }}
          ZEDGE_PASSWORD: ${{ github.event.inputs.zedge_password || secrets.ZEDGE3_PASSWORD }}
          # v28 security: all secrets below live in GitHub Secrets, never in this file
          FIREBASE_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: ${{ github.event.inputs.headless }}
          TOTAL_PROFILES: ${{ github.event.inputs.total_profiles }}
          UA_GROUP: ${{ github.event.inputs.ua_group }}
          FOLDER_NAME: "Zedge 3"
          EXACT_TARGET_DHAKA: ${{ needs.gate.outputs.target }}   # v26.2: gate released early, hold Publish until this minute
          # v27.11 missed-slot recovery: slot(s) served by this run + how many uploads (2 when a missed slot is merged in)
          GATE_SLOTS: ${{ needs.gate.outputs.slots }}
          GATE_RETRY_SLOTS: ${{ needs.gate.outputs.retries }}
          UPLOADS_PER_RUN: ${{ needs.gate.outputs.count || '1' }}
          # MH-EARNINGS: payout threshold in USD (the report is saved to this
          # account's own Firebase: dashboardSettings/earnings)
          EARN_THRESHOLD: "50"

        run: node bot.js

      - name: 🛟 Report unfinished slot(s) to the gate (job failed / cancelled before the upload)
        # v27.11: if the job died before bot.js could report (checkout / npm / Playwright / VPN step error, runner
        # killed, cancelled) the slot marker would stay "started" forever. Flip it to "failed" right away so the
        # gate retries the slot on the next ping instead of waiting for the 70 min stale timeout.
        if: inputs.run_mode != 'vpn_test' && (failure() || cancelled())
        continue-on-error: true
        shell: pwsh
        env:
          GATE_SLOTS: ${{ needs.gate.outputs.slots }}
          FIREBASE_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
        run: |
          @'
          const DB = process.env.FIREBASE_DB_URL;
          let slots = []; try { slots = JSON.parse(process.env.GATE_SLOTS || "[]"); } catch (_) {}
          const dateKey = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
          (async () => {
            for (const s of slots) {
              try {
                const r = await fetch(`${DB}/dashboardSettings/gate/runs/${dateKey}/${s}.json`);
                const m = r.ok ? await r.json() : null;
                if (!m || m.status !== "started") { console.log(`slot ${s}: status ${m && m.status} - nothing to do`); continue; }
                await fetch(`${DB}/dashboardSettings/gate/runs/${dateKey}/${s}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "failed", error: "workflow job failed / was cancelled before the upload finished (see GitHub Actions log)", finishedAt: Date.now(), runId: process.env.GITHUB_RUN_ID || "" }) });
                console.log(`slot ${s} -> failed (gate will retry)`);
              } catch (e) { console.log(`slot ${s}: ${e.message}`); }
            }
          })();
          '@ | Set-Content gate-report.mjs
          node gate-report.mjs

      - name: 🔐 VPN disconnect
        if: always()
        continue-on-error: true
        shell: pwsh
        run: if (Test-Path vpn.mjs) { node vpn.mjs disconnect }
