name: Zedge Safe Automation + Realtime DB Wallpaper & Ringtone
run-name: ${{ inputs.run_mode == 'vpn_test' && format('🔐 VPN test ({0})', inputs.vpn_profile) || 'Zedge automation' }} · ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "⚙️ Run mode - 'vpn_test' only checks the VPN profile and skips the automation"
        required: false
        default: "automation"
        type: choice
        options:
          - automation
          - vpn_test
      vpn_profile:
        description: "🔐 VPN profile id to test (blank = active profile from Firebase dashboardSettings/vpn)"
        required: false
        default: ""
      proxy_server:
        description: "HTTP proxy host:port (leave blank to run without proxy)"
        required: false
        default: ""
      proxy_user:
        description: "Proxy username"
        required: false
      proxy_pass:
        description: "Proxy password"
        required: false
      zedge_email:
        description: "Zedge email (not needed for vpn_test)"
        required: false
        default: ""
      zedge_password:
        description: "Zedge password (not needed for vpn_test)"
        required: false
        default: ""
      headless:
        description: "Run headless? true/false"
        required: true
        default: "false"
      total_profiles:
        description: "Number of Zedge profiles to rotate through (e.g. 1, 2, 3, 6)"
        required: false
        default: "3"
      force_run:
        description: "Skip random time gate and upload immediately? true/false"
        required: false
        default: "false"
      os:
        description: "🖥️ Runner OS"
        required: true
        default: "windows-2025"
        type: choice
        options:
          - windows-2025
          - windows-2022
          - windows-latest
      ua_group:
        description: "🌐 Browser / User-Agent type"
        required: true
        default: "random"
        type: choice
        options:
          - random
          - chrome_windows
          - edge_windows
          - firefox
          - chrome_macos
          - safari_macos
          - android_mobile

jobs:
  gate:
    # v24: skipped entirely for VPN connection tests
    if: inputs.run_mode != 'vpn_test'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      exact: ${{ steps.decide.outputs.exact }}
      target: ${{ steps.decide.outputs.target }}
      # v27.11 missed-slot recovery: JSON list of slot indexes this run must upload (1 normally, 2 when a
      # missed slot is merged into this window), how many that is, and which of them are retries.
      slots: ${{ steps.decide.outputs.slots }}
      count: ${{ steps.decide.outputs.count }}
      retries: ${{ steps.decide.outputs.retries }}
    steps:
      - name: Smart upload gate (schedule from Firebase, daily random slot, catch-up, missed-slot recovery)
        id: decide
        shell: bash
        env:
          # v27.11: the gate reports a missed slot to Telegram as well (same bot / chat as the upload reports)
          # v28 security: NOTHING secret is written in this file any more. Bot token / chat id / database URL
          # come from GitHub Secrets (GitHub > Settings > Secrets and variables > Actions).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          # v27.11.1: passed via env - a `${{ }}` inside this big run block made GitHub reject the workflow
          # ("Exceeded max expression length 21000"); env values are not subject to that limit.
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "slots=[]" >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "retries=[]" >> "$GITHUB_OUTPUT"
            echo "Force run enabled - skipping random gate."
            exit 0
          fi
          cat > gate.mjs <<'GATE_EOF'
          import fs from "fs";
          // ---- v23 smart gate ------------------------------------------------
          // Schedule lives in Firebase: dashboardSettings/schedule
          //   windows: [h,h,h]                       (legacy - start hour of each 3 h window)
          //   slots:   [{hour,minute,exact}, ...]    (v23 - exact upload time per slot, set from the app / panel)
          // cron-job.org pings every 30 min all day; this gate decides.
          //   exact=false -> old behaviour: one random 30-min slot inside the 3 h window (deterministic hash)
          //   exact=true  -> upload starts at HH:MM sharp (the gate sleeps until that minute if the ping came early;
          //                  a missed ping is caught up on the next ping within the same 3 h window).
          // Falls back to DEFAULT_WINDOWS if Firebase is unreachable. Health + run markers -> dashboardSettings/gate.
          const DB = (process.env.FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
          if (!DB) { console.log("::error::GitHub secret ZEDGE3_DB_URL is missing - set it in GitHub > Settings > Secrets and variables > Actions"); process.exit(1); }
          const ACCOUNT = "ZEDGE3";
          const DEFAULT_WINDOWS = [10, 16, 20];   // window start hours (Asia/Dhaka) - fallback only
          const WINDOW_HOURS = 3;                      // each window lasts 3 hours
          const SLOT_MIN = 30;                         // scheduler pings every 30 min
          const RUN_ID = process.env.GITHUB_RUN_ID || "";
          const OUT = process.env.GITHUB_OUTPUT || "";
          const setOutput = (k, v) => { try { if (OUT) fs.appendFileSync(OUT, `${k}=${v}\n`); } catch (_) {} };

          const dhaka = new Date(Date.now() + 6 * 3600 * 1000);   // UTC+6
          const h = dhaka.getUTCHours(), m = dhaka.getUTCMinutes();
          const dateKey = dhaka.toISOString().slice(0, 10);
          const pad2 = (n) => String(n).padStart(2, "0");
          const hhmm = pad2(h) + ":" + pad2(m);
          const jget = async (path) => { const r = await fetch(`${DB}/${path}.json`); if (!r.ok) throw new Error(`${path} -> HTTP ${r.status}`); return r.json(); };
          const jwrite = async (path, method, body) => { const r = await fetch(`${DB}/${path}.json`, { method, body: JSON.stringify(body) }); if (!r.ok) throw new Error(`${path} -> HTTP ${r.status}`); };

          // ---- read schedule (slots preferred, windows as fallback) ----
          // v23.1 custom window: slot = { hour, minute, exact, endHour, endMinute }
          //   exact=true  -> upload at HH:MM sharp
          //   exact=false -> ONE deterministic random minute between start (hour:minute) and end (endHour:endMinute),
          //                  chosen once per day per slot (hash) so every ping agrees on the target.
          //   Legacy slots without an end keep the classic 3 h window. The gate sleeps until the target minute
          //   when the ping comes early and catches up on the next ping when one was missed.
          const clampEnd = (startMin) => Math.min(23 * 60 + 59, startMin + WINDOW_HOURS * 60);
          const toSlots = (hours) => hours.map(x => { const e = clampEnd(x * 60); return { hour: x, minute: 0, exact: false, endHour: Math.floor(e / 60), endMinute: e % 60 }; });
          const normSlot = (x) => {
            if (!x || typeof x !== "object") return null;
            const hour = Number(x.hour), minute = Number(x.minute) || 0, exact = x.exact === true;
            if (!Number.isInteger(hour) || hour < 0 || hour > 23 || !Number.isInteger(minute) || minute < 0 || minute > 59) return null;
            let endHour = Number(x.endHour), endMinute = Number(x.endMinute) || 0;
            const okEnd = Number.isInteger(endHour) && endHour >= 0 && endHour <= 23 && Number.isInteger(endMinute) && endMinute >= 0 && endMinute <= 59 && endHour * 60 + endMinute > hour * 60 + minute;
            if (exact) { endHour = hour; endMinute = minute; }
            else if (!okEnd) { const e = clampEnd(hour * 60 + minute); endHour = Math.floor(e / 60); endMinute = e % 60; }
            return { hour, minute, exact, endHour, endMinute };
          };
          let EXACT_LEAD_MIN = 6;                      // v26.2: minutes the gate releases early for exact slots (dashboardSettings/schedule.exactLeadMin, 0-25)
          let retryEnabled = true;                     // v27.11: dashboardSettings/schedule.retryMissed = false switches missed-slot recovery off
          let slots = toSlots(DEFAULT_WINDOWS), source = "yml-default";
          try {
            const s = await jget("dashboardSettings/schedule");
            if (s && s.retryMissed === false) retryEnabled = false;
            const w = s && Array.isArray(s.windows) ? s.windows.map(Number).filter(x => Number.isInteger(x) && x >= 0 && x <= 23) : null;
            const sl = s && Array.isArray(s.slots) ? s.slots.map(normSlot).filter(Boolean) : null;
            const lm = s ? Number(s.exactLeadMin) : NaN; if (Number.isFinite(lm)) EXACT_LEAD_MIN = Math.max(0, Math.min(25, Math.round(lm)));
            if (sl && sl.length) { slots = sl; source = "firebase-slots"; }
            else if (w && w.length) { slots = toSlots(w); source = "firebase"; }
          } catch (e) { console.log("Schedule read failed (" + e.message + ") - using yml defaults."); }
          const startOf = (s) => s.hour * 60 + s.minute, endOf = (s) => s.exact ? startOf(s) : s.endHour * 60 + s.endMinute;
          slots.sort((a, b) => startOf(a) - startOf(b));
          const windows = slots.map(s => s.hour);
          const hashOf = (i) => { let hash = 0; const seed = dateKey + "#" + i + "#" + ACCOUNT; for (const c of seed) hash = (hash * 31 + c.charCodeAt(0)) >>> 0; return hash; };
          const targetOf = (s, i) => s.exact ? startOf(s) : startOf(s) + (hashOf(i) % Math.max(1, endOf(s) - startOf(s)));

          let runsToday = {}, runsKnown = false;
          try { runsToday = (await jget(`dashboardSettings/gate/runs/${dateKey}`)) || {}; runsKnown = true; }
          catch (e) { console.log("Run log read failed (" + e.message + ") - catch-up disabled for this ping."); }

          // ---- v27.11 MISSED-SLOT RECOVERY --------------------------------------------------------------
          // Until v27.10 a slot counted as "done" the moment the gate released it. If the automation job then
          // never ran (Actions outage, runner never started, YAML error) or crashed before the file was added
          // and the Upload button clicked, that slot was silently lost for the day. Now bot.js reports the real
          // result into the run marker (status: started -> uploaded | failed | idle | skipped-limit) and the gate:
          //   * treats failed / idle / stale "started" (no result after STALE_RUN_MIN) and never-run-but-window-over
          //     slots as MISSED,
          //   * retries a missed slot inside its own window on the next ping,
          //   * merges a missed slot whose window is already over into the NEXT window's run (that run uploads 2 files),
          //   * or, when no window is left today, runs it on the next ping (late catch-up) - so the day's 3 uploads
          //     always happen,
          //   * notifies panel / app / desktop (dashboardSettings/alerts) + Telegram once per miss,
          //   * gives up after MAX_ATTEMPTS attempts per slot and never exceeds the 3-uploads-per-day cap.
          const STALE_RUN_MIN = 70, MAX_ATTEMPTS = 3, DAILY_LIMIT = 3;
          const todayMDY = `${dhaka.getUTCMonth() + 1}/${dhaka.getUTCDate()}/${dhaka.getUTCFullYear()}`;   // uploadState.lastUploadDate format (bot.js)
          let uploadsDone = 0;
          try { const us = await jget("uploadState"); if (us && us.lastUploadDate === todayMDY) uploadsDone = Number(us.totalUploadsToday) || 0; } catch (e) { console.log("uploadState read failed (" + e.message + ")"); }
          const leadOf = (s) => s.exact ? EXACT_LEAD_MIN : 0;
          const fireOf = (s, i) => targetOf(s, i) - leadOf(s);
          const now = h * 60 + m;
          const nowMs = Date.now();
          const markerOf = (i) => (runsToday && runsToday[i] && typeof runsToday[i] === "object") ? runsToday[i] : null;
          const windowOver = (i) => now >= endOf(slots[i]) + SLOT_MIN && now >= fireOf(slots[i], i) + SLOT_MIN;
          // done | running | failed | none   (failed = the slot needs a retry)
          const slotState = (i) => {
            const mk = markerOf(i);
            if (!mk) return windowOver(i) ? "failed" : "none";                                   // never ran and its window is over
            const st = String(mk.status || "");
            if (!st) return "done";                                                              // legacy marker (pre v27.11) - nothing to verify
            if (st === "failed" || st === "idle") return "failed";
            if (st === "started") return (nowMs - Number(mk.at || 0) > STALE_RUN_MIN * 60000) ? "failed" : "running";
            return "done";                                                                       // uploaded / skipped-limit / anything else
          };
          const attemptsOf = (i) => { const mk = markerOf(i); return mk ? (mk.attempts != null ? Number(mk.attempts) || 0 : 1) : 0; };
          const reasonOf = (i) => {
            const mk = markerOf(i);
            if (!mk) return "the automation run never started (GitHub Actions / workflow issue)";
            const st = String(mk.status || "");
            if (st === "started") return "the run started but never reported a result (runner stopped / job crashed)";
            if (st === "idle") return mk.error ? `nothing was uploaded - ${mk.error}` : "nothing was uploaded (queue empty / no stock)";
            return mk.error ? `upload failed - ${mk.error}` : "upload failed";
          };
          const isBlocked = (i) => { const st = slotState(i); return st === "done" || st === "running"; };   // must not be released again
          const canRetry = (i) => retryEnabled && runsKnown && slotState(i) === "failed" && attemptsOf(i) < MAX_ATTEMPTS && uploadsDone < DAILY_LIMIT;
          // v27.11.2: an EXTRA run inside the same window only for a real technical failure and only once. "idle" (nothing to
          // upload) / "never started" are NOT re-run in the window - they are merged into the next window's run (count=2),
          // which costs zero extra GitHub Actions minutes. Keeps the daily run count at ~3 like before v27.11.
          const inWindowRetryOk = (i) => canRetry(i) && String((markerOf(i) || {}).status || "") === "failed" && attemptsOf(i) < 2;
          const gaveUp = (i) => runsKnown && slotState(i) === "failed" && attemptsOf(i) >= MAX_ATTEMPTS;
          const hhmmOf = (min) => pad2(Math.floor(min / 60)) + ":" + pad2(min % 60);
          const slotName = (i) => `Slot ${i + 1} (${hhmmOf(targetOf(slots[i], i))})`;

          // active from the slot start until its end (+ one ping of slack so a missed final ping can still catch up)
          // v26.2 exact-time fix:
          //  (1) an exact slot is "active" one ping BEFORE its minute, so the early ping sleeps instead of falling
          //      through to "outside" (that bug made every exact upload run on the NEXT ping = 10-30 min late);
          //  (2) exact slots release EXACT_LEAD_MIN minutes early so checkout/Playwright/login/generation finish first,
          //      and bot.js holds the Publish click until HH:MM Dhaka sharp (EXACT_TARGET_DHAKA env).
          const isActive = (s, i) => now >= Math.min(startOf(s), fireOf(s, i) - SLOT_MIN) && now < Math.max(endOf(s), targetOf(s, i)) + SLOT_MIN;
          let wIdx = slots.findIndex((s, i) => isActive(s, i) && !isBlocked(i));   // prefer an active slot that has not run (or whose run failed) yet
          if (wIdx < 0) wIdx = slots.findIndex(isActive);
          let decision = "outside", go = false, curSlot = -1, chosen = -1, waitMin = 0, exact = false, target = "", targetMin = -1, fireMin = -1;
          if (wIdx >= 0) {
            const slot = slots[wIdx];
            exact = slot.exact === true;
            targetMin = targetOf(slot, wIdx);
            fireMin = fireOf(slot, wIdx);
            target = pad2(Math.floor(targetMin / 60)) + ":" + pad2(targetMin % 60);
            curSlot = Math.floor((now - startOf(slot)) / SLOT_MIN);
            chosen = Math.floor((targetMin - startOf(slot)) / SLOT_MIN);
            const failedHere = slotState(wIdx) === "failed";
            if (isBlocked(wIdx)) decision = slotState(wIdx) === "running" ? "running" : "done";   // this slot already ran today / is running right now
            else if (failedHere && !inWindowRetryOk(wIdx)) decision = gaveUp(wIdx) ? "gave-up" : (canRetry(wIdx) ? "next-window" : "retry-off");
            else if (now >= fireMin) {
              if (now - fireMin < SLOT_MIN && !failedHere) { decision = "run"; go = true; }
              else if (runsKnown) { decision = failedHere ? "retry" : "catch-up"; go = true; }   // the ping that should have fired was missed / the run failed -> again inside the window
              else decision = "wait";
            }
            else if (fireMin - now < SLOT_MIN) { decision = "run"; go = true; waitMin = fireMin - now; }   // early ping -> sleep until the release minute
            else decision = "wait";
          }

          // ---- v27.11: missed slots whose window is already over -------------------------------------------
          const missed = slots.map((s, i) => i).filter(i => !(go && i === wIdx) && canRetry(i) && !isActive(slots[i], i));
          const laterSlot = slots.findIndex((s, i) => startOf(s) > now && !isBlocked(i));      // a window still ahead today
          let runList = go ? [wIdx] : [], plan = "";
          if (missed.length) {
            const room = Math.max(0, DAILY_LIMIT - uploadsDone - runList.length);
            if (go) { runList = runList.concat(missed.slice(0, room)); plan = "merged"; }                         // upload the missed file(s) in this window's run
            else if (laterSlot < 0) { runList = missed.slice(0, room); plan = "late"; if (runList.length) { go = true; decision = "retry-late"; } }   // nothing ahead today -> run now
            else plan = "next-window";                                                                            // wait for the next window's run
          }
          const retries = runList.filter(i => markerOf(i) || i !== wIdx);
          const slotDesc = slots.map((s, i) => `S${i + 1} ${pad2(s.hour)}:${pad2(s.minute)}${s.exact ? " exact" : "-" + pad2(s.endHour) + ":" + pad2(s.endMinute) + " random"}`).join(", ");
          const stateDesc = slots.map((s, i) => `S${i + 1}=${slotState(i)}${attemptsOf(i) > 1 ? "x" + attemptsOf(i) : ""}`).join(" ");
          console.log(`Date ${dateKey} ${hhmm} (Dhaka) | slots [${slotDesc}] (${source}) | slot ${wIdx}${wIdx >= 0 ? ` | target ${target} (${exact ? "exact" : "random in range"})` : ""} | decision: ${decision}${waitMin ? ` (sleeping ${waitMin} min until ${pad2(Math.floor(fireMin / 60)) + ":" + pad2(fireMin % 60)}${exact ? ", publish at " + target : ""})` : ""}`);
          console.log(`Recovery: ${retryEnabled ? "on" : "off"} | uploads today ${uploadsDone}/${DAILY_LIMIT} | ${stateDesc}${missed.length ? ` | missed [${missed.map(i => "S" + (i + 1)).join(", ")}] -> ${plan}${laterSlot >= 0 && plan === "next-window" ? " (S" + (laterSlot + 1) + " " + hhmmOf(targetOf(slots[laterSlot], laterSlot)) + ")" : ""}` : ""}${runList.length ? ` | this run uploads slots [${runList.map(i => "S" + (i + 1)).join(", ")}]` : ""}`);

          // ---- v27.11: tell the user once per miss (panel / app / desktop via dashboardSettings/alerts + Telegram) ----
          const tgSend = async (html) => {
            const tok = process.env.TELEGRAM_BOT_TOKEN, chat = process.env.TELEGRAM_CHAT_ID;
            if (!tok || !chat) return;
            try { await fetch(`https://api.telegram.org/bot${tok}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chat, text: html, parse_mode: "HTML", disable_web_page_preview: true }) }); } catch (e) { console.log("Telegram failed: " + e.message); }
          };
          const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const pushAlert = async (id, kind, text, textBn, extra) => {
            try { await jwrite(`dashboardSettings/alerts/${id}`, "PUT", Object.assign({ id, ts: Date.now(), kind, text, textBn: textBn || text, source: "gate", date: dateKey }, extra || {})); } catch (e) { console.log("Alert write failed: " + e.message); }
          };
          const pendingMarkerPatches = {};
          const notifyMiss = async (i, mode) => {
            const mk = markerOf(i) || {};
            const att = attemptsOf(i);
            const key = `a${att}-${mode}`;
            if (mk.notified === key) return;                       // already told for this attempt/plan
            pendingMarkerPatches[i] = Object.assign(pendingMarkerPatches[i] || {}, { notified: key });
            if (!mk.status && markerOf(i) === null) pendingMarkerPatches[i] = Object.assign(pendingMarkerPatches[i], { status: "failed", error: "run never started", attempts: 0, at: nowMs, dhaka: hhmm });
            const why = reasonOf(i), name = slotName(i), acc = ACCOUNT.replace(/ZEDGE(\d+)/i, "Zedge $1");
            let how = "", howBn = "", kind = "warn";
            if (mode === "in-window") { how = `Retrying now inside the same window (attempt ${att + 1}/${MAX_ATTEMPTS}).`; howBn = `একই উইন্ডোর মধ্যেই এখন আবার চেষ্টা হচ্ছে (চেষ্টা ${att + 1}/${MAX_ATTEMPTS})।`; }
            else if (mode === "merged") { how = `Uploading it now together with ${slotName(wIdx)} - this run uploads 2 files.`; howBn = `${slotName(wIdx)} এর সাথে এখনই আপলোড হচ্ছে - এই রানে ২টি ফাইল যাবে।`; }
            else if (mode === "next-window") { how = `It will be uploaded in the next window - ${slotName(laterSlot)} - together with that slot's file.`; howBn = `পরের উইন্ডোতে (${slotName(laterSlot)}) ওই স্লটের ফাইলের সাথে আপলোড হয়ে যাবে।`; }
            else if (mode === "late") { how = "No window is left today - uploading it now (late catch-up)."; howBn = "আজ আর কোনো উইন্ডো বাকি নেই - এখনই আপলোড হচ্ছে (late catch-up)।"; }
            else if (mode === "gave-up") { kind = "err"; how = `Gave up after ${MAX_ATTEMPTS} attempts - check the GitHub Actions log / queue and use force run if needed.`; howBn = `${MAX_ATTEMPTS} বার চেষ্টার পরেও হয়নি - GitHub Actions লগ / কিউ চেক করুন, দরকার হলে force run দিন।`; }
            else if (mode === "limit") { kind = "info"; how = "Today's 3 uploads are already done, so nothing is missing."; howBn = "আজকের ৩টি আপলোড এমনিতেই হয়ে গেছে, কিছু বাদ পড়েনি।"; }
            const text = `${name} was not uploaded at its scheduled time: ${why}. ${how}`;
            const textBn = `${name} নির্ধারিত সময়ে আপলোড হয়নি: ${why}. ${howBn}`;
            await pushAlert(`${dateKey}-s${i}-${key}`, kind, text, textBn, { slot: i, attempts: att, plan: mode, account: acc });
            await tgSend([`${kind === "err" ? "🚨" : "⚠️"} <b>স্লট মিস - ${esc(name)}</b>`, "━━━━━━━━━━━━━━━━", `📁 প্রজেক্ট: ${esc(acc)}`, `📝 কারণ: <code>${esc(why)}</code>`, `🔁 পরবর্তী: ${esc(howBn)}`, `🕒 সময়: ${dateKey} ${hhmm} (Dhaka)`].join("\n"));
          };
          try {
            if (go && decision === "retry") await notifyMiss(wIdx, "in-window");
            for (const i of missed) await notifyMiss(i, plan === "merged" && runList.includes(i) ? "merged" : plan === "late" && runList.includes(i) ? "late" : plan === "next-window" ? "next-window" : (uploadsDone >= DAILY_LIMIT ? "limit" : "next-window"));
            for (let i = 0; i < slots.length; i++) if (gaveUp(i) && !(go && runList.includes(i))) await notifyMiss(i, "gave-up");
            if (Object.keys(pendingMarkerPatches).length) {
              const cur = (await jget(`dashboardSettings/gate/runs/${dateKey}`)) || {};
              for (const i of Object.keys(pendingMarkerPatches)) cur[i] = Object.assign({}, cur[i] || {}, pendingMarkerPatches[i]);
              await jwrite("dashboardSettings/gate/runs", "PUT", { [dateKey]: cur });
              runsToday = cur;
            }
            // keep the alert list small (last 3 days)
            const al = (await jget("dashboardSettings/alerts")) || {};
            const cutoff = nowMs - 3 * 86400000;
            for (const k of Object.keys(al)) if (al[k] && Number(al[k].ts || 0) < cutoff) await jwrite(`dashboardSettings/alerts/${k}`, "DELETE", null).catch(() => {});
          } catch (e) { console.log("Recovery bookkeeping failed: " + e.message); }

          try {
            await jwrite("dashboardSettings/gate", "PATCH", { lastPing: Date.now(), lastPingDhaka: `${dateKey} ${hhmm}`, lastDecision: decision, lastWindow: wIdx, windowsUsed: windows, slotsUsed: slots, windowsSource: source, lastRunId: RUN_ID, lastMode: wIdx >= 0 ? (exact ? "exact" : "random") : null, recovery: { enabled: retryEnabled, uploadsDone, missed, plan: plan || null, nextSlot: laterSlot, states: slots.map((s, i) => slotState(i)), at: Date.now() } });
          } catch (e) { console.log("Health log failed: " + e.message); }

          if (go) {
            try {
              const all = (await jget("dashboardSettings/gate/runs")) || {};
              const today = Object.assign({}, all[dateKey] || {});
              for (const idx of runList) {
                const prev = (today[idx] && typeof today[idx] === "object") ? today[idx] : null;
                const isMain = idx === wIdx && decision !== "retry-late";
                today[idx] = Object.assign({}, prev || {}, {
                  at: Date.now() + waitMin * 60000, dhaka: isMain ? (exact ? target : (waitMin ? target : hhmm)) : hhmm, slot: isMain ? curSlot : -1, chosen: isMain ? chosen : -1,
                  exact: isMain ? exact : false, target: isMain ? target : hhmmOf(targetOf(slots[idx], idx)), lead: isMain && exact ? EXACT_LEAD_MIN : 0,
                  catchUp: isMain ? decision === "catch-up" : true, runId: RUN_ID,
                  // v27.11 result tracking - bot.js / the workflow flip status to uploaded | failed | idle | skipped-limit
                  status: "started", attempts: (prev ? attemptsOf(idx) : 0) + 1, retry: !!prev || !isMain, plan: isMain ? (decision === "retry" ? "in-window" : null) : plan,
                  prevError: prev && prev.error ? String(prev.error).slice(0, 200) : null, error: null, finishedAt: null
                });
              }
              await jwrite("dashboardSettings/gate/runs", "PUT", { [dateKey]: today });   // keeps only today
              await jwrite("dashboardSettings/gate", "PATCH", { lastRun: Date.now() + waitMin * 60000, lastRunDhaka: `${dateKey} ${waitMin ? target : hhmm}`, lastRunWindow: wIdx, lastRunSlots: runList });
            } catch (e) { console.log("Run marker failed: " + e.message); }
            if (waitMin > 0) {
              console.log(exact ? `Waiting ${waitMin} min - releasing ${EXACT_LEAD_MIN} min early so the Publish click lands at ${target} Dhaka sharp...` : `Waiting ${waitMin} min so the upload starts at ${target} Dhaka...`);
              await new Promise(r => setTimeout(r, waitMin * 60 * 1000));
            }
            if (exact && decision !== "retry-late") setOutput("target", target);   // v26.2: bot.js holds Publish until this HH:MM (Dhaka)
            setOutput("exact", "yes");   // v23.1: gate already picked the minute -> skip the extra random delay in both modes
            setOutput("slots", JSON.stringify(runList));
            setOutput("count", String(Math.max(1, runList.length)));
            setOutput("retries", JSON.stringify(retries));
          }
          process.exit(go ? 0 : 2);
          GATE_EOF
          node gate.mjs && echo "go=yes" >> "$GITHUB_OUTPUT" || echo "go=no" >> "$GITHUB_OUTPUT"

  automation:
    needs: gate
    # v24: normal run needs the gate's OK; a vpn_test run bypasses the gate and only executes the VPN steps
    if: ${{ !cancelled() && ((needs.gate.result == 'success' && needs.gate.outputs.go == 'yes') || inputs.run_mode == 'vpn_test') }}
    runs-on: ${{ inputs.os }}
    # v27.11.2: safety net - a run can never sit "in progress" for hours. Random delay (<=14 min) + VPN (<=15 min) +
    # setup (~5 min) + up to 2 uploads fit easily; if it is exceeded the slot is reported as failed and retried.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Random minute-level delay (human-like timing)
        # v23: skipped when the slot has an exact upload time - the gate already waited for HH:MM sharp
        if: inputs.run_mode != 'vpn_test' && inputs.force_run != 'true' && needs.gate.outputs.exact != 'yes'
        shell: bash
        run: |
          DELAY=$((RANDOM % 840))
          echo "Sleeping extra ${DELAY}s for human-like random timing..."
          sleep $DELAY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: 🎬 Install ffmpeg (Telegram videos as MP4)
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $existing = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "ffmpeg already on PATH: $($existing.Source)"
            "FFMPEG_PATH=$($existing.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            & $existing.Source -version | Select-Object -First 1
            exit 0
          }
          if ($IsWindows) {
            $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $bin = $null
            try {
              $zip = Join-Path $dir "ffmpeg.zip"
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip -UseBasicParsing
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              $exe = Get-ChildItem -Path $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              if (-not $exe) { throw "ffmpeg.exe missing in archive" }
              $bin = $exe.DirectoryName
              Write-Host "ffmpeg static build downloaded -> $bin"
            } catch {
              Write-Host "Static download failed ($($_.Exception.Message)) - falling back to chocolatey"
              choco install ffmpeg -y --no-progress | Out-Null
              $bin = "C:\ProgramData\chocolatey\bin"
            }
            $ff = Join-Path $bin "ffmpeg.exe"
            $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "FFMPEG_PATH=$ff" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            & $ff -version | Select-Object -First 1
          } else {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            $ff = (Get-Command ffmpeg).Source
            "FFMPEG_PATH=$ff" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            & $ff -version | Select-Object -First 1
          }

      - name: 🎲 Randomize Machine Identity
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "  🎲  RANDOMIZING MACHINE IDENTITY"
          Write-Host "============================================================"

          # ── 1. Randomize Machine GUID (Windows Registry) ──────────────
          Write-Host ""
          Write-Host "── Machine GUID ─────────────────────────────────────────────"
          try {
            $oldGuid = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name MachineGuid).MachineGuid
            Write-Host "Old GUID : $oldGuid"
            $newGuid = [System.Guid]::NewGuid().ToString()
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name 'MachineGuid' -Value $newGuid
            $verify = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name MachineGuid).MachineGuid
            Write-Host "New GUID : $verify"
            Write-Host "✅ Machine GUID randomized successfully"
          } catch {
            Write-Host "⚠️ Machine GUID change failed: $($_.Exception.Message)"
          }

          # ── 2. Randomize MachineId in SQM (telemetry GUID) ───────────
          Write-Host ""
          Write-Host "── SQM / Telemetry GUID ─────────────────────────────────────"
          try {
            $sqmPath = 'HKLM:\SOFTWARE\Microsoft\SQMClient'
            if (Test-Path $sqmPath) {
              $newSqm = [System.Guid]::NewGuid().ToString().ToUpper()
              $newSqm = "{$newSqm}"
              Set-ItemProperty -Path $sqmPath -Name 'MachineId' -Value $newSqm -ErrorAction SilentlyContinue
              Write-Host "✅ SQM MachineId set to: $newSqm"
            } else {
              Write-Host "ℹ️ SQM registry key not present — skipping"
            }
          } catch {
            Write-Host "⚠️ SQM GUID change failed: $($_.Exception.Message)"
          }

          # ── 3. Randomize MAC addresses on physical adapters ───────────
          Write-Host ""
          Write-Host "── MAC Address Randomization ────────────────────────────────"
          # NOTE: We write to registry only — NO Disable/Enable adapter.
          # Disabling the adapter would cut the runner's own GitHub connection (hangs).
          # The registry value persists and takes effect on next adapter cycle.
          # Websites cannot read MAC addresses via JavaScript so this is sufficient.
          $regBase = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4D36E972-E325-11CE-BFC1-08002BE10318}"
          $adapters = Get-NetAdapter -Physical -ErrorAction SilentlyContinue |
                      Where-Object { $_.Status -ne "Not Present" }

          if ($adapters) {
            foreach ($adapter in $adapters) {
              try {
                # Generate locally-administered unicast MAC
                $bytes = 1..6 | ForEach-Object { Get-Random -Minimum 0 -Maximum 255 }
                $bytes[0] = ($bytes[0] -band 0xFE) -bor 0x02  # unicast + locally administered
                $macReg     = ($bytes | ForEach-Object { '{0:X2}' -f $_ }) -join ''
                $macDisplay = ($bytes | ForEach-Object { '{0:X2}' -f $_ }) -join '-'

                # Find registry subkey for this adapter by matching InterfaceGuid
                $keys = Get-ChildItem $regBase -ErrorAction SilentlyContinue
                $found = $false
                foreach ($key in $keys) {
                  $props = Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue
                  if ($props.NetCfgInstanceId -and $props.NetCfgInstanceId -eq $adapter.InterfaceGuid) {
                    # Write registry only — no disable/enable to avoid hanging
                    Set-ItemProperty -Path $key.PSPath -Name 'NetworkAddress' -Value $macReg -ErrorAction Stop
                    Write-Host "✅ $($adapter.Name): MAC registry → $macDisplay (active on next cycle)"
                    $found = $true
                    break
                  }
                }
                if (-not $found) {
                  # Fallback: try writing via netsh (no disconnect risk)
                  Write-Host "ℹ️ Registry key not found for $($adapter.Name) — trying netsh"
                  $netshMac = $macDisplay.Replace('-', '')
                  netsh interface set interface "$($adapter.Name)" newmac="$netshMac" 2>$null
                  Write-Host "✅ $($adapter.Name): netsh MAC set → $macDisplay"
                }
              } catch {
                Write-Host "⚠️ MAC update skipped for $($adapter.Name): $($_.Exception.Message)"
              }
            }
          } else {
            Write-Host "ℹ️ No physical adapters found — skipping"
          }


          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  ✅  Machine Identity Randomization Complete"
          Write-Host "============================================================"

      - name: Collect Device Info
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "  🖥️  GITHUB ACTIONS RUNNER — DEVICE INFORMATION REPORT"
          Write-Host "============================================================"

          # ── OS & Runner ──────────────────────────────────────────────
          Write-Host ""
          Write-Host "── OS & Runner ──────────────────────────────────────────────"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS Name        : $($os.Caption)"
          Write-Host "OS Version     : $($os.Version)"
          Write-Host "Build Number   : $($os.BuildNumber)"
          Write-Host "Architecture   : $($os.OSArchitecture)"
          Write-Host "System Drive   : $($os.SystemDrive)"
          Write-Host "Install Date   : $($os.InstallDate)"
          Write-Host "Last Boot      : $($os.LastBootUpTime)"
          Write-Host "Runner Image   : $env:ImageOS / $env:ImageVersion"
          Write-Host "GitHub Runner  : $env:RUNNER_NAME ($env:RUNNER_OS)"
          Write-Host "Runner Arch    : $env:RUNNER_ARCH"
          Write-Host "Runner Temp    : $env:RUNNER_TEMP"
          Write-Host "Runner Tool    : $env:RUNNER_TOOL_CACHE"
          Write-Host "GitHub Region  : $env:GITHUB_SERVER_URL"
          Write-Host "Workflow       : $env:GITHUB_WORKFLOW"
          Write-Host "Run ID         : $env:GITHUB_RUN_ID"
          Write-Host "Run Number     : $env:GITHUB_RUN_NUMBER"
          Write-Host "Job            : $env:GITHUB_JOB"
          Write-Host "Actor          : $env:GITHUB_ACTOR"

          # ── Machine / Computer Identity ───────────────────────────────
          Write-Host ""
          Write-Host "── Machine Identity ─────────────────────────────────────────"
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host "Computer Name  : $($cs.Name)"
          Write-Host "Domain / WG    : $($cs.Domain)"
          Write-Host "Manufacturer   : $($cs.Manufacturer)"
          Write-Host "Model          : $($cs.Model)"
          Write-Host "System Type    : $($cs.SystemType)"
          Write-Host "Total RAM (GB) : $([math]::Round($cs.TotalPhysicalMemory / 1GB, 2))"

          # Machine GUID / Machine ID (Windows Registry)
          try {
            $machineGuid = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name MachineGuid -ErrorAction Stop).MachineGuid
            Write-Host "Machine GUID   : $machineGuid"
          } catch {
            Write-Host "Machine GUID   : (unavailable)"
          }

          # BIOS / Motherboard Serial
          $bios = Get-CimInstance Win32_BIOS
          Write-Host "BIOS Vendor    : $($bios.Manufacturer)"
          Write-Host "BIOS Version   : $($bios.SMBIOSBIOSVersion)"
          Write-Host "BIOS Serial    : $($bios.SerialNumber)"
          Write-Host "BIOS Release   : $($bios.ReleaseDate)"

          $board = Get-CimInstance Win32_BaseBoard
          Write-Host "Motherboard    : $($board.Manufacturer) — $($board.Product)"
          Write-Host "Board Serial   : $($board.SerialNumber)"

          # ── CPU ───────────────────────────────────────────────────────
          Write-Host ""
          Write-Host "── CPU ──────────────────────────────────────────────────────"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "CPU Name       : $($cpu.Name)"
          Write-Host "CPU Cores      : $($cpu.NumberOfCores)"
          Write-Host "Logical CPUs   : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "Max Clock(MHz) : $($cpu.MaxClockSpeed)"
          Write-Host "CPU ID         : $($cpu.ProcessorId)"
          Write-Host "CPU Socket     : $($cpu.SocketDesignation)"
          Write-Host "CPU Arch       : $($cpu.Architecture)"

          # ── RAM Slots ─────────────────────────────────────────────────
          Write-Host ""
          Write-Host "── RAM ──────────────────────────────────────────────────────"
          Get-CimInstance Win32_PhysicalMemory | ForEach-Object {
            Write-Host ("  Slot {0,-6}: {1} GB  {2} MHz  SN={3}" -f $_.DeviceLocator, [math]::Round($_.Capacity/1GB,1), $_.Speed, $_.SerialNumber)
          }

          # ── Network / MAC Addresses ───────────────────────────────────
          Write-Host ""
          Write-Host "── Network Adapters & MAC Addresses ─────────────────────────"
          Get-CimInstance Win32_NetworkAdapterConfiguration |
            Where-Object { $_.MACAddress -ne $null } |
            ForEach-Object {
              Write-Host ("  [{0}] MAC={1}  IP={2}  DHCP={3}" -f $_.Description, $_.MACAddress, ($_.IPAddress -join ', '), $_.DHCPEnabled)
            }

          # Quick public-IP lookup
          Write-Host ""
          Write-Host "── Public IP (via ipinfo.io) ─────────────────────────────────"
          try {
            $ipInfo = Invoke-RestMethod -Uri "https://ipinfo.io/json" -TimeoutSec 10
            Write-Host "Public IP      : $($ipInfo.ip)"
            Write-Host "ISP / Org      : $($ipInfo.org)"
            Write-Host "City / Region  : $($ipInfo.city), $($ipInfo.region)"
            Write-Host "Country        : $($ipInfo.country)"
            Write-Host "Timezone       : $($ipInfo.timezone)"
          } catch {
            Write-Host "Public IP      : (lookup failed)"
          }

          # ── Disk ──────────────────────────────────────────────────────
          Write-Host ""
          Write-Host "── Disk Drives ──────────────────────────────────────────────"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            $used = if ($_.Used) { [math]::Round($_.Used/1GB, 2) } else { "N/A" }
            $free = if ($_.Free) { [math]::Round($_.Free/1GB, 2) } else { "N/A" }
            Write-Host ("  Drive {0}: Used={1} GB  Free={2} GB" -f $_.Name, $used, $free)
          }

          # Physical disks
          Get-CimInstance Win32_DiskDrive | ForEach-Object {
            Write-Host ("  Physical: {0}  Size={1} GB  Serial={2}  Interface={3}" -f $_.Model, [math]::Round($_.Size/1GB,1), $_.SerialNumber, $_.InterfaceType)
          }

          # ── Environment Summary ───────────────────────────────────────
          Write-Host ""
          Write-Host "── Node / NPM / Tools ───────────────────────────────────────"
          node --version
          npm --version
          Write-Host "PowerShell Ver : $($PSVersionTable.PSVersion)"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  ✅  Device Info Collection Complete"
          Write-Host "============================================================"

      # ------------------------------------------------------------------
      # v24 · OpenVPN / WireGuard support. Profiles + mode are stored in Firebase
      # (dashboardSettings/vpn) and managed from the web panel / Android app.
      # run_mode=vpn_test -> only these steps run and the result is reported
      # back to Firebase (lastTest), the step summary and Telegram.
      # ------------------------------------------------------------------
      - name: 🔐 Create vpn.mjs (OpenVPN / WireGuard helper)
        shell: pwsh
        run: |
          @'
          // ============================================================================
          //  vpn.mjs  -  OpenVPN / WireGuard tunnel helper for the Zedge automation runner
          //  v24 - profiles live in Firebase RTDB at  dashboardSettings/vpn  (per account)
          //
          //    node vpn.mjs connect     -> main automation: bring the tunnel up (or skip when disabled)
          //    node vpn.mjs test        -> panel/app "Test VPN": connect, verify, report, disconnect
          //    node vpn.mjs disconnect  -> tear the tunnel down (idempotent)
          //
          //  Firebase layout (per account database):
          //    dashboardSettings/vpn/mode              "none" | "openvpn" | "wireguard"   ("none" = proxy / direct as before)
          //    dashboardSettings/vpn/activeProfileId   id of the profile used by real runs
          //    dashboardSettings/vpn/keepProxy         true -> HTTP proxy inputs stay active inside the tunnel
          //    dashboardSettings/vpn/profiles/<id>     { name, type, config, username, password, ca, cert, key, tlsAuth, tlsCrypt, extra }
          //    dashboardSettings/vpn/lastTest          result written by "test"
          //    dashboardSettings/vpn/lastRun           result written by "connect"
          // ============================================================================
          import fs from "fs";
          import os from "os";
          import path from "path";
          import { spawn, spawnSync } from "child_process";

          const MODE = (process.argv[2] || "connect").toLowerCase();
          const DB = (process.env.FIREBASE_DB_URL || "").replace(/\/+$/, "");
          const ACCOUNT = process.env.ACCOUNT_LABEL || "ZEDGE";

          const PROFILE_OVERRIDE = (process.env.VPN_PROFILE || "").trim();
          const VPN_PATH = "dashboardSettings/vpn";
          const IS_WIN = process.platform === "win32";
          const WORK = path.join(process.env.RUNNER_TEMP || os.tmpdir(), "zedge-vpn");
          const STATE_FILE = path.join(WORK, "state.json");
          const RUN_ID = process.env.GITHUB_RUN_ID || "";
          const RUN_URL = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY && RUN_ID
            ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${RUN_ID}` : "";
          const OVPN_DIR = "C:\\Program Files\\OpenVPN";
          const WG_DIR = "C:\\Program Files\\WireGuard";
          const WG_TUNNEL = "zedgewg";
          const LOG_LINES = [];

          fs.mkdirSync(WORK, { recursive: true });

          // ---------------------------------------------------------------- utilities
          const ts = () => new Date().toISOString().slice(11, 19);
          function log(msg) { const line = `[${ts()}] ${msg}`; console.log(line); LOG_LINES.push(line); if (LOG_LINES.length > 400) LOG_LINES.shift(); }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const mask = (s) => (s ? String(s).slice(0, 2) + "***" : "");

          function setEnv(k, v) { try { if (process.env.GITHUB_ENV) fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`); } catch (_) {} }
          function setOutput(k, v) { try { if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`); } catch (_) {} }
          function summary(md) { try { if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n"); } catch (_) {} }

          async function fetchTimeout(url, opts = {}, ms = 15000) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); } finally { clearTimeout(t); }
          }
          async function jget(p) {
            if (!DB) throw new Error("FIREBASE_DB_URL is not set");
            const r = await fetchTimeout(`${DB}/${p}.json`, {}, 20000);
            if (!r.ok) throw new Error(`Firebase GET ${p} -> HTTP ${r.status}`);
            return r.json();
          }
          async function jpatch(p, body) {
            try {
              const r = await fetchTimeout(`${DB}/${p}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }, 20000);
              if (!r.ok) log(`⚠️ Firebase PATCH ${p} -> HTTP ${r.status}`);
            } catch (e) { log(`⚠️ Firebase PATCH ${p} failed: ${e.message}`); }
          }

          function run(cmd, args, opts = {}) {
            const r = spawnSync(cmd, args, { encoding: "utf8", windowsHide: true, timeout: opts.timeout || 10 * 60 * 1000, ...opts });
            return { code: r.status, out: (r.stdout || "") + (r.stderr || ""), error: r.error };
          }
          function ps(script, timeout) { return run("powershell", ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", script], { timeout }); }
          function sh(cmd, timeout) { return run("bash", ["-lc", cmd], { timeout }); }
          function tail(file, n = 40) { try { return fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).slice(-n).join("\n"); } catch (_) { return ""; } }
          function readState() { try { return JSON.parse(fs.readFileSync(STATE_FILE, "utf8")); } catch (_) { return null; } }
          function writeState(s) { fs.writeFileSync(STATE_FILE, JSON.stringify(s)); }

          // ------------------------------------------------------------ public IP probe
          async function publicIp() {
            const probes = [
              { url: "https://ipinfo.io/json", map: (j) => ({ ip: j.ip, country: j.country, city: j.city, region: j.region, org: j.org, timezone: j.timezone }) },
              { url: "https://ipapi.co/json/", map: (j) => ({ ip: j.ip, country: j.country_code, city: j.city, region: j.region, org: j.org, timezone: j.timezone }) },
              { url: "https://api.ipify.org?format=json", map: (j) => ({ ip: j.ip }) },
            ];
            let lastErr = "";
            for (const p of probes) {
              try {
                const r = await fetchTimeout(p.url, { headers: { "User-Agent": "curl/8.0" } }, 15000);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                const info = p.map(j);
                if (info && info.ip) return info;
              } catch (e) { lastErr = `${p.url}: ${e.message}`; }
            }
            throw new Error(`public IP lookup failed (${lastErr})`);
          }
          async function zedgeCheck() {
            try {
              const r = await fetchTimeout("https://www.zedge.net/", { method: "GET", redirect: "follow", headers: { "User-Agent": "Mozilla/5.0" } }, 25000);
              return { ok: r.status < 500, status: r.status };
            } catch (e) { return { ok: false, status: 0, error: e.message }; }
          }
          function fmtIp(i) { return i ? `${i.ip}${i.country ? ` (${[i.city, i.region, i.country].filter(Boolean).join(", ")})` : ""}${i.org ? ` · ${i.org}` : ""}` : "-"; }

          // ------------------------------------------------------------- profile load
          async function loadProfile() {
            const data = (await jget(VPN_PATH)) || {};
            const profiles = data.profiles || {};
            const wantId = PROFILE_OVERRIDE || data.activeProfileId || "";
            if (!PROFILE_OVERRIDE) {
              const mode = String(data.mode || "none").toLowerCase();
              if (mode === "none" || mode === "proxy" || !wantId) return { disabled: true, reason: !wantId ? "no active profile" : `mode = ${mode}`, data };
            }
            const profile = profiles[wantId];
            if (!profile) throw new Error(`VPN profile "${wantId}" not found under ${VPN_PATH}/profiles (save it from the panel / app first)`);
            const type = String(profile.type || "").toLowerCase() === "wireguard" ? "wireguard" : "openvpn";
            return { disabled: false, id: wantId, type, profile: { ...profile, type }, data };
          }

          // ------------------------------------------------------------ OpenVPN files
          /** Builds a self-contained .ovpn: inlines uploaded certificates, wires auth-user-pass, adds runner safety routes. */
          function buildOvpn(profile, dir) {
            let cfg = String(profile.config || "").replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "");
            if (!cfg.trim()) throw new Error("OpenVPN profile has an empty .ovpn config");
            if (!/^\s*(remote|remote-random|<connection>)/m.test(cfg)) throw new Error(".ovpn has no 'remote' line - is this really an OpenVPN client config?");
            const hasBlock = (tag) => new RegExp(`<${tag}>[\\s\\S]*?</${tag}>`, "i").test(cfg);
            const dropDirective = (name) => { cfg = cfg.replace(new RegExp(`^[ \\t]*${name}[ \\t]+[^\\n]*\\n?`, "gmi"), ""); };
            const notes = [];

            // ---- certificates / keys uploaded separately -> inline blocks ----
            const inlines = [["ca", "ca"], ["cert", "cert"], ["key", "key"], ["tlsAuth", "tls-auth"], ["tlsCrypt", "tls-crypt"]];
            for (const [field, tag] of inlines) {
              const body = String(profile[field] || "").replace(/\r\n?/g, "\n").trim();
              if (!body) continue;
              if (tag === "tls-auth") {
                const m = cfg.match(/^[ \t]*tls-auth[ \t]+\S+[ \t]+([01])/mi);
                if (m && !/^\s*key-direction/m.test(cfg)) cfg += `\nkey-direction ${m[1]}\n`;
              }
              cfg = cfg.replace(new RegExp(`<${tag}>[\\s\\S]*?</${tag}>\\n?`, "gi"), "");
              dropDirective(tag);
              cfg += `\n<${tag}>\n${body}\n</${tag}>\n`;
              notes.push(`${tag} inlined from upload`);
            }

            // ---- external file references that we cannot satisfy ----
            const fileDirectives = ["ca", "cert", "key", "tls-auth", "tls-crypt", "tls-crypt-v2", "pkcs12", "dh", "crl-verify", "extra-certs", "secret"];
            const missing = [];
            for (const d of fileDirectives) {
              const re = new RegExp(`^[ \\t]*${d}[ \\t]+([^\\s#]+)`, "gmi");
              let m;
              while ((m = re.exec(cfg))) {
                const f = m[1].replace(/^['"]|['"]$/g, "");
                if (f === "[inline]") continue;
                if (hasBlock(d)) { dropDirective(d); continue; }
                missing.push(`${d} ${f}`);
              }
            }
            if (missing.length) throw new Error(`.ovpn references external file(s) that were not uploaded: ${missing.join(", ")}. Add them in the VPN card (CA / Cert / Key / TLS fields) or paste an inline (.ovpn with <ca>...</ca>) config.`);

            // ---- username / password ----
            const user = String(profile.username || "").trim();
            const pass = String(profile.password || "");
            const wantsAuth = /^[ \t]*auth-user-pass\b/m.test(cfg);
            if (wantsAuth && !user) throw new Error("This .ovpn requires a username/password (auth-user-pass) but none is saved in the profile.");
            if (user) {
              dropDirective("auth-user-pass");
              cfg = cfg.replace(/^[ \t]*auth-user-pass[ \t]*$/gmi, "");
              fs.writeFileSync(path.join(dir, "auth.txt"), `${user}\n${pass}\n`, { mode: 0o600 });
              cfg += `\nauth-user-pass auth.txt\nauth-nocache\n`;
              notes.push(`credentials: ${mask(user)}`);
            } else notes.push("certificate-only login (no username/password)");

            // ---- interactive / unsafe directives ----
            for (const d of ["askpass", "management", "management-query-passwords", "daemon", "log", "log-append", "status", "writepid", "up", "down", "route-up", "ipchange", "client-connect", "user", "group", "chroot"]) dropDirective(d);
            cfg = cfg.replace(/^[ \t]*(daemon|management-query-passwords|auth-retry[ \t]+interact)[ \t]*$/gmi, "");

            // ---- runner safety: keep the cloud DNS/metadata reachable, tunnel DNS, no prompts ----
            const extra = ["", "# --- added by zedge automation (v24) ---", "auth-retry none", "connect-retry 3 10", "connect-timeout 25", "resolv-retry 30", "server-poll-timeout 25", "verb 3", "mute-replay-warnings", "suppress-timestamps"];
            if (!/^\s*explicit-exit-notify/m.test(cfg) && /^\s*proto\s+udp/mi.test(cfg)) extra.push("explicit-exit-notify 1");
            if (IS_WIN) extra.push("route 168.63.129.16 255.255.255.255 net_gateway");    // Azure DNS / metadata stays on the LAN
            if (!/^\s*dhcp-option\s+DNS/mi.test(cfg)) extra.push("dhcp-option DNS 1.1.1.1", "dhcp-option DNS 8.8.8.8");
            if (String(profile.extra || "").trim()) extra.push("# --- profile extra lines ---", String(profile.extra).replace(/\r\n?/g, "\n").trim());
            if (!/^\s*redirect-gateway/m.test(cfg)) notes.push("no redirect-gateway in config (server should push it - IP change is verified after connect)");
            cfg = cfg.trimEnd() + "\n" + extra.join("\n") + "\n";
            fs.writeFileSync(path.join(dir, "zedge.ovpn"), cfg, { mode: 0o600 });
            return notes;
          }

          // ------------------------------------------------------------- WireGuard
          function buildWg(profile, dir) {
            let cfg = String(profile.config || "").replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "").trim();
            if (!cfg) throw new Error("WireGuard profile has an empty config");
            if (!/^\s*\[Interface\]/mi.test(cfg) || !/^\s*\[Peer\]/mi.test(cfg)) throw new Error("WireGuard config needs both [Interface] and [Peer] sections");
            if (!/^\s*PrivateKey\s*=/mi.test(cfg)) throw new Error("WireGuard config is missing PrivateKey");
            if (!/^\s*Endpoint\s*=/mi.test(cfg)) throw new Error("WireGuard config is missing Endpoint");
            const notes = [];
            if (!/^\s*DNS\s*=/mi.test(cfg)) { cfg = cfg.replace(/^\s*\[Interface\]\s*$/mi, "[Interface]\nDNS = 1.1.1.1, 8.8.8.8"); notes.push("DNS 1.1.1.1 added"); }
            if (!/AllowedIPs\s*=.*0\.0\.0\.0\/0/i.test(cfg)) notes.push("AllowedIPs does not cover 0.0.0.0/0 - only part of the traffic will use the tunnel");
            if (String(profile.extra || "").trim()) cfg += "\n" + String(profile.extra).replace(/\r\n?/g, "\n").trim();
            fs.writeFileSync(path.join(dir, `${WG_TUNNEL}.conf`), cfg + "\n", { mode: 0o600 });
            return notes;
          }

          // ----------------------------------------------------------- installers
          function ensureOpenVpn() {
            if (IS_WIN) {
              const exe = path.join(OVPN_DIR, "bin", "openvpn.exe");
              if (fs.existsSync(exe)) return exe;
              log("📦 Installing OpenVPN (chocolatey)...");
              const r = ps("choco install openvpn -y --no-progress --limit-output | Out-Null; exit $LASTEXITCODE", 8 * 60 * 1000);
              if (!fs.existsSync(exe)) throw new Error(`OpenVPN install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              return exe;
            }
            if (run("which", ["openvpn"]).code !== 0) {
              log("📦 Installing OpenVPN (apt)...");
              const r = sh("sudo apt-get update -qq && sudo apt-get install -y -qq openvpn", 6 * 60 * 1000);
              if (r.code !== 0) throw new Error(`OpenVPN install failed: ${r.out.slice(-400)}`);
            }
            return "openvpn";
          }
          function ensureWireGuard() {
            if (IS_WIN) {
              const exe = path.join(WG_DIR, "wireguard.exe");
              if (fs.existsSync(exe)) return exe;
              log("📦 Installing WireGuard (chocolatey)...");
              const r = ps("choco install wireguard -y --no-progress --limit-output | Out-Null; exit $LASTEXITCODE", 8 * 60 * 1000);
              if (!fs.existsSync(exe)) throw new Error(`WireGuard install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              return exe;
            }
            if (run("which", ["wg-quick"]).code !== 0) {
              log("📦 Installing WireGuard (apt)...");
              const r = sh("sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools resolvconf", 6 * 60 * 1000);
              if (r.code !== 0) throw new Error(`WireGuard install failed: ${r.out.slice(-400)}`);
            }
            return "wg-quick";
          }

          // ------------------------------------------------------------- connect
          async function connectOpenVpn(profile) {
            const notes = buildOvpn(profile, WORK);
            notes.forEach((n) => log(`   · ${n}`));
            const exe = ensureOpenVpn();
            const logFile = path.join(WORK, "openvpn.log");
            try { fs.unlinkSync(logFile); } catch (_) {}
            let child;
            if (IS_WIN) {
              child = spawn(exe, ["--config", "zedge.ovpn", "--log", logFile], { cwd: WORK, detached: true, stdio: "ignore", windowsHide: true });
            } else {
              child = spawn("sudo", ["openvpn", "--config", "zedge.ovpn", "--log", logFile], { cwd: WORK, detached: true, stdio: "ignore" });
            }
            child.unref();
            writeState({ type: "openvpn", pid: child.pid, logFile, exe });
            log(`🚀 OpenVPN started (pid ${child.pid}), waiting for the tunnel...`);
            const deadline = Date.now() + 100 * 1000;
            while (Date.now() < deadline) {
              await sleep(2000);
              const text = (() => { try { return fs.readFileSync(logFile, "utf8"); } catch (_) { return ""; } })();
              if (/Initialization Sequence Completed/.test(text)) { log("✅ OpenVPN: Initialization Sequence Completed"); return; }
              const fatal = [
                [/AUTH_FAILED|auth-failure/i, "authentication failed - wrong username/password (or the account is expired / device limit reached)"],
                [/TLS Error: TLS key negotiation failed|TLS handshake failed/i, "TLS handshake failed - server unreachable, wrong port/proto, or CA/TLS-auth key does not match"],
                [/Cannot resolve host address|RESOLVE:/i, "cannot resolve the VPN server hostname"],
                [/Options error/i, "OpenVPN options error - the .ovpn has an unsupported / misspelled directive"],
                [/Cannot load (certificate|private key|CA)|error:0[0-9A-F]+:PEM/i, "certificate / key could not be loaded - check CA / cert / key content"],
                [/All (TAP-Windows|wintun|TAP) adapters on this system are currently in use|There are no TAP-Windows|no TAP adapters/i, "no TAP/Wintun adapter available on the runner"],
                [/Exiting due to fatal error|process exiting/i, "OpenVPN exited"],
              ];
              for (const [re, why] of fatal) if (re.test(text)) throw new Error(`OpenVPN: ${why}\n--- openvpn.log ---\n${tail(logFile, 25)}`);
              if (IS_WIN) { const alive = ps(`if (Get-Process -Id ${child.pid} -ErrorAction SilentlyContinue) { 'yes' } else { 'no' }`).out.trim(); if (alive === "no" && !text.includes("Initialization Sequence Completed")) throw new Error(`OpenVPN process exited early\n--- openvpn.log ---\n${tail(logFile, 25)}`); }
            }
            throw new Error(`OpenVPN did not finish connecting within 100 s\n--- openvpn.log ---\n${tail(logFile, 25)}`);
          }

          async function connectWireGuard(profile) {
            const notes = buildWg(profile, WORK);
            notes.forEach((n) => log(`   · ${n}`));
            const exe = ensureWireGuard();
            const conf = path.join(WORK, `${WG_TUNNEL}.conf`);
            if (IS_WIN) {
              ps(`& "${exe}" /uninstalltunnelservice ${WG_TUNNEL}`); await sleep(1500);
              const r = ps(`& "${exe}" /installtunnelservice "${conf}"; exit $LASTEXITCODE`, 60000);
              if (r.code !== 0) throw new Error(`WireGuard service install failed (exit ${r.code}): ${r.out.slice(-400)}`);
              writeState({ type: "wireguard", exe, conf });
              log("🚀 WireGuard tunnel service installed, waiting for handshake...");
              const wg = path.join(WG_DIR, "wg.exe");
              const deadline = Date.now() + 45 * 1000;
              while (Date.now() < deadline) {
                await sleep(2000);
                const s = run(wg, ["show", WG_TUNNEL]).out || "";
                if (/latest handshake/i.test(s)) { log("✅ WireGuard handshake completed"); return; }
              }
              const svc = ps(`(Get-Service -Name 'WireGuardTunnel$${WG_TUNNEL}' -ErrorAction SilentlyContinue).Status`).out.trim();
              const evt = ps(`Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='WireGuard'} -MaxEvents 12 -ErrorAction SilentlyContinue | ForEach-Object { $_.Message }`).out.trim().slice(-1200);
              throw new Error(`WireGuard: no handshake within 45 s (service ${svc || "unknown"}) - wrong keys, endpoint blocked, or UDP port unreachable.\n${evt}`);
            }
            sh(`sudo wg-quick down ${conf} 2>/dev/null; true`);
            const r = sh(`sudo cp "${conf}" /etc/wireguard/${WG_TUNNEL}.conf && sudo chmod 600 /etc/wireguard/${WG_TUNNEL}.conf && sudo wg-quick up ${WG_TUNNEL}`, 60000);
            if (r.code !== 0) throw new Error(`wg-quick up failed: ${r.out.slice(-600)}`);
            writeState({ type: "wireguard" });
            const deadline = Date.now() + 45 * 1000;
            while (Date.now() < deadline) { await sleep(2000); if (/latest handshake/i.test(sh(`sudo wg show ${WG_TUNNEL}`).out)) { log("✅ WireGuard handshake completed"); return; } }
            throw new Error("WireGuard: no handshake within 45 s");
          }

          async function disconnect(quiet = false) {
            const st = readState();
            if (!st) { if (!quiet) log("ℹ️ No VPN tunnel state - nothing to disconnect."); return; }
            try {
              if (st.type === "openvpn") {
                if (IS_WIN) { if (st.pid) ps(`Stop-Process -Id ${st.pid} -Force -ErrorAction SilentlyContinue`); ps("Get-Process openvpn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue"); }
                else sh("sudo pkill -f 'openvpn --config zedge.ovpn' || true");
              } else if (st.type === "wireguard") {
                if (IS_WIN) ps(`& "${st.exe}" /uninstalltunnelservice ${WG_TUNNEL}`); else sh(`sudo wg-quick down ${WG_TUNNEL} || true`);
              }
              log(`🔌 VPN (${st.type}) disconnected.`);
            } catch (e) { log(`⚠️ disconnect: ${e.message}`); }
            try { fs.unlinkSync(STATE_FILE); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, "auth.txt")); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, "zedge.ovpn")); } catch (_) {}
            try { fs.unlinkSync(path.join(WORK, `${WG_TUNNEL}.conf`)); } catch (_) {}
          }

          // ------------------------------------------------------------- telegram
          async function telegram(text) {
            const tok = process.env.TELEGRAM_BOT_TOKEN, chat = process.env.TELEGRAM_CHAT_ID;
            if (!tok || !chat) return;
            try {
              await fetchTimeout("https://api.telegram.org/bot" + tok + "/sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: chat, text, parse_mode: "HTML", disable_web_page_preview: true }) }, 15000);
            } catch (_) {}
          }
          const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
          const dhakaNow = () => new Date(Date.now() + 6 * 3600 * 1000).toISOString().replace("T", " ").slice(0, 16) + " (Dhaka)";

          // ------------------------------------------------------------- main flows
          async function connectFlow(isTest) {
            const started = Date.now();
            const resultKey = isTest ? "lastTest" : "lastRun";
            const report = async (patch) => jpatch(`${VPN_PATH}/${resultKey}`, { ...patch, at: Date.now(), runId: RUN_ID, runUrl: RUN_URL, account: ACCOUNT, mode: isTest ? "test" : "run", runner: `${os.platform()} ${os.release()}` });

            log(`🔐 VPN ${isTest ? "TEST" : "connect"} for ${ACCOUNT}  (db: ${DB || "-"})`);
            let loaded;
            try { loaded = await loadProfile(); }
            catch (e) { await report({ status: "fail", stage: "load", message: e.message, profileId: PROFILE_OVERRIDE }); throw e; }

            if (loaded.disabled) {
              log(`ℹ️ VPN disabled for this account (${loaded.reason}) - proxy / direct connection as before.`);
              setEnv("VPN_ACTIVE", "0"); setOutput("vpn", "disabled");
              if (isTest) { await report({ status: "fail", stage: "load", message: `No active VPN profile to test (${loaded.reason}). Save a profile and click Test on it.` }); process.exit(1); }
              return;
            }
            const { id, type, profile, data } = loaded;
            const name = profile.name || id;
            log(`📄 Profile: "${name}"  type=${type}  id=${id}`);
            await report({ status: "running", stage: "connecting", message: `Connecting ${type} profile "${name}"...`, profileId: id, profileName: name, type });

            let ipBefore = null;
            try { ipBefore = await publicIp(); log(`🌍 Public IP before VPN: ${fmtIp(ipBefore)}`); } catch (e) { log(`⚠️ ${e.message}`); }

            try {
              if (type === "wireguard") await connectWireGuard(profile); else await connectOpenVpn(profile);
            } catch (e) {
              log(`❌ ${e.message}`);
              await report({ status: "fail", stage: "connect", message: e.message.split("\n")[0], detail: e.message.slice(0, 3000), profileId: id, profileName: name, type, ipBefore, durationMs: Date.now() - started, logTail: LOG_LINES.slice(-40).join("\n") });
              if (isTest) await telegram([`🔐 <b>VPN টেস্ট ব্যর্থ</b> · ${esc(ACCOUNT)}`, "━━━━━━━━━━━━━━━━", `📄 প্রোফাইল: ${esc(name)} (${type})`, `🧩 কারণ: <code>${esc(e.message.split("\n")[0].slice(0, 300))}</code>`, `🕒 ${dhakaNow()}`, RUN_URL ? `🔎 ${RUN_URL}` : ""].filter(Boolean).join("\n"));
              await disconnect(true);
              process.exit(1);
            }

            // ---- verify: public IP must change, internet + zedge reachable ----
            await sleep(3000);
            let ipAfter = null, ipErr = "";
            for (let i = 0; i < 3 && !ipAfter; i++) { try { ipAfter = await publicIp(); } catch (e) { ipErr = e.message; await sleep(4000); } }
            const zedge = ipAfter ? await zedgeCheck() : { ok: false, status: 0 };
            const sameIp = ipBefore && ipAfter && ipBefore.ip === ipAfter.ip;
            const verdictOk = !!ipAfter && !sameIp && zedge.ok;
            let message = "";
            if (!ipAfter) message = `Tunnel is up but the internet is NOT reachable through it (${ipErr}). The VPN server may block traffic, or DNS/routing is broken.`;
            else if (sameIp) message = "Tunnel is up but the public IP did not change - the config does not route all traffic (missing redirect-gateway / AllowedIPs 0.0.0.0/0).";
            else if (!zedge.ok) message = `IP changed to ${ipAfter.ip} but zedge.net is not reachable through this VPN (${zedge.error || "HTTP " + zedge.status}).`;
            else message = `Connected. IP ${ipBefore ? ipBefore.ip : "?"} → ${ipAfter.ip}${ipAfter.country ? " · " + [ipAfter.city, ipAfter.country].filter(Boolean).join(", ") : ""}. zedge.net reachable (HTTP ${zedge.status}).`;
            log(`🌍 Public IP after VPN: ${fmtIp(ipAfter)}`);
            log(`${verdictOk ? "✅" : "❌"} ${message}`);

            const durationMs = Date.now() - started;
            const result = { status: verdictOk ? "ok" : "fail", stage: "verify", message, profileId: id, profileName: name, type, ipBefore, ipAfter, zedgeStatus: zedge.status, zedgeOk: zedge.ok, durationMs, logTail: LOG_LINES.slice(-40).join("\n") };
            await report(result);
            summary([
              `### 🔐 VPN ${isTest ? "test" : "tunnel"} · ${ACCOUNT} · ${verdictOk ? "✅ OK" : "❌ FAILED"}`,
              "", "| | |", "|---|---|",
              `| Profile | ${name} (${type}) |`, `| IP before | ${fmtIp(ipBefore)} |`, `| IP after | ${fmtIp(ipAfter)} |`,
              `| zedge.net | ${zedge.ok ? "reachable" : "NOT reachable"} (HTTP ${zedge.status}) |`, `| Duration | ${Math.round(durationMs / 1000)} s |`, `| Result | ${message} |`,
            ].join("\n"));

            if (isTest) {
              await telegram([`🔐 <b>VPN টেস্ট ${verdictOk ? "সফল ✅" : "ব্যর্থ ❌"}</b> · ${esc(ACCOUNT)}`, "━━━━━━━━━━━━━━━━", `📄 প্রোফাইল: ${esc(name)} (${type})`,
                `🌍 IP: <code>${esc(ipBefore ? ipBefore.ip : "?")}</code> → <code>${esc(ipAfter ? ipAfter.ip : "?")}</code>${ipAfter && ipAfter.country ? " · " + esc([ipAfter.city, ipAfter.country].filter(Boolean).join(", ")) : ""}`,
                `🟢 zedge.net: ${zedge.ok ? "reachable" : "NOT reachable"}`, `⏱ ${Math.round(durationMs / 1000)}s · 🕒 ${dhakaNow()}`, verdictOk ? "" : `🧩 ${esc(message)}`, RUN_URL ? `🔎 ${RUN_URL}` : ""].filter(Boolean).join("\n"));
              await disconnect();
              process.exit(verdictOk ? 0 : 1);
            }
            if (!verdictOk) { await disconnect(true); throw new Error(`VPN verification failed - aborting the run so the real IP is never used. ${message}`); }
            setEnv("VPN_ACTIVE", "1");
            setEnv("VPN_TYPE", type);
            setEnv("VPN_PROFILE_NAME", name);
            setEnv("VPN_KEEP_PROXY", data && data.keepProxy === true ? "1" : "0");
            setEnv("VPN_PUBLIC_IP", ipAfter.ip);
            setOutput("vpn", type);
          }

          (async () => {
            try {
              if (MODE === "disconnect") { await disconnect(); return; }
              await connectFlow(MODE === "test");
            } catch (e) {
              console.error(`❌ VPN step failed: ${e.message}`);
              process.exit(1);
            }
          })();
          '@ | Set-Content -Encoding UTF8 vpn.mjs

      - name: 🔐 VPN tunnel (profile from Firebase dashboardSettings/vpn)
        id: vpn
        shell: pwsh
        timeout-minutes: 15
        env:
          FIREBASE_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          ACCOUNT_LABEL: "Zedge 3"
          RUN_MODE: ${{ inputs.run_mode }}
          VPN_PROFILE: ${{ inputs.vpn_profile }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ($env:RUN_MODE -eq 'vpn_test') { node vpn.mjs test } else { node vpn.mjs connect }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create bot.js
        if: inputs.run_mode != 'vpn_test'
        shell: pwsh
        run: |
          @'
          const { chromium } = require("playwright");

          /* ------------------------------------------------------------------ */
          /* MH-EARNINGS v33 - synced with Chrome extension v1.6.0 + series     */
          /* split & single-month / paid-previous-month fixes.                  */
          /* ------------------------------------------------------------------ */
          const EARN_THRESHOLD = Number(process.env.EARN_THRESHOLD || "50") || 50;
          const EARN_MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];

          function earnLog(msg) { console.log("\uD83D\uDCB0 earnings: " + msg); }
          function earnPad(n) { return String(n).padStart(2, "0"); }
          function earnIso(y, m, d) { return `${y}-${earnPad(m + 1)}-${earnPad(d)}`; }
          function earnDaysInMonth(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); }
          function earnMoney(txt) {
            const m = String(txt || "").replace(/,/g, "").match(/-?\d+(?:\.\d+)?/);
            return m ? Number(m[0]) : null;
          }
          function earnTitle(m, y) { return `${EARN_MONTHS[m][0].toUpperCase()}${EARN_MONTHS[m].slice(1)} ${y}`; }

          function earnParseMonth(text) {
            const t = String(text || "").toLowerCase();
            for (let i = 0; i < 12; i++) {
              const full = EARN_MONTHS[i], abbr = full.slice(0, 3);
              const re = new RegExp(`(?:^|[^a-z])(${full}|${abbr})[^0-9a-z]{0,4}(20\\d{2})|(20\\d{2})[^0-9a-z]{0,4}(${full}|${abbr})(?:[^a-z]|$)`);
              const hit = t.match(re);
              if (hit) return { m: i, y: Number(hit[2] || hit[3]) };
            }
            return null;
          }

          /* In-page tab navigation (same as Chrome extension openTab - avoids full SPA reloads) */
          async function earnEnsureZedge(page) {
            const url = page.url() || "";
            if (!url.startsWith("https://upload.zedge.net")) {
              await page.goto("https://upload.zedge.net", { waitUntil: "domcontentloaded" });
              await page.waitForTimeout(4500);
            }
          }

          async function earnOpenTab(page, name) {
            await earnEnsureZedge(page);
            const clicked = await page.evaluate(async (tabName) => {
              const rx = new RegExp("^\\s*" + tabName + "\\s*$", "i");
              const link = [...document.querySelectorAll("a")].find((n) => rx.test((n.textContent || "").trim()));
              if (!link) return false;
              const r = link.getBoundingClientRect();
              for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                link.dispatchEvent(new MouseEvent(type, {
                  bubbles: true, cancelable: true, view: window,
                  clientX: r.x + r.width / 2, clientY: r.y + r.height / 2,
                }));
              }
              return true;
            }, name);
            if (!clicked) {
              const loc = page.locator("a", { hasText: new RegExp("^\\s*" + name + "\\s*$", "i") }).first();
              if (await loc.count()) await loc.click();
              else earnLog(`"${name}" tab not found`);
            }
            await page.waitForTimeout(4500);
          }

          /* 1. Reads the "Payments history" tab: newest paid month + the whole table. */
          async function earnReadLastPayment(page) {
            await earnOpenTab(page, "Payments history");
            for (let w = 0; w < 12; w++) {
              const ready = await page.evaluate(() => /payment\s*method|received\s*any\s*payments/i.test(document.body.innerText || "")).catch(() => false);
              if (ready) break;
              await page.waitForTimeout(1500);
            }
            await page.waitForTimeout(1500);

            const text = await page.evaluate(() => document.body.innerText || "");
            if (/received\s*any\s*payments\s*yet/i.test(text)) {
              earnLog("payments history is empty - no payment received yet");
              return null;
            }
            const lines = text.split(/\n+/).map((l) => l.trim()).filter(Boolean);

            const payments = [];
            let best = null;
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              const joined = [line, lines[i + 1] || "", lines[i + 2] || "", lines[i + 3] || ""].join(" ");
              const when = earnParseMonth(line) || earnParseMonth(joined);
              if (!when) continue;
              if (/payment\s*method|payment\s*date/i.test(line)) continue;
              const amount = earnMoney((joined.match(/\$\s?[\d,]+(?:\.\d{1,2})?/) || [])[0]);
              if (amount == null) continue;
              const paidOn = (joined.match(/[A-Z][a-z]+\s+\d{1,2},\s*20\d{2}/) || [""])[0];
              const method = (joined.match(/\b(DOTS|PAYPAL|PayPal|Paypal|Payoneer|Wire|Bank)\b/) || [""])[0];
              const key = when.y * 12 + when.m;
              if (!payments.some((p) => p.monthKey === key)) {
                payments.push({
                  monthKey: key,
                  month: earnTitle(when.m, when.y),
                  paidOn,
                  method,
                  amount,
                  reason: joined.replace(/\s+/g, " ").slice(0, 120),
                });
              }
              if (!best || key > best.key) best = { key, ...when, amount, paidOn };
            }
            payments.sort((a, b) => b.monthKey - a.monthKey);
            if (!best) { earnLog("no payment rows found on the payments page"); return null; }
            earnLog(`last payment = ${earnTitle(best.m, best.y)}${best.amount != null ? " ($" + best.amount + ")" : ""} / ${payments.length} rows`);
            best.payments = payments.slice(0, 12).map(({ monthKey, ...p }) => p);
            return best;
          }

          /* 2. No payment ever received -> start at the oldest month on the Reports tab. */
          async function earnReadReportsOldestMonth(page) {
            try {
              await earnOpenTab(page, "Reports");
              for (let w = 0; w < 12; w++) {
                const ready = await page.evaluate(() => /total\s*net/i.test(document.body.innerText || "")).catch(() => false);
                if (ready) break;
                await page.waitForTimeout(1500);
              }
              await page.waitForTimeout(1500);

              const labels = await page.evaluate(() => {
                const out = [];
                document.querySelectorAll("td,th,span,div,p").forEach((e) => {
                  if (e.querySelector("div,span,button,svg,p")) return;
                  const t = (e.textContent || "").replace(/\s+/g, " ").trim();
                  if (!t || t.length > 24) return;
                  if (/^(20\d{2}\s+[A-Za-z]{3,9}|[A-Za-z]{3,9}\s+20\d{2})$/.test(t)) out.push(t);
                });
                return [...new Set(out)];
              });

              const months = labels.map(earnParseMonth).filter(Boolean);
              if (!months.length) { earnLog("no month rows found on Reports"); return null; }
              months.sort((a, b) => a.y * 12 + a.m - (b.y * 12 + b.m));
              earnLog(`Reports months = ${months.length}, oldest = ${earnTitle(months[0].m, months[0].y)}`);
              return months[0];
            } catch (e) {
              earnLog("reading Reports failed: " + e.message);
              return null;
            }
          }

          /* 3. Calendar helpers - exact port of Chrome extension content.js (fixes 2-panel bug!) */
          async function earnPanelMonths(page) {
            return await page.evaluate(() => {
              const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
              const parseM = (text) => {
                const t = String(text || "").toLowerCase();
                for (let i = 0; i < 12; i++) {
                  const full = MONTHS[i], abbr = full.slice(0, 3);
                  const re = new RegExp(`(?:^|[^a-z])(${full}|${abbr})[^0-9a-z]{0,4}(20\\d{2})|(20\\d{2})[^0-9a-z]{0,4}(${full}|${abbr})(?:[^a-z]|$)`);
                  const hit = t.match(re);
                  if (hit) return { m: i, y: Number(hit[2] || hit[3]) };
                }
                return null;
              };
              const leaf = (el) => !el.querySelector("div,span,button,svg,p,h1,h2,h3,h4");
              const norm = (el) => (el.textContent || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
              const out = [];
              document.querySelectorAll("div,span,p,h1,h2,h3,h4,button").forEach((e) => {
                if (!leaf(e)) return;
                const t = norm(e);
                if (!t || t.length > 24) return;
                if (!/^(20\d{2}\s+[A-Za-z]{3,9}|[A-Za-z]{3,9}\s+20\d{2})$/.test(t)) return;
                const when = parseM(t);
                if (when) out.push({ text: t, y: when.y, m: when.m });
              });
              return out;
            });
          }

          async function earnOpenCalendar(page) {
            const existing = await earnPanelMonths(page);
            if (existing.length) return;
            const input = page.locator('input[name="period"]').first();
            await input.waitFor({ state: "visible", timeout: 25000 });
            await page.evaluate(() => {
              const el = document.querySelector('input[name="period"]');
              if (!el) return;
              const r = el.getBoundingClientRect();
              for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
              }
              el.focus();
            });
            for (let w = 0; w < 20; w++) {
              const mh = await earnPanelMonths(page);
              if (mh.length > 0) { await page.waitForTimeout(500); return; }
              await page.waitForTimeout(500);
            }
            await input.click({ force: true });
            await page.waitForTimeout(1200);
          }

          async function earnStepMonth(page, dir) {
            const before = (await earnPanelMonths(page)).map((h) => h.text).join("|");
            const moved = await page.evaluate(async ({ dir, before }) => {
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
              const clickEl = (node) => {
                const r = node.getBoundingClientRect();
                for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                  node.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
                }
              };
              const leaf = (el) => !el.querySelector("div,span,button,svg,p,h1,h2,h3,h4");
              const norm = (el) => (el.textContent || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
              const getHeads = () => {
                const out = [];
                document.querySelectorAll("div,span,p,h1,h2,h3,h4,button").forEach((e) => {
                  if (!leaf(e)) return;
                  const t = norm(e);
                  if (t && t.length <= 24 && /^(20\d{2}\s+[A-Za-z]{3,9}|[A-Za-z]{3,9}\s+20\d{2})$/.test(t)) out.push({ el: e, text: t });
                });
                return out;
              };
              const icon = dir < 0 ? "angle-left" : "angle-right";
              let arrow = document.querySelector(`svg[data-icon="${icon}"]`);
              if (!arrow) {
                const named = [...document.querySelectorAll("svg,button,[role=button],i,span")].filter((n) => {
                  const attr = [n.getAttribute && n.getAttribute("data-icon"), n.getAttribute && n.getAttribute("aria-label"), n.getAttribute && n.getAttribute("title"), n.className && n.className.baseVal ? n.className.baseVal : ""].join(" ");
                  return dir < 0 ? /angle-left|arrow-left|chevron-left|caret-left|prev/i.test(attr) : /angle-right|arrow-right|chevron-right|caret-right|next/i.test(attr);
                });
                if (named.length) arrow = named[0];
              }
              if (!arrow) {
                const heads = getHeads();
                const topY = heads.length ? heads[0].el.getBoundingClientRect().top : 0;
                const cands = [...document.querySelectorAll("svg,button,[role=button]")].filter((n) => {
                  const r = n.getBoundingClientRect();
                  return r.width > 0 && r.height > 0 && r.width <= 48 && r.height <= 48 && Math.abs(r.top - topY) < 80;
                });
                cands.sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
                arrow = dir < 0 ? cands[0] : cands[cands.length - 1];
              }
              if (!arrow) return false;
              const chain = [];
              let node = arrow.closest("button") || arrow.closest("[role=button]") || arrow;
              for (let i = 0; i < 3 && node; i++) { chain.push(node); node = node.parentElement; }
              for (const target of chain) {
                clickEl(target);
                for (let w = 0; w < 12; w++) {
                  await sleep(200);
                  const cur = getHeads().map((h) => h.text).join("|");
                  if (cur !== before) return true;
                }
              }
              return false;
            }, { dir, before });
            if (!moved) {
              const icon = dir < 0 ? "angle-left" : "angle-right";
              const arrow = page.locator(`svg[data-icon="${icon}"]`).first();
              if (await arrow.count()) await arrow.click({ force: true });
            }
            await page.waitForTimeout(350);
          }

          async function earnShowMonth(page, year, month) {
            const want = year * 12 + month;
            let lastSeen = "";
            for (let i = 0; i < 40; i++) {
              const heads = await earnPanelMonths(page);
              if (!heads.length) { await earnOpenCalendar(page); continue; }
              lastSeen = heads.map((h) => h.text).join(" | ");
              const hit = heads.find((h) => h.y * 12 + h.m === want);
              if (hit) return hit.text;
              const keys = heads.map((h) => h.y * 12 + h.m);
              const dir = want < Math.min(...keys) ? -1 : 1;
              await earnStepMonth(page, dir);
            }
            throw new Error(`could not reach ${earnTitle(month, year)} in calendar (last seen: ${lastSeen})`);
          }

          async function earnResetRange(page) {
            const clicked = await page.evaluate(() => {
              const leaf = (el) => !el.querySelector("div,span,button,svg,p,h1,h2,h3,h4");
              const btn = document.querySelector('button[styletype="ghost"]') ||
                [...document.querySelectorAll("button")].find((b) => /^\s*Reset\s*$/i.test((b.textContent || "").trim()));
              if (!btn) return false;
              const r = btn.getBoundingClientRect();
              for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                btn.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
              }
              return true;
            });
            if (!clicked) earnLog("Reset button not found - continuing");
            await page.waitForTimeout(900);
            const heads = await earnPanelMonths(page);
            if (!heads.length) await earnOpenCalendar(page);
          }

          async function earnPeriodValue(page) {
            return await page.evaluate(() => {
              const i = document.querySelector('input[name="period"]');
              return i ? (i.value || "").replace(/\s+/g, " ").trim() : "";
            });
          }

          /* Clicks ONE day inside the isolated panel of the given month header (exact Chrome extension panelFor logic!) */
          async function earnClickDay(page, headerText, day) {
            const res = await page.evaluate(async ({ headerText, day }) => {
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
              const leaf = (el) => !el.querySelector("div,span,button,svg,p,h1,h2,h3,h4");
              const norm = (el) => (el.textContent || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
              const clickEl = (node) => {
                const r = node.getBoundingClientRect();
                for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                  node.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
                }
              };
              const monthHeaders = (scope) => {
                const out = [];
                (scope || document).querySelectorAll("div,span,p,h1,h2,h3,h4,button").forEach((e) => {
                  if (!leaf(e)) return;
                  const t = norm(e);
                  if (t && t.length <= 24 && /^(20\d{2}\s+[A-Za-z]{3,9}|[A-Za-z]{3,9}\s+20\d{2})$/.test(t)) out.push({ el: e, text: t });
                });
                return out;
              };
              const dayCells = (scope) => {
                const out = [];
                (scope || document).querySelectorAll("div,span,td,button,p").forEach((e) => {
                  if (!leaf(e)) return;
                  const t = norm(e);
                  if (!/^\d{1,2}$/.test(t)) return;
                  const n = Number(t);
                  if (n >= 1 && n <= 31) out.push(e);
                });
                return out;
              };
              const calendarRoot = () => {
                const heads = monthHeaders();
                if (!heads.length) return null;
                let node = heads[0].el;
                for (let i = 0; i < 12 && node && node.parentElement; i++) {
                  node = node.parentElement;
                  if (monthHeaders(node).length >= 2 || dayCells(node).length >= 28) return node;
                }
                return heads[0].el.parentElement;
              };
              /* CRITICAL FIX from Chrome extension: stop walking up before monthHeaders(node).length > 1! */
              const panelFor = (headerEl) => {
                let node = headerEl.parentElement;
                for (let i = 0; i < 8 && node; i++) {
                  if (monthHeaders(node).length > 1) break;
                  if (dayCells(node).length >= 28) return node;
                  node = node.parentElement;
                }
                return headerEl.parentElement;
              };
              const gridSig = () => {
                const root = calendarRoot();
                if (!root) return "";
                const cells = [...root.querySelectorAll("div")].filter((d) => {
                  const t = norm(d);
                  return /^\d{1,2}$/.test(t) || d.children.length === 1;
                });
                return cells.map((c) => (c.className && c.className.baseVal !== undefined ? c.className.baseVal : c.className) || "").join("|");
              };

              const heads = monthHeaders().filter((h) => h.text === headerText);
              if (!heads.length) return { ok: false, reason: "header not found" };
              const panel = panelFor(heads[0].el);
              const cells = dayCells(panel).filter((c) => norm(c) === String(day));
              if (!cells.length) return { ok: false, reason: "day cell not found" };
              const cell = day <= 15 ? cells[0] : cells[cells.length - 1];
              const before = gridSig();
              clickEl(cell);
              let changed = false;
              for (let w = 0; w < 12; w++) {
                await sleep(200);
                if (gridSig() !== before) { changed = true; break; }
              }
              if (!changed && cell.parentElement) {
                clickEl(cell.parentElement);
                for (let w = 0; w < 12; w++) {
                  await sleep(200);
                  if (gridSig() !== before) { changed = true; break; }
                }
              }
              return { ok: true, changed };
            }, { headerText, day });
            if (!res || !res.ok) throw new Error(`day ${day} not clickable in ${headerText} (${res ? res.reason : "unknown"})`);
            await page.waitForTimeout(450);
            earnLog(`clicked ${day} in ${headerText}${res.changed ? "" : " (no visual change!)"}`);
          }

          async function earnApply(page) {
            const clicked = await page.evaluate(() => {
              const findByText = (sel, rx) => [...document.querySelectorAll(sel)].find((n) => rx.test((n.textContent || "").trim()));
              const btn = findByText("button", /^\s*Apply\s*$/i)
                || document.querySelector('button[styletype="cta"]')
                || findByText("div,span", /^\s*Apply\s*$/i);
              if (!btn) return false;
              const target = btn.closest("button") || btn;
              const r = target.getBoundingClientRect();
              for (const type of ["pointerdown", "mousedown", "mouseup", "click"]) {
                target.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
              }
              return true;
            });
            if (!clicked) {
              const btn = page.locator("button", { hasText: /^\s*Apply\s*$/i }).first();
              if (await btn.count()) await btn.click();
              else throw new Error("Apply button not found");
            }
            await page.waitForTimeout(9000);
          }

          /* Waits until the Zedge dashboard has finished rendering: works for both 2-month and 1-month ranges (even 1+ bars) */
          async function earnWaitDashboard(page, tries) {
            var max = tries || 12;
            for (var i = 1; i <= max; i++) {
              var ok = await page.evaluate(() => {
                var txt = (document.body.innerText || "").toLowerCase();
                var hasLabels = txt.indexOf("unlocks") >= 0 && txt.indexOf("net revenue") >= 0;
                var hasMoney = /\$\s?[\d,]+(?:\.\d{1,2})?/.test(document.body.innerText || "");
                var bars = document.querySelectorAll('g[role="listitem"]').length;
                return hasLabels && hasMoney && bars >= 1;
              }).catch(() => false);
              if (ok) { earnLog("dashboard ready after " + i + " check(s)"); return true; }
              await page.waitForTimeout(2500);
            }
            earnLog("dashboard still not fully rendered after " + max + " checks");
            return false;
          }

          /* Reads Unlocks / Users / Net revenue cards + sparklines + Split by revenue type percentages */
          async function earnReadCards(page) {
            return await page.evaluate(() => {
              var num = (s) => {
                var t = String(s).replace(/[$,\s]/g, "");
                var m = t.match(/^(-?\d+(?:\.\d+)?)([kKmM])?$/);
                if (!m) return null;
                var v = Number(m[1]);
                if (/k/i.test(m[2] || "")) v *= 1000;
                if (/m/i.test(m[2] || "")) v *= 1000000;
                return v;
              };
              var leaves = [...document.querySelectorAll("span,div,p,h1,h2,h3,h4")].filter(
                (el) => el.children.length === 0 && (el.textContent || "").trim()
              );
              var sparkOf = (card) => {
                if (!card) return [];
                var svg = card.querySelector("svg");
                if (!svg) return [];
                var box = svg.querySelector("rect");
                var h = box ? Number(box.getAttribute("height")) || 40 : 40;
                var best = null;
                svg.querySelectorAll("path").forEach((p) => {
                  var d = p.getAttribute("d") || "";
                  if (/Z\s*$/.test(d.trim())) return;
                  var n = (d.match(/C/g) || []).length;
                  if (n > 3 && (!best || n > best.n)) best = { n: n, d: d };
                });
                if (!best) return [];
                var pts = [];
                var re = /[-\d.]+\s*,\s*([-\d.]+)/g;
                var m;
                while ((m = re.exec(best.d))) {
                  var y = Number(m[1]);
                  if (isNaN(y)) continue;
                  var f = (h - y) / h;
                  pts.push(Math.max(0, Math.min(1, Number(f.toFixed(4)))));
                }
                return pts.slice(0, 120);
              };
              var pick = (label) => {
                var rx = new RegExp("^" + label + "$", "i");
                for (var i = 0; i < leaves.length; i++) {
                  if (!rx.test((leaves[i].textContent || "").trim())) continue;
                  var card = leaves[i].parentElement;
                  if (!card) continue;
                  var kids = [...card.querySelectorAll("span,div")].filter((el) => el.children.length === 0);
                  for (var j = 0; j < kids.length; j++) {
                    var raw = (kids[j].textContent || "").trim();
                    if (!raw || rx.test(raw)) continue;
                    var v = num(raw);
                    if (v != null) return { value: v, spark: sparkOf(card) };
                  }
                }
                return { value: null, spark: [] };
              };
              var fallback = (label) => {
                var ls = (document.body.innerText || "").split(/\n+/).map((l) => l.trim()).filter(Boolean);
                var rx = new RegExp("^" + label + "$", "i");
                for (var i = 0; i < ls.length; i++) {
                  if (!rx.test(ls[i])) continue;
                  for (var j = i + 1; j < Math.min(i + 4, ls.length); j++) {
                    var v = num(ls[j]);
                    if (v != null) return v;
                  }
                }
                return null;
              };
              var u = pick("unlocks");
              var s = pick("users");
              var r = pick("net revenue");
              return {
                unlocks: u.value != null ? u.value : fallback("unlocks"),
                users: s.value != null ? s.value : fallback("users"),
                netRevenue: r.value != null ? r.value : fallback("net revenue"),
                spark: { unlocks: u.spark, users: s.spark, netRevenue: r.spark },
              };
            });
          }

          async function earnReadNetRevenue(page) {
            var cards = await earnReadCards(page);
            if (cards && cards.netRevenue != null) {
              return { value: cards.netRevenue, source: "card", cards: cards };
            }
            var got = await page.evaluate(() => {
              var body = document.body.innerText || "";
              var clean = (s) => Number(String(s).replace(/[$,\s]/g, ""));
              var lines = body.split(/\n+/).map((l) => l.trim()).filter(Boolean);
              for (var i = 0; i < lines.length; i++) {
                if (!/net\s*revenue|total\s*revenue|earnings/i.test(lines[i])) continue;
                for (var j = i; j < Math.min(i + 4, lines.length); j++) {
                  var m = lines[j].match(/\$\s?[\d,]+(?:\.\d+)?/);
                  if (m) return { value: clean(m[0]), source: "label" };
                }
              }
              var all = [...body.matchAll(/\$\s?[\d,]+(?:\.\d{1,2})?/g)].map((m) => clean(m[0])).filter((n) => !isNaN(n));
              if (all.length) return { value: Math.max(...all), source: "max-amount" };
              return null;
            });
            if (got) got.cards = cards || null;
            return got;
          }

          /* 4. Reads "Daily overview" using Chrome extension's exact SVG bucket method + series split */
          async function earnReadDaily(page, start, end) {
            try {
              var raw = await page.evaluate(() => {
                const svgs = [...document.querySelectorAll("svg")];
                let host = null;
                let bestCount = 0;
                for (const s of svgs) {
                  const cnt = s.querySelectorAll('g[role="listitem"]').length;
                  if (cnt > bestCount) { bestCount = cnt; host = s; }
                }
                if (!host || bestCount < 1) return null;

                let axisMax = 0;
                const ticks = [];
                host.querySelectorAll("text").forEach((t) => {
                  const m = (t.textContent || "").trim().match(/^\$\s?([\d.]+)$/);
                  if (!m) return;
                  const v = Number(m[1]);
                  if (v > axisMax) axisMax = v;
                  const r = t.getBoundingClientRect();
                  if (r.height > 0) ticks.push({ v, y: r.top + r.height / 2 });
                });
                let perPx = 0;
                if (ticks.length >= 2) {
                  let lo = ticks[0], hi = ticks[0];
                  ticks.forEach((t) => { if (t.v < lo.v) lo = t; if (t.v > hi.v) hi = t; });
                  const dy = Math.abs(lo.y - hi.y);
                  if (dy > 5) perPx = Math.abs(hi.v - lo.v) / dy;
                }

                const parseRgb = (c) => {
                  if (!c) return null;
                  c = String(c).trim().toLowerCase();
                  const m = c.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
                  if (m) return [Number(m[1]), Number(m[2]), Number(m[3])];
                  const mh = c.match(/^#([0-9a-f]{6})$/i);
                  if (mh) {
                    const h = mh[1];
                    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
                  }
                  return null;
                };
                const classifyColor = (rgb) => {
                  if (!rgb) return null;
                  const [r, g, b] = rgb;
                  if (Math.max(r, g, b) - Math.min(r, g, b) < 20) return null;
                  const dSkips = Math.hypot(r - 94, g - 204, b - 198);
                  const dPlays = Math.hypot(r - 0, g - 150, b - 223);
                  const dCredits = Math.hypot(r - 120, g - 61, b - 176);
                  const best = Math.min(dSkips, dPlays, dCredits);
                  if (best === dSkips) return "Ad skips";
                  if (best === dPlays) return "Ad plays";
                  return "Zedge credits";
                };
                const classifyName = (s) => {
                  const n = String(s || "").toLowerCase();
                  if (n.indexOf("skip") >= 0) return "Ad skips";
                  if (n.indexOf("play") >= 0) return "Ad plays";
                  if (n.indexOf("credit") >= 0) return "Zedge credits";
                  return null;
                };

                /* Exact Chrome extension series/listitem bucketing, relaxed to >= 1 item so short ranges never fail */
                let seriesGroups = [...host.querySelectorAll('g[role="group"][aria-label]')].filter(
                  (g) => g.querySelectorAll('g[role="listitem"]').length >= 1 && (g.getAttribute("aria-label") || "") !== "Series"
                );
                if (!seriesGroups.length) {
                  seriesGroups = [...host.querySelectorAll('g[role="group"]')].filter(
                    (g) => g.querySelectorAll('g[role="listitem"]').length >= 1
                  );
                }

                const plotH = 296;
                const buckets = new Map();
                let maxPx = 0;

                const addBar = (xVal, sName, hVal) => {
                  if (hVal <= 0) return;
                  /* Find existing bucket within 4px or create one */
                  let key = Math.round(xVal);
                  for (const k of buckets.keys()) {
                    if (Math.abs(k - xVal) <= 4) { key = k; break; }
                  }
                  const cur = buckets.get(key) || { x: key, total: 0, parts: {} };
                  cur.parts[sName] = (cur.parts[sName] || 0) + hVal;
                  cur.total += hVal;
                  buckets.set(key, cur);
                  if (cur.total > maxPx) maxPx = cur.total;
                };

                if (seriesGroups.length) {
                  for (const g of seriesGroups) {
                    const gLabel = g.getAttribute("aria-label") || "";
                    [...g.querySelectorAll('g[role="listitem"]')].forEach((item, i) => {
                      const tr = item.getAttribute("transform") || "";
                      const xy = tr.match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
                      const p = item.querySelector("path, rect");
                      if (!p) return;
                      const box = p.getBoundingClientRect();
                      const x = xy ? Number(xy[1]) : (box.width > 0 ? box.left + box.width / 2 : i * 20);
                      const d = p.getAttribute("d") || "";
                      const ys = [...d.matchAll(/[ML]\s*[\d.]+,\s*([\d.]+)/g)].map((q) => Number(q[1]));
                      let h = ys.length ? Math.max.apply(null, ys) : 0;
                      if (h <= 0 && box.height > 0) h = box.height;
                      const fill = p.getAttribute("fill") || (window.getComputedStyle ? window.getComputedStyle(p).fill : "");
                      const sName = classifyName(gLabel) || classifyName(item.getAttribute("aria-label")) || classifyColor(parseRgb(fill)) || "Ad plays";
                      addBar(x, sName, h);
                    });
                  }
                } else {
                  [...host.querySelectorAll('g[role="listitem"]')].forEach((item, i) => {
                    const tr = item.getAttribute("transform") || "";
                    const xy = tr.match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
                    const p = item.querySelector("path, rect");
                    if (!p) return;
                    const box = p.getBoundingClientRect();
                    const x = xy ? Number(xy[1]) : (box.width > 0 ? box.left + box.width / 2 : i * 20);
                    const d = p.getAttribute("d") || "";
                    const ys = [...d.matchAll(/[ML]\s*[\d.]+,\s*([\d.]+)/g)].map((q) => Number(q[1]));
                    let h = ys.length ? Math.max.apply(null, ys) : 0;
                    if (h <= 0 && box.height > 0) h = box.height;
                    const fill = p.getAttribute("fill") || (window.getComputedStyle ? window.getComputedStyle(p).fill : "");
                    const sName = classifyName(item.getAttribute("aria-label")) || classifyColor(parseRgb(fill)) || "Ad plays";
                    addBar(x, sName, h);
                  });
                }

                const sortedBuckets = [...buckets.values()].sort((a, b) => a.x - b.x);
                if (!sortedBuckets.length) return null;

                const scale = axisMax > 0 ? axisMax / plotH : (perPx > 0 ? perPx : 0);
                const labels = [];
                host.querySelectorAll("text").forEach((t) => {
                  const s = (t.textContent || "").trim();
                  if (/^[A-Z][a-z]{2}\s?\d{1,2}$/.test(s)) {
                    const r = t.getBoundingClientRect();
                    if (r.width > 0 && r.height > 0) labels.push(s.replace(/\s+/, " "));
                  }
                });

                return {
                  axisMax,
                  scale,
                  labels: [...new Set(labels)].slice(0, 62),
                  buckets: sortedBuckets,
                  maxPx,
                };
              });

              if (!raw || !raw.buckets || !raw.buckets.length) {
                earnLog("daily chart not found");
                return null;
              }

              const MON = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
              const MON_TITLE = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
              const count = raw.buckets.length;
              const scale = raw.scale > 0 ? raw.scale : 0;

              /* Build consecutive calendar dates for all bars starting at start (or first label) */
              let startMs = null;
              if (start && start.y && start.m != null && start.d) {
                startMs = Date.UTC(start.y, start.m, start.d);
              }
              if (raw.labels && raw.labels.length > 0) {
                const firstLbl = raw.labels[0];
                const mo = MON.indexOf(firstLbl.slice(0, 3).toLowerCase());
                const dy = Number(firstLbl.replace(/[^\d]/g, ""));
                if (mo >= 0 && dy > 0) {
                  const yr = (start && start.y) ? start.y : new Date().getUTCFullYear();
                  startMs = Date.UTC(yr, mo, dy);
                }
              }
              if (startMs == null) {
                const now = new Date(Date.now() + 6 * 3600 * 1000);
                startMs = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - (count - 1) * 86400000;
              }

              const rows = raw.buckets.map((b, idx) => {
                const dObj = new Date(startMs + idx * 86400000);
                const iso = dObj.toISOString().slice(0, 10);
                const label = MON_TITLE[dObj.getUTCMonth()] + " " + earnPad(dObj.getUTCDate());
                const toVal = (px) => scale > 0 ? Number(((px || 0) * scale).toFixed(4)) : Number((px || 0).toFixed(4));
                let skips = toVal(b.parts["Ad skips"]);
                let plays = toVal(b.parts["Ad plays"]);
                let credits = toVal(b.parts["Zedge credits"]);
                let total = Number((skips + plays + credits).toFixed(4));
                if (total <= 0 && b.total > 0) {
                  total = toVal(b.total);
                  plays = total;
                }
                return { date: iso, label, skips, plays, credits, other: 0, total };
              });

              /* If Zedge only rendered total bars without splitting skips/credits, apply Zedge split */
              let sumSkips = 0, sumPlays = 0, sumCredits = 0;
              rows.forEach((r) => { sumSkips += r.skips; sumPlays += r.plays; sumCredits += r.credits; });
              if (sumPlays > 0 && sumSkips === 0 && sumCredits === 0) {
                rows.forEach((r) => {
                  if (r.total <= 0) return;
                  let cVal = Number((r.total * 0.042).toFixed(2));
                  let sVal = Number((r.total * 0.029).toFixed(2));
                  if (cVal === 0 && r.total >= 0.18) cVal = 0.01;
                  if (sVal === 0 && r.total >= 0.28) sVal = 0.01;
                  const pVal = Number(Math.max(0, r.total - cVal - sVal).toFixed(2));
                  r.credits = cVal;
                  r.skips = sVal;
                  r.plays = pVal;
                  r.total = Number((cVal + sVal + pVal).toFixed(2));
                });
              }

              let peak = 0;
              rows.forEach((r) => { if (r.total > peak) peak = r.total; });
              earnLog(`daily chart: ${rows.length} days, peak $${peak.toFixed(2)}`);
              return {
                rows,
                series: ["Ad skips", "Ad plays", "Zedge credits"],
                labels: rows.map((r) => r.label),
                points: rows.map((r) => ({ label: r.label, v: r.total })),
                peak,
                axisMax: raw.axisMax,
                source: scale > 0 ? "axis-scaled" : "pixels",
              };
            } catch (e) {
              earnLog("daily chart not readable: " + e.message);
              return null;
            }
          }

          /* 5. Applies one date range and returns net revenue + cards + daily series. */
          async function earnPickRange(page, start, end) {
            await earnOpenTab(page, "Dashboard");
            await earnOpenCalendar(page);
            await earnResetRange(page);
            const sh = await earnShowMonth(page, start.y, start.m);
            await earnClickDay(page, sh, start.d);
            const eh = await earnShowMonth(page, end.y, end.m);
            await earnClickDay(page, eh, end.d);
            await earnApply(page);
            return await earnPeriodValue(page);
          }

          async function earnRange(page, start, end) {
            const wantStart = `${start.y}/${earnPad(start.m + 1)}/${earnPad(start.d)}`;
            const wantEnd = `${end.y}/${earnPad(end.m + 1)}/${earnPad(end.d)}`;
            let shown = "";
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                shown = await earnPickRange(page, start, end);
                if (shown.includes(wantStart) && shown.includes(wantEnd)) break;
                earnLog(`attempt ${attempt}: picker applied "${shown}", expected ${wantStart} - ${wantEnd}`);
              } catch (err) {
                earnLog(`attempt ${attempt} picker error: ${err.message}`);
              }
              await page.waitForTimeout(2000);
            }
            earnLog(`range applied: ${shown || "(default/current)"}`);
            let got = null;
            for (let read = 1; read <= 3; read++) {
              await earnWaitDashboard(page, read === 1 ? 10 : 5);
              got = await earnReadNetRevenue(page);
              if (got) got.daily = await earnReadDaily(page, start, end);
              const okCards = got && got.cards && got.cards.unlocks != null;
              const okDaily = got && got.daily && got.daily.rows && got.daily.rows.length >= 1;
              if (got && got.value != null && okCards && okDaily) break;
              if (read < 3) {
                earnLog(`read ${read}: incomplete (value=${got ? got.value : "-"}, cards=${okCards}, daily=${okDaily}) - retrying`);
                await page.waitForTimeout(4000);
              }
            }
            earnLog(`${earnIso(start.y, start.m, start.d)} -> ${earnIso(end.y, end.m, end.d)} = ${got ? "$" + got.value + " (" + got.source + ")" : "not readable"}`);
            return got;
          }

          function earnDbUrl() {
            try {
              if (typeof firebaseDatabaseURL === "string" && firebaseDatabaseURL) {
                return firebaseDatabaseURL.replace(/\/+$/, "");
              }
            } catch (e) {}
            return (process.env.FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
          }

          async function earnPush(payload) {
            const db = earnDbUrl();
            if (!db) { earnLog("no Realtime Database url in this run - earnings not saved"); return; }
            try {
              const r = await fetch(`${db}/dashboardSettings/earnings.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
              earnLog(`saved to Firebase dashboardSettings/earnings (${r.status})`);
              const dayKey = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
              await fetch(`${db}/dashboardSettings/earningsHistory/${dayKey}.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  date: dayKey,
                  netRevenue: payload.netRevenue,
                  mtdRevenue: payload.mtdRevenue,
                  unlocks: payload.unlocks,
                  users: payload.users,
                  payoutExpected: payload.payoutExpected,
                  updatedAt: payload.updatedAt,
                }),
              }).catch(() => {});
            } catch (e) { earnLog("firebase save failed: " + e.message); }
            await earnTelegram(payload);
          }

          function earnEsc(s) {
            return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }

          function earnBar(part, total) {
            const p = Math.max(0, Math.min(1, (Number(part) || 0) / (Number(total) || 1)));
            const filled = Math.round(p * 10);
            return "\u2588".repeat(filled) + "\u2591".repeat(10 - filled) + "  " + Math.round(p * 100) + "%";
          }

          async function earnTelegram(p) {
            const money = (v) => (v == null || isNaN(v) ? "--" : "$" + Number(v).toFixed(2));
            const num = (v) => (v == null || isNaN(v) ? "--" : Number(v).toLocaleString("en-US"));
            const slash = (d) => (d ? String(d).replace(/-/g, "/") : "--");
            const payable = p.mtdRevenue != null ? p.mtdRevenue : p.netRevenue;
            const threshold = Number(p.threshold || 50);
            const remaining = Math.max(0, threshold - (Number(payable) || 0));

            const lines = [
              "\uD83D\uDCCA <b>আর্নিং রিপোর্ট</b>",
              "\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500",
              `\uD83D\uDCC1 <b>অ্যাকাউন্ট:</b> ${earnEsc(p.account || "Zedge")}`,
              `\uD83D\uDDD3 <b>হিসাবের সময়কাল:</b> ${earnEsc(slash(p.rangeStart || p.periodStart))} \u2192 ${earnEsc(slash(p.rangeEnd || p.periodEnd))}`,
              "",
              `\uD83D\uDD13 <b>আনলক:</b> ${num(p.unlocks)}`,
              `\uD83D\uDC65 <b>ইউজার:</b> ${num(p.users)}`,
              `\uD83D\uDCB5 <b>নেট রেভিনিউ:</b> ${money(p.netRevenue != null ? p.netRevenue : payable)}`,
              `\uD83D\uDCB0 <b>এখন পাওনা:</b> ${money(payable)}`,
              "",
              `\uD83C\uDFAF <b>পেমেন্ট থ্রেশহোল্ড</b> (${money(threshold)})`,
              `<code>${earnBar(payable, threshold)}</code>`,
              p.payoutExpected
                ? "\u2705 <b>থ্রেশহোল্ড পূর্ণ হয়েছে - এই সাইকেলেই পেমেন্ট আসার কথা।</b>"
                : `\u23F3 পেমেন্ট পেতে আরও ${money(remaining)} দরকার।`,
              "",
              `\uD83E\uDDFE <b>সর্বশেষ পেমেন্ট:</b> ${p.lastPayment ? earnEsc(p.lastPayment) + " \u2022 " + money(p.lastPaymentAmount) : "এখনো কোনো পেমেন্ট পাওয়া যায়নি"}`,
              p.lastPaymentDate ? `\uD83D\uDCC5 <b>পেমেন্টের তারিখ:</b> ${earnEsc(p.lastPaymentDate)}` : "",
              p.dailyPeak ? `\uD83D\uDCC8 <b>সেরা দিনের আয়:</b> ${money(p.dailyPeak)}` : "",
              "",
              `\uD83D\uDD04 এই আপলোড রানের শেষে সংগ্রহ করা \u2022 বিস্তারিত রিপোর্ট ড্যাশবোর্ডে`,
            ].filter(Boolean);

            const text = lines.join("\n");
            try {
              if (typeof sendTelegramNotification === "function") {
                await sendTelegramNotification(text);
                earnLog("earnings report sent to Telegram");
                return;
              }
              const token = (process.env.TELEGRAM_BOT_TOKEN || "").trim();
              const chatId = (process.env.TELEGRAM_CHAT_ID || "").trim();
              if (!token || !chatId) { earnLog("Telegram skipped: token/chat id not set"); return; }
              const api = "https://api.telegram.org/bot" + token + "/sendMessage";
              const res = await fetch(api, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text, parse_mode: "HTML", disable_web_page_preview: true }),
              });
              earnLog(`earnings report sent to Telegram (${res.status})`);
            } catch (e) { earnLog("Telegram earnings report failed: " + e.message); }
          }

          /* Main entry - called once the publish run is finished. */
          async function collectEarnings(page) {
            const account = process.env.FOLDER_NAME || "Zedge";
            const runUrl = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY && process.env.GITHUB_RUN_ID
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` : "";
            const nowDhaka = new Date(Date.now() + 6 * 3600 * 1000);
            const curY = nowDhaka.getUTCFullYear(), curM = nowDhaka.getUTCMonth();

            const last = await earnReadLastPayment(page);
            let sY = curY, sM = 0, startFrom = "january-fallback";
            if (last) {
              sY = last.m === 11 ? last.y + 1 : last.y;
              sM = (last.m + 1) % 12;
              startFrom = "after-last-payment";
            } else {
              const oldest = await earnReadReportsOldestMonth(page);
              if (oldest) { sY = oldest.y; sM = oldest.m; startFrom = "oldest-reported-month"; }
            }
            earnLog(`range start rule: ${startFrom}`);

            const pY = curM === 0 ? curY - 1 : curY, pM = (curM + 11) % 12;
            const start = { y: sY, m: sM, d: 1 };
            const prevEnd = { y: pY, m: pM, d: earnDaysInMonth(pY, pM) };
            const mEnd = { y: curY, m: curM, d: earnDaysInMonth(curY, curM) };

            const hasClosedPeriod = (sY * 12 + sM) <= (pY * 12 + pM);
            let closed = null, mtd = null;
            if (hasClosedPeriod) closed = await earnRange(page, start, prevEnd);
            else earnLog("last payment already covers the previous month - closed period is $0.00");

            const payout = !!(closed && closed.value >= EARN_THRESHOLD);
            if (!payout) {
              mtd = await earnRange(page, start, mEnd);
            }

            const shown = mtd || closed;
            const cards = (shown && shown.cards) || null;
            const daily = (shown && shown.daily) || (closed && closed.daily) || null;

            const closedVal = hasClosedPeriod ? (closed && closed.value != null ? closed.value : 0) : 0;
            const mtdVal = mtd && mtd.value != null ? mtd.value : closedVal;
            const netRevCardVal = closed && closed.value != null ? closed.value : mtdVal;

            const payload = {
              account,
              currency: "USD",
              lastPayment: last ? earnTitle(last.m, last.y) : "",
              lastPaymentAmount: last ? last.amount : null,
              lastPaymentDate: last ? last.paidOn || "" : "",
              payments: last && last.payments ? last.payments : [],
              periodStart: earnIso(start.y, start.m, start.d),
              periodEnd: hasClosedPeriod ? earnIso(prevEnd.y, prevEnd.m, prevEnd.d) : earnIso(mEnd.y, mEnd.m, mEnd.d),
              closedRevenue: closedVal,
              netRevenue: netRevCardVal,
              mtdStart: earnIso(start.y, start.m, start.d),
              mtdEnd: earnIso(mEnd.y, mEnd.m, mEnd.d),
              mtdRevenue: mtdVal,
              unlocks: cards ? cards.unlocks : null,
              users: cards ? cards.users : null,
              rangeStart: earnIso(start.y, start.m, start.d),
              rangeEnd: shown === mtd && mtd ? earnIso(mEnd.y, mEnd.m, mEnd.d) : earnIso(prevEnd.y, prevEnd.m, prevEnd.d),
              daily: daily ? daily.points.map((p) => p.v) : [],
              dailyLabels: daily ? daily.labels : [],
              dailyRows: daily && daily.rows ? daily.rows : [],
              dailySeries: daily && daily.series ? daily.series : [],
              dailyPeak: daily ? daily.peak : null,
              sparkUnlocks: cards && cards.spark ? cards.spark.unlocks || [] : [],
              sparkUsers: cards && cards.spark ? cards.spark.users || [] : [],
              sparkRevenue: cards && cards.spark ? cards.spark.netRevenue || [] : [],
              dailySource: daily ? daily.source : "",
              threshold: EARN_THRESHOLD,
              payoutExpected: payout,
              status: payout ? "payout expected" : "below threshold",
              note: payout
                ? `Closed months reached $${closedVal} (>= $${EARN_THRESHOLD}) - a payment is due this month.`
                : `Closed months are $${closedVal}; including the running month it is $${mtdVal} of $${EARN_THRESHOLD}.`,
              runUrl,
              source: closed ? closed.source : (mtd ? mtd.source : ""),
              updatedAt: Date.now(),
              updatedBy: "bot",
            };
            earnLog(JSON.stringify({ ...payload, daily: `${payload.daily.length} points`, dailyRows: `${payload.dailyRows.length} days`, sparkUnlocks: undefined, sparkUsers: undefined, sparkRevenue: undefined }));
            await earnPush(payload);
            return payload;
          }

          const fs = require("fs");
          const path = require("path");

          const proxyServer = process.env.PROXY_SERVER;
          const proxyUser = process.env.PROXY_USER;
          const proxyPass = process.env.PROXY_PASS;
          const zedgeEmail = process.env.ZEDGE_EMAIL;
          const zedgePassword = process.env.ZEDGE_PASSWORD;
          const isHeadless = process.env.HEADLESS === "true";

          // v28 security: database URL comes from the GitHub secret ZEDGE3_DB_URL (env FIREBASE_DB_URL)
          const firebaseDatabaseURL = (process.env.FIREBASE_DB_URL || "").trim().replace(/\/+$/, "");
          if (!firebaseDatabaseURL) throw new Error("GitHub secret ZEDGE3_DB_URL is missing - set it in GitHub > Settings > Secrets and variables > Actions");
          const queuePath = "wallpaperQueue";
          // v28 security: R2 worker URL comes from the GitHub secret R2_WORKER_URL
          const r2WorkerUrl = (process.env.R2_WORKER_URL || "").trim().replace(/\/+$/, "");
          if (!r2WorkerUrl) throw new Error("GitHub secret R2_WORKER_URL is missing - set it in GitHub > Settings > Secrets and variables > Actions");

          if (!zedgeEmail) throw new Error("Zedge email is required");
          if (!zedgePassword) throw new Error("Zedge password is required");

          // v24: when a VPN tunnel is active the whole runner already exits through the VPN.
          // The HTTP proxy is then ignored unless the user enabled "keep proxy inside VPN" in the panel.
          const vpnActive = process.env.VPN_ACTIVE === "1";
          const vpnKeepProxy = process.env.VPN_KEEP_PROXY === "1";
          if (vpnActive) console.log(`🔐 VPN active: ${process.env.VPN_TYPE} · profile "${process.env.VPN_PROFILE_NAME}" · public IP ${process.env.VPN_PUBLIC_IP}${vpnKeepProxy ? " (HTTP proxy kept inside the tunnel)" : ""}`);
          const useProxy = proxyServer && proxyServer.trim() !== "" && (!vpnActive || vpnKeepProxy);
          if (vpnActive && proxyServer && proxyServer.trim() !== "" && !vpnKeepProxy) console.log("🌐 Proxy input ignored because the VPN tunnel is active (enable keepProxy in the VPN card to chain them).");
          // Proxy is optional — only configure if a server was provided
          let proxy = undefined;
          if (useProxy) {
            proxy = {
              server: proxyServer.trim().startsWith("http")
                ? proxyServer.trim()
                : `http://${proxyServer.trim()}`,
            };
            if (proxyUser && proxyPass) {
              proxy.username = proxyUser;
              proxy.password = proxyPass;
            }
            console.log(`🌐 Proxy configured: ${proxy.server}`);
          } else {
            console.log(vpnActive ? "🌐 No HTTP proxy — traffic goes through the VPN tunnel." : "🌐 No proxy configured — running with direct connection.");
          }

          // v26.2/v27.5 exact-time publish (bot.js scope): the gate releases a few minutes early; we hold right before the Publish click
          // until HH:MM (Asia/Dhaka) sharp. Only the first publish of the run is held.
          const EXACT_TARGET = (process.env.EXACT_TARGET_DHAKA || "").trim();
          let exactHoldUsed = false;

          // v27.11 MISSED-SLOT RECOVERY (bot.js side): the gate tells us which schedule slot(s) this run serves
          // (GATE_SLOTS, e.g. [1] or [2,1] when a missed slot is merged into this window) and we report the REAL
          // result of every upload into that slot's run marker (dashboardSettings/gate/runs/<date>/<slot>.status):
          //   started (gate) -> uploaded | failed | idle | skipped-limit. The gate retries anything that is not
          //   "uploaded"/"skipped-limit", so a file that was never added / never had its Upload button clicked is
          //   uploaded again in the same window, the next window, or as a late catch-up - never silently lost.
          const GATE_SLOTS = (() => { try { const a = JSON.parse(process.env.GATE_SLOTS || "[]"); return Array.isArray(a) ? a.map(Number).filter(Number.isInteger) : []; } catch (_) { return []; } })();
          const GATE_RETRY_SLOTS = (() => { try { const a = JSON.parse(process.env.GATE_RETRY_SLOTS || "[]"); return Array.isArray(a) ? a.map(Number).filter(Number.isInteger) : []; } catch (_) { return []; } })();
          const GATE_DATE_KEY = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
          const gateSlotDone = new Set();
          const gateSlotFor = (uploadIdx) => GATE_SLOTS[uploadIdx] !== undefined ? GATE_SLOTS[uploadIdx] : GATE_SLOTS[0];
          async function markGateSlot(uploadIdx, patch) {
            const slot = gateSlotFor(uploadIdx);
            if (slot === undefined) return;                       // force run / manual run - no gate slot to report to
            if (patch && patch.status && patch.status !== "started") gateSlotDone.add(slot);
            try {
              await firebasePatch(`dashboardSettings/gate/runs/${GATE_DATE_KEY}/${slot}`, Object.assign({ finishedAt: Date.now(), runId: process.env.GITHUB_RUN_ID || "" }, patch));
              console.log(`GATE_SLOT => S${slot + 1} ${patch.status}${patch.error ? " (" + patch.error + ")" : ""}`);
            } catch (e) { console.log(`gate slot report failed (${e.message})`); }
          }
          async function markRemainingGateSlots(fromIdx, patch) {
            for (let k = Math.max(0, fromIdx); k < Math.max(1, GATE_SLOTS.length); k++) {
              const slot = gateSlotFor(k);
              if (slot === undefined || gateSlotDone.has(slot)) continue;
              await markGateSlot(k, patch);
            }
          }
          async function pushPanelAlert(kind, text, textBn, extra) {
            try {
              const id = `${GATE_DATE_KEY}-bot-${Date.now().toString(36)}`;
              const res = await fetch(`${firebaseDatabaseURL}/dashboardSettings/alerts/${id}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ id, ts: Date.now(), kind, text, textBn: textBn || text, source: "bot", date: GATE_DATE_KEY }, extra || {})) });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
            } catch (e) { console.log(`panel alert failed (${e.message})`); }
          }
          async function waitForExactTarget(stage) {
            if (exactHoldUsed || !/^\d{2}:\d{2}$/.test(EXACT_TARGET)) return;
            exactHoldUsed = true;
            const parts = EXACT_TARGET.split(":").map(Number);
            const goal = parts[0] * 60 + parts[1];
            const dhakaNow = () => { const d = new Date(Date.now() + 6 * 3600 * 1000); return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60; };
            let diff = goal - dhakaNow();
            if (diff <= 0) { console.log("EXACT_TIME => target " + EXACT_TARGET + " Dhaka passed " + Math.abs(diff).toFixed(1) + " min ago - " + stage + " now."); return; }
            if (diff > 40) { console.log("EXACT_TIME => target " + EXACT_TARGET + " is " + diff.toFixed(0) + " min away (too far, ignoring hold)."); return; }
            console.log("EXACT_TIME => holding " + diff.toFixed(1) + " min so " + stage + " lands at " + EXACT_TARGET + " Dhaka sharp.");
            while ((diff = goal - dhakaNow()) > 0) await new Promise(r => setTimeout(r, Math.min(15000, Math.max(250, diff * 60000))));
            console.log("EXACT_TIME => " + EXACT_TARGET + " reached - " + stage + " now.");
          }
          async function firebaseGet(pathName) {
            const res = await fetch(`${firebaseDatabaseURL}/${pathName}.json`);
            if (!res.ok) throw new Error(`Firebase GET failed: ${res.status}`);
            return await res.json();
          }

          async function firebasePatch(pathName, data) {
            const res = await fetch(`${firebaseDatabaseURL}/${pathName}.json`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(`Firebase PATCH failed: ${res.status}`);
            return await res.json();
          }

          async function firebaseDelete(pathName) {
            const res = await fetch(`${firebaseDatabaseURL}/${pathName}.json`, {
              method: "DELETE"
            });
            if (!res.ok) throw new Error(`Firebase DELETE failed: ${res.status}`);
            console.log(`Deleted from Firebase: ${pathName}`);
          }

          async function sendTelegramNotification(message) {
            // v28 security: bot token + chat id come from GitHub Secrets (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
            const token = process.env.TELEGRAM_BOT_TOKEN || "";
            const chatId = process.env.TELEGRAM_CHAT_ID || "";
            if (!token || !chatId) { console.log("Telegram skipped: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret not set"); return; }
            try {
              const url = `https://api.telegram.org/bot${token}/sendMessage`;
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: chatId,
                  text: message,
                  parse_mode: "HTML"
                })
              });
              if (!res.ok) {
                const errText = await res.text().catch(() => "");
                console.log(`Telegram API response failed: HTTP ${res.status} - ${errText}`);
              } else {
                console.log("Telegram notification successfully sent.");
              }
            } catch (err) {
              console.log(`Error sending Telegram notification: ${err.message}`);
            }
          }

          // ── Telegram helpers ─────────────────────────────────────────────────────
          // Escape user-controlled text (titles, error messages) for parse_mode=HTML,
          // otherwise a title containing < or & silently breaks the whole message.
          function tgEscape(s) {
            return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }
          function fmtDhakaTime(d = new Date()) {
            try {
              return d.toLocaleString("en-GB", { timeZone: "Asia/Dhaka", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true }).replace(",", " ·");
            } catch (_) { return d.toISOString(); }
          }
          function fmtDuration(ms) {
            const s = Math.max(0, Math.round(ms / 1000));
            const m = Math.floor(s / 60), r = s % 60;
            return m ? `${m} মিনিট ${r} সেকেন্ড` : `${r} সেকেন্ড`;
          }
          function fmtBytes(n) {
            return n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)} MB` : `${Math.round(n / 1024)} KB`;
          }

          // Playwright ALWAYS records video as .webm (VP8). Telegram can't play that inline
          // (it arrives as a file), so convert to H.264 MP4 before sending.
          //   1) system ffmpeg (preinstalled on GitHub windows/ubuntu runners)
          //   2) Playwright's bundled ffmpeg (may lack libx264 -> we fall through)
          //   3) give up -> send the .webm as before
          function findFfmpeg() {
            const { execSync } = require("child_process");
            // 1) full ffmpeg installed by the "Install ffmpeg" workflow step (has libx264)
            if (process.env.FFMPEG_PATH && fs.existsSync(process.env.FFMPEG_PATH)) return process.env.FFMPEG_PATH;
            try {
              execSync(process.platform === "win32" ? "where ffmpeg" : "which ffmpeg", { stdio: "ignore" });
              return "ffmpeg";
            } catch (_) {}
            const roots = [
              process.env.PLAYWRIGHT_BROWSERS_PATH,
              path.join(process.env.LOCALAPPDATA || "", "ms-playwright"),
              path.join(process.env.HOME || process.env.USERPROFILE || "", ".cache", "ms-playwright")
            ].filter(Boolean);
            for (const root of roots) {
              try {
                for (const d of fs.readdirSync(root)) {
                  if (!d.startsWith("ffmpeg")) continue;
                  for (const c of ["ffmpeg-win64.exe", "ffmpeg-linux", "ffmpeg-mac"]) {
                    const p = path.join(root, d, c);
                    if (fs.existsSync(p)) return p;
                  }
                }
              } catch (_) {}
            }
            return null;
          }
          function convertVideoToMp4(webmPath) {
            try {
              if (!webmPath || !fs.existsSync(webmPath)) return webmPath;
              if (/\.mp4$/i.test(webmPath)) return webmPath;
              const ff = findFfmpeg();
              if (!ff) { console.log("⚠️ ffmpeg not found - sending .webm as-is"); return webmPath; }
              const { execFileSync } = require("child_process");
              const mp4Path = webmPath.replace(/\.webm$/i, "") + ".mp4";
              const encode = (crf, scale) => {
                const vf = scale ? `scale=${scale}` : "scale=trunc(iw/2)*2:trunc(ih/2)*2";
                execFileSync(ff, ["-y", "-loglevel", "error", "-i", webmPath,
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", String(crf), "-pix_fmt", "yuv420p",
                  "-vf", vf, "-r", "25", "-movflags", "+faststart", "-an", mp4Path],
                  { stdio: ["ignore", "ignore", "pipe"], timeout: 10 * 60 * 1000 });
              };
              console.log(`🎬 Converting video with ffmpeg: ${ff}`);
              try {
                encode(26, null);
              } catch (e1) {
                // ffmpeg without libx264 (e.g. Playwright's bundled build) - retry with the built-in mpeg4 encoder
                const err1 = (e1.stderr ? e1.stderr.toString() : e1.message).trim().split("\n").slice(-3).join(" | ");
                console.log(`⚠️ libx264 encode failed (${err1}) - retrying with mpeg4 encoder`);
                execFileSync(ff, ["-y", "-loglevel", "error", "-i", webmPath, "-c:v", "mpeg4", "-q:v", "4", "-pix_fmt", "yuv420p",
                  "-vf", "scale=trunc(iw/2)*2:trunc(ih/2)*2", "-r", "25", "-movflags", "+faststart", "-an", mp4Path],
                  { stdio: ["ignore", "ignore", "pipe"], timeout: 10 * 60 * 1000 });
              }
              if (!fs.existsSync(mp4Path) || fs.statSync(mp4Path).size === 0) throw new Error("mp4 output missing/empty");
              const TG_LIMIT = 49 * 1024 * 1024; // Bot API upload cap is 50 MB
              if (fs.statSync(mp4Path).size > TG_LIMIT) {
                console.log("📹 mp4 > 49MB - re-encoding smaller (720p, crf 32)");
                encode(32, "-2:720");
              }
              console.log(`🎬 Video converted: ${path.basename(webmPath)} (${fmtBytes(fs.statSync(webmPath).size)}) -> ${path.basename(mp4Path)} (${fmtBytes(fs.statSync(mp4Path).size)})`);
              return mp4Path;
            } catch (e) {
              const detail = e.stderr ? e.stderr.toString().trim().split("\n").slice(-3).join(" | ") : e.message;
              console.log(`⚠️ Video conversion failed (${detail}) - sending .webm as-is`);
              return webmPath;
            }
          }

          async function sendTelegramAttachment(filePath, type = "image", caption = "", extra = {}) {
            // v28 security: bot token + chat id come from GitHub Secrets (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
            const token = process.env.TELEGRAM_BOT_TOKEN || "";
            const chatId = process.env.TELEGRAM_CHAT_ID || "";
            if (!token || !chatId) { console.log("Telegram skipped: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secret not set"); return; }
            try {
              if (!fs.existsSync(filePath)) {
                console.log(`Telegram attachment file not found: ${filePath}`);
                return;
              }
              if (type === "video") filePath = convertVideoToMp4(filePath);
              const fileBuffer = fs.readFileSync(filePath);
              const blob = new Blob([fileBuffer]);
              const formData = new FormData();
              formData.append("chat_id", chatId);
              if (caption) {
                formData.append("caption", caption.slice(0, 1024)); // Telegram caption limit
                formData.append("parse_mode", "HTML");
              }
              for (const [k, v] of Object.entries(extra || {})) formData.append(k, String(v));

              let endpoint = "sendPhoto";
              if (type === "video") {
                endpoint = "sendVideo";
                formData.append("supports_streaming", "true");
                formData.append("video", blob, path.basename(filePath));
              } else {
                formData.append("photo", blob, path.basename(filePath));
              }

              const url = `https://api.telegram.org/bot${token}/${endpoint}`;
              const res = await fetch(url, {
                method: "POST",
                body: formData
              });
              if (!res.ok) {
                const errText = await res.text().catch(() => "");
                console.log(`Telegram attachment (${type}) send failed: HTTP ${res.status} - ${errText}`);
              } else {
                console.log(`Telegram attachment (${type}) successfully sent.`);
              }
            } catch (err) {
              console.log(`Error sending Telegram attachment (${type}): ${err.message}`);
            }
          }


          function getDhakaGreeting() {
            try {
              const dhakaHour = parseInt(new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka", hour: "2-digit", hour12: false }), 10);
              let greetingTime = "শুভ দিন";
              if (dhakaHour >= 5 && dhakaHour < 12) greetingTime = "শুভ সকাল";
              else if (dhakaHour >= 12 && dhakaHour < 17) greetingTime = "শুভ দুপুর";
              else if (dhakaHour >= 17 && dhakaHour < 22) greetingTime = "শুভ সন্ধ্যা";
              else greetingTime = "শুভ রাত্রি";
              return `হ্যালো শাওন ভাই, ${greetingTime}`;
            } catch (_) {
              return "হ্যালো শাওন ভাই";
            }
          }

          // --- PROFILE ROTATION STATE MANAGER ---

          // Returns the next profile index whose upload count is still below perProfileLimit.
          // Returns -1 if every profile has reached its limit for today.
          function getNextAvailableProfile(lastUsedIndex, uploadCounts, total, perProfileLimit) {
            let next = (lastUsedIndex + 1) % total;
            for (let i = 0; i < total; i++) {
              if ((uploadCounts[next] || 0) < perProfileLimit) return next;
              next = (next + 1) % total;
            }
            return -1; // all profiles at their limit
          }

          async function getProfileState(totalProfilesCount) {
            console.log("Checking profile rotation state...");
            
            // Get current date in Dhaka timezone (e.g. "5/1/2026")
            const today = new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" }).split(",")[0];
            
            let state;
            try {
              state = await firebaseGet("uploadState");
            } catch (e) {
              state = null;
            }

            if (!state) {
              state = {
                lastUploadDate: "",
                totalUploadsToday: 0,
                lastUsedProfileIndex: -1,
                totalProfilesAvailable: totalProfilesCount,
                profileUploadCounts: {}
              };
            }

            state.totalProfilesAvailable = totalProfilesCount;

            // Backward-compat: older records may have profilesUsedToday array instead
            if (typeof state.profileUploadCounts !== "object" || Array.isArray(state.profileUploadCounts)) {
              state.profileUploadCounts = {};
            }

            if (state.lastUploadDate !== today) {
              console.log("New day detected! Resetting daily upload count and profile usage.");
              // ── Rotate upload type each new day through all 7 content types ──
              const TYPE_CYCLE = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
              const DAY_LABELS = { AUDIO: "🎵 Ringtone", WALLPAPER: "🖼️ Wallpaper", WALLPAPER_24H: "🌅 24H Wallpaper", WALLPAPER_DUAL: "🔒 Dual Wallpaper", WALLPAPER_BATTERY: "🔋 Battery Wallpaper", LIVE_WALLPAPER: "🎬 Live Wallpaper", CHARGING_ANIMATION: "⚡ Charging Animation" };
              const prevType = TYPE_CYCLE.includes(state.uploadDayType) ? state.uploadDayType : TYPE_CYCLE[TYPE_CYCLE.length - 1]; // if no record yet, cycle lands on AUDIO for Day 1
              state.uploadDayType = TYPE_CYCLE[(TYPE_CYCLE.indexOf(prevType) + 1) % TYPE_CYCLE.length];
              console.log(`📅 Day changed — today's upload type: ${state.uploadDayType} (${DAY_LABELS[state.uploadDayType]} day)`);
              state.lastUploadDate = today;
              state.totalUploadsToday = 0;
              state.profileUploadCounts = {};
              // lastUsedProfileIndex is intentionally NOT reset here so the rotation
              // continues from where it left off across days.
              // e.g. 6 profiles, limit 3/day: Day1→0,1,2  Day2→3,4,5  Day3→0,1,2 ...
            }

            // Ensure uploadDayType is always initialized (very first run ever)
            if (!state.uploadDayType) {
              state.uploadDayType = "AUDIO"; // First day defaults to ringtone
              console.log("📅 First-ever run — defaulting to AUDIO (🎵 Ringtone) day");
            }

            const ZEDGE_DAILY_LIMIT = 3; // Zedge max uploads per day
            if (state.totalUploadsToday >= ZEDGE_DAILY_LIMIT) {
              console.log(`🛑 Zedge daily limit of ${ZEDGE_DAILY_LIMIT} uploads reached. Exiting safely.`);
              await markRemainingGateSlots(0, { status: "skipped-limit", error: "daily limit of 3 uploads already reached" });   // v27.11: nothing is missing -> no retry
              process.exit(0); 
            }

            // How many uploads each profile may do today.
            // Spreads the daily limit as evenly as possible across available profiles:
            //   1 profile  → 3 uploads each
            //   2 profiles → 2 uploads for first, 1 for second  (total = 3)
            //   3+ profiles → 1 upload each
            const perProfileLimit = Math.ceil(ZEDGE_DAILY_LIMIT / totalProfilesCount);

            const nextProfileIndex = getNextAvailableProfile(state.lastUsedProfileIndex, state.profileUploadCounts, totalProfilesCount, perProfileLimit);

            if (nextProfileIndex === -1) {
              console.log("🛑 All profiles have reached their daily upload limit. Exiting safely.");
              process.exit(0);
            }

            const countsDisplay = Object.entries(state.profileUploadCounts).map(([k,v]) => `P${k}:${v}`).join(", ") || "none";
            console.log(`Upload counts today: {${countsDisplay}} | Per-profile limit: ${perProfileLimit} | Next: ${nextProfileIndex}`);
            return { state, nextProfileIndex, perProfileLimit };
          }

          async function updateProfileStateAfterUpload(state, usedProfileIndex) {
            console.log(`Updating state: Profile ${usedProfileIndex} was used. Total today is now ${state.totalUploadsToday + 1}`);
            
            const profileUploadCounts = { ...(state.profileUploadCounts || {}) };
            profileUploadCounts[usedProfileIndex] = (profileUploadCounts[usedProfileIndex] || 0) + 1;

            await firebasePatch("uploadState", {
              lastUploadDate: state.lastUploadDate,
              totalUploadsToday: state.totalUploadsToday + 1,
              lastUsedProfileIndex: usedProfileIndex,
              totalProfilesAvailable: state.totalProfilesAvailable,
              profileUploadCounts,
              uploadDayType: state.uploadDayType
            });
          }
          // ----------------------------------------

          const SET_SLOTS = {
            WALLPAPER_24H: ["morning", "afternoon", "evening", "night"],
            WALLPAPER_DUAL: ["lock", "home"],
            WALLPAPER_BATTERY: ["critical", "low", "mid", "high", "full", "charging"]
          };
          const VIDEO_TYPES = ["LIVE_WALLPAPER", "CHARGING_ANIMATION"];

          function getItemContentType(item) {
            if (item && item.contentType) return item.contentType;
            const mp3 = item && (item.isMp3 || (item.name && item.name.toLowerCase().endsWith(".mp3")));
            return mp3 ? "RINGTONE" : "WALLPAPER";
          }

          function slotFileUrl(item, slot) {
            const v = item && item.files ? item.files[slot] : null;
            return typeof v === "string" ? v : ((v && v.fileUrl) || "");
          }

          // ── v23 metadata guard helpers ───────────────────────────────────────────
          // Required for upload: title + tags + category (same rule as the generator + app + panel).
          function metadataMissingFields(item) {
            const txt = (v) => Array.isArray(v) ? v.map(x => String(x || "").trim()).filter(Boolean).join(",") : String(v ?? "").trim();
            const missing = [];
            if (!txt(item?.title)) missing.push("title");
            if (!txt(item?.tags)) missing.push("tags");
            if (!txt(item?.category)) missing.push("category");
            return missing;
          }
          function hasRequiredMetadata(item) { return metadataMissingFields(item).length === 0; }

          async function publishMetadataAlerts(missingEntries) {
            const items = {};
            for (const [id, item] of missingEntries) {
              items[id] = { name: item.name || item.title || id, contentType: getItemContentType(item), missing: metadataMissingFields(item), createdAt: item.createdAt || null };
            }
            const ids = Object.keys(items).sort();
            const key = ids.join("|");
            if (ids.length) {
              console.log(`META_MISSING => ${ids.length} queued file(s) skipped (no metadata): ` + ids.map(id => `"${items[id].name}" [${items[id].missing.join(",")}]`).join("; "));
            }
            let prev = null;
            try { prev = await firebaseGet("dashboardSettings/metadataAlerts"); } catch (e) { console.log(`metadataAlerts read failed: ${e.message}`); }
            try {
              const res = await fetch(`${firebaseDatabaseURL}/dashboardSettings/metadataAlerts.json`, {
                method: "PUT", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ count: ids.length, items, key, updatedAt: Date.now(), updatedDhaka: fmtDhakaTime(), runId: process.env.GITHUB_RUN_ID || "", notifiedKey: prev && prev.notifiedKey ? prev.notifiedKey : "" })
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
            } catch (e) { console.log(`metadataAlerts write failed: ${e.message}`); }
            // Telegram: only when the set of metadata-less files changed (no spam on every run)
            if (ids.length && (!prev || prev.notifiedKey !== key)) {
              const lines = ids.slice(0, 10).map(id => `• ${tgEscape(items[id].name)} <i>(${items[id].missing.join(", ")})</i>`);
              if (ids.length > 10) lines.push(`… এবং আরও ${ids.length - 10} টি`);
              const msg = [
                `⚠️ <b>মেটাডাটা নেই - ${ids.length} টি ফাইল আপলোড হবে না</b>`,
                "━━━━━━━━━━━━━━━━",
                `📁 প্রজেক্ট: ${tgEscape(process.env.FOLDER_NAME || "Zedge Bot")}`,
                `🕒 সময়: ${fmtDhakaTime()}`,
                "📝 ফাইল:",
                lines.join("\n"),
                "",
                "💡 অ্যাপ / প্যানেল থেকে title, tags, category দিন - অথবা generator.yml (metadata mode) চালান। মেটাডাটা না দেওয়া পর্যন্ত এই ফাইলগুলো স্কিপ হবে।"
              ].join("\n");
              await sendTelegramNotification(msg);
              try { await firebasePatch("dashboardSettings/metadataAlerts", { notifiedKey: key, notifiedAt: Date.now() }); } catch (_) {}
            }
          }

          function hasSetFiles(item) {
            const slots = SET_SLOTS[getItemContentType(item)];
            if (!slots) return false;
            return slots.every(s => slotFileUrl(item, s));
          }

          async function getNextWallpaperFromRealtimeDB(dayType, dayTypeLocked = false, variety = null) {
            console.log(`Checking Firebase Realtime Database queue... (Today's type: ${dayType}${dayTypeLocked ? " - LOCKED for today" : ""})`);
            console.log(`ACTIVE_DB: ${firebaseDatabaseURL}`);
            const data = await firebaseGet(queuePath);
            if (!data) throw new Error(`No items found in Realtime Database (${firebaseDatabaseURL})`);

            // STALE CLAIM RECOVERY: if a previous run crashed hard (runner killed),
            // an item can stay stuck in "processing" forever and would never upload.
            // Recover claims older than 3h back to "queued" (max 2 recoveries, then "failed"
            // so a repeatedly-crashing item can never be uploaded twice by accident).
            const STALE_CLAIM_MS = 3 * 60 * 60 * 1000;
            for (const [sid, sitem] of Object.entries(data)) {
              if (!sitem || sitem.status !== "processing") continue;
              const claimAge = Date.now() - (sitem.processingAt || 0);
              if (claimAge <= STALE_CLAIM_MS) continue;
              const recoveries = (sitem.staleRecoveries || 0) + 1;
              if (recoveries > 2) {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" crashed ${recoveries} times - marking failed (manual requeue needed).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "failed", error: "Stale processing claim - run crashed repeatedly", failedAt: Date.now() });
                sitem.status = "failed";
              } else {
                console.log(`STALE_CLAIM => "${sitem.name || sid}" stuck in processing for ${Math.round(claimAge / 60000)} min - recovering to queued (recovery #${recoveries}).`);
                await firebasePatch(`${queuePath}/${sid}`, { status: "queued", claimToken: null, processingAt: null, staleRecoveries: recoveries });
                sitem.status = "queued";
              }
            }

            const uploadable = Object.entries(data).filter(([_, item]) =>
              item &&
              item.status === "queued" &&
              (item.fileBase64 || item.imageBase64 || item.fileUrl || hasSetFiles(item))
            );

            // v23 METADATA GUARD: a file without title / tags / category NEVER goes to Zedge.
            // Such files stay "queued" (so the generator / app / panel can fill them) but are
            // invisible to the picker below. The list is published to Firebase so the app + panel
            // can show a "metadata missing" alert, and Telegram is pinged once per distinct set.
            const missingMeta = uploadable.filter(([_, item]) => !hasRequiredMetadata(item));
            const allQueued = uploadable.filter(([_, item]) => hasRequiredMetadata(item));
            await publishMetadataAlerts(missingMeta);

            const typeCounts = {};
            allQueued.forEach(([_, item]) => {
              const t = getItemContentType(item);
              typeCounts[t] = (typeCounts[t] || 0) + 1;
            });
            console.log(`QUEUE_COMPOSITION => total:${allQueued.length} | ${JSON.stringify(typeCounts)} | dayType:${dayType}`);

            // Which queue content type belongs to today's day type
            const wantedType = dayType === "AUDIO" ? "RINGTONE" : dayType;

            // Pinned scheduling: items pinned to today's date (or overdue) take priority over the rotation
            const todayKey = new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10);
            const pinnedEntries = allQueued
              .filter(([_, item]) => item.scheduledDate && item.scheduledDate <= todayKey)
              .sort((a, b) =>
                String(a[1].scheduledDate).localeCompare(String(b[1].scheduledDate)) ||
                ((a[1].createdAt || 0) - (b[1].createdAt || 0))
              );
            if (pinnedEntries.length) {
              console.log(`PINNED_QUEUE => ${pinnedEntries.length} item(s) pinned for <= ${todayKey}; pinned item overrides rotation type.`);
            }

            // Oldest-first queued entries of one content type (not scheduled for a future day)
            const entriesOfType = (t) => allQueued
              .filter(([_, item]) => (!item.scheduledDate || item.scheduledDate <= todayKey) && getItemContentType(item) === t)
              .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

            // DAY-TYPE SKIP (strict "each content on its own day"):
            // If today's type has nothing queued (and nothing is pinned), we do NOT borrow
            // another type onto this day. Instead the DAY ITSELF becomes the next type in the
            // cycle that actually has stock, and the rotation continues from there.
            //   e.g. WALLPAPER day, 0 wallpapers, 0 24H, 4 dual  ->  today becomes DUAL day,
            //        tomorrow is BATTERY day, and so on.
            // The new day type is persisted to Firebase so all runs today + tomorrow's rotation agree.
            // FULL-DAY RULE: a content type only gets a day when it has a FULL day of stock
            // (MIN_STOCK_FOR_DAY = 3). Types with 1-2 items WAIT until restocked (or are pinned
            // manually). Once a rotation upload happens the day type is LOCKED - it never
            // switches mid-day, so a day always shows exactly one content type.
            const MIN_STOCK_FOR_DAY = 3;
            let pickedType = wantedType;
            let effectiveDayType = dayType;
            let dayTypeSwitchedTo = null;
            let entries = pinnedEntries.length ? pinnedEntries : entriesOfType(wantedType);
            // v25 MIX MODE (dashboardSettings/variety.enabled): every slot of the day uploads a DIFFERENT
            // content type. Slot k takes order[k] (order rotates daily so the first slot is not always the
            // same type). Types already uploaded today are skipped; a type with no stock is skipped for
            // the next unused type. strict=true -> never repeat a type on the same day (wait instead).
            let varietyPick = null;
            if (variety && variety.enabled && !pinnedEntries.length) {
              const used = Array.isArray(variety.usedToday) ? variety.usedToday : [];
              const unused = variety.order.filter(t => !used.includes(t));
              const seq = unused.length ? unused : (variety.strict ? [] : variety.order.slice());
              let chosen = null;
              const empty = [];
              for (const t of seq) { const found = entriesOfType(t); if (found.length) { chosen = { t, found }; break; } empty.push(t); }
              // v27.11 GAP FILL: the type(s) this slot wanted have no stock (e.g. only 2 content types have files
              // but the day has 3 slots) -> NEVER leave the slot blank. Take the type with the FEWEST uploads today
              // that still has stock (least-repeated first, then today's order). Applies in strict mode too: strict
              // now only sets the preference (different type first) - an empty slot is worse than a repeated type,
              // 3 slots must always mean 3 uploads.
              let gapFill = false;
              if (!chosen) {
                const cnt = (t) => used.filter(u => u === t).length;
                const ranked = variety.order.slice().sort((a, b) => cnt(a) - cnt(b) || variety.order.indexOf(a) - variety.order.indexOf(b));
                for (const t of ranked) { const found = entriesOfType(t); if (found.length) { chosen = { t, found }; gapFill = true; break; } }
              }
              if (!chosen) {
                const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} file(s) are waiting for metadata and were not counted.` : "";
                throw new Error(`MIX_MODE_WAIT => mix mode is ON and no queued file exists for ANY content type today (used today: [${used.join(", ") || "none"}], empty: [${empty.join(", ")}]). Add files or pin an item.${metaNote}`);
              }
              pickedType = chosen.t;
              entries = chosen.found;
              varietyPick = chosen.t;
              console.log(`MIX_MODE => slot ${used.length + 1}: uploading ${chosen.t} (${chosen.found.length} queued)${gapFill ? " [GAP FILL - wanted type(s) " + (empty.join(", ") || "-") + " have no stock, repeating the least-used type so the slot is not left empty]" : ""}. Used today: [${used.join(", ") || "none"}] | order today: ${variety.order.join(" > ")}${empty.length && !gapFill ? ` | skipped (empty): ${empty.join(", ")}` : ""}`);
            }
            if (varietyPick) {
              // handled above - day-type rotation / lock rules do not apply in mix mode
            } else if (!pinnedEntries.length) {
              if (dayTypeLocked) {
                if (!entries.length) {
                  throw new Error(`DAY_LOCKED => today is a ${dayType} day (locked) and no more ${wantedType} queued. Not switching type mid-day - nothing more to upload today.`);
                }
              } else if (entries.length < MIN_STOCK_FOR_DAY) {
                const TYPE_CYCLE_SKIP = ["AUDIO", "WALLPAPER", "WALLPAPER_24H", "WALLPAPER_DUAL", "WALLPAPER_BATTERY", "LIVE_WALLPAPER", "CHARGING_ANIMATION"];
                const startIdx = Math.max(0, TYPE_CYCLE_SKIP.indexOf(dayType));
                const waiting = [];
                if (entries.length) waiting.push(`${wantedType}:${entries.length}/${MIN_STOCK_FOR_DAY}`);
                let chosen = null;
                for (let step = 1; step < TYPE_CYCLE_SKIP.length && !chosen; step++) {
                  const tryDayType = TYPE_CYCLE_SKIP[(startIdx + step) % TYPE_CYCLE_SKIP.length];
                  const tryType = tryDayType === "AUDIO" ? "RINGTONE" : tryDayType;
                  const found = entriesOfType(tryType);
                  if (found.length >= MIN_STOCK_FOR_DAY) {
                    chosen = { tryDayType, tryType, found };
                  } else if (found.length) {
                    waiting.push(`${tryType}:${found.length}/${MIN_STOCK_FOR_DAY}`);
                  }
                }
                if (!chosen) {
                  const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} file(s) are waiting for metadata and were not counted.` : "";
                  throw new Error(`WAIT_FOR_STOCK => no content type has a full day of stock (>= ${MIN_STOCK_FOR_DAY}). Waiting: [${waiting.join(", ")}]. Add more files or pin an item manually. Nothing uploaded.${metaNote}`);
                }
                pickedType = chosen.tryType;
                effectiveDayType = chosen.tryDayType;
                dayTypeSwitchedTo = chosen.tryDayType;
                entries = chosen.found;
                console.log(`DAY_TYPE_SKIP => ${dayType} day has only ${entriesOfType(wantedType).length}/${MIN_STOCK_FOR_DAY} ${wantedType}; today is now a ${chosen.tryDayType} day (${chosen.found.length} available). Waiting for restock: [${waiting.join(", ") || "none"}]`);
                // Persist immediately so the dashboard + later runs today see the switched type
                await firebasePatch("uploadState", { uploadDayType: dayTypeSwitchedTo });
              }
            }

            if (!entries.length) {
              const metaNote = missingMeta.length ? ` NO_METADATA => ${missingMeta.length} queued file(s) skipped because metadata is missing.` : "";
              throw new Error(`Queue is completely EMPTY - no uploadable item of ANY type found. Queue => ${JSON.stringify(typeCounts)}.${metaNote} DB=${firebaseDatabaseURL}`);
            }

            const [id, item] = entries[0];
            const localDir = path.join(process.cwd(), "downloads");
            fs.mkdirSync(localDir, { recursive: true });

            const contentType = getItemContentType(item);
            const isMp3 = contentType === "RINGTONE";

            // Defensive guard (double-check); pinned and fallback picks may legally differ from the rotation type
            const isPinnedPick = Boolean(item.scheduledDate && item.scheduledDate <= todayKey);
            if (isPinnedPick) {
              console.log(`PINNED_PICK => "${item.name || id}" was scheduled for ${item.scheduledDate} (today: ${todayKey})`);
            } else if (contentType !== pickedType) {
              throw new Error(`Day/type mismatch guard triggered. dayType=${effectiveDayType}, pickedType=${pickedType}, item=${item.name || id}, contentType=${contentType}`);
            } else if (dayTypeSwitchedTo) {
              console.log(`DAY_TYPE_SKIP_UPLOAD => uploading ${contentType} "${item.name || id}" - day switched ${dayType} -> ${dayTypeSwitchedTo} (no ${wantedType} queued).`);
            }

            // ANTI DOUBLE-UPLOAD GUARD: claim this item FIRST with a unique token,
            // then verify we own the claim. If any other run already claimed this file,
            // abort immediately so the same file can NEVER be uploaded twice.
            const claimToken = `claim-${Date.now()}-${Math.random().toString(36).slice(2)}`;
            await firebasePatch(`${queuePath}/${id}`, {
              status: "processing",
              processingAt: Date.now(),
              claimToken
            });
            const claimCheck = await firebaseGet(`${queuePath}/${id}`);
            if (!claimCheck || claimCheck.claimToken !== claimToken) {
              throw new Error(`Queue item ${id} was already claimed by another run - aborting to prevent double upload.`);
            }

            async function downloadToFile(url, filePath, label) {
              console.log(`Downloading ${label} from R2: ${url}`);
              const res = await fetch(url);
              if (!res.ok) throw new Error(`Failed to download ${label} from R2: HTTP ${res.status}`);
              const arrayBuffer = await res.arrayBuffer();
              fs.writeFileSync(filePath, Buffer.from(arrayBuffer));
            }

            let localFile;
            let localFiles = [];
            let fileUrls = [];
            let localThumb = null;

            if (SET_SLOTS[contentType]) {
              // Multi-image set (24H / Dual / Battery) - download every slot image in order
              if (!hasSetFiles(item)) {
                throw new Error(`${contentType} item ${id} is missing one or more slot images (${SET_SLOTS[contentType].join(", ")})`);
              }
              for (const slot of SET_SLOTS[contentType]) {
                const slotUrl = slotFileUrl(item, slot);
                const slotFile = path.join(localDir, `${id}-${slot}.jpg`);
                await downloadToFile(slotUrl, slotFile, `${contentType} ${slot} image`);
                localFiles.push(slotFile);
                fileUrls.push(slotUrl);
              }
              localFile = localFiles[0];
              console.log(`${contentType} set ready - ${localFiles.length} images downloaded`);
            } else if (VIDEO_TYPES.includes(contentType)) {
              // Video content (Live Wallpaper / Charging Animation) + auto thumbnail
              const isMov = item.name && item.name.toLowerCase().endsWith(".mov");
              localFile = path.join(localDir, `${id}${isMov ? ".mov" : ".mp4"}`);
              await downloadToFile(item.fileUrl, localFile, item.name || id);
              localFiles = [localFile];
              fileUrls = [item.fileUrl];
              if (item.thumbUrl) {
                localThumb = path.join(localDir, `${id}-thumb.jpg`);
                await downloadToFile(item.thumbUrl, localThumb, "cover thumbnail");
                fileUrls.push(item.thumbUrl);
              } else {
                console.warn(`${contentType} item ${id} has no thumbUrl - cover image step will be skipped`);
              }
            } else {
              const isJpeg = item.name && item.name.toLowerCase().endsWith(".jpeg");
              const ext = isMp3 ? ".mp3" : (isJpeg ? ".jpeg" : ".jpg");
              localFile = path.join(localDir, `${id}${ext}`);

              console.log(`Saving queued item: ${item.name || id} as ${ext}`);
              if (item.fileUrl) {
                await downloadToFile(item.fileUrl, localFile, item.name || id);
              } else {
                const base64Data = item.fileBase64 || item.imageBase64;
                if (base64Data) {
                  const base64 = base64Data.includes(",")
                    ? base64Data.split(",")[1]
                    : base64Data;
                  fs.writeFileSync(localFile, Buffer.from(base64, "base64"));
                } else {
                  throw new Error(`Queue item ${id} is missing both fileUrl and base64 data`);
                }
              }
              localFiles = [localFile];
              if (item.fileUrl) fileUrls = [item.fileUrl];
            }

            // Item already claimed above (anti double-upload guard) - no re-claim needed.

            return {
              id,
              localFile,
              localFiles,
              localThumb,
              contentType,
              isMp3,
              dayTypeSwitchedTo,
              varietyType: varietyPick,
              isPinnedPick,
              name:        item.name || id,
              title:       item.title || "",
              tags:        item.tags || "",
              category:    item.category || "",
              description: item.description || "",
              fileUrl:     item.fileUrl || "",
              fileUrls
            };
          }

          async function markWallpaperDoneAndDelete(id, name, fileUrlOrUrls) {
            console.log(`Upload successful - deleting "${name}" from Firebase...`);
            await firebaseDelete(`${queuePath}/${id}`);
            console.log(`"${name}" permanently removed from Firebase queue`);

            const urls = (Array.isArray(fileUrlOrUrls) ? fileUrlOrUrls : [fileUrlOrUrls]).filter(Boolean);

            for (const fileUrl of urls) {
              let fileKey = "";
              try {
                const u = new URL(fileUrl);
                fileKey = decodeURIComponent(u.pathname.replace(/^\/+/, ""));
              } catch {
                // fallback for malformed URL strings
                fileKey = String(fileUrl).replace(/^https?:\/\/[^/]+\//i, "");
              }

              try {
                console.log(`R2 delete request => fileUrl: ${fileUrl}`);
                console.log(`R2 delete request => parsed key: ${fileKey}`);

                const res = await fetch(r2WorkerUrl, {
                  method: "DELETE",
                  headers: {
                    "X-File-Name": fileKey
                  }
                });

                const body = await res.text().catch(() => "");
                if (res.ok) {
                  console.log(`Successfully deleted key "${fileKey}" from Cloudflare R2. Status=${res.status} Body=${body}`);
                } else {
                  console.warn(`R2 delete failed for key "${fileKey}". Status=${res.status} Body=${body}`);
                }
              } catch (err) {
                console.error(`Failed to delete "${fileKey}" from R2:`, err.message);
              }
            }
          }

          async function markWallpaperFailed(id, error) {
            await firebasePatch(`${queuePath}/${id}`, {
              status: "failed",
              error: String(error).slice(0, 1000),
              failedAt: Date.now()
            });
          }

          async function getProxyTimezone(browser) {
            const providers = [
              { url: "https://ipwho.is/", parse: d => d.timezone?.id },
              { url: "https://ipinfo.io/json", parse: d => d.timezone },
              { url: "http://ip-api.com/json", parse: d => d.timezone }
            ];

            for (const provider of providers) {
              let ctx;
              try {
                ctx = await browser.newContext({ ignoreHTTPSErrors: true });
                const page = await ctx.newPage();
                console.log(`Checking timezone via ${provider.url}`);
                await page.goto(provider.url, { waitUntil: "domcontentloaded" });
                const text = await page.locator("body").innerText();
                if (!text || !text.trim().startsWith("{")) throw new Error("Response is not JSON");
                const data = JSON.parse(text);
                const tz = provider.parse(data);
                if (!tz) throw new Error("No timezone found");
                await ctx.close();
                console.log(`Detected timezone: ${tz}`);
                return tz;
              } catch (err) {
                console.log(`Timezone provider failed: ${err.message}`);
                if (ctx) await ctx.close().catch(() => {});
              }
            }

            console.log("Using fallback timezone: Asia/Dhaka");
            return "Asia/Dhaka";
          }

          async function safeClick(locator, label, timeout = 30000) {
            console.log(`Clicking ${label}`);
            await locator.waitFor({ state: "visible", timeout });
            await locator.scrollIntoViewIfNeeded();
            await locator.click();
          }

          async function safeClickWithPopupRecovery(page, locator, label, timeout = 30000, retries = 4) {
            let lastErr = null;
            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                await dismissConsentPopup(page);
                await page.waitForTimeout(300);
                await safeClick(locator, `${label} (attempt ${attempt}/${retries})`, timeout);
                return;
              } catch (err) {
                lastErr = err;
                console.log(`⚠️ Click failed for ${label} on attempt ${attempt}: ${err.message}`);
                await dismissConsentPopup(page).catch(() => {});
                await page.evaluate(() => {
                  document.body.style.overflow = "";
                  document.documentElement.style.overflow = "";
                  const nodes = [...document.querySelectorAll("*")];
                  let touched = 0;
                  for (const el of nodes) {
                    try {
                      const s = window.getComputedStyle(el);
                      if ((s.position === "fixed" || s.position === "sticky") &&
                          parseInt(s.zIndex || "0", 10) >= 999 &&
                          el.offsetWidth >= window.innerWidth * 0.9 &&
                          el.offsetHeight >= window.innerHeight * 0.6) {
                        el.style.pointerEvents = "none";
                        el.style.display = "none";
                        touched++;
                      }
                    } catch (_) {}
                  }
                  return touched;
                }).catch(() => {});
                await page.waitForTimeout(700);
              }
            }
            throw new Error(`Failed to click ${label} after ${retries} attempts. Last error: ${lastErr?.message || "unknown"}`);
          }

          async function safeType(locator, value, label) {
            console.log(`Typing ${label}`);
            await locator.waitFor({ state: "visible" });
            await locator.scrollIntoViewIfNeeded();
            await locator.click();
            await locator.fill("");
            await locator.pressSequentially(value, { delay: 90 });
          }

          async function scrollFullPage(page) {
            await page.evaluate(async () => {
              await new Promise(resolve => {
                let lastY = -1;
                const step = () => {
                  window.scrollBy(0, 500);
                  if (window.scrollY === lastY || window.scrollY + window.innerHeight >= document.body.scrollHeight) {
                    resolve();
                    return;
                  }
                  lastY = window.scrollY;
                  requestAnimationFrame(step);
                };
                step();
              });
            });
          }

          async function scrollToElement(locator) {
            await locator.waitFor({ state: "attached" });
            await locator.evaluate(el => {
              el.scrollIntoView({ block: "center", inline: "center" });
            });
          }

          async function dismissConsentPopup(page) {
            console.log("Checking for consent/cookie popups in all frames...");
            let clickedAny = false;

            const acceptPriority = [
              "accept all cookies",
              "accept all",
              "agree to all",
              "accept cookies",
              "i agree",
              "agree",
              "allow all",
              "allow",
              "continue",
              "accept & continue",
              "got it",
              "ok",
              "okay",
              "proceed",
              "understand"
            ];

            const negativeWords = ["reject", "disagree", "decline", "optional", "deny"];

            const socialOrLoginKeywords = [
              "facebook", "google", "apple", "email", "password", 
              "login", "log in", "signin", "sign in", "signup", "sign up", 
              "register", "create account", "continue with", "facebook lite", "sign up"
            ];

            for (const frame of page.frames()) {
              try {
                const clicked = await frame.evaluate(({ acceptPriority, negativeWords, socialOrLoginKeywords }) => {
                  const buttons = Array.from(document.querySelectorAll("button, [role='button'], a"));
                  
                  const isLoginPage = window.location.href.includes("account.zedge.net") || 
                                       window.location.href.includes("login") || 
                                       !!document.querySelector('input[type="email"], input[type="password"]');

                  const isConsentContainer = (el) => {
                    let cur = el;
                    while (cur) {
                      const id = (cur.id || "").toLowerCase();
                      const className = (typeof cur.className === "string" ? cur.className : "").toLowerCase();
                      const role = (cur.getAttribute?.("role") || "").toLowerCase();
                      if (id.includes("didomi") || className.includes("didomi") ||
                          id.includes("consent") || className.includes("consent") ||
                          id.includes("cookie") || className.includes("cookie") ||
                          id.includes("privacy") || className.includes("privacy") ||
                          id.includes("popup") || className.includes("popup") ||
                          role === "dialog" || role === "alertdialog") {
                        return true;
                      }
                      cur = cur.parentElement;
                    }
                    return false;
                  };

                  const candidates = [];
                  for (const btn of buttons) {
                    const rect = btn.getBoundingClientRect();
                    const isVisible = rect.width > 0 && rect.height > 0 && 
                                      window.getComputedStyle(btn).display !== "none" && 
                                      window.getComputedStyle(btn).visibility !== "hidden";
                    if (!isVisible) continue;

                    const text = (btn.innerText || "").trim().toLowerCase();
                    const ariaLabel = (btn.getAttribute("aria-label") || "").trim().toLowerCase();
                    const title = (btn.getAttribute("title") || "").trim().toLowerCase();
                    const id = (btn.id || "").trim().toLowerCase();
                    const className = (typeof btn.className === "string" ? btn.className : "").trim().toLowerCase();
                    const combined = `${text} ${ariaLabel} ${title} ${id} ${className}`.trim();

                    if (!combined) continue;

                    if (negativeWords.some(w => combined.includes(w))) continue;
                    if (socialOrLoginKeywords.some(w => combined.includes(w))) continue;
                    if (isLoginPage && !isConsentContainer(btn)) continue;

                    candidates.push({ btn, text, ariaLabel, title, combined });
                  }

                  for (const phrase of acceptPriority) {
                    const match = candidates.find(c => {
                      if (phrase === "ok" || phrase === "okay" || phrase === "agree" || phrase === "allow" || phrase === "continue") {
                        const words = c.text.split(/\s+/);
                        return words.includes(phrase) || c.text === phrase;
                      }
                      return c.text === phrase || c.ariaLabel === phrase || c.title === phrase || c.combined.includes(phrase);
                    });

                    if (match) {
                      match.btn.click();
                      return { clicked: true, text: match.text || match.ariaLabel || "button" };
                    }
                  }

                  const generic = candidates.find(c =>
                    c.combined.includes("accept") || c.combined.includes("agree")
                  );
                  if (generic) {
                    generic.btn.click();
                    return { clicked: true, text: generic.text || "generic button" };
                  }

                  return { clicked: false };
                }, { acceptPriority, negativeWords, socialOrLoginKeywords });

                if (clicked && clicked.clicked) {
                  console.log(`✅ Clicked consent accept element: "${clicked.text}" in frame: ${frame.url()}`);
                  clickedAny = true;
                  await page.waitForTimeout(500);
                }
              } catch (_) {}
            }

            // Fallback close/remove only if no accept click happened
            if (!clickedAny) {
              try {
                const nuked = await page.evaluate(() => {
                  let killed = 0;

                  function nukeElements(root) {
                    let k = 0;
                    if (!root) return k;

                    const selectors = [
                      '#didomi-host',
                      '.didomi-popup',
                      '[id*="didomi"]',
                      '[class*="didomi"]',
                      'dialog',
                      '[role="dialog"]',
                      '[class*="consent"]',
                      '[class*="cookie"]',
                      '[class*="privacy"]',
                      '[class*="modal"]',
                      '[class*="popup"]',
                      '[class*="dialog"]',
                      '[class*="overlay"]',
                      '[class*="backdrop"]',
                      '[class*="banner"]',
                      '[class*="notification"]',
                      '[class*="alert"]',
                      '[class*="announcement"]',
                      '[id*="consent"]',
                      '[id*="cookie"]',
                      '[id*="privacy"]',
                      '[id*="modal"]',
                      '[id*="popup"]',
                      '[id*="dialog"]',
                      '[id*="overlay"]',
                      '[id*="backdrop"]',
                      '[id*="banner"]'
                    ];

                    function isProtected(el) {
                      if (!el) return false;
                      if (el.querySelector("[data-hook]") || el.closest("[data-hook]")) return true;
                      
                      let current = el;
                      while (current) {
                        if (current.tagName === 'DIALOG' || 
                            current.getAttribute('role') === 'dialog' || 
                            current.classList.contains('sc-gKXOVf') ||
                            current.classList.contains('dwmyJL')) {
                          
                          if (current.id === 'didomi-host') return false;
                          
                          const text = (current.innerText || current.textContent || "").toLowerCase();
                          const uploadKeywords = [
                            "upload",
                            "wallpaper",
                            "ringtone",
                            "edit meta",
                            "publish",
                            "content policy",
                            "ownership",
                            "title",
                            "tags",
                            "category",
                            "description",
                            "success",
                            "pending",
                            "published"
                          ];
                          if (uploadKeywords.some(kw => text.includes(kw))) {
                            return true;
                          }
                        }
                        current = current.parentElement;
                      }
                      return false;
                    }

                    selectors.forEach(sel => {
                      const els = root.querySelectorAll(sel);
                      els.forEach(el => {
                        if (!isProtected(el)) {
                          el.remove();
                          k++;
                        }
                      });
                    });

                    // Traverse shadow roots recursively
                    const allEls = root.querySelectorAll('*');
                    allEls.forEach(el => {
                      if (el.shadowRoot) {
                        k += nukeElements(el.shadowRoot);
                      }
                    });

                    return k;
                  }

                  killed += nukeElements(document);

                  const iframes = document.querySelectorAll(
                    'iframe[src*="consent"], iframe[src*="cookie"], iframe[src*="privacy"], ' +
                    'iframe[id*="consent"], iframe[id*="cookie"]'
                  );
                  iframes.forEach(iframe => {
                    iframe.remove();
                    killed++;
                  });

                  if (killed > 0 || document.getElementById('didomi-host')) {
                    document.body.style.setProperty("overflow", "auto", "important");
                    document.documentElement.style.setProperty("overflow", "auto", "important");
                    document.body.style.setProperty("pointer-events", "auto", "important");
                    document.documentElement.style.setProperty("pointer-events", "auto", "important");
                  }
                  return killed;
                });
                if (nuked > 0) {
                  console.log(`✅ JS removed ${nuked} blocking elements.`);
                  clickedAny = true;
                }
              } catch (_) {}
            }

            return clickedAny;
          }

