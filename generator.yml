                'LATIN', 'MESSAGE_TONES', 'OTHER', 'POP', 'RNB_SOUL', 'REGGAE', 'RELIGIOUS', 'ROCK',
                'SAYINGS', 'ALTERNATIVE', 'ANIMALS', 'BLUES', 'BOLLYWOOD', 'CHILDREN', 'CLASSICAL',
                'SOUND_EFFECTS', 'WORLD', 'COMEDY', 'CONTACT_RINGTONES', 'COUNTRY', 'DANCE',
                'ELECTRONICA', 'GAMES', 'HIP_HOP', 'HOLIDAYS', 'JAZZ'
              ];

              let soundMode = 'Ringtone';
              let libraryViewMode = 'NEW'; // 'NEW' | 'OLD' | 'ALL'
              let selectedInstruments = new Set();
              let allAudios = [];

              function setLibraryView(mode) {
                libraryViewMode = mode;
                document.querySelectorAll('.lib-tab-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('view-tab-' + mode.toLowerCase());
                if (btn) btn.classList.add('active');
                renderAudioGrid();
              }

              function formatRelativeTime(ts) {
                if (!ts) return '';
                const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
                if (diffSec < 60) return 'Just now';
                if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm ago';
                if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h ago';
                return Math.floor(diffSec / 86400) + 'd ago';
              }
              let lastAudioSignature = '';
              const globalAudio = new Audio();
              globalAudio.preload = 'auto';
              let activeCardId = null;
              let activeStreamUrl = '';
              let activeFallbackUrl = '';
              let defaultMasterPrompt = '';
              let defaultNegativePrompt = '';
              let defaultBannedWords = '';

              function showToast(msg, isError = false) {
                const wrap = document.getElementById('toastContainer');
                const el = document.createElement('div');
                el.className = 'toast' + (isError ? ' error' : '');
                const iconSvg = isError
                  ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
                  : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>`;
                el.innerHTML = `${iconSvg}<span>${escapeHtml(msg)}</span>`;
                wrap.appendChild(el);
                setTimeout(() => el.remove(), 3800);
              }

              function escapeHtml(s) {
                return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
              }

              function switchTab(tabId, btn) {
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                btn.classList.add('active');
              }

              let audioShape = 'track';

              function setSoundMode(mode, defaultSec) {
                soundMode = mode;
                document.querySelectorAll('#toneModeSeg .seg-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('mode-' + mode.toLowerCase());
                if (btn) btn.classList.add('active');
                syncDuration(defaultSec);
                if (mode === 'Notification') setAudioShape('oneshot', false);
              }

              function setAudioShape(shape, adjustDuration = true) {
                audioShape = ['track', 'loop', 'oneshot'].includes(shape) ? shape : 'track';
                document.querySelectorAll('#shapeModeSeg .seg-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('shape-' + audioShape);
                if (btn) btn.classList.add('active');
                if (adjustDuration) {
                  if (audioShape === 'oneshot') syncDuration(3);
                  else if (audioShape === 'loop' && parseInt(document.getElementById('durationSlider').value, 10) < 8) syncDuration(20);
                }
              }

              function syncDuration(sec) {
                const val = Math.max(1, Math.min(60, parseInt(sec, 10) || 20));
                document.getElementById('durationSlider').value = val;
                document.getElementById('durationLabel').textContent = val + 's';
                document.querySelectorAll('#durationChips .chip').forEach(ch => {
                  ch.classList.toggle('selected', parseInt(ch.dataset.sec, 10) === val);
                });
              }

              function updateLineCount() {
                const raw = document.getElementById('promptsInput').value || '';
                const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
                const takes = parseInt(document.getElementById('takesCountSelect')?.value, 10) || 4;
                document.getElementById('lineCountBadge').textContent = `${lines.length} Prompt Line${lines.length === 1 ? '' : 's'}`;
                const btnLabel = document.getElementById('generateBtnLabel');
                if (lines.length > 0) {
                  const totalTracks = lines.length * takes;
                  btnLabel.textContent = `Generate ${lines.length} Prompt${lines.length === 1 ? '' : 's'} (${totalTracks} Tracks)`;
                } else {
                  const autoCnt = parseInt(document.getElementById('autoCountInput').value, 10) || 5;
                  btnLabel.textContent = `Auto-Generate ${autoCnt} Prompts (${autoCnt * takes} Tracks)`;
                }
              }

              document.getElementById('autoCountInput').addEventListener('input', updateLineCount);

              function insertSamplePrompts() {
                const samples = soundMode === 'Notification'
                  ? [
                      'Crisp crystal kalimba and celesta 3-note notification chime with warm natural decay',
                      'Gentle Japanese koto plucked harmonic alert motif in pentatonic scale',
                      'Warm vibraphone and soft wooden xylophone double-tap message tone',
                      'Bright acoustic harmonic guitar chime with airy stereo tail',
                      'Subtle Tibetan singing bowl and soft harp harmonic ping'
                    ]
                  : [
                      'Warm kalimba and Rhodes electric piano uplifting sunrise groove with subtle shaker',
                      'Spanish nylon acoustic guitar flamenco rhythm with crisp hand percussion',
                      'Cinematic pizzicato strings and solo cello playful detective motif',
                      'Japanese koto and bamboo flute serene zen garden melody with gentle groove',
                      'Upbeat jazz vibraphone and upright bass strutting mid-tempo swing melody'
                    ];
                const box = document.getElementById('promptsInput');
                box.value = (box.value.trim() ? box.value.trim() + '\n' : '') + samples.join('\n');
                updateLineCount();
              }

              function clearPrompts() {
                document.getElementById('promptsInput').value = '';
                updateLineCount();
              }

              function toggleBpmMode() {
                const isAuto = document.getElementById('bpmAutoToggle').checked;
                const slider = document.getElementById('bpmSlider');
                slider.disabled = isAuto;
                document.getElementById('bpmValueDisplay').textContent = isAuto ? 'Auto' : slider.value + ' BPM';
              }

              function setBpmValue(val) {
                document.getElementById('bpmAutoToggle').checked = false;
                document.getElementById('bpmSlider').disabled = false;
                document.getElementById('bpmSlider').value = val;
                document.getElementById('bpmValueDisplay').textContent = val + ' BPM';
              }

              function setBpmPreset(preset) {
                if (preset === 'Auto') {
                  document.getElementById('bpmAutoToggle').checked = true;
                  toggleBpmMode();
                } else {
                  setBpmValue(preset);
                }
              }

              function toggleInstrument(el, name) {
                if (selectedInstruments.has(name)) {
                  selectedInstruments.delete(name);
                  el.classList.remove('selected');
                } else {
                  selectedInstruments.add(name);
                  el.classList.add('selected');
                }
              }

              function clearInstruments() {
                selectedInstruments.clear();
                document.querySelectorAll('#instrumentChips .chip').forEach(c => c.classList.remove('selected'));
                document.getElementById('customInstrumentInput').value = '';
              }

              function getSelectedInstrumentsString() {
                const arr = [...selectedInstruments];
                const custom = document.getElementById('customInstrumentInput').value.trim();
                if (custom) arr.push(custom);
                return arr.join(', ');
              }

              function appendNeg(text) {
                const box = document.getElementById('negativePromptInput');
                const cur = box.value.trim();
                const existing = new Set(cur.split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
                const additions = text.split(',').map(s => s.trim()).filter(s => s && !existing.has(s.toLowerCase()));
                if (additions.length) {
                  box.value = cur ? `${cur}, ${additions.join(', ')}` : additions.join(', ');
                  showToast('Added exclusion rules to Negative Prompt');
                }
              }

              function resetNegativePrompt() {
                document.getElementById('negativePromptInput').value = defaultNegativePrompt;
                showToast('Negative prompt reset to default');
              }

              function resetMasterPrompt() {
                document.getElementById('masterPromptInput').value = defaultMasterPrompt;
                showToast('Master prompt reset to default');
              }

              function insertMasterVar(token) {
                const box = document.getElementById('masterPromptInput');
                const start = box.selectionStart || box.value.length;
                const end = box.selectionEnd || box.value.length;
                box.value = box.value.slice(0, start) + token + box.value.slice(end);
                box.focus();
              }

              function toggleTerminal() {
                document.getElementById('terminalBox').classList.toggle('open');
              }

              function collectStudioPayload() {
                const rawLines = document.getElementById('promptsInput').value || '';
                const prompts = rawLines.split('\n').map(s => s.trim()).filter(Boolean);
                const isBpmAuto = document.getElementById('bpmAutoToggle').checked;
                return {
                  prompts,
                  autoCount: parseInt(document.getElementById('autoCountInput').value, 10) || 5,
                  soundType: soundMode,
                  audioShape,
                  takesCount: parseInt(document.getElementById('takesCountSelect').value, 10) || 4,
                  timeSignature: document.getElementById('timeSignatureSelect').value || '4/4',
                  lengthSeconds: parseInt(document.getElementById('durationSlider').value, 10) || 20,
                  targetAccount: document.getElementById('targetAccount').value,
                  useGeminiEnhancer: document.getElementById('useGeminiEnhancer').checked,
                  bpm: isBpmAuto ? 'Auto' : parseInt(document.getElementById('bpmSlider').value, 10),
                  instruments: getSelectedInstrumentsString() || 'Auto',
                  genre: document.getElementById('genreSelect').value,
                  mood: document.getElementById('moodSelect').value,
                  musicalKey: document.getElementById('keySelect').value,
                  structure: document.getElementById('structureSelect').value,
                  production: document.getElementById('productionSelect').value,
                  negativePrompt: document.getElementById('negativePromptInput').value.trim(),
                  bannedWords: document.getElementById('bannedWordsInput').value.trim(),
                  masterPrompt: document.getElementById('masterPromptInput').value.trim(),
                  autoProcess: document.getElementById('autoProcessToggle').checked,
                  trimSilence: document.getElementById('trimSilenceToggle').checked,
                  volumeBoostPct: parseInt(document.getElementById('volumeBoostSlider').value, 10) || 200,
                  silenceThreshold: parseFloat(document.getElementById('silenceSlider').value) || 0.004,
                  padMs: parseInt(document.getElementById('padMsInput').value, 10) || 100,
                  fadeInMs: parseInt(document.getElementById('fadeInMsInput').value, 10) || 0,
                  fadeOutMs: parseInt(document.getElementById('fadeOutMsInput').value, 10) || 0,
                  bitrate: document.getElementById('bitrateSelect').value,
                  seed: parseInt(document.getElementById('seedInput').value, 10)
                };
              }

              async function saveStudioConfig() {
                try {
                  const payload = collectStudioPayload();
                  const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Failed to save config');
                  showToast('Master Prompt & studio settings saved');
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              async function startGenerationBatch() {
                try {
                  const payload = collectStudioPayload();
                  const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Could not start generation');
                  setLibraryView('NEW');
                  showToast(`Started batch generation (${data.total} item${data.total === 1 ? '' : 's'})`);
                  pollState();
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              async function stopGenerationBatch() {
                try {
                  await fetch('/api/stop-batch', { method: 'POST' });
                  showToast('Stopping batch after current step...');
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              async function syncFirebaseAudios() {
                try {
                  showToast('Syncing ringtones from Firebase...');
                  const res = await fetch('/api/firebase-audios');
                  const data = await res.json();
                  if (data.audios) {
                    allAudios = data.audios;
                    renderAudioGrid();
                    showToast(`Synced ${allAudios.length} ringtones from Firebase`);
                  }
                } catch (e) {
                  showToast('Firebase sync failed: ' + e.message, true);
                }
              }

              async function cleanR2Orphans() {
                try {
                  showToast('Scanning R2 bucket & all Firebase queues for orphan files...');
                  const scanRes = await fetch('/api/clean-r2-orphans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dryRun: true })
                  });
                  const scan = await scanRes.json();
                  if (!scanRes.ok) throw new Error(scan.error || 'R2 orphan scan failed');
                  if (!scan.orphanCount) {
                    showToast(`No R2 orphans found! (${scan.totalR2} R2 files, all ${scan.activeKeysCount} active)`);
                    return;
                  }
                  const mb = (scan.orphanBytes / (1024 * 1024)).toFixed(2);
                  const preview = (scan.sampleKeys || []).slice(0, 6).join('\n');
                  const msg = `Found ${scan.orphanCount} orphan file(s) (${mb} MB) in R2 that are NOT in any Firebase queue (${scan.dbsChecked.join(', ')}).\n\nSample:\n${preview}${scan.orphanCount > 6 ? '\n...' : ''}\n\nDelete these ${scan.orphanCount} orphan file(s) permanently from R2?`;
                  if (!confirm(msg)) return;
                  showToast(`Deleting ${scan.orphanCount} orphan file(s) from R2...`);
                  const delRes = await fetch('/api/clean-r2-orphans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dryRun: false })
                  });
                  const del = await delRes.json();
                  if (!delRes.ok) throw new Error(del.error || 'R2 orphan cleanup failed');
                  const delMb = (del.deletedBytes / (1024 * 1024)).toFixed(2);
                  showToast(`Cleaned ${del.deletedCount}/${del.orphanCount} R2 orphan(s) (${delMb} MB)` + (del.failedCount ? ` — ${del.failedCount} failed` : ''));
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              async function rotateStableToken() {
                if (!confirm('Create a new Stable Audio account and rotate bearer token now?')) return;
                try {
                  showToast('Rotating Stable Audio token in background...');
                  await fetch('/api/rotate-token', { method: 'POST' });
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              async function shutdownServer() {
                if (!confirm('Finish session and close the TryCloudflare Studio Server?')) return;
                try {
                  await fetch('/api/shutdown', { method: 'POST' });
                  showToast('Studio server shutting down. GitHub Action completing...');
                } catch (e) {}
              }

              function formatTime(sec) {
                if (!sec || !isFinite(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
              }

              const PLAY_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
              const PAUSE_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;

              function syncActiveCardUi() {
                document.querySelectorAll('.audio-card').forEach(c => c.classList.remove('playing'));
                document.querySelectorAll('.play-btn').forEach(b => { b.innerHTML = PLAY_SVG; });
                if (!activeCardId) return;
                const cardEl = document.getElementById('card-' + activeCardId);
                const btnEl = document.getElementById('play-btn-' + activeCardId);
                if (!globalAudio.paused) {
                  if (cardEl) cardEl.classList.add('playing');
                  if (btnEl) btnEl.innerHTML = PAUSE_SVG;
                }
              }

              globalAudio.addEventListener('timeupdate', () => {
                if (!activeCardId) return;
                const slider = document.getElementById('seek-' + activeCardId);
                const curLabel = document.getElementById('time-cur-' + activeCardId);
                const durLabel = document.getElementById('time-dur-' + activeCardId);
                if (globalAudio.duration && isFinite(globalAudio.duration)) {
                  if (slider) {
                    slider.max = globalAudio.duration;
                    slider.value = globalAudio.currentTime;
                  }
                  if (durLabel) durLabel.textContent = formatTime(globalAudio.duration);
                }
                if (curLabel) curLabel.textContent = formatTime(globalAudio.currentTime);
              });

              globalAudio.addEventListener('loadedmetadata', () => {
                if (!activeCardId) return;
                const slider = document.getElementById('seek-' + activeCardId);
                const durLabel = document.getElementById('time-dur-' + activeCardId);
                if (globalAudio.duration && isFinite(globalAudio.duration)) {
                  if (slider) slider.max = globalAudio.duration;
                  if (durLabel) durLabel.textContent = formatTime(globalAudio.duration);
                }
              });

              globalAudio.addEventListener('play', () => syncActiveCardUi());
              globalAudio.addEventListener('pause', () => syncActiveCardUi());
              globalAudio.addEventListener('ended', () => {
                const finishedId = activeCardId;
                activeCardId = null;
                syncActiveCardUi();
                if (finishedId) {
                  const slider = document.getElementById('seek-' + finishedId);
                  const curLabel = document.getElementById('time-cur-' + finishedId);
                  if (slider) slider.value = 0;
                  if (curLabel) curLabel.textContent = '0:00';
                }
              });

              globalAudio.addEventListener('error', () => {
                // If local stream proxy fails and we have a direct R2 fileUrl fallback, switch seamlessly
                if (activeCardId && activeFallbackUrl && globalAudio.src !== activeFallbackUrl) {
                  const fb = activeFallbackUrl;
                  activeFallbackUrl = '';
                  globalAudio.src = fb;
                  globalAudio.play().catch(() => {});
                }
              });

              function stopAllAudio() {
                activeCardId = null;
                try {
                  globalAudio.pause();
                  globalAudio.currentTime = 0;
                } catch (e) {}
                syncActiveCardUi();
              }

              async function togglePlayAudio(id, streamUrl, directR2Url = '') {
                // Same track clicked -> toggle play/pause cleanly
                if (activeCardId === id) {
                  if (!globalAudio.paused) {
                    globalAudio.pause();
                    syncActiveCardUi();
                    return;
                  }
                  try {
                    await globalAudio.play();
                    syncActiveCardUi();
                  } catch (err) {
                    if (err.name !== 'AbortError' && !/interrupted by a call to pause|removed from the document/i.test(err.message || '')) {
                      showToast('Playback notice: ' + err.message, true);
                    }
                  }
                  return;
                }

                // Switching to a new track
                try { globalAudio.pause(); } catch (e) {}
                activeCardId = id;
                activeStreamUrl = streamUrl;
                activeFallbackUrl = directR2Url || '';
                globalAudio.src = streamUrl;
                globalAudio.currentTime = 0;
                syncActiveCardUi();

                try {
                  await globalAudio.play();
                  syncActiveCardUi();
                } catch (err) {
                  // Ignore harmless AbortError when user clicks another button while loading
                  if (err.name === 'AbortError' || /interrupted by a call to pause|removed from the document/i.test(err.message || '')) {
                    return;
                  }
                  if (activeFallbackUrl) {
                    try {
                      globalAudio.src = activeFallbackUrl;
                      activeFallbackUrl = '';
                      await globalAudio.play();
                      syncActiveCardUi();
                      return;
                    } catch (err2) {}
                  }
                  showToast('Could not play audio: ' + err.message, true);
                }
              }

              function onAudioSeek(id, val) {
                if (activeCardId === id && globalAudio.duration) {
                  globalAudio.currentTime = parseFloat(val);
                }
              }

              async function deleteAudioItem(id) {
                const item = allAudios.find(a => a.id === id);
                if (!item) return;
                if (!confirm(`Delete "${item.title}" permanently from Firebase (${item.dbName}) & R2 storage?`)) return;

                try {
                  if (activeCardId === id) stopAllAudio();
                  const res = await fetch('/api/delete-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      id: item.id,
                      dbName: item.dbName,
                      firebaseKey: item.firebaseKey,
                      fileUrl: item.fileUrl || '',
                      keys: item.keys || []
                    })
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Delete failed');
                  allAudios = allAudios.filter(a => a.id !== id);
                  renderAudioGrid();
                  showToast(data.r2Deleted ? `Deleted "${item.title}" from Firebase & R2` : `Deleted "${item.title}" from Firebase & queue`);
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              function openEditModal(id) {
                const item = allAudios.find(a => a.id === id);
                if (!item) return;
                document.getElementById('editItemId').value = item.id;
                document.getElementById('editTitle').value = item.title || '';
                document.getElementById('editCategory').value = item.category || 'OTHER';
                document.getElementById('editTags').value = item.tags || '';
                document.getElementById('editDescription').value = item.description || '';
                document.getElementById('editModal').classList.add('open');
              }

              function closeEditModal() {
                document.getElementById('editModal').classList.remove('open');
              }

              async function saveMetadataEdit() {
                const id = document.getElementById('editItemId').value;
                const item = allAudios.find(a => a.id === id);
                if (!item) return;

                const payload = {
                  id: item.id,
                  dbName: item.dbName,
                  firebaseKey: item.firebaseKey,
                  keys: item.keys || [],
                  title: document.getElementById('editTitle').value.trim(),
                  category: document.getElementById('editCategory').value,
                  tags: document.getElementById('editTags').value.trim(),
                  description: document.getElementById('editDescription').value.trim()
                };

                try {
                  const res = await fetch('/api/update-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error || 'Update failed');
                  Object.assign(item, {
                    title: payload.title,
                    category: payload.category,
                    tags: payload.tags,
                    description: payload.description
                  });
                  closeEditModal();
                  renderAudioGrid();
                  showToast(`Updated metadata for "${payload.title}"`);
                } catch (e) {
                  showToast(e.message, true);
                }
              }

              function renderAudioGrid() {
                const grid = document.getElementById('audioGrid');
                const q = (document.getElementById('searchFilter').value || '').toLowerCase().trim();
                const dbF = document.getElementById('dbFilter').value;
                const catF = document.getElementById('catFilter').value;

                const newCount = allAudios.filter(a => !!a.isNewSession).length;
                const oldCount = allAudios.filter(a => !a.isNewSession).length;
                const elNew = document.getElementById('countNewBadge');
                const elOld = document.getElementById('countOldBadge');
                const elAll = document.getElementById('countAllBadge');
                if (elNew) elNew.textContent = newCount;
                if (elOld) elOld.textContent = oldCount;
                if (elAll) elAll.textContent = allAudios.length;

                const filtered = allAudios.filter(item => {
                  if (libraryViewMode === 'NEW' && !item.isNewSession) return false;
                  if (libraryViewMode === 'OLD' && item.isNewSession) return false;
                  if (dbF !== 'ALL' && item.dbName !== dbF) return false;
                  if (catF !== 'ALL' && item.category !== catF) return false;
                  if (q) {
                    const hay = `${item.title || ''} ${item.tags || ''} ${item.enhancedPrompt || ''} ${item.prompt || ''} ${item.category || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                  }
                  return true;
                });

                document.getElementById('audioCountBadge').textContent = `${filtered.length} Shown (${newCount} New / ${oldCount} Old)`;

                if (!filtered.length) {
                  const emptyMsg = libraryViewMode === 'NEW'
                    ? `No new ringtones generated in this session yet. Enter prompts on the left and click Generate Audio Batch (or switch to "Old Firebase Queue (${oldCount})" above to browse older tones).`
                    : `No matching ringtones found for current filter.`;
                  grid.innerHTML = `
                    <div class="empty-state">
                      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
                      <div style="max-width:460px;">${escapeHtml(emptyMsg)}</div>
                    </div>`;
                  return;
                }

                grid.innerHTML = filtered.map(item => {
                  const streamUrl = `/api/audio-stream?id=${encodeURIComponent(item.id)}&url=${encodeURIComponent(item.fileUrl || '')}`;
                  const tags = String(item.tags || '').split(',').map(t => t.trim()).filter(Boolean);
