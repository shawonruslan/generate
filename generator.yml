            const asmr = ['Keyboard Typing', 'Paper Turning Pages', 'Rain on Window', 'Whispering Voice', 'Sand Pouring', 'Crunching Leaves', 'Hair Brushing', 'Soft Tapping', 'Coffee Brewing', 'Crackling Fireplace'];
            const epic = ['Orchestral Battle March', 'Choir of Warriors', 'Dragon Theme', 'Kingdom Rising', 'Final Boss Theme', 'Hero Transformation', 'Galaxy Explosion', 'Ancient Gods Awakening', 'Legendary Sword Unsheathing', 'Apocalypse Dawn'];
            const urban = ['City Traffic Jazz', 'Subway Beat', 'Hip-Hop Street', 'Breakbeat Alley', 'Night Club Bass', 'Graffiti Art Funk', 'Skyscraper Wind', 'Street Vendor Rhythm', 'Neon Market', 'Urban Jungle Groove'];
            const structures = ['a catchy 3-note hook that repeats continuously', 'a rising build that stays full and bright through the entire track', 'a lively call-and-response between two contrasting instruments', 'a tight seamless loop with a steady rhythmic groove from start to end', 'an immediate melodic intro that stays energetic all the way through', 'a punchy repeating motif with full sustained energy', 'a playful question-answer melody with continuous rhythm', 'a hypnotic repeating groove with crisp accents throughout'];
            const productions = ['warm analog studio polish', 'crisp modern cinematic production', 'intimate close-mic organic recording', 'lush layered stereo depth', 'punchy radio-ready mix', 'airy minimalist production with real room ambience'];
            const tempos = ['90 BPM relaxed groove', '108 BPM mid-tempo groove', '120 BPM upbeat and bouncy', '128 BPM energetic pulse', '80 BPM slow and spacious'];

            const THEME_BUILDERS = {
              Musical:    () => `Style: ${pickFresh(genres, 'genres')} | Lead: ${pickFresh(instruments, 'instruments')} | Mood: ${pickFresh(moods, 'moods')}`,
              Animal:     () => `Type: Animal Sound (Musical Translation) | Focus: ${pickFresh(animals, 'animals')} | Mood: ${pickFresh(moods, 'moods')}`,
              Comedy:     () => `Type: Comedy/Funny | Sound: ${pickFresh(comedy, 'comedy')} | Character: ${pickFresh(moods, 'moods')}`,
              SciFi:      () => `Type: Sci-Fi / Futuristic | Element: ${pickFresh(sciFi, 'sciFi')} | Vibe: ${pickFresh(moods, 'moods')}`,
              Situation:  () => `Purpose: ${pickFresh(situations, 'situations')} | Atmosphere: ${pickFresh(moods, 'moods')}`,
              SmartTopic: () => `Creative Topic: ${pickFresh(adjectives, 'adjectives')} ${pickFresh(topics, 'topics')} ${pickFresh(actions, 'actions')}`,
              Horror:     () => `Type: Horror/Suspense | Sound: ${pickFresh(horror, 'horror')} | Mood: ${pickFresh(moods, 'moods')}`,
              Sports:     () => `Type: Sports/Action | Sound: ${pickFresh(sports, 'sports')} | Energy: ${pickFresh(moods, 'moods')}`,
              Romance:    () => `Type: Romantic/Emotional | Theme: ${pickFresh(romance, 'romance')} | Mood: ${pickFresh(moods, 'moods')}`,
              Cultural:   () => `Type: World/Cultural Music | Style: ${pickFresh(cultural, 'cultural')} | Mood: ${pickFresh(moods, 'moods')}`,
              Kids:       () => `Type: Children/Playful | Theme: ${pickFresh(kids, 'kids')} | Mood: Joyful and Energetic`,
              ASMR:       () => `Type: ASMR/Relaxing Sounds | Sound: ${pickFresh(asmr, 'asmr')} | Texture: Ultra HD, highly detailed`,
              Epic:       () => `Type: Epic/Cinematic | Theme: ${pickFresh(epic, 'epic')} | Scale: Grand and Powerful`,
              Urban:      () => `Type: Urban/Street | Vibe: ${pickFresh(urban, 'urban')} | Mood: ${pickFresh(moods, 'moods')}`,
              Nature:     () => `Type: Nature Soundscape | Element: ${pickFresh(nature, 'nature')} | Intensity: High`
            };

            const selectedPath = drawPath(Object.keys(THEME_BUILDERS));
            const mandatoryTheme = THEME_BUILDERS[selectedPath]();
            const chosenGenre = (cfg.genre && cfg.genre !== 'Auto') ? cfg.genre : `${selectedPath} (${mandatoryTheme})`;
            const chosenInst  = (cfg.instruments && cfg.instruments !== 'Auto') ? cfg.instruments : pickFresh(instruments, 'instruments');
            const chosenMood  = (cfg.mood && cfg.mood !== 'Auto') ? cfg.mood : pickFresh(moods, 'moods');
            const chosenBpm   = (cfg.bpm && cfg.bpm !== 'Auto') ? `${cfg.bpm} BPM` : tempos[Math.floor(Math.random() * tempos.length)];
            const chosenKey   = (cfg.musicalKey && cfg.musicalKey !== 'Auto') ? cfg.musicalKey : 'Clean Harmonic Major/Minor Key';
            const chosenStruct = (cfg.structure && cfg.structure !== 'Auto') ? cfg.structure : structures[Math.floor(Math.random() * structures.length)];
            const chosenProd   = cfg.production || productions[Math.floor(Math.random() * productions.length)];
            const negPrompt    = cfg.negativePrompt || DEFAULT_NEGATIVE_PROMPT;
            const bannedWords  = cfg.bannedWords || DEFAULT_BANNED_WORDS;
            const validCategories = VALID_RT_CATS.filter(c => c !== 'OTHER').join(', ');
            const randomSalt = Math.random().toString(36).substring(7);

            const craftRules = isShort
              ? `CRAFT RULES for a premium NOTIFICATION sound (${durSec}s):\n` +
                `- Design ONE memorable 2-4 note motif with a clean, bright attack and a smooth natural decay.\n` +
                `- Pleasant to hear 100 times a day: no harsh, shrill, or startling frequencies.\n` +
                `- ZERO IMITATION: Never imitate default iPhone, Samsung, Nokia, or Pixel tones.\n` +
                `- Name the real instrument (${chosenInst}), exact articulation (plucked, struck, warm chime), and decay feel.`
              : `CRAFT RULES for a chart-topping RINGTONE (${durSec}s):\n` +
                `- The melodic hook must be instantly recognizable within the FIRST 2 SECONDS.\n` +
                `- Clear, musical melody at ${chosenBpm} featuring ${chosenInst} in ${chosenKey}.\n` +
                `- ZERO IMITATION: Never imitate stock phone ringtones from Apple, Samsung, Nokia, or Motorola.\n` +
                `- CRITICAL FULL DURATION: Music MUST start immediately at 0.0s and stay active continuously for the ENTIRE ${durSec}s — NO silent intro, NO early fade-out, NO trailing silence.\n` +
                `- Must cut through on a phone speaker (strong clear mids, crisp highs, no muddy sub-bass).`;

            const RENDERER_RULES = `AUDIO RENDERER FACTS (the ENHANCED_PROMPT is sent to Stable Audio 2.5 text-to-music model for ${durSec}s):\n` +
              `- Renders musical instruments, genres, rhythm, BPM, harmony, and studio textures with high fidelity.\n` +
              `- Cannot render realistic human speech, lyrics, or raw unmusical foley — always translate concepts into musical instruments.\n` +
              `- TITLE, KEYWORDS and DESCRIPTION must describe ONLY what the ENHANCED_PROMPT literally sounds like.`;

            const noveltyBlock = RECENT_CONCEPTS.length > 0
              ? `ALREADY GENERATED IN THIS SESSION (make your new concept completely distinct):\n` +
                RECENT_CONCEPTS.map((c, i) => `${i + 1}. ${c}`).join('\n') + '\n'
              : '';

            const ideaBlock = prompt
              ? `User Prompt Idea: "${prompt}"\nRewrite and enrich this idea into a vivid, studio-grade 25-to-35-word text-to-music prompt incorporating the Featured Instruments (${chosenInst}), Tempo (${chosenBpm}), Mood (${chosenMood}), Key (${chosenKey}), and Production (${chosenProd}). [Salt: ${randomSalt}]`
              : `Invent a fresh, sellable 25-to-35-word text-to-music prompt for a ${soundTypeLabel} featuring ${chosenInst} in a ${chosenGenre} style with a ${chosenMood} mood at ${chosenBpm} in ${chosenKey}, built around ${chosenStruct} with ${chosenProd}.\n${noveltyBlock}[Salt: ${randomSalt}]`;

            const template = (cfg.masterPrompt && cfg.masterPrompt.trim()) ? cfg.masterPrompt : DEFAULT_MASTER_PROMPT;
            const finalGeminiPrompt = template
              .replace(/\{\{ZEDGE_POLICY_RULES\}\}/g, ZEDGE_POLICY_RULES)
              .replace(/\{\{RENDERER_RULES\}\}/g, RENDERER_RULES)
              .replace(/\{\{CRAFT_RULES\}\}/g, craftRules)
              .replace(/\{\{SOUND_TYPE\}\}/g, soundTypeLabel)
              .replace(/\{\{DURATION\}\}/g, String(durSec))
              .replace(/\{\{BPM\}\}/g, String(chosenBpm))
              .replace(/\{\{INSTRUMENTS\}\}/g, String(chosenInst))
              .replace(/\{\{GENRE\}\}/g, String(chosenGenre))
              .replace(/\{\{MOOD\}\}/g, String(chosenMood))
              .replace(/\{\{KEY\}\}/g, String(chosenKey))
              .replace(/\{\{STRUCTURE\}\}/g, String(chosenStruct))
              .replace(/\{\{PRODUCTION\}\}/g, String(chosenProd))
              .replace(/\{\{NEGATIVE_PROMPT\}\}/g, String(negPrompt))
              .replace(/\{\{BANNED_WORDS\}\}/g, String(bannedWords))
              .replace(/\{\{VALID_CATEGORIES\}\}/g, validCategories)
              .replace(/\{\{IDEA\}\}/g, ideaBlock);

            const responseText = await callGeminiRpc(finalGeminiPrompt);

            const getTagValue = (text, tag) => {
              const t = tag.replace(/_/g, '[_ \\-]?');
              const open = new RegExp(`\\[\\s*${t}\\s*\\]\\s*:?`, 'i');
              const m = text.match(open);
              if (!m) return '';
              let rest = text.slice(m.index + m[0].length);
              const close = rest.match(new RegExp(`\\[\\s*\\/\\s*${t}\\s*\\]`, 'i'));
              if (close) rest = rest.slice(0, close.index);
              else {
                const nx = rest.match(/\[\s*\/?\s*(ENHANCED[_ -]?PROMPT|TITLE|KEYWORDS|CATEGORY|DESCRIPTION|POLICY)\s*\]/i);
                if (nx) rest = rest.slice(0, nx.index);
              }
              rest = rest.replace(/\*\*/g, '').replace(/^`+|`+$/g, '').replace(/^\s*:\s*/, '').trim();
              return /^(\.{3}|\u2026)$/.test(rest) ? '' : rest;
            };

            const r0 = getTagValue(responseText, 'ENHANCED_PROMPT');
            const r1 = getTagValue(responseText, 'TITLE');
            const r2 = getTagValue(responseText, 'KEYWORDS');
            const r3 = getTagValue(responseText, 'CATEGORY');
            const r4 = getTagValue(responseText, 'DESCRIPTION');

            const missing = [];
            if (!r0 || r0.split(/\s+/).filter(Boolean).length < 4) missing.push('ENHANCED_PROMPT');
            if (!r1) missing.push('TITLE');
            if (!r2) missing.push('KEYWORDS');
            if (missing.length) {
              throw new Error(`Gemini RPC reply incomplete (missing ${missing.join(', ')}) — regenerating`);
            }

            let enhancedPrompt = r0.replace(/^["']|["']$/g, '').trim();
            if (prompt && cfg.useGeminiEnhancer === false) {
              const extras = [
                chosenInst !== 'Auto' ? chosenInst : '',
                chosenBpm !== 'Auto' ? chosenBpm : '',
                chosenKey !== 'Auto' ? chosenKey : '',
                chosenProd
              ].filter(Boolean).join(', ');
              enhancedPrompt = extras ? `${prompt.trim()}, ${extras}` : prompt.trim();
            }

            const finalTitle = cleanTitle(r1) || (prompt || 'Studio Tone').split(' ').slice(0, 4).join(' ').slice(0, 28);
            const finalTags = cleanKeywords(r2);
            const finalCategory = cleanCategory(r3);
            const finalDesc = cleanDescription(r4) || finalTitle;

            rememberConcept(finalTitle, enhancedPrompt);

            return {
              enhancedPrompt,
              title: finalTitle,
              tags: finalTags,
              category: finalCategory,
              description: finalDesc
            };
          }

          // ─── GENERATE 100% UNIQUE TITLE, TAGS & ULTRA-SHORT DESCRIPTION PER TAKE ───
          async function generateUniqueTakeMetadatas(baseMeta, totalTakes, cfg = {}) {
            const firstClean = {
              ...baseMeta,
              title: cleanTitle(baseMeta.title) || 'Fresh Studio Tone',
              description: cleanDescription(baseMeta.description) || cleanTitle(baseMeta.title).split(' ').slice(0, 3).join(' ')
            };
            if (totalTakes <= 1) return [firstClean];

            const validCategories = VALID_RT_CATS.filter(c => c !== 'OTHER').join(', ');
            const bannedWords = cfg.bannedWords || DEFAULT_BANNED_WORDS;
            const shape = String(cfg.audioShape || STUDIO_CONFIG.audioShape || 'track').toLowerCase();
            const musicalKey = String(cfg.musicalKey || STUDIO_CONFIG.musicalKey || 'Auto').trim();
            const recentTitles = RECENT_CONCEPTS.map(c => c.split(' — ')[0]).filter(Boolean);

            const normalizeKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const wordsOf = (s) => normalizeKey(s).split(' ').filter(w => w.length > 2);
            const tagListOf = (s) => String(s || '').split(',').map(w => w.trim().toLowerCase()).filter(Boolean);

            // Distinct curated vocabulary banks so every take gets genuinely different tags & short descriptions
            const FRESH_TAG_BANKS = [
              ['melodic', 'harmonic', 'crisp', 'bright', 'mellow', 'rhythmic', 'acoustic', 'lush', 'clean', 'vivid', 'smooth', 'uplifting'],
              ['groovy', 'warm', 'airy', 'punchy', 'sparkling', 'dreamy', 'organic', 'velvet', 'bouncy', 'gentle', 'golden', 'radiant'],
              ['cinematic', 'dramatic', 'deep', 'moody', 'mystic', 'shadowy', 'intense', 'bold', 'epic', 'resonant', 'dark', 'haunting'],
              ['playful', 'cheery', 'breezy', 'fresh', 'sunny', 'lively', 'quirky', 'sweet', 'snappy', 'light', 'joyful', 'zippy']
            ];

            const results = [firstClean];
            const usedTitles = new Set([normalizeKey(firstClean.title), ...recentTitles.map(normalizeKey)]);
            const usedDescs  = new Set([normalizeKey(firstClean.description)]);
            const usedDescWords = new Set(wordsOf(firstClean.description));
            const usedTagCounts = new Map();
            for (const t of tagListOf(firstClean.tags)) usedTagCounts.set(t, 1);

            const enforceDistinctTags = (rawTagsStr, takeIdx, category) => {
              const catTag = String(category || '').toLowerCase().replace(/[^a-z]/g, '');
              const incoming = tagListOf(rawTagsStr);
              const picked = [];
              // First take tags that haven't been used in any earlier take
              for (const w of incoming) {
                if (picked.length >= 10) break;
                if (!usedTagCounts.has(w) && !picked.includes(w)) picked.push(w);
              }
              // Allow at most 2 shared core tags (like primary instrument/genre)
              let sharedAdded = 0;
              for (const w of incoming) {
                if (picked.length >= 10 || sharedAdded >= 2) break;
                if (!picked.includes(w)) { picked.push(w); sharedAdded++; }
              }
              // Top up to 8-10 tags with fresh unused descriptors from distinct bank
              const bank = [...FRESH_TAG_BANKS[takeIdx % FRESH_TAG_BANKS.length], ...FRESH_TAG_BANKS[(takeIdx + 1) % FRESH_TAG_BANKS.length]]
                .sort(() => Math.random() - 0.5);
              for (const w of bank) {
                if (picked.length >= 9) break;
                if (!picked.includes(w) && !usedTagCounts.has(w)) picked.push(w);
              }
              if (catTag && catTag !== 'other' && !picked.includes(catTag) && picked.length < 10) {
                picked.unshift(catTag);
              }
              const finalArr = picked.slice(0, 10);
              for (const w of finalArr) usedTagCounts.set(w, (usedTagCounts.get(w) || 0) + 1);
              return finalArr.join(', ');
            };

            const isDescTooSimilar = (desc) => {
              const norm = normalizeKey(desc);
              if (!norm || usedDescs.has(norm)) return true;
              const ws = wordsOf(desc);
              const shared = ws.filter(w => usedDescWords.has(w)).length;
              return ws.length > 0 && shared >= Math.max(2, ws.length);
            };

            for (let attempt = 1; attempt <= 3 && results.length < totalTakes; attempt++) {
              const remaining = totalTakes - results.length;
              const avoidTitlesList = [...usedTitles].slice(-12).join(', ');
              const avoidDescsList  = [...usedDescs].slice(-8).join(', ');
              const avoidTagsList   = [...usedTagCounts.keys()].slice(0, 28).join(', ');

              const multiPrompt = [
                'You are a Zedge marketplace audio metadata expert.',
                `We generated ${totalTakes} separate audio variations. Zedge SUSPENDS accounts if uploads share titles, numbered suffixes (V1/V2/V3/V4/#1/Take 1), similar tag lists, or similar descriptions.`,
                '',
                ZEDGE_POLICY_RULES,
                '',
                'AUDIO CONCEPT:',
                `- Prompt: ${baseMeta.enhancedPrompt}`,
                `- Shape: ${shape} | Key: ${musicalKey} | Primary Category: ${baseMeta.category}`,
                `- ALREADY USED TITLES (ZERO overlap allowed): ${avoidTitlesList}`,
                `- ALREADY USED DESCRIPTIONS (ZERO overlap allowed): ${avoidDescsList}`,
                `- ALREADY USED TAGS (AVOID repeating these — invent fresh synonyms, moods, textures, instruments): ${avoidTagsList}`,
                '',
                `TASK: Return ONLY a valid JSON array with EXACTLY ${remaining} objects. Each object MUST have completely different "title", "keywords", "category", and "description":`,
                `- "title": Unique creative 2-3 word title (max 25 chars). NO numbers, NO V1/V2/V3/V4, NO banned words (${bannedWords}).`,
                '- "keywords": 8-10 SINGLE-WORD comma-separated tags that are DIFFERENT from the already used tags above.',
                `- "category": ONE exact value from: ${validCategories}.`,
                '- "description": ULTRA-SHORT, EXACTLY 2 TO 3 WORDS (max 24 chars), no punctuation, completely different wording from all other descriptions.',
                '',
                'Output ONLY the raw JSON array, e.g.: [{"title":"...","keywords":"w1, w2, ...","category":"...","description":"..."}]'
              ].join('\n');

              try {
                const rawReply = await callGeminiRpc(multiPrompt);
                let parsedItems = [];

                // Primary parse: JSON array
                const jsonMatch = rawReply.match(/\[\s*\{[\s\S]*?\}\s*\]/);
                if (jsonMatch) {
                  try {
                    const arr = JSON.parse(jsonMatch[0]);
                    if (Array.isArray(arr)) parsedItems = arr;
                  } catch {}
                }

                // Secondary fallback parse: [SET_N] or tagged blocks
                if (!parsedItems.length) {
                  const blocks = rawReply.split(/\[\s*SET_\d+\s*\]/i).slice(1);
                  for (const b of blocks) {
                    const getF = (tag) => {
                      const m = b.match(new RegExp(`\\[\\s*${tag}\\s*\\]\\s*:?([\\s\\S]*?)(?:\\[\\s*\\/\\s*${tag}\\s*\\]|\\[|$)`, 'i'));
                      return m ? m[1].trim() : '';
                    };
                    parsedItems.push({
                      title: getF('TITLE'),
                      keywords: getF('KEYWORDS'),
                      category: getF('CATEGORY'),
                      description: getF('DESCRIPTION')
                    });
                  }
                }

                for (const item of parsedItems) {
                  if (results.length >= totalTakes) break;
                  const tTitle = cleanTitle(item?.title || '');
                  const tTags  = cleanKeywords(Array.isArray(item?.keywords) ? item.keywords.join(', ') : (item?.keywords || item?.tags || ''));
                  const tCat   = cleanCategory(item?.category || baseMeta.category);
                  const tDesc  = cleanDescription(item?.description || '');
                  if (!tTitle || tTitle.length < 3 || !tTags || !tDesc) continue;

                  const normT = normalizeKey(tTitle);
                  if (usedTitles.has(normT) || isDescTooSimilar(tDesc)) continue;

                  const checked = zedgeEnforce({
                    enhancedPrompt: baseMeta.enhancedPrompt,
                    title: tTitle,
                    tags: tTags,
                    category: tCat,
                    description: tDesc
                  }, 'audio');
                  if (checked.issues.length) continue;

                  const distinctTags = enforceDistinctTags(checked.meta.tags, results.length, checked.meta.category);
                  const finalTakeMeta = { ...checked.meta, tags: distinctTags };
                  usedTitles.add(normT);
                  usedDescs.add(normalizeKey(finalTakeMeta.description));
                  wordsOf(finalTakeMeta.description).forEach(w => usedDescWords.add(w));
                  rememberConcept(finalTakeMeta.title, baseMeta.enhancedPrompt);
                  results.push(finalTakeMeta);
                }
              } catch (e) {
                console.warn(`  Unique take metadata batch attempt ${attempt}/3 failed: ${e.message}`);
              }
            }

            // Deterministic zero-duplicate fallback if any slot still missing
            const fallbackAdjs  = ['Velvet', 'Golden', 'Silver', 'Amber', 'Crimson', 'Cobalt', 'Misty', 'Solar', 'Lunar', 'Coral', 'Ivory', 'Emerald', 'Saffron', 'Indigo', 'Obsidian', 'Scarlet'];
            const fallbackNouns = ['Horizon', 'Breeze', 'Cascade', 'Mirage', 'Meadow', 'Lantern', 'Ripple', 'Drift', 'Bloom', 'Spark', 'Cadence', 'Whisper', 'Glimmer', 'Chime', 'Prism', 'Ember'];
            const fallbackDescPairs = [
              'Warm melodic motif', 'Crisp rhythmic groove', 'Lush acoustic harmony', 'Bright gentle cadence',
              'Smooth midnight pulse', 'Airy sunlit chime', 'Deep resonant pluck', 'Lively modern tune',
              'Soft dreamy phrase', 'Bold vibrant rhythm', 'Calm twilight tone', 'Fresh punchy hook'
            ];

            while (results.length < totalTakes) {
              const slotIdx = results.length;
              let fbTitle = '';
              for (let tries = 0; tries < 30; tries++) {
                const a = fallbackAdjs[Math.floor(Math.random() * fallbackAdjs.length)];
                const n = fallbackNouns[Math.floor(Math.random() * fallbackNouns.length)];
                const cand = `${a} ${n}`;
                if (!usedTitles.has(normalizeKey(cand))) { fbTitle = cand; break; }
              }
              if (!fbTitle) fbTitle = `Studio Motif ${Math.random().toString(36).slice(2, 5).toUpperCase()}`;

              let fbDesc = '';
              for (const candRaw of [...fallbackDescPairs].sort(() => Math.random() - 0.5)) {
                const cand = cleanDescription(candRaw);
                if (!isDescTooSimilar(cand)) { fbDesc = cand; break; }
              }
              if (!fbDesc) fbDesc = cleanDescription(fbTitle);

              const distinctTags = enforceDistinctTags(FRESH_TAG_BANKS[slotIdx % FRESH_TAG_BANKS.length].join(', '), slotIdx, baseMeta.category);
              const checked = zedgeEnforce({
                enhancedPrompt: baseMeta.enhancedPrompt,
                title: fbTitle,
                tags: distinctTags,
                category: baseMeta.category,
                description: fbDesc
              }, 'audio');

              usedTitles.add(normalizeKey(checked.meta.title));
              usedDescs.add(normalizeKey(checked.meta.description));
              wordsOf(checked.meta.description).forEach(w => usedDescWords.add(w));
              rememberConcept(checked.meta.title, baseMeta.enhancedPrompt);
              results.push(checked.meta);
            }

            results.forEach((m, idx) => {
              console.log(`    [Take ${idx + 1}/${results.length}] Title: "${m.title}" | Desc: "${m.description}" | Tags: ${m.tags}`);
            });
            return results;
          }

