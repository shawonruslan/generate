          function parseExplicitBpm(rawBpm) {
            if (rawBpm == null || String(rawBpm).toLowerCase() === 'auto') return null;
            const n = parseInt(String(rawBpm), 10);
            return (Number.isFinite(n) && n >= 40 && n <= 240) ? n : null;
          }

          function buildStableAudioPrompt(basePrompt, opts = {}) {
            let p = String(basePrompt || '').trim().replace(/\.+$/, '').trim();
            const shape = String(opts.audioShape || STUDIO_CONFIG.audioShape || 'track').toLowerCase();
            const key = String(opts.musicalKey || STUDIO_CONFIG.musicalKey || 'Auto').trim();
            const bpmNum = parseExplicitBpm(opts.bpm ?? STUDIO_CONFIG.bpm);

            // Force user's exact selected BPM (strip any conflicting BPM Gemini wrote)
            if (bpmNum) {
              p = p.replace(/,?\s*(?:at\s+)?\b\d{2,3}\s*bpm\b/gi, '').replace(/\s{2,}/g, ' ').replace(/,\s*,/g, ',').trim();
              p += `, ${bpmNum} BPM`;
            }
            if (shape !== 'oneshot' && !/continuous|full length/i.test(p)) {
              p += ', continuous full-length music with no silence';
            }
            if (shape === 'loop' && !/\bloop\b/i.test(p)) {
              p += ', loop';
            } else if (shape === 'oneshot' && !/\bone[- ]?shot\b/i.test(p)) {
              p += ', one-shot';
            }
            if (key && key !== 'Auto' && !new RegExp(`\\bin\\s+${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i').test(p)) {
              p += `, in ${key}`;
            }
            return p + '.';
          }

          async function generateStableAudio(prompt, lengthSeconds, opts = {}, isRetry = false) {
            const targetDurSec = Math.max(1, Math.min(60, parseInt(lengthSeconds, 10) || 20));
            const shape = String(opts.audioShape || STUDIO_CONFIG.audioShape || 'track').toLowerCase();
            const trimEnabled = (opts.trimSilence ?? STUDIO_CONFIG.trimSilence ?? true) !== false;
            // Request +4s extra buffer on tracks/loops >= 6s so after trimming trailing silence we still fill the exact target duration!
            const requestDurSec = (trimEnabled && shape === 'track' && targetDurSec >= 6)
              ? Math.min(60, targetDurSec + 1)
              : targetDurSec;

            const musicalKey = String(opts.musicalKey || STUDIO_CONFIG.musicalKey || 'Auto').trim();
            const timeSignature = String(opts.timeSignature || STUDIO_CONFIG.timeSignature || '4/4').trim() || '4/4';
            const bpmNum = parseExplicitBpm(opts.bpm ?? STUDIO_CONFIG.bpm);
            const takesCount = Math.max(1, Math.min(4, parseInt(opts.takesCount ?? STUDIO_CONFIG.takesCount ?? 4, 10) || 4));
            const baseSeed = (opts.seed != null && Number(opts.seed) >= 0)
              ? Math.floor(Number(opts.seed))
              : Math.floor(100000000 + Math.random() * 800000000);

            const finalPrompt = buildStableAudioPrompt(prompt, { ...opts, audioShape: shape, musicalKey, bpm: bpmNum ?? 'Auto' });
            const tracks = [];
            for (let i = 0; i < takesCount; i++) {
              const t = { generation_prompt: finalPrompt, seed: baseSeed + i };
              if (shape === 'oneshot') t.is_oneshot = true;
              tracks.push(t);
            }

            const plan = {
              source: 'generate',
              tracks,
              time_signature: timeSignature
            };
            if (bpmNum) {
              plan.tempo = bpmNum;
            }
            if (musicalKey && musicalKey !== 'Auto') {
              plan.key = musicalKey;
            }

            const payload = {
              plan,
              duration_per_stem: requestDurSec,
              output_format: 'wav',
              quality_preset: 'standard',
              apply_mix: false,
              generation_strategy: 'parallel_t2a'
            };

            if (!isRetry) {
              await ensureStableAudioTokenAndCredits(takesCount);
            }
            console.log(`  Calling Stable Audio Wizard API (${takesCount} tracks | target: ${targetDurSec}s, req: ${requestDurSec}s | BPM: ${bpmNum || 'Auto'} | shape: ${shape} | key: ${musicalKey} | meter: ${timeSignature} | baseSeed: ${baseSeed})...`);

            const res = await fetchWithTimeout(
              `${WIZARD_API_BASE}/compose-from-plan`,
              {
                method: 'POST',
                headers: buildWizardHeaders({
                  'Content-Type': 'application/json',
                  'idempotency-key': crypto.randomUUID()
                }),
                body: JSON.stringify(payload)
              },
              60000
            );

            if (!res.ok) {
              const errText = await res.text().catch(() => '');
              const errLower = errText.toLowerCase();
              const isAuthError = (
                res.status === 401 ||
                res.status === 403 ||
                errLower.includes('unauthorized') ||
                errLower.includes('unable to verify user token') ||
                errLower.includes('token')
              );
              const isLimitError = (
                res.status === 429 ||
                res.status === 402 ||
                (res.status === 400 && (
                  errLower.includes('limit') || errLower.includes('quota') ||
                  errLower.includes('credit') || errLower.includes('rate') ||
                  errLower.includes('exceeded') || errLower.includes('insufficient')
                ))
              );

              if (isAuthError && !isRetry) {
                const refreshed = await refreshStableAudioToken();
                if (refreshed) {
                  return generateStableAudio(prompt, targetDurSec, opts, true);
                }
                console.warn(`  Auth/Token error (${res.status}) & refresh unavailable! Auto-creating fresh 50-credit Stable Audio account...`);
                currentRefreshToken = null;
                currentToken = await createStableAudioAccount();
                STUDIO_STATUS.stableAudioReady = true;
                await fetchStableAudioCredits();
                return generateStableAudio(prompt, targetDurSec, opts, true);
              }
              if (isLimitError && !isRetry) {
                console.warn(`  Credits/Quota exhausted (${res.status})! Auto-creating fresh 50-credit Stable Audio account...`);
                currentRefreshToken = null;
                currentToken = await createStableAudioAccount();
                STUDIO_STATUS.stableAudioReady = true;
                await fetchStableAudioCredits();
                return generateStableAudio(prompt, targetDurSec, opts, true);
              }
              throw new Error(`Stable Audio Wizard API error (${res.status}): ${errText.slice(0, 260)}`);
            }

            const data = await res.json();
            const jobId = data?.job_id;
            if (!jobId) {
              throw new Error(`Stable Audio Wizard returned no job_id: ${JSON.stringify(data).slice(0, 200)}`);
            }
            console.log(`  Wizard job created: ${jobId} (expecting ${takesCount} stems, target ${targetDurSec}s / req ${requestDurSec}s)`);
            return { jobId, baseSeed, finalPrompt, takesCount, durSec: targetDurSec, requestDurSec, bpm: bpmNum, shape, musicalKey, timeSignature };
          }

          async function pollStableAudioResult(jobId) {
            const maxRetries = 90;
            for (let i = 0; i < maxRetries; i++) {
              const stRes = await fetchWithTimeout(
                `${WIZARD_API_BASE}/status/${encodeURIComponent(jobId)}`,
                { headers: buildWizardHeaders({ 'Content-Type': 'application/json' }) },
                30000
              );
              if (!stRes.ok) {
                const errText = await stRes.text().catch(() => '');
                throw new Error(`Wizard status poll failed (${stRes.status}): ${errText.slice(0, 200)}`);
              }
              const st = await stRes.json();
              const status = String(st?.status || '').toLowerCase();
              if (status === 'complete' || status === 'completed') {
                console.log(`  Wizard job ${jobId} complete (${st.stems_completed || 0}/${st.stems_total || 0} stems in ${st.elapsed_seconds || '?'}s)!`);
                break;
              }
              if (status === 'failed' || status === 'error' || status === 'cancelled') {
                throw new Error(`Wizard job failed: ${st.error || status}`);
              }
              if (i === maxRetries - 1) {
                throw new Error('Timed out waiting for Stable Audio Wizard generation (3 minutes).');
              }
              await sleep(2000);
            }

            const resResult = await fetchWithTimeout(
              `${WIZARD_API_BASE}/result/${encodeURIComponent(jobId)}?include_audio=false`,
              { headers: buildWizardHeaders({ 'Content-Type': 'application/json' }) },
              30000
            );
            if (!resResult.ok) {
              const errText = await resResult.text().catch(() => '');
              throw new Error(`Wizard result fetch failed (${resResult.status}): ${errText.slice(0, 200)}`);
            }
            const resultData = await resResult.json();
            const stems = Array.isArray(resultData?.stems) ? resultData.stems : [];
            if (!stems.length) {
              throw new Error('Wizard result returned 0 stems.');
            }
            fetchStableAudioCredits().catch(() => {});
            return stems;
          }

          async function downloadStableAudioStem(jobId, stem) {
            const stemName = stem?.name || 'item-0';
            if (stem?.audio_url && /^https?:\/\//i.test(stem.audio_url)) {
              try {
                const r = await fetchWithTimeout(stem.audio_url, { headers: { 'Accept': 'audio/*, */*' } }, 60000);
                if (r.ok) {
                  const buf = Buffer.from(await r.arrayBuffer());
                  if (buf.length > 1000) return buf;
                }
              } catch {}
            }
            const stemUrl = `${WIZARD_API_BASE}/stems/${encodeURIComponent(jobId)}/${encodeURIComponent(stemName)}`;
            const r2 = await fetchWithTimeout(stemUrl, { headers: buildWizardHeaders({ 'Accept': 'audio/*' }) }, 60000);
            if (!r2.ok) {
              throw new Error(`Stem download failed (${r2.status}) for ${stemName}`);
            }
            const buf = Buffer.from(await r2.arrayBuffer());
            if (buf.length < 1000) throw new Error(`Downloaded stem ${stemName} is too small (${buf.length} bytes)`);
            return buf;
          }

          // ─── FFMPEG AUDIO MASTERING (SILENCE TRIM + NORMALIZE + BOOST + FADES) ─────
          function ffRun(args, timeout = 60000) {
            try {
              return execSync(`"${FFMPEG.bin}" -hide_banner -nostats ${args}`, { timeout, stdio: ['ignore', 'pipe', 'pipe'] }).toString();
            } catch (e) {
              const stderrTail = e.stderr ? e.stderr.toString().trim().split('\n').slice(-5).join(' | ') : '';
              throw new Error(`ffmpeg failed: ${stderrTail || e.message}`);
            }
          }

          function ffMeasure(file) {
            const out = execSync(`"${FFMPEG.bin}" -hide_banner -nostats -i "${file}" -af volumedetect -f null - 2>&1 || true`,
              { timeout: 60000, stdio: ['ignore', 'pipe', 'ignore'] }).toString();
            if (!/max_volume/.test(out)) {
              throw new Error(`ffmpeg measure failed: ${out.trim().split('\n').slice(-3).join(' | ')}`);
            }
            const dur = /Duration:\s*(\d+):(\d+):([\d.]+)/.exec(out);
            const peak = /max_volume:\s*(-?[\d.]+)\s*dB/.exec(out);
            const mean = /mean_volume:\s*(-?[\d.]+)\s*dB/.exec(out);
            return {
              duration: dur ? (+dur[1]) * 3600 + (+dur[2]) * 60 + (+dur[3]) : null,
              peakDb: peak ? parseFloat(peak[1]) : null,
              meanDb: mean ? parseFloat(mean[1]) : null,
            };
          }

          function convertAudioToMp3(inputBuffer, bitrate = '192k') {
            if (!FFMPEG) return inputBuffer;
            const tmpDir = '/tmp/ringtone_proc';
            fs.mkdirSync(tmpDir, { recursive: true });
            const stamp  = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            const tmpIn  = path.join(tmpDir, `raw_${stamp}.wav`);
            const tmpOut = path.join(tmpDir, `raw_${stamp}.mp3`);
            fs.writeFileSync(tmpIn, inputBuffer);
            try {
              ffRun(`-i "${tmpIn}" -ar 44100 -b:a ${bitrate} -y "${tmpOut}"`);
              return fs.readFileSync(tmpOut);
            } finally {
              try { fs.unlinkSync(tmpIn); } catch {}
              try { fs.unlinkSync(tmpOut); } catch {}
            }
          }

          async function autoProcessAudio(inputBuffer, opts = {}) {
            if (!FFMPEG) throw new Error('ffmpeg binary not available');
            const gainFactor       = (parseInt(opts.volumeBoostPct ?? STUDIO_CONFIG.volumeBoostPct ?? 200, 10)) / 100;
            const silenceThreshold = parseFloat(opts.silenceThreshold ?? STUDIO_CONFIG.silenceThreshold ?? 0.004);
            const padSec           = (parseInt(opts.padMs ?? STUDIO_CONFIG.padMs ?? 150, 10)) / 1000;
            const shape            = String(opts.audioShape || STUDIO_CONFIG.audioShape || 'track').toLowerCase();
            const targetDurSec     = Math.max(1, Math.min(60, parseInt(opts.lengthSeconds ?? STUDIO_CONFIG.lengthSeconds ?? 20, 10) || 20));
            const shouldTrim       = (opts.trimSilence ?? STUDIO_CONFIG.trimSilence ?? true) !== false;
            const fadeInSec        = shape === 'loop' ? 0.015 : ((parseInt(opts.fadeInMs ?? STUDIO_CONFIG.fadeInMs ?? 0, 10)) / 1000);
            const rawFadeOutSec    = (parseInt(opts.fadeOutMs ?? STUDIO_CONFIG.fadeOutMs ?? 350, 10)) / 1000;
            const fadeOutSec       = shape === 'loop' ? 0.025 : Math.max(0.25, rawFadeOutSec);
            const bitrate          = opts.bitrate || STUDIO_CONFIG.bitrate || '192k';

            const tmpDir = '/tmp/ringtone_proc';
            fs.mkdirSync(tmpDir, { recursive: true });
            const stamp  = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            const tmpIn  = path.join(tmpDir, `in_${stamp}.wav`);
            const tmpOut = path.join(tmpDir, `out_${stamp}.mp3`);
            fs.writeFileSync(tmpIn, inputBuffer);

            const dbThreshold = 20 * Math.log10(Math.max(silenceThreshold, 0.0005));
            const dbStr = `${dbThreshold.toFixed(1)}dB`;

            try {
              const before = ffMeasure(tmpIn);
              const boostDb = 20 * Math.log10(Math.max(gainFactor, 0.01));
              const normalizeDb = before.peakDb == null ? 0 : Math.min(30, Math.max(0, -1.0 - before.peakDb));
              const totalGainDb = normalizeDb + boostDb;

              const chain = [];
              if (shouldTrim) {
                // Trim dead silence from BOTH start and end, then cap cleanly to exact targetDurSec
                chain.push(
                  `silenceremove=start_periods=1:start_threshold=${dbStr}:start_silence=${padSec}:detection=peak`,
                  `areverse`,
                  `silenceremove=start_periods=1:start_threshold=${dbStr}:start_silence=${padSec}:detection=peak`,
                  `areverse`,
                  `atrim=0:${targetDurSec}`,
                  `asetpts=PTS-STARTPTS`
                );
              }
              if (fadeOutSec > 0.005) {
                chain.push(`areverse`, `afade=t=in:st=0:d=${fadeOutSec.toFixed(3)}`, `areverse`);
              }
              if (fadeInSec > 0.005) {
                chain.push(`afade=t=in:st=0:d=${fadeInSec.toFixed(3)}`);
              }
              chain.push(
                `volume=${totalGainDb.toFixed(2)}dB`,
                `alimiter=limit=0.95:attack=5:release=50:level=false`
              );

              ffRun(`-i "${tmpIn}" -af "${chain.join(',')}" -ar 44100 -b:a ${bitrate} -y "${tmpOut}"`);

              if (!fs.existsSync(tmpOut) || fs.statSync(tmpOut).size < 1000) {
                throw new Error('ffmpeg output empty or too small');
              }

              const after = ffMeasure(tmpOut);
              const outBuf = fs.readFileSync(tmpOut);
              const trimmed = (before.duration != null && after.duration != null) ? Math.max(0, before.duration - after.duration) : null;

              const stats = {
                durationBefore: before.duration != null ? +before.duration.toFixed(2) : null,
                durationAfter:  after.duration  != null ? +after.duration.toFixed(2)  : null,
                trimmedSec:     trimmed != null ? +trimmed.toFixed(2) : null,
                peakBeforeDb:   before.peakDb,
                peakAfterDb:    after.peakDb,
                meanBeforeDb:   before.meanDb,
                meanAfterDb:    after.meanDb,
                gainDb:         +totalGainDb.toFixed(2),
                normalizeDb:    +normalizeDb.toFixed(2),
                boostDb:        +boostDb.toFixed(2),
                boostPct:       Math.round(gainFactor * 100),
                silenceThreshold,
                padMs:          Math.round(padSec * 1000),
                ffmpeg:         FFMPEG.version,
              };
              console.log(`  Mastered: ${stats.durationBefore}s -> ${stats.durationAfter}s | peak ${stats.peakBeforeDb}dB -> ${stats.peakAfterDb}dB`);
              return { buffer: outBuf, stats };
            } finally {
              try { fs.unlinkSync(tmpIn); } catch {}
              try { fs.unlinkSync(tmpOut); } catch {}
            }
          }

          // ─── FIREBASE & R2 CRUD HELPERS ────────────────────────────────────────────
          async function firebasePushToUrl(dbUrl, queuePath, data) {
            const res = await fetch(`${dbUrl}/${queuePath}.json`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase push failed (${res.status}): ${err.slice(0, 200)}`);
            }
            const result = await res.json();
            return result.name;
          }

          async function firebaseDeleteFromUrl(dbUrl, queuePath, key) {
            const res = await fetch(`${dbUrl}/${queuePath}/${key}.json`, { method: 'DELETE' });
            if (!res.ok) {
              const err = await res.text().catch(() => '');
              throw new Error(`Firebase DELETE failed (${res.status}): ${err.slice(0, 160)}`);
            }
            return true;
          }

          async function firebasePatchToUrl(dbUrl, queuePath, key, patchData) {
            const res = await fetch(`${dbUrl}/${queuePath}/${key}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(patchData)
            });
            if (!res.ok) {
              const err = await res.text().catch(() => '');
              throw new Error(`Firebase PATCH failed (${res.status}): ${err.slice(0, 160)}`);
            }
            return res.json();
          }

          async function uploadToR2(audioBuffer, fileName, dbName) {
            const cleanedName = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
            const destinationKey = `${String(dbName).replace(/^zedge_?/i, 'zedge')}/ringtone/${Date.now()}_${cleanedName}`;
            const response = await fetch(R2_WORKER_URL, {
              method: 'POST',
              headers: {
                'X-File-Name': destinationKey,
                'X-File-Type': 'audio/mpeg'
              },
              body: audioBuffer
            });
            if (!response.ok) {
              const body = await response.text().catch(() => '');
              throw new Error(`R2 upload failed (HTTP ${response.status}): ${body || response.statusText}`);
            }
            const data = await response.json();
            if (!data.url) throw new Error(`R2 worker response missing 'url' field`);
            return data.url;
          }

          async function deleteFromR2(fileUrl) {
            const url = String(fileUrl || '').trim();
            if (!url) return { ok: false, skipped: true, reason: 'missing_url' };
            if (!R2_WORKER_URL) return { ok: false, skipped: true, reason: 'missing_worker_url' };
            const isR2Url = url.includes('.r2.dev/') || url.startsWith(R2_WORKER_URL.replace(/\/+$/, ''));
            if (!isR2Url) return { ok: false, skipped: true, reason: 'non_r2_url' };
            const response = await fetchWithTimeout(R2_WORKER_URL, {
              method: 'DELETE',
              headers: {
                'Content-Type': 'application/json',
                'X-R2-Delete-Protocol': 'r2-delete-v1'
              },
              body: JSON.stringify({ url })
            }, 15000);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok !== true || body.absent !== true) {
              throw new Error(body.error || `R2 delete failed (HTTP ${response.status})`);
            }
            return body;
          }

          function generateFilename(title, dbName) {
            if (dbName === 'zedge_1') {
              const smashes = ['asdf', 'asdfg', 'qwerty', 'hjkl', 'lkjh', 'qwer', 'zxcv', 'test', 'new', 'audio', 'untitled', 'file', 'rec', 'my'];
              let name = smashes[Math.floor(Math.random() * smashes.length)] + Math.floor(Math.random() * 999);
              return `${name}.mp3`;
            } else if (dbName === 'zedge_2') {
              const prefixes = ['my', 'cool', 'new', 'best', 'fav', 'top', 'great', 'nice', 'saved', 'ringtone', 'tone', 'sound', 'audio'];
              const midWords = ['ring', 'tone', 'beat', 'track', 'song', 'clip', 'tune', 'sound', 'mix', 'edit'];
              const suffixes = ['v1', 'v2', 'final', 'new', 'copy', 'edit', '2', '3', '1', 'hd'];
              return `${prefixes[Math.floor(Math.random() * prefixes.length)]}_${midWords[Math.floor(Math.random() * midWords.length)]}_${suffixes[Math.floor(Math.random() * suffixes.length)]}.mp3`;
            } else if (dbName === 'zedge_3') {
              return `audio_${Math.floor(Math.random() * 90000) + 10000}.mp3`;
            } else if (dbName === 'zedge_4') {
              const words = ['Ringtone', 'Tone', 'Sound', 'Alarm', 'Notification', 'Melody', 'Beat', 'Loop', 'Alert', 'Chime'];
              const tags = ['HD', 'New', 'Best', 'Original', 'Clean'];
              return `${words[Math.floor(Math.random() * words.length)]}-${tags[Math.floor(Math.random() * tags.length)]}-${Math.floor(Math.random() * 99) + 1}.mp3`;
            }
            return `tone_${Date.now()}.mp3`;
          }

          // ─── STUDIO STATE & GENERATED AUDIOS STORE ─────────────────────────────────
          const STUDIO_AUDIOS = []; // Newest first
          const STUDIO_STATUS = {
            isGenerating: false,
            stopRequested: false,
            currentTask: 'Ready',
            completed: 0,
            total: 0,
            geminiReady: false,
            geminiUser: 0,
            stableAudioReady: false,
            tryCloudflareUrl: process.env.TRYCLOUDFLARE_URL || ''
          };

          async function syncFirebaseRingtones() {
            const existingIds = new Set(STUDIO_AUDIOS.map(a => `${a.dbName}:${a.firebaseKey}`));
            for (const [dbName, dbUrl] of Object.entries(FIREBASE_DB_MAP)) {
              try {
                const res = await fetchWithTimeout(`${dbUrl}/${QUEUE_PATH}.json`, {}, 25000);
                if (!res.ok) continue;
                const data = await res.json();
                if (!data || typeof data !== 'object') continue;
                for (const [key, rec] of Object.entries(data)) {
                  if (!rec || typeof rec !== 'object') continue;
                  const isRingtone = rec.isMp3 === true || String(rec.contentType || '').toUpperCase() === 'RINGTONE' || String(rec.type || '').startsWith('audio/');
                  if (!isRingtone) continue;
                  const compound = `${dbName}:${key}`;
                  if (existingIds.has(compound)) continue;
                  existingIds.add(compound);
                  STUDIO_AUDIOS.push({
                    id: `${dbName}_${key}`,
                    dbName,
                    firebaseKey: key,
                    keys: [{ dbName, key }],
                    title: rec.title || rec.name || 'Ringtone',
                    tags: rec.tags || '',
                    category: rec.category || 'OTHER',
                    description: rec.description || '',
                    prompt: rec.prompt || '',
                    enhancedPrompt: rec.enhancedPrompt || rec.prompt || '',
                    fileUrl: rec.fileUrl || '',
                    audioSeed: rec.audioSeed ?? null,
                    processed: !!rec.processed,
                    processing: rec.processing || null,
                    isNewSession: false,
                    createdAt: rec.createdAt || 0
                  });
                }
              } catch (e) {
                console.warn(`  Firebase sync notice (${dbName}): ${e.message}`);
              }
            }
            STUDIO_AUDIOS.sort((a, b) => (b.isNewSession ? 1 : 0) - (a.isNewSession ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0));
          }

          // ─── GENERATE ALL TAKES (UP TO 4 TRACKS PER PROMPT) & PUSH TO FIREBASE ────
          async function generateAndPushOne(prompt, dbTarget, opts = {}) {
            const cfg = { ...STUDIO_CONFIG, ...opts };
            const durSec = Math.max(1, Math.min(60, parseInt(cfg.lengthSeconds || INITIAL_LENGTH_SEC, 10) || 20));
            const shape = String(cfg.audioShape || 'track').toLowerCase();
            const musicalKey = String(cfg.musicalKey || 'Auto').trim();
            const timeSignature = String(cfg.timeSignature || '4/4').trim();
            const takesCount = Math.max(1, Math.min(4, parseInt(cfg.takesCount ?? 4, 10) || 4));

            if (prompt) {
              const pi = zedgePolicyIssues({ title: prompt });
              if (pi.length) throw new Error(`Zedge policy blocked prompt: ${pi.join('; ')}`);
            }

            let meta = null;
            for (let attempt = 1; attempt <= 3 && !meta; attempt++) {
              try {
                STUDIO_STATUS.currentTask = `[${dbTarget.name}] Crafting prompt & metadata via Gemini RPC (try ${attempt}/3)...`;
                const candidate = await generateMetadataFromPrompt(prompt, cfg);
                const check = zedgeEnforce(candidate, 'audio');
                if (check.issues.length) {
                  console.warn(`  [${dbTarget.name}] Zedge policy (attempt ${attempt}/3): ${check.issues.join('; ')} — regenerating`);
                  continue;
                }
                meta = check.meta;
              } catch (e) {
                console.warn(`  [${dbTarget.name}] Metadata attempt ${attempt}/3 failed: ${e.message}`);
              }
            }
            if (!meta) throw new Error('Could not generate policy-compliant metadata after 3 attempts');

            console.log(`  [${dbTarget.name}] Title: "${meta.title}" | Category: ${meta.category} | Shape: ${shape} | Key: ${musicalKey} | Duration: ${durSec}s | Takes: ${takesCount}`);
            STUDIO_STATUS.currentTask = `[${dbTarget.name}] Rendering ${takesCount} tracks for "${meta.title}" (${durSec}s, ${shape}) via Stable Audio Wizard...`;

            const jobInfo = await generateStableAudio(meta.enhancedPrompt, durSec, cfg);
            const stems = await pollStableAudioResult(jobInfo.jobId);
            const totalTakes = stems.length;

            STUDIO_STATUS.currentTask = `[${dbTarget.name}] Creating ${totalTakes} unique Zedge titles, tags & short descriptions...`;
            const takeMetas = await generateUniqueTakeMetadatas(meta, totalTakes, cfg);
            const createdItems = [];

            for (let idx = 0; idx < totalTakes; idx++) {
              if (STUDIO_STATUS.stopRequested) break;
              const stem = stems[idx];
              const takeNum = idx + 1;
              const takeSeed = stem?.generation_settings?.seed ?? (jobInfo.baseSeed + idx);
              const tMeta = takeMetas[idx] || meta;
              const takeTitle = tMeta.title;

              STUDIO_STATUS.currentTask = `[${dbTarget.name}] Downloading Take ${takeNum}/${totalTakes} ("${takeTitle}")...`;
              let audioBuffer = await downloadStableAudioStem(jobInfo.jobId, stem);

              let processed = false;
              let processing = null;
              let processError = null;
              if (cfg.autoProcess !== false && FFMPEG) {
                try {
                  STUDIO_STATUS.currentTask = `[${dbTarget.name}] Mastering Take ${takeNum}/${totalTakes} ("${takeTitle}") with FFmpeg DSP...`;
                  const r = await autoProcessAudio(audioBuffer, { ...cfg, lengthSeconds: durSec });
                  audioBuffer = r.buffer;
                  processing = r.stats;
                  processed = true;
                  audioStats.processed++;
                  if (r.stats.trimmedSec) audioStats.trimmedSec += r.stats.trimmedSec;
                } catch (e) {
                  processError = e.message;
                  audioStats.failed++;
                  if (audioStats.reasons.length < 10) audioStats.reasons.push(`[${dbTarget.name}] ${e.message.slice(0, 160)}`);
                  console.error(`  [${dbTarget.name}] FFmpeg mastering failed on take ${takeNum}, converting WAV->MP3: ${e.message}`);
                  audioBuffer = convertAudioToMp3(audioBuffer, cfg.bitrate || '192k');
                }
              } else if (FFMPEG) {
                audioBuffer = convertAudioToMp3(audioBuffer, cfg.bitrate || '192k');
              }

              STUDIO_STATUS.currentTask = `[${dbTarget.name}] Uploading Take ${takeNum}/${totalTakes} ("${takeTitle}") to R2 & Firebase...`;
              const fileName = generateFilename(takeTitle, dbTarget.name);
              const fileUrl = await uploadToR2(audioBuffer, fileName, dbTarget.name);

              const createdAt = Date.now();
              const key = await firebasePushToUrl(dbTarget.url, QUEUE_PATH, {
                name: fileName,
                type: 'audio/mpeg',
                size: audioBuffer.length,
                width: null,
                height: null,
                isMp3: true,
                contentType: 'RINGTONE',
                fileUrl,
                title: takeTitle,
                tags: tMeta.tags,
                category: tMeta.category,
                description: tMeta.description,
                policyCheck: 'passed',
                policyCheckedAt: createdAt,
                status: 'queued',
                prompt: prompt || meta.enhancedPrompt,
                enhancedPrompt: jobInfo.finalPrompt,
                negativePrompt: cfg.negativePrompt || '',
                audioSeed: takeSeed,
                audioModel: 'stable-audio-wizard',
                audioShape: shape,
                musicalKey,
                timeSignature,
                lengthSeconds: stem?.duration_seconds || durSec,
                takeIndex: takeNum,
                takesTotal: totalTakes,
                wizardJobId: jobInfo.jobId,
                autoProcess: cfg.autoProcess !== false,
                processed,
                processing,
                processError,
                createdAt
              });

              const itemId = `${dbTarget.name}_${key}`;
              const localPath = path.join(AUDIO_CACHE_DIR, `${itemId}.mp3`);
              try { fs.writeFileSync(localPath, audioBuffer); } catch {}

              const studioItem = {
                id: itemId,
                dbName: dbTarget.name,
                firebaseKey: key,
                keys: [{ dbName: dbTarget.name, key }],
                title: takeTitle,
                tags: tMeta.tags,
                category: tMeta.category,
                description: tMeta.description,
                prompt: prompt || meta.enhancedPrompt,
                enhancedPrompt: jobInfo.finalPrompt,
                fileUrl,
                lengthSeconds: stem?.duration_seconds || durSec,
                audioSeed: takeSeed,
                audioShape: shape,
                musicalKey,
                timeSignature,
                takeIndex: takeNum,
                takesTotal: totalTakes,
                processed,
                processing,
                isNewSession: true,
                createdAt
              };
              STUDIO_AUDIOS.unshift(studioItem);
              createdItems.push(studioItem);
              STUDIO_STATUS.completed = (STUDIO_STATUS.completed || 0) + 1;
              console.log(`  [${dbTarget.name}] Queued Take ${takeNum}/${totalTakes} "${takeTitle}" (${processing?.durationAfter || durSec}s) -> Firebase key: ${key}`);
            }
            return createdItems;
          }

          async function runGenerationBatch(promptsList, opts = {}) {
            if (STUDIO_STATUS.isGenerating) {
              throw new Error('A generation batch is already running.');
            }
            const cfg = { ...STUDIO_CONFIG, ...opts };
            const targetDbs = resolveTargetDbs(cfg.targetAccount);
            const takesCount = Math.max(1, Math.min(4, parseInt(cfg.takesCount ?? 4, 10) || 4));

            STUDIO_STATUS.isGenerating = true;
            STUDIO_STATUS.stopRequested = false;
            STUDIO_STATUS.completed = 0;
            STUDIO_STATUS.total = promptsList.length * takesCount * targetDbs.length;

            const batchResults = [];
            try {
              if (!currentToken) {
                STUDIO_STATUS.currentTask = 'Auto-creating Stable Audio account token...';
                currentToken = await createStableAudioAccount();
                STUDIO_STATUS.stableAudioReady = true;
              }

              for (let i = 0; i < promptsList.length; i++) {
                if (STUDIO_STATUS.stopRequested) {
                  console.log('Batch stopped by user request.');
                  break;
                }
                const prompt = promptsList[i];
                console.log(`\n[${i + 1}/${promptsList.length}] Processing (${takesCount} tracks): ${prompt ? `"${prompt}"` : 'Smart Auto-Concept'}`);

                try {
                  const pushResults = [];
                  for (const dbTarget of targetDbs) {
                    if (STUDIO_STATUS.stopRequested) break;
                    const items = await generateAndPushOne(prompt, dbTarget, cfg);
                    pushResults.push(...items);
                  }
                  batchResults.push({
                    status: 'success',
                    prompt: prompt || 'Auto-Generated',
                    title: pushResults[0]?.title,
                    category: pushResults[0]?.category,
                    tracksCreated: pushResults.length,
                    keys: pushResults.map(r => ({ dbName: r.dbName, key: r.firebaseKey }))
                  });
                } catch (err) {
                  console.error(`Prompt ${i + 1} failed: ${err.message}`);
                  batchResults.push({ status: 'failed', prompt: prompt || 'Auto-Generated', error: err.message });
                }
              }
            } finally {
              STUDIO_STATUS.isGenerating = false;
              STUDIO_STATUS.currentTask = STUDIO_STATUS.stopRequested ? 'Batch stopped by user' : 'Batch complete — Ready';
            }
            return batchResults;
          }

          // ─── HTTP WEB STUDIO SERVER & API ROUTES ───────────────────────────────────
          let serverShutdownResolver = null;
          const shutdownPromise = new Promise(resolve => { serverShutdownResolver = resolve; });

          function readJsonBody(req) {
            return new Promise((resolve, reject) => {
              let body = '';
              req.on('data', chunk => {
                body += chunk;
                if (body.length > 2 * 1024 * 1024) reject(new Error('Payload too large'));
              });
              req.on('end', () => {
                try { resolve(body ? JSON.parse(body) : {}); }
                catch (e) { reject(new Error('Invalid JSON payload')); }
              });
              req.on('error', reject);
            });
          }

          function sendJson(res, status, obj) {
            const payload = JSON.stringify(obj);
            res.writeHead(status, {
              'Content-Type': 'application/json; charset=utf-8',
              'Cache-Control': 'no-store'
            });
            res.end(payload);
          }

          const studioServer = http.createServer(async (req, res) => {
            try {
              const u = new URL(req.url, `http://127.0.0.1:${STUDIO_PORT}`);

              if (req.method === 'GET' && (u.pathname === '/' || u.pathname === '/index.html')) {
                const html = fs.readFileSync('./studio.html', 'utf8');
                res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' });
                return res.end(html);
              }

              if (req.method === 'POST' && u.pathname === '/api/login') {
                const body = await readJsonBody(req);
                const inputPwd = String(body.password || '').trim();
                const expectedBuf = Buffer.from(STUDIO_PASSWORD);
                const inputBuf = Buffer.from(inputPwd);
                const match = expectedBuf.length === inputBuf.length && crypto.timingSafeEqual(expectedBuf, inputBuf);
                if (!match) {
                  await sleep(1200);
                  return sendJson(res, 401, { error: 'Invalid studio password' });
                }
                res.writeHead(200, {
                  'Content-Type': 'application/json; charset=utf-8',
                  'Set-Cookie': `studio_auth=${STUDIO_AUTH_TOKEN}; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400`,
                  'Cache-Control': 'no-store'
                });
                return res.end(JSON.stringify({ ok: true }));
              }

              if (req.method === 'POST' && u.pathname === '/api/logout') {
                res.writeHead(200, {
                  'Content-Type': 'application/json; charset=utf-8',
                  'Set-Cookie': 'studio_auth=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0',
                  'Cache-Control': 'no-store'
                });
                return res.end(JSON.stringify({ ok: true }));
              }

              // Password protection disabled — direct open access to Studio panel

              if (req.method === 'GET' && u.pathname === '/api/state') {
                return sendJson(res, 200, {
                  config: STUDIO_CONFIG,
                  status: STUDIO_STATUS,
                  logs: STUDIO_LOGS.slice(-100),
                  audios: STUDIO_AUDIOS
                });
              }

              if (req.method === 'GET' && u.pathname === '/api/firebase-audios') {
                await syncFirebaseRingtones();
                return sendJson(res, 200, { audios: STUDIO_AUDIOS });
              }

              if (req.method === 'GET' && u.pathname === '/api/audio-stream') {
                const id = u.searchParams.get('id') || '';
                const remoteUrl = u.searchParams.get('url') || '';
                const safeId = id.replace(/[^a-zA-Z0-9_-]/g, '');
                const localFile = path.join(AUDIO_CACHE_DIR, `${safeId}.mp3`);

                let buf = null;
                if (safeId && fs.existsSync(localFile)) {
                  buf = fs.readFileSync(localFile);
                } else if (remoteUrl && /^https?:\/\//i.test(remoteUrl)) {
                  const r2Res = await fetch(remoteUrl);
                  if (!r2Res.ok) {
                    res.writeHead(404);
                    return res.end('Audio not found on R2');
                  }
                  buf = Buffer.from(await r2Res.arrayBuffer());
                  if (safeId && buf.length > 0) {
                    try { fs.writeFileSync(localFile, buf); } catch {}
                  }
                }

                if (!buf) {
                  res.writeHead(404);
                  return res.end('Audio source missing');
                }

                const total = buf.length;
                const rangeHeader = req.headers.range;
                if (rangeHeader) {
                  const parts = rangeHeader.replace(/bytes=/, '').split('-');
                  const start = parseInt(parts[0], 10) || 0;
                  const end = parts[1] ? Math.min(total - 1, parseInt(parts[1], 10)) : total - 1;
                  if (start >= total || start > end) {
                    res.writeHead(416, { 'Content-Range': `bytes */${total}` });
                    return res.end();
                  }
                  const chunk = buf.subarray(start, end + 1);
                  res.writeHead(206, {
                    'Content-Range': `bytes ${start}-${end}/${total}`,
                    'Accept-Ranges': 'bytes',
                    'Content-Length': chunk.length,
                    'Content-Type': 'audio/mpeg',
                    'Cache-Control': 'public, max-age=3600'
                  });
                  return res.end(chunk);
                }

                res.writeHead(200, {
                  'Content-Type': 'audio/mpeg',
                  'Content-Length': total,
                  'Accept-Ranges': 'bytes',
                  'Cache-Control': 'public, max-age=3600'
                });
                return res.end(buf);
              }

              if (req.method === 'POST' && u.pathname === '/api/config') {
                const body = await readJsonBody(req);
                Object.assign(STUDIO_CONFIG, {
                  masterPrompt: body.masterPrompt || STUDIO_CONFIG.masterPrompt,
                  negativePrompt: body.negativePrompt ?? STUDIO_CONFIG.negativePrompt,
                  bannedWords: body.bannedWords ?? STUDIO_CONFIG.bannedWords,
                  soundType: body.soundType || STUDIO_CONFIG.soundType,
                  audioShape: ['track', 'loop', 'oneshot'].includes(String(body.audioShape || '').toLowerCase()) ? String(body.audioShape).toLowerCase() : STUDIO_CONFIG.audioShape,
                  takesCount: Math.max(1, Math.min(4, parseInt(body.takesCount ?? STUDIO_CONFIG.takesCount ?? 4, 10) || 4)),
                  timeSignature: body.timeSignature || STUDIO_CONFIG.timeSignature || '4/4',
                  lengthSeconds: Math.max(1, Math.min(60, parseInt(body.lengthSeconds || STUDIO_CONFIG.lengthSeconds, 10) || 20)),
                  targetAccount: body.targetAccount || STUDIO_CONFIG.targetAccount,
                  useGeminiEnhancer: body.useGeminiEnhancer !== false,
                  bpm: body.bpm ?? STUDIO_CONFIG.bpm,
                  instruments: body.instruments ?? STUDIO_CONFIG.instruments,
                  genre: body.genre ?? STUDIO_CONFIG.genre,
                  mood: body.mood ?? STUDIO_CONFIG.mood,
                  musicalKey: body.musicalKey ?? STUDIO_CONFIG.musicalKey,
                  structure: body.structure ?? STUDIO_CONFIG.structure,
                  production: body.production ?? STUDIO_CONFIG.production,
                  autoProcess: body.autoProcess !== false,
                  trimSilence: body.trimSilence !== false,
                  volumeBoostPct: parseInt(body.volumeBoostPct || STUDIO_CONFIG.volumeBoostPct, 10),
                  silenceThreshold: parseFloat(body.silenceThreshold || STUDIO_CONFIG.silenceThreshold),
                  padMs: parseInt(body.padMs ?? STUDIO_CONFIG.padMs, 10),
                  fadeInMs: parseInt(body.fadeInMs ?? STUDIO_CONFIG.fadeInMs, 10),
                  fadeOutMs: parseInt(body.fadeOutMs ?? STUDIO_CONFIG.fadeOutMs, 10),
                  bitrate: body.bitrate || STUDIO_CONFIG.bitrate,
                  seed: parseInt(body.seed ?? -1, 10)
                });
                return sendJson(res, 200, { ok: true, config: STUDIO_CONFIG });
              }

              if (req.method === 'POST' && u.pathname === '/api/generate') {
                if (STUDIO_STATUS.isGenerating) {
                  return sendJson(res, 409, { error: 'A batch is already generating. Please wait or stop it first.' });
                }
                const body = await readJsonBody(req);
                Object.assign(STUDIO_CONFIG, {
                  masterPrompt: body.masterPrompt || STUDIO_CONFIG.masterPrompt,
                  negativePrompt: body.negativePrompt ?? STUDIO_CONFIG.negativePrompt,
                  bannedWords: body.bannedWords ?? STUDIO_CONFIG.bannedWords,
                  soundType: body.soundType || STUDIO_CONFIG.soundType,
                  audioShape: ['track', 'loop', 'oneshot'].includes(String(body.audioShape || '').toLowerCase()) ? String(body.audioShape).toLowerCase() : STUDIO_CONFIG.audioShape,
                  takesCount: Math.max(1, Math.min(4, parseInt(body.takesCount ?? STUDIO_CONFIG.takesCount ?? 4, 10) || 4)),
                  timeSignature: body.timeSignature || STUDIO_CONFIG.timeSignature || '4/4',
                  lengthSeconds: Math.max(1, Math.min(60, parseInt(body.lengthSeconds || STUDIO_CONFIG.lengthSeconds, 10) || 20)),
                  targetAccount: body.targetAccount || STUDIO_CONFIG.targetAccount,
                  useGeminiEnhancer: body.useGeminiEnhancer !== false,
                  bpm: body.bpm ?? STUDIO_CONFIG.bpm,
                  instruments: body.instruments ?? STUDIO_CONFIG.instruments,
                  genre: body.genre ?? STUDIO_CONFIG.genre,
                  mood: body.mood ?? STUDIO_CONFIG.mood,
                  musicalKey: body.musicalKey ?? STUDIO_CONFIG.musicalKey,
                  structure: body.structure ?? STUDIO_CONFIG.structure,
                  production: body.production ?? STUDIO_CONFIG.production,
                  autoProcess: body.autoProcess !== false,
                  trimSilence: body.trimSilence !== false,
                  volumeBoostPct: parseInt(body.volumeBoostPct || STUDIO_CONFIG.volumeBoostPct, 10),
                  silenceThreshold: parseFloat(body.silenceThreshold || STUDIO_CONFIG.silenceThreshold),
                  padMs: parseInt(body.padMs ?? STUDIO_CONFIG.padMs, 10),
                  fadeInMs: parseInt(body.fadeInMs ?? STUDIO_CONFIG.fadeInMs, 10),
                  fadeOutMs: parseInt(body.fadeOutMs ?? STUDIO_CONFIG.fadeOutMs, 10),
                  bitrate: body.bitrate || STUDIO_CONFIG.bitrate,
                  seed: parseInt(body.seed ?? -1, 10)
                });

                const userLines = Array.isArray(body.prompts)
                  ? body.prompts.map(s => String(s || '').trim()).filter(Boolean)
                  : [];
                const fallbackCnt = Math.max(1, Math.min(100, parseInt(body.autoCount || 5, 10)));
                const promptsList = userLines.length > 0 ? userLines : Array(fallbackCnt).fill(null);

                runGenerationBatch(promptsList, STUDIO_CONFIG).catch(err => {
                  console.error(`Batch error: ${err.message}`);
                });

                return sendJson(res, 200, { ok: true, total: promptsList.length * (STUDIO_CONFIG.takesCount || 4) });
              }

              if (req.method === 'POST' && u.pathname === '/api/stop-batch') {
                STUDIO_STATUS.stopRequested = true;
                return sendJson(res, 200, { ok: true });
              }

              if (req.method === 'POST' && u.pathname === '/api/delete-audio') {
                const body = await readJsonBody(req);
                const { id, dbName, firebaseKey } = body;
                const targets = Array.isArray(body.keys) && body.keys.length
                  ? body.keys
                  : (dbName && firebaseKey ? [{ dbName, key: firebaseKey }] : []);

                const idx = STUDIO_AUDIOS.findIndex(a => a.id === id || (a.dbName === dbName && a.firebaseKey === firebaseKey));
                let fileUrl = String(body.fileUrl || (idx !== -1 ? STUDIO_AUDIOS[idx].fileUrl : '') || '').trim();

                if (!fileUrl) {
                  for (const t of targets) {
                    const dbUrl = FIREBASE_DB_MAP[t.dbName];
                    if (dbUrl && t.key) {
                      try {
                        const r = await fetchWithTimeout(`${dbUrl}/${QUEUE_PATH}/${t.key}.json`, {}, 10000);
                        if (r.ok) {
                          const rec = await r.json().catch(() => null);
                          if (rec && rec.fileUrl) { fileUrl = String(rec.fileUrl).trim(); break; }
                        }
                      } catch {}
                    }
                  }
                }

                let r2Deleted = false;
                if (fileUrl) {
                  const targetSet = new Set(targets.map(t => `${t.dbName}:${t.key}`));
                  const stillShared = STUDIO_AUDIOS.some(a =>
                    String(a.fileUrl || '').trim() === fileUrl && !targetSet.has(`${a.dbName}:${a.firebaseKey}`)
                  );
                  if (!stillShared) {
                    const r2Res = await deleteFromR2(fileUrl);
                    r2Deleted = !!(r2Res && r2Res.ok && r2Res.absent);
                    if (r2Deleted) console.log(`  Deleted audio from R2 (${r2Res.key || fileUrl})`);
                  }
                }

                for (const t of targets) {
                  const dbUrl = FIREBASE_DB_MAP[t.dbName];
                  if (dbUrl && t.key) {
                    await firebaseDeleteFromUrl(dbUrl, QUEUE_PATH, t.key);
                    console.log(`  Deleted audio [${t.dbName}:${t.key}] from Firebase`);
                  }
                }

                if (idx !== -1) STUDIO_AUDIOS.splice(idx, 1);

                const safeId = String(id || '').replace(/[^a-zA-Z0-9_-]/g, '');
                if (safeId) {
                  try { fs.unlinkSync(path.join(AUDIO_CACHE_DIR, `${safeId}.mp3`)); } catch {}
                }

                return sendJson(res, 200, { ok: true, r2Deleted });
              }

              if (req.method === 'POST' && u.pathname === '/api/clean-r2-orphans') {
                const body = await readJsonBody(req).catch(() => ({}));
                const dryRun = body.dryRun !== false;
                if (!R2_WORKER_URL) return sendJson(res, 400, { error: 'R2_WORKER_URL is not configured' });

                // 1. Collect ALL active R2 keys across ALL configured Firebase queues
                const activeKeys = new Set();
                const dbsChecked = [];
                const extractUrls = (val) => {
                  if (!val) return;
                  if (typeof val === 'string') {
                    if (val.startsWith('http://') || val.startsWith('https://')) {
                      try {
                        const parsed = new URL(val);
                        const k = decodeURIComponent(parsed.pathname.replace(/^\/+/, ''));
                        if (k) activeKeys.add(k);
                      } catch {}
                    }
                    return;
                  }
                  if (Array.isArray(val)) { for (const item of val) extractUrls(item); return; }
                  if (typeof val === 'object') { for (const v of Object.values(val)) extractUrls(v); }
                };

                for (const [dbKey, dbUrl] of Object.entries(FIREBASE_DB_MAP)) {
                  const r = await fetchWithTimeout(`${dbUrl}/${QUEUE_PATH}.json`, {}, 25000);
                  if (!r.ok) {
                    return sendJson(res, 502, { error: `Aborted: failed to read Firebase ${dbKey} (HTTP ${r.status})` });
                  }
                  const data = await r.json();
                  extractUrls(data);
                  dbsChecked.push(dbKey);
                }
                if (!dbsChecked.length) {
                  return sendJson(res, 400, { error: 'No Firebase DBs configured — aborted for safety' });
                }

                // 2. Paginate R2 objects via worker.js (?action=list)
                const allObjects = [];
                let cursor = null;
                let pages = 0;
                do {
                  const listUrl = new URL(R2_WORKER_URL);
                  listUrl.searchParams.set('action', 'list');
                  listUrl.searchParams.set('limit', '1000');
                  if (cursor) listUrl.searchParams.set('cursor', cursor);
                  const lr = await fetchWithTimeout(listUrl.toString(), {}, 20000);
                  const ld = await lr.json().catch(() => ({}));
                  if (!lr.ok || !Array.isArray(ld.objects)) {
                    return sendJson(res, 502, { error: ld.error || 'R2 worker does not support ?action=list yet — deploy the updated worker.js first' });
                  }
                  allObjects.push(...ld.objects);
                  cursor = ld.truncated && ld.cursor ? ld.cursor : null;
                  pages++;
                } while (cursor && pages < 50);

                const orphans = allObjects.filter(o => o && o.key && !activeKeys.has(o.key));
                const orphanBytes = orphans.reduce((s, o) => s + (Number(o.size) || 0), 0);
                if (dryRun) {
                  return sendJson(res, 200, {
                    ok: true,
                    dryRun: true,
                    dbsChecked,
                    totalR2: allObjects.length,
                    activeKeysCount: activeKeys.size,
                    orphanCount: orphans.length,
                    orphanBytes,
                    sampleKeys: orphans.slice(0, 12).map(o => o.key)
                  });
                }

                // 3. Delete verified orphans via worker.js
                let deletedCount = 0;
                let deletedBytes = 0;
                let failedCount = 0;
                const queue = [...orphans];
                const workers = Array.from({ length: Math.min(5, queue.length) }, async () => {
                  while (queue.length) {
                    const obj = queue.shift();
                    try {
                      const dr = await fetchWithTimeout(R2_WORKER_URL, {
                        method: 'DELETE',
                        headers: { 'X-File-Name': obj.key }
                      }, 15000);
                      const dd = await dr.json().catch(() => ({}));
                      if (dr.ok && dd.ok && dd.absent) {
                        deletedCount++;
                        deletedBytes += Number(obj.size) || 0;
                      } else {
                        failedCount++;
                      }
                    } catch {
                      failedCount++;
                    }
                  }
                });
                await Promise.all(workers);
                console.log(`  R2 orphan cleanup: deleted ${deletedCount}/${orphans.length} (${(deletedBytes / 1048576).toFixed(2)} MB), failed ${failedCount}`);
                return sendJson(res, 200, {
                  ok: true,
                  dryRun: false,
                  dbsChecked,
                  totalR2: allObjects.length,
                  orphanCount: orphans.length,
                  deletedCount,
                  deletedBytes,
                  failedCount
                });
              }

              if (req.method === 'POST' && u.pathname === '/api/update-audio') {
                const body = await readJsonBody(req);
                const { id, dbName, firebaseKey, title, tags, category, description } = body;
                const patch = {
                  title: cleanTitle(title) || title,
                  tags: zedgeCleanTags(tags).join(', '),
                  category: cleanCategory(category),
                  description: cleanDescription(description) || description
                };
                const dbUrl = FIREBASE_DB_MAP[dbName];
                if (!dbUrl || !firebaseKey) {
                  return sendJson(res, 400, { error: 'Missing dbName or firebaseKey' });
                }
                await firebasePatchToUrl(dbUrl, QUEUE_PATH, firebaseKey, patch);
                const item = STUDIO_AUDIOS.find(a => a.id === id);
                if (item) Object.assign(item, patch);
                console.log(`  Updated metadata for [${dbName}:${firebaseKey}] -> "${patch.title}"`);
                return sendJson(res, 200, { ok: true, patch });
              }

              if (req.method === 'POST' && u.pathname === '/api/rotate-token') {
                createStableAudioAccount().then(tok => {
                  currentToken = tok;
                  STUDIO_STATUS.stableAudioReady = true;
                  console.log('Stable Audio token rotated successfully.');
                }).catch(e => {
                  console.error('Token rotation failed: ' + e.message);
                });
                return sendJson(res, 200, { ok: true });
              }

              if (req.method === 'POST' && u.pathname === '/api/shutdown') {
                sendJson(res, 200, { ok: true });
                console.log('Studio shutdown requested from web UI.');
                if (serverShutdownResolver) serverShutdownResolver();
                return;
              }

              res.writeHead(404);
              res.end('Not found');
            } catch (err) {
              sendJson(res, 500, { error: err.message });
            }
          });

          // ─── ENSURE CLOUDFLARED QUICK TUNNEL IS LIVE ───────────────────────────────
          async function ensureCloudflaredTunnel() {
            if (STUDIO_STATUS.tryCloudflareUrl) return STUDIO_STATUS.tryCloudflareUrl;
            try {
              if (fs.existsSync('/tmp/cloudflared.log')) {
                const logTxt = fs.readFileSync('/tmp/cloudflared.log', 'utf8');
                const m = logTxt.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
                if (m) {
                  STUDIO_STATUS.tryCloudflareUrl = m[0];
                  return m[0];
                }
              }
            } catch {}

            try {
              const child = spawn('cloudflared', ['tunnel', '--url', `http://127.0.0.1:${STUDIO_PORT}`, '--no-autoupdate'], {
                 detached: true,
                stdio: ['ignore', 'pipe', 'pipe']
              });
              const onChunk = (chunk) => {
                const s = chunk.toString();
                const m = s.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
                if (m && !STUDIO_STATUS.tryCloudflareUrl) {
                  STUDIO_STATUS.tryCloudflareUrl = m[0];
                }
              };
              child.stdout.on('data', onChunk);
              child.stderr.on('data', onChunk);
              child.unref();

              for (let i = 0; i < 25; i++) {
                await sleep(600);
                if (STUDIO_STATUS.tryCloudflareUrl) return STUDIO_STATUS.tryCloudflareUrl;
              }
            } catch (e) {
              console.warn(`Could not spawn cloudflared tunnel: ${e.message}`);
            }
            return '';
          }

          // ─── MAIN BOOTSTRAP ────────────────────────────────────────────────────────
          await new Promise(resolve => studioServer.listen(STUDIO_PORT, '127.0.0.1', resolve));
          const tunnelUrl = await ensureCloudflaredTunnel();

          console.log('============================================================');
          console.log('  RINGTONE STUDIO PRO (GEMINI WEB RPC + TRYCLOUDFLARE)');
          console.log('============================================================');
          if (tunnelUrl) {
            console.log(`  LIVE WEB STUDIO URL : ${tunnelUrl}`);
          } else {
            console.log(`  LOCAL STUDIO PORT   : http://127.0.0.1:${STUDIO_PORT}`);
          }
          console.log(`  STUDIO ACCESS       : Open (No Password Required)`);
          console.log(`  Gemini Transport    : Direct Web RPC (StreamGenerate — No Browser)`);
          console.log(`  Initial Auto-Count  : ${AUTO_GENERATE_COUNT}`);
          console.log(`  Duration            : ${INITIAL_LENGTH_SEC}s`);
          console.log('============================================================\n');

          STUDIO_STATUS.geminiVncUrl = GEMINI_VNC_URL || '';
          STUDIO_STATUS.stableAudioCredits = currentCredits;

          // 1. Launch Live Persistent Gemini Browser on DISPLAY=:99 (noVNC tunnel — user logs into Gmail directly, no expiring cookies!)
          await startGeminiLiveBrowser();
          if (!STUDIO_STATUS.geminiReady && COOKIE_HEADER) {
            try {
              const sess = await getGeminiSession(false);
              STUDIO_STATUS.geminiReady = true;
              STUDIO_STATUS.geminiUser = sess.authUser;
            } catch (err) {
              console.warn(`Optional cookie bootstrap skipped (${err.message}) — sign in via Live Gemini Browser link!`);
            }
          }
          if (!STUDIO_STATUS.geminiReady) {
            console.log(`  ⏳ Waiting for you to log into Gmail inside the Live Gemini Browser: ${GEMINI_VNC_URL || '(noVNC port 6080)'}`);
          }

          // 2. Sync existing ringtones from Firebase so they are immediately playable/deletable in the UI
          await syncFirebaseRingtones();

          // 3. Ensure Stable Audio token & 50-credit balance are ready
          if (!currentToken) {
            console.log('No STABLE_AUDIO_TOKEN provided — auto-creating initial 50-credit Stable Audio account...');
            try {
              currentToken = await createStableAudioAccount();
              STUDIO_STATUS.stableAudioReady = true;
              await fetchStableAudioCredits();
            } catch (err) {
              console.error(`Initial Stable Audio account creation failed: ${err.message}`);
            }
          } else {
            STUDIO_STATUS.stableAudioReady = true;
            await fetchStableAudioCredits();
          }

          // 4. Run initial auto-generation batch if AUTO_GENERATE_COUNT > 0
          let initialResults = [];
          if (AUTO_GENERATE_COUNT > 0) {
            const initialPrompts = Array(AUTO_GENERATE_COUNT).fill(null);
            initialResults = await runGenerationBatch(initialPrompts, STUDIO_CONFIG);
          }

          // 5. Keep TryCloudflare Studio Panel alive for interactive generation, listening & deletion
          if (tunnelUrl && STUDIO_MAX_MINUTES > 0) {
            console.log('\n============================================================');
            console.log(`  WEB STUDIO ACTIVE AT: ${tunnelUrl}`);
            console.log(`  Open the link above to enter line-by-line prompts, edit Master Prompt,`);
            console.log(`  set BPM/Instruments/Negative Prompt, play audios, or delete bad ones.`);
            console.log(`  Click "Finish Session" in the top bar when done (auto-closes in ${STUDIO_MAX_MINUTES}m).`);
            console.log('============================================================\n');

            const maxTimer = setTimeout(() => {
              console.log(`Studio max session duration (${STUDIO_MAX_MINUTES}m) reached. Closing server...`);
              if (serverShutdownResolver) serverShutdownResolver();
            }, STUDIO_MAX_MINUTES * 60 * 1000);

            await shutdownPromise;
            clearTimeout(maxTimer);
          }

          studioServer.close();

          // ─── SUMMARY ──────────────────────────────────────────────────────────────
          const successCount = STUDIO_AUDIOS.length;
          try {
            const md = [];
            if (tunnelUrl) {
              md.push(`### 🌐 TryCloudflare Ringtone Studio URL`, ``, `**Studio Link:** ${tunnelUrl}`, ``);
            }
            md.push(`| Metric | Value |`, `|---|---|`);
            md.push(`| Gemini Mode | Direct Web RPC (\`StreamGenerate\`) |`);
            md.push(`| Total Audios in Library | ${successCount} |`);
            md.push(`| Audio Processed (FFmpeg DSP) | ${audioStats.processed} |`);
            md.push(`| Silence Trimmed Total | ${audioStats.trimmedSec.toFixed(1)}s |`);
            fs.writeFileSync('/tmp/generator_summary.md', md.join('\n') + '\n');
          } catch {}

          process.exit(0);
          SCRIPT_EOF
          node --experimental-vm-modules --max-http-header-size=262144 generator.mjs

      - name: 📊 Upload Run Summary
        if: always()
        run: |
          echo "## ☁️ Bulk Ringtone Generator & Studio Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/generator_summary.md ]; then
            cat /tmp/generator_summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "> Ringtones pushed to Firebase with status **queued** — Zedge bot will pick them up on next run." >> $GITHUB_STEP_SUMMARY

  generate-image-metadata:
    if: github.event.inputs.mode == 'metadata'
    name: 🖼️ Generate Image Metadata → Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install Dependencies & Live Browser Tools (Fast)
        run: |
          npm init -y
          npm install --no-audit --no-fund node-fetch@3 patchright
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "✅ Using pre-installed system Google Chrome"
          else
            npx patchright install chrome || true
          fi
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          NEED_PKGS=""
          command -v Xvfb >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS xvfb"
          command -v x11vnc >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS x11vnc"
          command -v openbox >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS openbox"
          [ -d /usr/share/novnc ] || NEED_PKGS="$NEED_PKGS novnc websockify"
          command -v ffmpeg >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS ffmpeg"
          if [ -n "$NEED_PKGS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $NEED_PKGS
          fi

      - name: 🖼️ Generate Image Metadata & Patch Firebase
        env:
          # v28 security: Firebase database URLs from GitHub Secrets
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          ZEDGE1_DB_URL: ${{ secrets.ZEDGE1_DB_URL }}
          ZEDGE2_DB_URL: ${{ secrets.ZEDGE2_DB_URL }}
          ZEDGE3_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          ZEDGE4_DB_URL: ${{ secrets.ZEDGE4_DB_URL }}
          GEMINI_SESSION: ${{ secrets.GEMINI_SESSION }}
          GEMINI_SESSION_INPUT: ${{ github.event.inputs.gemini_session }}
          IMAGE_QUEUE_PATH: wallpaperQueue
          # Gemini's /app response headers exceed Node's default 16 KB parser limit
          # (HPE_HEADER_OVERFLOW → "Parse Error: Header overflow"). Chrome allows far
          # more, which is why the extension never hit this. Raise the cap to 256 KB.
          NODE_OPTIONS: --max-http-header-size=262144
        run: |
          cat > image_metadata.mjs << 'IMGMETA_EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';
          import path from 'path';
          import os from 'os';
          import http from 'http';
          import { execSync } from 'child_process';

          // ─── CONFIG ────────────────────────────────────────────────────────────────
          const GEMINI_SESSION_RAW = (process.env.GEMINI_SESSION_INPUT?.trim() || process.env.GEMINI_SESSION || '').trim();
          const TARGET_ACCOUNT     = 'all_accounts'; // Always scan all DBs automatically
          const IMAGE_QUEUE_PATH   = (process.env.IMAGE_QUEUE_PATH || 'wallpaperQueue').trim();
          // No count cap — we always process ALL images missing metadata automatically.

          // ─── CONTENT KINDS: plain wallpapers, wallpaper sets, and video content ───
          const SET_KINDS = {
            WALLPAPER_24H:     { label: '24H Wallpaper Set',     slots: ['morning', 'afternoon', 'evening', 'night'] },
            WALLPAPER_DUAL:    { label: 'Dual Wallpaper Set',    slots: ['lock', 'home'] },
            WALLPAPER_BATTERY: { label: 'Battery Wallpaper Set', slots: ['critical', 'low', 'mid', 'high', 'full', 'charging'] }
          };
          const VIDEO_KINDS = {
            LIVE_WALLPAPER:     { label: 'Live Wallpaper (video)' },
            CHARGING_ANIMATION: { label: 'Charging Animation (video)' }
          };
          const KIND_PROMPT_CONTEXT = {
            WALLPAPER: `I have attached a phone wallpaper image.`,
            WALLPAPER_24H: `I have attached ONE image from a 24H WALLPAPER SET - 4 wallpapers of the same scene that automatically change through the day (morning, afternoon, evening, night). Write metadata for the WHOLE day-cycle set, not just this single frame.`,
            WALLPAPER_DUAL: `I have attached ONE image from a DUAL WALLPAPER SET - a matching lock screen + home screen wallpaper pair. Write metadata that fits the matching pair.`,
            WALLPAPER_BATTERY: `I have attached ONE image from a BATTERY WALLPAPER SET - artwork that changes with the phone battery level (critical, low, mid, high, full, charging). Write metadata that fits the whole battery pack.`,
            LIVE_WALLPAPER: `I have attached a FRAME extracted from a LIVE WALLPAPER VIDEO (an animated phone wallpaper). Write metadata for the animated live wallpaper.`,
            CHARGING_ANIMATION: `I have attached a FRAME extracted from a phone CHARGING ANIMATION VIDEO (an animation that plays while the phone is charging). Write metadata that fits a charging screen animation.`
          };
          function getRecordKind(record) {
            const ct = String(record.contentType || '').toUpperCase().trim();
            if (SET_KINDS[ct] || VIDEO_KINDS[ct]) return ct;
            if (typeof record.type === 'string' && record.type.startsWith('video/')) return 'LIVE_WALLPAPER';
            return 'WALLPAPER';
          }
          function kindLabel(kind) {
            return (SET_KINDS[kind] || VIDEO_KINDS[kind] || {}).label || 'Wallpaper';
          }
          function slotUrlValue(v) {
            return typeof v === 'string' ? v : ((v && v.fileUrl) || '');
          }
          function firstSlotUrl(record, kind) {
            const meta = SET_KINDS[kind];
            if (!meta || !record.files) return '';
            for (const s of meta.slots) {
              const u = slotUrlValue(record.files[s]);
              if (u) return u;
            }
            return '';
          }

          // ─── PARSE GEMINI SESSION (OPTIONAL — falls back to Live Browser Login) ─────

          // ─── COOKIE NORMALIZER ────────────────────────────────────────────────────
          // Converts browser-extension cookie objects (EditThisCookie, Cookie-Editor, etc.)
          // into Playwright storageState-compatible cookie objects.
          //
          // Key field differences:
          //   expirationDate (float)  → expires (int, -1 = session)
          //   sameSite "no_restriction" → "None"
          //   sameSite null/undefined  → "None"
          //   sameSite "lax"           → "Lax"
          //   sameSite "strict"        → "Strict"
          //   hostOnly, storeId, session → stripped (not used by Playwright)
          function normalizeCookies(rawCookies) {
            return rawCookies.map(c => {
              // sameSite mapping
              let sameSite = 'None';
              if (c.sameSite) {
                const ss = c.sameSite.toLowerCase();
                if (ss === 'lax')                               sameSite = 'Lax';
                else if (ss === 'strict')                       sameSite = 'Strict';
                else if (ss === 'none' || ss === 'no_restriction') sameSite = 'None';
              }
              // expires: Playwright uses integer seconds, -1 means session cookie
              const expires = c.expires   !== undefined ? Math.floor(c.expires) :
                              c.expirationDate !== undefined ? Math.floor(c.expirationDate) :
                              -1;
              return {
                name:     c.name,
                value:    c.value,
                domain:   c.domain,
                path:     c.path || '/',
                expires,
                httpOnly: !!c.httpOnly,
                secure:   !!c.secure,
                sameSite,
              };
            });
          }

          // ─── NORMALIZE SESSION FORMAT ─────────────────────────────────────────────
          // The GEMINI_SESSION may arrive in several formats:
          //   1. Playwright storageState:  { cookies: [...], origins: [...] }
          //   2. Raw cookie array:         [{ name, value, domain, ... }, ...]
          //   3. Wrapped/nested formats:   { cookies: [...], ... } with extra keys
          // We normalize all of them into a valid cookie list.
          let GEMINI_STORAGE_STATE = { cookies: [] };
          if (GEMINI_SESSION_RAW) {
          try {
            const parsed = JSON.parse(GEMINI_SESSION_RAW);
            console.log(`📋 Parsed session JSON top-level type: ${Array.isArray(parsed) ? 'array' : typeof parsed}`);
            if (typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)) {
              console.log(`📋 Top-level keys: ${Object.keys(parsed).slice(0, 10).join(', ')}`);
            }

            // Format 1: Already a Playwright storageState with cookies array
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && Array.isArray(parsed.cookies)) {
              GEMINI_STORAGE_STATE = {
                cookies: normalizeCookies(parsed.cookies),
                origins: Array.isArray(parsed.origins) ? parsed.origins : []
              };
              console.log('🔄 Detected format: Playwright storageState object');

            // Format 2: Raw array of cookie objects (browser extension export)
            } else if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name !== undefined) {
              GEMINI_STORAGE_STATE = { cookies: normalizeCookies(parsed), origins: [] };
              console.log('🔄 Detected format: Raw cookie array (browser extension) — normalizing fields');

            // Format 3: Object but cookies nested under alternate key
            } else if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              const altKeys = ['cookie', 'Cookie', 'cookieList', 'cookieJar', 'session'];
              let found = null;
              for (const k of altKeys) {
                if (Array.isArray(parsed[k]) && parsed[k].length > 0) { found = parsed[k]; break; }
              }
              if (!found) {
                for (const val of Object.values(parsed)) {
                  if (val && typeof val === 'object' && Array.isArray(val.cookies) && val.cookies.length > 0) {
                    found = val.cookies;
                    break;
                  }
                }
              }
              if (found) {
                GEMINI_STORAGE_STATE = { cookies: normalizeCookies(found), origins: [] };
                console.log('🔄 Detected format: Nested/alternate key — extracted and normalized cookies');
              }
            }

            if (!GEMINI_STORAGE_STATE || !Array.isArray(GEMINI_STORAGE_STATE.cookies) || GEMINI_STORAGE_STATE.cookies.length === 0) {
              console.error('❌ Error: Could not find any cookies in GEMINI_SESSION JSON.');
              console.error('   Expected one of these formats:');
              console.error('     1. Playwright storageState: {"cookies":[...],"origins":[...]}');
              console.error('     2. Browser extension array: [{"name":"...","value":"...","domain":"..."}]');
              console.error('   Please re-export the session from your browser.');
              process.exit(1);
            }

            const googleCookies = GEMINI_STORAGE_STATE.cookies.filter(c =>
              c.domain && (c.domain.includes('google.com') || c.domain.includes('gemini.google.com'))
            );
            console.log(`🌐 Gemini Web Session loaded: ${GEMINI_STORAGE_STATE.cookies.length} total cookies, ${googleCookies.length} google.com cookies.`);
            // Log key auth cookies to confirm they're present
            const keyNames = ['SID', 'SSID', 'APISID', 'SAPISID', '__Secure-1PSID', '__Secure-3PSID'];
            const foundKeys = GEMINI_STORAGE_STATE.cookies.filter(c => keyNames.includes(c.name)).map(c => c.name);
            console.log(`🔑 Key auth cookies found: ${foundKeys.join(', ') || 'NONE — session may fail!'}`);
            if (googleCookies.length === 0) {
              console.error('❌ Error: No google.com cookies found — the RPC session cannot authenticate.');
              process.exit(1);
            }

          } catch (e) {
            console.warn('⚠️  GEMINI_SESSION JSON invalid (will use Live Browser Login instead):', e.message);
            GEMINI_STORAGE_STATE = { cookies: [] };
          }
          }

          // ─── BUILD COOKIE HEADER (extension-style direct web requests) ────────────
          // The Gemini HD Studio extension never drives a browser for metadata — it sends
          // plain HTTP calls with the account cookies. We do exactly the same here: no
          // Playwright, no DOM, no clipboard tricks, no 90s response-wait timeouts.
          //
          // SKIPPED_COOKIES: bulk UI-state blobs that are NOT needed to authenticate.
          // A typical EditThisCookie export carries a ~2 KB COMPASS preference blob
          // (often twice, for .google.com AND gemini.google.com) plus a session "S"
          // blob — together they inflate the request Cookie header by ~2 KB for zero
          // auth value. Auth lives in SID / HSID / SSID / APISID / SAPISID / __Secure-*.
          const SKIPPED_COOKIES = new Set(['COMPASS', 'S', 'SEARCH_SAMESITE']);
          function buildCookieHeader(storageState) {
            const byName = new Map();
            for (const c of storageState.cookies) {
              if (!c || !c.name || c.value === undefined || !c.domain) continue;
              if (!c.domain.includes('google.com')) continue;
              if (SKIPPED_COOKIES.has(c.name)) continue;
              // Prefer the account-level ".google.com" cookie when a name exists twice
              if (!byName.has(c.name) || c.domain === '.google.com') {
                byName.set(c.name, c.value);
              }
            }
            return [...byName.entries()].map(([k, v]) => `${k}=${v}`).join('; ');
          }
          let COOKIE_HEADER = GEMINI_STORAGE_STATE.cookies.length ? buildCookieHeader(GEMINI_STORAGE_STATE) : '';
          if (COOKIE_HEADER) console.log(`🍪 Cookie header built: ${COOKIE_HEADER.split('; ').length} cookies for google.com (${COOKIE_HEADER.length} bytes)`);

          // Minimal auth-only cookie header — fallback when Google answers with
          // "431 Request Header Fields Too Large" on an oversized cookie jar.
          function buildMinimalCookieHeader(storageState) {
            const ESSENTIAL = new Set([
              'SID', 'HSID', 'SSID', 'APISID', 'SAPISID',
              '__Secure-1PSID', '__Secure-3PSID', '__Secure-1PAPISID', '__Secure-3PAPISID',
              '__Secure-1PSIDTS', '__Secure-3PSIDTS', 'SIDCC', 'NID'
            ]);
            const byName = new Map();
            for (const c of storageState.cookies) {
              if (!c || !c.name || c.value === undefined || !c.domain) continue;
              if (!c.domain.includes('google.com')) continue;
              if (!ESSENTIAL.has(c.name)) continue;
              if (!byName.has(c.name) || c.domain === '.google.com') byName.set(c.name, c.value);
            }
            return [...byName.entries()].map(([k, v]) => `${k}=${v}`).join('; ');
          }
          let COOKIE_HEADER_MIN = GEMINI_STORAGE_STATE.cookies.length ? buildMinimalCookieHeader(GEMINI_STORAGE_STATE) : '';
          if (COOKIE_HEADER_MIN) console.log(`🍪 Minimal fallback cookie header: ${COOKIE_HEADER_MIN.split('; ').length} cookies (${COOKIE_HEADER_MIN.length} bytes)`);

          // ─── FIREBASE DB ROUTING ──────────────────────────────────────────────────
          // <-- CONFIG: your Firebase Realtime Database URLs (same as in index.html / Core.kt / zedgeN.yml)
          // v28 security: database URLs come from GitHub Secrets ZEDGEn_DB_URL (never written here).
          const FIREBASE_DB_MAP = Object.fromEntries(Object.entries({
            zedge_1: process.env.ZEDGE1_DB_URL,
            zedge_2: process.env.ZEDGE2_DB_URL,
            zedge_3: process.env.ZEDGE3_DB_URL,
            zedge_4: process.env.ZEDGE4_DB_URL
          }).filter(([, u]) => u && u.trim()).map(([k, u]) => [k, u.trim().replace(/\/+$/, '')]));
          if (!Object.keys(FIREBASE_DB_MAP).length) { console.error('No ZEDGEn_DB_URL GitHub secret is set - add them in GitHub > Settings > Secrets and variables > Actions'); process.exit(1); }

          let TARGET_DB_URLS;
          if (TARGET_ACCOUNT === 'all_accounts' || TARGET_ACCOUNT === 'all_four' || TARGET_ACCOUNT === 'all_three') {
            TARGET_DB_URLS = Object.entries(FIREBASE_DB_MAP).map(([name, url]) => ({ name, url }));
          } else if (FIREBASE_DB_MAP[TARGET_ACCOUNT]) {
            TARGET_DB_URLS = [{ name: TARGET_ACCOUNT, url: FIREBASE_DB_MAP[TARGET_ACCOUNT] }];
          } else {
            console.error(`❌ Unknown target_account: "${TARGET_ACCOUNT}".`);
            process.exit(1);
          }

          // ─── UTILITY ──────────────────────────────────────────────────────────────
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          async function fetchWithTimeout(url, opts = {}, ms = 90000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
              return await fetch(url, { ...opts, signal: ctrl.signal });
            } finally {
              clearTimeout(timer);
            }
          }

          // ─── VALID IMAGE CATEGORIES ────────────────────────────────────────────────
          const VALID_IMG_CATS = [
            'ANIMALS', 'ANIME', 'CARS_N_VEHICLES', 'COMICS', 'DESIGNS',
            'DRAWINGS', 'ENTERTAINMENT', 'FUNNY', 'GAMES', 'HOLIDAYS',
            'LOVE', 'MUSIC', 'NATURE', 'OTHER', 'PATTERNS',
            'PEOPLE', 'SAYINGS', 'SPACE', 'SPIRITUAL', 'SPORTS',
            'TECHNOLOGY'
          ];

          // ─── RESPONSE CLEANERS ─────────────────────────────────────────────────────
          function cleanTitle(raw) {
            if (!raw) return '';
            raw = raw.replace(/^(here is a title:|title:|the title is:|suggested title:)/i, '').trim();
            const quoteMatch = raw.match(/"([^"\r\n]{3,60})"/);
            if (quoteMatch) return quoteMatch[1].trim();
            const boldMatch = raw.match(/\*\*([^\*\r\n]{3,60})\*\*/);
            if (boldMatch) return boldMatch[1].trim();
            const lines = raw.split('\n')
              .map(l => l.trim())
              .filter(l => {
                const lower = l.toLowerCase();
                return l.length > 0 &&
                       !lower.startsWith('here') &&
                       !lower.startsWith('sure') &&
                       !lower.startsWith('based') &&
                       !lower.startsWith('suggest') &&
                       !lower.startsWith('the') &&
                       !lower.startsWith('this');
              });
            if (lines.length > 0) {
              return lines[0].replace(/^["'*\s]+|["'*\s]+$/g, '').trim().slice(0, 30);
            }
            return raw.replace(/^["'*\s]+|["'*\s]+$/g, '').slice(0, 30).trim();
          }

          function cleanKeywords(raw) {
            if (!raw) return '';
            const words = raw.match(/[a-zA-Z0-9]{2,20}/g) || [];
            const stopWords = new Set(['here', 'are', 'the', 'keywords', 'based', 'on', 'this', 'image', 'and', 'for', 'with', 'your', 'wallpaper', 'title', 'tags', 'single', 'word']);
            const uniqueWords = [...new Set(
              words
                .map(w => w.trim())
                .filter(w => {
                  const lower = w.toLowerCase();
                  return w.length > 1 && !stopWords.has(lower);
                })
            )];
            return uniqueWords.slice(0, 10).join(', ');
          }

          function cleanCategory(raw) {
            if (!raw) return 'OTHER';
            const upper = raw.toUpperCase().replace(/[^A-Z0-9_\s]/g, ' ');

            // Alias map: words/phrases Gemini might use → exact Zedge category value
            const ALIAS_MAP = [
              { cat: 'ANIMALS',        aliases: ['ANIMAL', 'ANIMALS', 'WILDLIFE', 'PET', 'PETS', 'BIRD', 'BIRDS', 'CAT', 'DOG'] },
              { cat: 'ANIME',          aliases: ['ANIME', 'MANGA', 'ANIMATION', 'ANIMATED'] },
              { cat: 'CARS_N_VEHICLES',aliases: ['CAR', 'CARS', 'VEHICLE', 'VEHICLES', 'AUTOMOTIVE', 'AUTO', 'TRUCK', 'MOTORCYCLE', 'BIKE', 'TRANSPORT', 'CARS N VEHICLES', 'CARS AND VEHICLES'] },
              { cat: 'COMICS',         aliases: ['COMIC', 'COMICS', 'SUPERHERO', 'CARTOON', 'CARTOONS', 'ILLUSTRATION'] },
              { cat: 'DESIGNS',        aliases: ['DESIGN', 'DESIGNS', 'GRAPHIC', 'ABSTRACT', 'ART', 'ARTISTIC', 'PATTERN ART', 'GEOMETRIC'] },
              { cat: 'DRAWINGS',       aliases: ['DRAWING', 'DRAWINGS', 'SKETCH', 'SKETCHES', 'HAND DRAWN', 'PENCIL', 'INK'] },
              { cat: 'ENTERTAINMENT',  aliases: ['ENTERTAINMENT', 'MOVIE', 'MOVIES', 'FILM', 'TV', 'CELEBRITY', 'CELEBRITIES', 'ACTOR', 'ACTRESS', 'SHOW'] },
              { cat: 'FUNNY',          aliases: ['FUNNY', 'HUMOR', 'HUMOUR', 'MEME', 'MEMES', 'COMEDY', 'JOKE', 'JOKES', 'LOL'] },
              { cat: 'GAMES',          aliases: ['GAME', 'GAMES', 'GAMING', 'VIDEO GAME', 'VIDEOGAME', 'ESPORTS', 'GAMER'] },
              { cat: 'HOLIDAYS',       aliases: ['HOLIDAY', 'HOLIDAYS', 'CHRISTMAS', 'HALLOWEEN', 'EASTER', 'NEW YEAR', 'FESTIVAL', 'CELEBRATION'] },
              { cat: 'LOVE',           aliases: ['LOVE', 'ROMANCE', 'ROMANTIC', 'HEART', 'HEARTS', 'VALENTINES', 'COUPLE', 'WEDDING'] },
              { cat: 'MUSIC',          aliases: ['MUSIC', 'MUSICAL', 'SONG', 'SONGS', 'BAND', 'CONCERT', 'INSTRUMENT', 'DJ'] },
              { cat: 'NATURE',         aliases: ['NATURE', 'NATURAL', 'LANDSCAPE', 'FOREST', 'MOUNTAIN', 'OCEAN', 'FLOWER', 'FLORAL', 'PLANT', 'TREE', 'BEACH', 'SUNSET', 'SKY', 'FOOD', 'TRAVEL', 'CITY', 'ARCHITECTURE', 'SPACE EARTH'] },
              { cat: 'PATTERNS',       aliases: ['PATTERN', 'PATTERNS', 'TEXTURE', 'TEXTURES', 'MINIMALIST', 'MINIMAL', 'RETRO', 'VINTAGE'] },
              { cat: 'PEOPLE',         aliases: ['PEOPLE', 'PERSON', 'PORTRAIT', 'FACE', 'HUMAN', 'MAN', 'WOMAN', 'GIRL', 'BOY'] },
              { cat: 'SAYINGS',        aliases: ['SAYING', 'SAYINGS', 'QUOTE', 'QUOTES', 'MOTIVATIONAL', 'INSPIRATIONAL', 'TEXT', 'TYPOGRAPHY', 'WORDS'] },
              { cat: 'SPACE',          aliases: ['SPACE', 'GALAXY', 'UNIVERSE', 'COSMOS', 'STAR', 'STARS', 'PLANET', 'NEBULA', 'ASTRONAUT', 'SCI FI', 'SCIFI', 'SCIENCE FICTION'] },
              { cat: 'SPIRITUAL',      aliases: ['SPIRITUAL', 'RELIGION', 'RELIGIOUS', 'FAITH', 'GOD', 'MANDALA', 'MEDITATION', 'ZEN', 'BUDDHIST', 'ISLAMIC', 'CHRISTIAN'] },
              { cat: 'SPORTS',         aliases: ['SPORT', 'SPORTS', 'FOOTBALL', 'BASKETBALL', 'SOCCER', 'TENNIS', 'BASEBALL', 'ATHLETICS', 'FITNESS', 'GYM'] },
              { cat: 'TECHNOLOGY',     aliases: ['TECHNOLOGY', 'TECH', 'DIGITAL', 'CYBER', 'NEON', 'FUTURISTIC', 'COMPUTER', 'ROBOT', 'AI', 'CIRCUIT', 'DARK'] },
            ];

            for (const { cat, aliases } of ALIAS_MAP) {
              if (aliases.some(a => upper.includes(a))) return cat;
            }
            return 'OTHER';
          }

          function cleanDescription(raw) {
            if (!raw) return '';
            const quoteMatch = raw.match(/"([^"\r\n]{3,100})"/);
            let text = quoteMatch ? quoteMatch[1] : raw;
            text = text.replace(/^(here is a short description:|description:)/i, '').trim();
            const words = text.split(/\s+/).filter(Boolean);
            return words.slice(0, 5).join(' ');
          }

          // ─── FIREBASE: SCAN FOR IMAGES WITHOUT METADATA ───────────────────────────
          async function scanImagesWithoutMetadata(dbUrl, queuePath) {
            console.log(`  🔍 Scanning ${dbUrl}/${queuePath} for images without metadata...`);
            const res = await fetch(`${dbUrl}/${queuePath}.json`);
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase read failed (${res.status}): ${err.slice(0, 200)}`);
            }
            const data = await res.json();
            if (!data || typeof data !== 'object') {
              console.log('  ℹ️  Queue is empty or not an object — nothing to process.');
              return [];
            }

            let totalRecords = 0, skippedNotImage = 0, skippedHasMetadata = 0, skippedNoData = 0;
            const candidates = [];

            for (const [key, record] of Object.entries(data)) {
              if (!record || typeof record !== 'object') continue;
              totalRecords++;

              // ── Step 1: Confirm it is an IMAGE record ──────────────────────────────
              // Primary:   type field set to "image/*"  (always written by distribute-image.html)
              // Secondary: isMp3 explicitly set to false (older records without type field)
              // Exclude:   isMp3: true  (ringtones), missing type AND isMp3 not explicitly false
              const typeIsImage = typeof record.type === 'string' && record.type.startsWith('image/');
              const isExplicitlyImage = record.isImage === true;
              const isImplicitlyImage = record.isMp3 === false && !record.type; // only if type is absent
              const isImage = typeIsImage || isExplicitlyImage || isImplicitlyImage;

              // Content kind: WALLPAPER | WALLPAPER_24H | WALLPAPER_DUAL | WALLPAPER_BATTERY
              //             | LIVE_WALLPAPER | CHARGING_ANIMATION (videos accepted too)
              const kind = getRecordKind(record);
              const isVideoContent = !!VIDEO_KINDS[kind];

              if (!isImage && !isVideoContent) {
                skippedNotImage++;
                continue;
              }

              // ── Step 2: Only process records that are MISSING metadata ─────────────
              const missingTitle    = !record.title    || String(record.title).trim()    === '';
              const missingTags     = !record.tags     || String(record.tags).trim()     === '';
              const missingCategory = !record.category || String(record.category).trim() === '';
              const needsMetadata   = missingTitle || missingTags || missingCategory;

              if (!needsMetadata) {
                skippedHasMetadata++;
                continue; // already has full metadata — skip
              }

              // ── Step 3: Must have a downloadable image source ──────────────────────
              // fileUrl   = R2 URL (written by distribute-image.html)
              // imageUrl  = legacy remote URL
              // fileBase64 = inline base64 (older records)
              const setSlotUrl = SET_KINDS[kind] ? firstSlotUrl(record, kind) : '';
              const hasSource = !!(record.fileUrl || record.imageUrl || record.fileBase64 || setSlotUrl || (VIDEO_KINDS[kind] && record.thumbUrl)); // v27.10 video thumb
              if (!hasSource) {
                skippedNoData++;
                console.warn(`  ⚠️  [${key}] Skipped — no fileUrl / imageUrl / fileBase64 / set slot file found.`);
                continue;
              }

              const sourceType = record.fileUrl ? 'R2 fileUrl' : record.imageUrl ? 'imageUrl' : record.fileBase64 ? 'fileBase64' : 'set slot file (R2)';
              const missing = [
                missingTitle    ? 'title'    : null,
                missingTags     ? 'tags'     : null,
                missingCategory ? 'category' : null,
              ].filter(Boolean).join(', ');
              console.log(`  ✅ [${key}] Queued — ${kindLabel(kind)} | source: ${sourceType} | missing: ${missing}`);
              candidates.push({ key, record, kind });
            }

            console.log(`  📊 Scan complete: ${totalRecords} total | ${skippedNotImage} not-image | ${skippedHasMetadata} already-done | ${skippedNoData} no-source | ${candidates.length} to process`);
            return candidates;
          }

          // ─── ZEDGE CONTENT POLICY GUARD (v21) ─────────────────────────────────────
          // Enforces Zedge's Content Guidelines on everything this workflow produces:
          // original-only (no artists, songs, characters, brands, logos, celebrities), no
          // adult / hate / violence / drugs / illegal content, accurate non-promotional
          // metadata, 2–10 real tags. Violations are regenerated or skipped — never uploaded.
          const ZEDGE_POLICY_RULES = `ZEDGE MARKETPLACE POLICY (MANDATORY — a single violation permanently suspends the seller account):
          - 100% ORIGINAL work only. Never name, reference, imitate or hint at any real artist, band, singer, song, lyric, album, film, TV show, game, anime, cartoon, comic, character, franchise, brand, company, product, logo, trademark, sports team, celebrity or public figure. No "in the style of", no "sounds like", no theme/cover/remix of anything existing.
          - No sexual, suggestive, nude or adult content. No hate speech, slurs, hate symbols, discrimination or stereotypes. No violence, gore, weapons, drugs, self-harm or illegal activity. Nothing involving minors.
          - Metadata must be truthful and describe ONLY this item. No promotional or spam words (free, download, app, website, subscribe, follow, link, buy), no URLs, hashtags, @handles, emojis, brand or service names, no misleading keywords.
          - Keywords: between 2 and 10 genuine descriptive single words.`;
          const POLICY_PROMO = /\b(free|download|downloads|website|subscribe|follow|buy|sale|discount|promo|www|http|https|telegram|whatsapp|instagram|tiktok|youtube|facebook|twitter|zedge)\b/i;
          const POLICY_ADULT = /\b(sexy|sex|sexual|nude|nudity|naked|porn|porno|xxx|erotic|erotica|boobs|breasts?|booty|bikini|lingerie|topless|hot girls?|seductive|nsfw|hentai|fetish|stripper|thong|underwear|cleavage)\b/i;
          const POLICY_HARM = /\b(nigg\w*|fagg?\w*|retard\w*|murder|gore|gun|guns|rifle|pistol|shooting|shooter|terror\w*|nazi|hitler|swastika|isis|jihad|marijuana|cocaine|heroin|meth|drugs|suicide|self-harm|rape|racist|slur)\b/i;
          const POLICY_IP = /\b(disney|pixar|marvel|dc comics|batman|superman|spider-?man|iron ?man|avengers|wolverine|x-?men|deadpool|harley quinn|star ?wars|darth|vader|yoda|jedi|mandalorian|grogu|harry ?potter|hogwarts|lord of the rings|hobbit|game of thrones|stranger things|squid game|breaking bad|pokemon|pikachu|charizard|super mario|luigi|zelda|minecraft|fortnite|roblox|among us|gta|call of duty|pubg|free fire|valorant|league of legends|overwatch|god of war|kratos|elden ring|naruto|goku|dragon ?ball|one piece|luffy|attack on titan|demon slayer|jujutsu|gojo|itachi|sasuke|death note|my hero academia|hello kitty|sanrio|mickey|minnie|donald duck|elsa|moana|encanto|toy story|shrek|minions|despicable|kung fu panda|spongebob|simpsons|rick and morty|peppa|paw patrol|barbie|hot wheels|lego|nike|adidas|puma|gucci|louis vuitton|iphone|samsung|xiaomi|oneplus|huawei|tesla|bmw|mercedes|audi|ferrari|lamborghini|porsche|toyota|coca-?cola|pepsi|starbucks|mcdonald'?s|kfc|netflix|spotify|nfl|nba|fifa|uefa|real madrid|barcelona|manchester united|liverpool fc|juventus|psg|messi|ronaldo|neymar|mbappe|lebron|taylor swift|beyonce|drake|eminem|rihanna|bts|blackpink|billie eilish|ed sheeran|weeknd|bad bunny|justin bieber|ariana grande|dua lipa|coldplay|imagine dragons|linkin park|metallica|beatles|nirvana|michael jackson|elvis|kanye|travis scott|post malone|shakira|adele|bruno mars|hans zimmer|john williams|bollywood|shah rukh|salman khan|allu arjun|pushpa|kgf|pathaan|jawan|kabir singh|arijit|pritam|ar rahman|a\.r\. rahman|anirudh|nokia|nokia tune|marimba|over the horizon|xbox|playstation|nintendo|godzilla|king kong|jurassic|transformers|optimus prime|bumblebee|pirates of the caribbean|jack sparrow|james bond|mission impossible|john wick|fast and furious|terminator|poppy playtime|huggy wuggy|skibidi|fnaf|cuphead|genshin|honkai|clash of clans|clash royale|brawl stars|candy crush|angry birds|subway surfers|temple run|flappy bird|tom and jerry|doraemon|shinchan|ben 10|scooby|looney|bugs bunny|winnie the pooh|cars movie|lightning mcqueen|olaf|stitch|lilo|baymax|zootopia|inside out|wednesday addams|squid|haikyuu|chainsaw man|spy x family|frieren|solo leveling|sung jinwoo)\b/i;
          function zedgePolicyIssues(meta) {
            const issues = [];
            const fields = { title: meta.title || '', tags: meta.tags || '', description: meta.description || '', prompt: meta.enhancedPrompt || '' };
            for (const [f, v] of Object.entries(fields)) {
              if (!v) continue;
              const ip = v.match(POLICY_IP); if (ip) issues.push(`${f}: protected name "${ip[0]}"`);
              const ad = v.match(POLICY_ADULT); if (ad) issues.push(`${f}: adult term "${ad[0]}"`);
              const hv = v.match(POLICY_HARM); if (hv) issues.push(`${f}: prohibited term "${hv[0]}"`);
              if (f !== 'prompt') {
                const pr = v.match(POLICY_PROMO); if (pr) issues.push(`${f}: promotional/spam word "${pr[0]}"`);
                if (/[#@]|https?:|www\.|\.(com|net|org|io|app)\b/i.test(v)) issues.push(`${f}: link/hashtag/handle`);
              }
            }
            return issues;
          }
          function zedgeCleanTags(tags) {
            const words = String(tags || '').split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z0-9-]{2,20}$/.test(w));
            const out = [];
            for (const w of words) if (!out.includes(w) && !POLICY_IP.test(w) && !POLICY_ADULT.test(w) && !POLICY_HARM.test(w) && !POLICY_PROMO.test(w)) out.push(w);
            return out.slice(0, 10);
          }
          // Returns { issues, meta } — meta has policy-clean, deduped, 2–10 tags.
          function zedgeEnforce(meta, kind) {
            const issues = zedgePolicyIssues(meta);
            const tags = zedgeCleanTags(meta.tags);
            const fallback = kind === 'image' ? ['wallpaper', 'background', 'art', 'design', 'phone', 'screen'] : ['melody', 'tune', 'alert', 'phone', 'music', 'sound'];
            const cat = String(meta.category || '').toLowerCase().replace(/[^a-z]/g, '');
            if (cat && cat !== 'other' && !tags.includes(cat)) tags.unshift(cat);
            for (const w of fallback) { if (tags.length >= 2) break; if (!tags.includes(w)) tags.push(w); }
            return { issues, meta: { ...meta, tags: tags.slice(0, 10).join(', ') } };
          }
          // ─── FIREBASE: PATCH METADATA ─────────────────────────────────────────────
          async function firebasePatchMetadata(dbUrl, queuePath, key, metadata) {
            const res = await fetch(`${dbUrl}/${queuePath}/${key}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(metadata)
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase PATCH failed (${res.status}): ${err.slice(0, 200)}`);
            }
            return await res.json();
          }

          // ─── DECODE MEDIA → TEMP IMAGE FILE ───────────────────────────────────────
          // Supports fileBase64 (data URL), remote imageUrl / fileUrl (R2), wallpaper
          // set slot files (24H / Dual / Battery), and video content — for videos a
          // single representative frame is extracted with ffmpeg for Gemini vision.
          async function imageToTempFile(record, key, kind) {
            const tmpDir = path.join(os.tmpdir(), 'img_meta');
            fs.mkdirSync(tmpDir, { recursive: true });

            if (record.fileBase64) {
              let base64Data = record.fileBase64;
              let ext = 'png';

              if (base64Data.startsWith('data:')) {
                const mimeMatch = base64Data.match(/data:([^;]+);base64,/);
                if (mimeMatch) {
                  const mime = mimeMatch[1];
                  ext = mime.split('/')[1] || 'png';
                }
                base64Data = base64Data.replace(/^data:[^;]+;base64,/, '');
              }

              const buffer = Buffer.from(base64Data, 'base64');
              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Saved image from fileBase64 → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;

            } else {
              // fileUrl  = R2 URL saved by distribute-image.html
              // imageUrl = legacy field name (kept for backwards compatibility)
              // Wallpaper sets: fall back to the first slot file when fileUrl is absent
              // v27.10 video thumb: Live Wallpaper / Charging Animation records already carry a JPEG
              // thumbnail (thumbUrl, written by the panel + app). Use it directly - no multi-MB video
              // download, no ffmpeg dependency. Falls back to frame extraction only when thumbUrl is missing.
              if (VIDEO_KINDS[kind] && record.thumbUrl) {
                console.log(`  🎬 Video item - using thumbnail: ${record.thumbUrl}`);
                const tRes = await fetch(record.thumbUrl);
                if (tRes.ok) {
                  const tBuf = Buffer.from(await tRes.arrayBuffer());
                  if (tBuf.length > 1024) {
                    const tPath = path.join(tmpDir, `${key}.jpg`);
                    fs.writeFileSync(tPath, tBuf);
                    console.log(`  💾 Saved video thumbnail → ${tPath} (${(tBuf.length / 1024).toFixed(1)} KB)`);
                    return tPath;
                  }
                }
                console.warn(`  ⚠️  Thumbnail fetch failed (HTTP ${tRes.status}) - falling back to video frame extraction`);
              }
              const remoteUrl = record.fileUrl || record.imageUrl || (SET_KINDS[kind] ? firstSlotUrl(record, kind) : '');
              if (!remoteUrl) throw new Error('No fileBase64, fileUrl, imageUrl, or set slot file found on record.');
              const urlSource = record.fileUrl ? 'fileUrl (R2)' : record.imageUrl ? 'imageUrl' : 'set slot file (R2)';
              console.log(`  🌐 Downloading from ${urlSource}: ${remoteUrl}`);
              const res = await fetch(remoteUrl);
              if (!res.ok) throw new Error(`Failed to fetch ${urlSource} (HTTP ${res.status}): ${remoteUrl}`);
              const buffer = Buffer.from(await res.arrayBuffer());
              const contentType = res.headers.get('content-type') || 'image/jpeg';
              const ext = contentType.split('/')[1]?.split(';')[0] || 'jpg';

              // VIDEO CONTENT (Live Wallpaper / Charging Animation): save the video,
              // then extract a single representative frame with ffmpeg for Gemini.
              if (VIDEO_KINDS[kind] || contentType.startsWith('video/')) {
                const videoExt = contentType.startsWith('video/') ? ext : 'mp4';
                const videoPath = path.join(tmpDir, `${key}_video.${videoExt}`);
                fs.writeFileSync(videoPath, buffer);
                console.log(`  💾 Downloaded video → ${videoPath} (${(buffer.length / 1024).toFixed(1)} KB)`);
                const framePath = path.join(tmpDir, `${key}.jpg`);
                try {
                  execSync(`ffmpeg -y -ss 1 -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                } catch (e) {
                  // Very short clips can fail at -ss 1 — retry from the very first frame
                  execSync(`ffmpeg -y -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                }
                try { fs.unlinkSync(videoPath); } catch {}
                if (!fs.existsSync(framePath) || !fs.statSync(framePath).size) {
                  throw new Error('ffmpeg could not extract a frame from the video.');
                }
                console.log(`  🎬 Extracted video frame → ${framePath}`);
                return framePath;
              }

              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Downloaded from ${urlSource} → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;
            }
          }

          // ════════════════════════════════════════════════════════════════════════════
          // GEMINI WEB RPC (ported 1:1 from the Gemini HD Studio Chrome extension)
          // ════════════════════════════════════════════════════════════════════════════
          // Instead of driving gemini.google.com with Playwright (DOM clicks, clipboard
          // paste, 90s waits), we call the exact same backend endpoints the extension
          // uses:
          //   1. GET  /u/{n}/app                     → scrape SNlM0e (at), cfb2h (bl), FdrFJe (f.sid)
          //   2. POST push.clients6.google.com/upload → resumable image upload → /contrib_service/... path
          //   3. POST BardFrontendService/ProcessFile → optional file UUID
          //   4. POST BardFrontendService/StreamGenerate → prompt + attachment → wrb.fr reply
          // No browser = no rendering flakiness, no overlay/intercept issues, and the
          // reply arrives in a single HTTP response instead of a DOM polling loop.
          // ════════════════════════════════════════════════════════════════════════════
          const GEMINI_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          const GEMINI_UPLOAD_INIT_URL = 'https://push.clients6.google.com/upload/';
          const GEMINI_PUSH_ID = 'feeds/mcudyrk2a4khkz';
          const GEMINI_CLIENT_PCTX = 'CgcSBWjK7pYx';
          const GEMINI_TENANT_ID = 'bard-storage';
          const SESSION_TTL_MS = 15 * 60 * 1000;
          let cachedGeminiSession = null;

          // ─── STEP 1: SESSION BOOTSTRAP (SNlM0e / cfb2h / FdrFJe from the app HTML) ─
          // NOTE ON "Parse Error: Header overflow": Node's HTTP parser caps response
          // headers at 16 KB by default (HPE_HEADER_OVERFLOW). Gemini's /app response
          // ships a large header block (many Set-Cookie entries), which Chrome accepts
          // but Node rejects. The workflow raises the cap with
          // --max-http-header-size=262144 (CLI flag + NODE_OPTIONS) before this code runs.
          async function fetchGeminiSession(authUser, cookieHeader = COOKIE_HEADER) {
            // Gemini serves the bootstrap tokens from several app entry points depending
            // on account type and rollout state. Try each instead of giving up on the first.
            const appUrls = [
              `https://gemini.google.com/u/${authUser}/app?authuser=${authUser}`,
              `https://gemini.google.com/app?authuser=${authUser}`,
              `https://gemini.google.com/u/${authUser}/app?authuser=${authUser}&hl=en`
            ];

            let lastErr = null;
            for (const appUrl of appUrls) {
              let res;
              try {
                res = await fetchWithTimeout(appUrl, {
                  method: 'GET',
                  redirect: 'follow',
                  headers: {
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    'Cookie': cookieHeader,
                    'User-Agent': GEMINI_UA
                  }
                }, 45000);
              } catch (e) {
                if (/header overflow|HPE_HEADER_OVERFLOW/i.test(e.message || '')) {
                  throw new Error(
                    `HTTP header overflow on u/${authUser} — Node's header limit is ${(http.maxHeaderSize / 1024)} KB. ` +
                    `Re-run with --max-http-header-size=262144 (the workflow already sets this; if you see it, the flag was stripped).`
                  );
                }
                lastErr = e;
                continue;
              }

              const finalUrl = res.url || '';
              if (!res.ok || /accounts\.google\.com|ServiceLogin|\/signin|\/login/.test(finalUrl)) {
                lastErr = new Error(`u/${authUser} not signed in (HTTP ${res.status}, landed on ${finalUrl.slice(0, 80)})`);
                continue;
              }

              const html = await res.text();
              const atMatch   = html.match(/"SNlM0e":"([^"]+)"/);
              const blMatch   = html.match(/"cfb2h":"([^"]+)"/);
              const fSidMatch = html.match(/"FdrFJe":"([^"]+)"/);
              if (!atMatch || !atMatch[1]) {
                lastErr = new Error(`SNlM0e token not found in Gemini app HTML for u/${authUser} (${appUrl}) — session cookies likely expired`);
                continue;
              }
              return {
                authUser,
                at: atMatch[1],
                bl: blMatch ? blMatch[1] : 'boq_gemini-web-uiserver_20261106.06_p0',
                fSid: fSidMatch ? fSidMatch[1] : '',
                fetchedAt: Date.now()
              };
            }
            throw lastErr || new Error(`u/${authUser}: could not bootstrap a Gemini session`);
          }

          async function getGeminiSession(forceRefresh = false) {
            if (!forceRefresh && cachedGeminiSession && cachedGeminiSession.at && (Date.now() - cachedGeminiSession.fetchedAt) < SESSION_TTL_MS) {
              return cachedGeminiSession;
            }
            const preferred = parseInt(process.env.GEMINI_AUTH_USER || '0', 10) || 0;
            try {
              cachedGeminiSession = await fetchGeminiSession(preferred, COOKIE_HEADER);
            } catch (e) {
              console.warn(`  ⚠️  Gemini u/${preferred} session failed (${e.message}) — retrying with the minimal auth-only cookie set...`);
              try {
                cachedGeminiSession = await fetchGeminiSession(preferred, COOKIE_HEADER_MIN);
                console.log('  ✅ Minimal cookie set worked (the full jar was too large for Google).');
              } catch (e2) {
                console.warn(`  ⚠️  Minimal cookie set also failed (${e2.message}) — scanning u/0..u/5 like the extension...`);
                let found = null;
                for (const u of [0, 1, 2, 3, 4, 5]) {
                  if (u === preferred) continue;
                  try { found = await fetchGeminiSession(u, COOKIE_HEADER); break; } catch (_) {}
                }
                if (!found) throw e;
                cachedGeminiSession = found;
              }
            }
            console.log(`🔑 Gemini RPC session ready: account u/${cachedGeminiSession.authUser}, bl=${cachedGeminiSession.bl}`);
            return cachedGeminiSession;
          }

          // ─── STEP 4 HELPER: parse StreamGenerate wrb.fr frames → assistant text ────
          function parseStreamGenerateResponse(rawText) {
            let assistantText = '';
            for (const line of rawText.split('\n')) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('[')) continue;
              try {
                const outer = JSON.parse(trimmed);
                if (!Array.isArray(outer)) continue;
                for (const entry of outer) {
                  if (Array.isArray(entry) && entry[0] === 'wrb.fr' && typeof entry[2] === 'string') {
                    try {
                      const inner = JSON.parse(entry[2]);
                      if (
                        Array.isArray(inner) &&
                        Array.isArray(inner[4]) &&
                        Array.isArray(inner[4][0]) &&
                        Array.isArray(inner[4][0][1]) &&
                        typeof inner[4][0][1][0] === 'string'
                      ) {
                        const candidateText = inner[4][0][1][0];
                        if (candidateText.trim().length >= assistantText.trim().length) {
                          assistantText = candidateText;
                        }
                      }
                    } catch (_) {}
                  }
                }
              } catch (_) {}
            }
            return assistantText.trim();
          }

          // ─── STEP 2+3: RESUMABLE IMAGE UPLOAD (bard-storage) + ProcessFile UUID ───
          async function uploadImageToGeminiRpc(imagePath, session) {
            const u = session.authUser;
            const buffer = fs.readFileSync(imagePath);
            const filename = path.basename(imagePath);
            const mimeType = /\.jpe?g$/i.test(imagePath) ? 'image/jpeg'
                           : /\.webp$/i.test(imagePath) ? 'image/webp' : 'image/png';
            console.log(`    📎 Uploading image via RPC: ${filename} (${(buffer.length / 1024).toFixed(1)} KB)`);

            // 2a. Init resumable upload session
            const startResp = await fetchWithTimeout(`${GEMINI_UPLOAD_INIT_URL}?authuser=${u}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'Push-Id': GEMINI_PUSH_ID,
                'X-Client-Pctx': GEMINI_CLIENT_PCTX,
                'X-Goog-AuthUser': String(u),
                'X-Goog-Upload-Command': 'start',
                'X-Goog-Upload-Header-Content-Length': String(buffer.length),
                'X-Goog-Upload-Protocol': 'resumable',
                'X-Tenant-Id': GEMINI_TENANT_ID,
                'Cookie': COOKIE_HEADER,
                'User-Agent': GEMINI_UA
              },
              body: `File name: ${filename}`
            }, 45000);
            if (!startResp.ok) {
              throw new Error(`Gemini resumable upload init failed (HTTP ${startResp.status})`);
            }
            const uploadUrl = startResp.headers.get('x-goog-upload-url') || startResp.headers.get('x-goog-upload-control-url');
            if (!uploadUrl) {
              throw new Error('Gemini upload init did not return x-goog-upload-url header.');
            }

            // 2b. Send the raw bytes and finalize
            const finalizeResp = await fetchWithTimeout(uploadUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8',
                'Push-Id': GEMINI_PUSH_ID,
                'X-Client-Pctx': GEMINI_CLIENT_PCTX,
                'X-Goog-Upload-Command': 'upload, finalize',
                'X-Goog-Upload-Offset': '0',
                'X-Tenant-Id': GEMINI_TENANT_ID,
                'Cookie': COOKIE_HEADER,
                'User-Agent': GEMINI_UA
              },
              body: buffer
            }, 120000);
            if (!finalizeResp.ok) {
              throw new Error(`Gemini image binary upload failed (HTTP ${finalizeResp.status})`);
            }
            const uploadPath = (await finalizeResp.text()).trim();
            if (!uploadPath || !uploadPath.startsWith('/contrib_service/')) {
              throw new Error(`Unexpected upload path returned by bard-storage: "${uploadPath.slice(0, 100)}"`);
            }

            // 3. Optional: ProcessFile RPC → file UUID (makes the StreamGenerate attachment more reliable)
            let processFileUuid = null;
            try {
              const reqId = Math.floor(100000 + Math.random() * 900000);
              const qp = new URLSearchParams({ bl: session.bl, hl: 'en', _reqid: String(reqId), rt: 'c', authuser: String(u) });
              if (session.fSid) qp.set('f.sid', session.fSid);
              const processEndpoint = `https://gemini.google.com/u/${u}/_/BardChatUi/data/assistant.lamda.BardFrontendService/ProcessFile?${qp.toString()}`;
              const processInner = [
                [[uploadPath, null, 1, mimeType], filename, null, null, null, null, null, null, [0]],
                null,
                1,
                ['en']
              ];
              const form = new URLSearchParams();
              form.set('f.req', JSON.stringify([null, JSON.stringify(processInner)]));
              form.set('at', session.at);
              const procResp = await fetchWithTimeout(processEndpoint, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                  'X-Same-Domain': '1',
                  'Cookie': COOKIE_HEADER,
                  'User-Agent': GEMINI_UA
                },
                body: form.toString()
              }, 45000);
              if (procResp.ok) {
                const procText = await procResp.text();
                const uuidMatch = procText.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
                if (uuidMatch) processFileUuid = uuidMatch[0];
              }
            } catch (_) {}

            console.log(`    ✅ Image uploaded via RPC → ${uploadPath.slice(0, 55)}… ${processFileUuid ? '(ProcessFile uuid ok)' : '(no uuid, will use path-only payload)'}`);
            return { uploadPath, mimeType, filename, processFileUuid, authUser: u };
          }

          // ─── STEP 4: StreamGenerate RPC (prompt + optional image attachment) ──────
          // Payload variants ported 1:1 from the extension — if Google rejects one
          // attachment descriptor shape, the next variant is tried automatically.
          function buildStreamPayloads(promptText, attachment) {
            const variants = [];
            if (attachment) {
              // Variant 1: full descriptor (+ ProcessFile uuid when available) + padded 42-slot frame
              const desc1 = attachment.processFileUuid
                ? [attachment.uploadPath, 1, null, attachment.mimeType, attachment.processFileUuid]
                : [attachment.uploadPath, 1, null, attachment.mimeType];
              const att1 = [desc1, attachment.filename, null, null, null, null, null, null, [0]];
              const inner1 = [
                [promptText, 0, null, [att1], null, null, 0],
                ['en'],
                ['', '', ''],
                null, null, null,
                [1],
                1,
                null, null, 1, 0
              ];
              while (inner1.length < 41) inner1.push(null);
              inner1[41] = [1];
              variants.push(inner1);

              // Variant 2: path descriptor with the null second slot
              const desc2 = [attachment.uploadPath, null, 1, attachment.mimeType];
              const att2 = [desc2, attachment.filename, null, null, null, null, null, null, [0]];
              variants.push([
                [promptText, 0, null, [att2], null, null, 0],
                ['en'],
                ['', '', ''],
                null, null, null,
                [1],
                1,
                null, null, 1, 0
              ]);

              // Variant 3: minimal [[path], filename] attachment
              variants.push([
                [promptText, 0, null, [[[attachment.uploadPath], attachment.filename]], null, null, 0],
                ['en'],
                ['', '', ''],
                null, null, null,
                [1],
                1,
                null, null, 1, 0
              ]);
            } else {
              // Text-only prompt (fresh chat: empty conversation id)
              variants.push([
                [promptText, 0, null, null, null, null, 0],
                ['en'],
                ['', '', ''],
                null, null, null,
                [1],
                1,
                null, null, 1, 0
              ]);
            }
            return variants;
          }

          async function callGeminiRpc(promptText, attachment = null) {
            console.log(`    🌐 Sending prompt via StreamGenerate RPC (${promptText.length} chars)...`);
            let session = await getGeminiSession(false);
            const variants = buildStreamPayloads(promptText, attachment);
            let lastErr = 'Empty response from Gemini';

            for (let v = 0; v < variants.length; v++) {
              for (let attempt = 0; attempt < 2; attempt++) {
                try {
                  const u = session.authUser;
                  const reqId = Math.floor(100000 + Math.random() * 900000);
                  const doPost = async (sess) => {
                    const qp = new URLSearchParams({ bl: sess.bl, hl: 'en', _reqid: String(reqId), rt: 'c', authuser: String(sess.authUser) });
                    if (sess.fSid) qp.set('f.sid', sess.fSid);
                    const endpoint = `https://gemini.google.com/u/${sess.authUser}/_/BardChatUi/data/assistant.lamda.BardFrontendService/StreamGenerate?${qp.toString()}`;
                    const form = new URLSearchParams();
                    form.set('f.req', JSON.stringify([null, JSON.stringify(variants[v])]));
                    form.set('at', sess.at);
                    return fetchWithTimeout(endpoint, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                        'X-Same-Domain': '1',
                        'Cookie': COOKIE_HEADER,
                        'User-Agent': GEMINI_UA
                      },
                      body: form.toString()
                    }, 120000);
                  };

                  let resp = await doPost(session);
                  // Token stale / rejected → refresh SNlM0e once and retry, exactly like the extension
                  if (resp.status === 401 || resp.status === 403 || resp.status === 400) {
                    console.warn(`    ⚠️  StreamGenerate HTTP ${resp.status} — refreshing session token and retrying...`);
                    session = await getGeminiSession(true);
                    resp = await doPost(session);
                  }

                  if (!resp.ok) {
                    lastErr = `HTTP ${resp.status}`;
                    console.warn(`    ⚠️  StreamGenerate payload v${v + 1} attempt ${attempt + 1}: HTTP ${resp.status}`);
                    continue;
                  }

                  const text = parseStreamGenerateResponse(await resp.text());
                  if (text && text.length > 0) {
                    console.log(`    ✅ Got RPC response (${text.length} chars, payload v${v + 1})`);
                    return text;
                  }
                  lastErr = 'Empty assistant text in StreamGenerate response';
                } catch (e) {
                  lastErr = (e && e.message) || String(e);
                  console.warn(`    ⚠️  StreamGenerate payload v${v + 1} attempt ${attempt + 1} failed: ${lastErr}`);
                }
                await sleep(1500 * (attempt + 1));
              }
            }
            throw new Error(`Gemini RPC failed on all payload variants: ${lastErr}`);
          }

          // ─── GENERATE METADATA FOR ONE IMAGE VIA GEMINI RPC ───────────────────────
          // Same prompt + same tolerant tag parser as before — only the transport
          // changed (Playwright DOM → extension-style web requests).
          async function generateImageMetadata(imagePath, key, kind) {
            console.log(`  🤖 Generating metadata for image [${key}] via Gemini RPC...`);

            const session = await getGeminiSession(false);
            const attachment = await uploadImageToGeminiRpc(imagePath, session);

            // Build the metadata prompt (content-kind aware: wallpaper / set / video)
            const validCategories = VALID_IMG_CATS.filter(c => c !== 'OTHER').join(', ');
            const kindContext = KIND_PROMPT_CONTEXT[kind] || KIND_PROMPT_CONTEXT.WALLPAPER;
            const METADATA_PROMPT =
              `You are an expert image curator, SEO metadata specialist and Zedge marketplace compliance reviewer.\n\n${ZEDGE_POLICY_RULES}\n\n` +
              `${kindContext}\n` +
              `Look at the attached image carefully and generate the following metadata:\n` +
              `1. A creative and UNIQUE TITLE (max 25 characters). Use evocative, descriptive words. Avoid generic filler words like "beautiful", "amazing", "stunning". No quotes.\n` +
              `2. 15 relevant, descriptive single-word KEYWORDS (comma-separated). Cover the subject, colors, mood, style, and use-case.\n` +
              `3. The most appropriate CATEGORY selected ONLY from this list: ${validCategories}.\n` +
              `4. A SHORT description in MAXIMUM 5 WORDS. No punctuation, no full sentences.\n` +
              `5. POLICY verdict: write OK if this image is clearly safe and original under the policy above. Otherwise write FLAG: <short reason> — flag any recognizable copyrighted character, franchise art, brand/logo/trademark, celebrity or real identifiable person (selfie, family photo), text watermark, sexual/suggestive content, hate symbol, violence, weapons, drugs, apparent minors, or a stretched / blurry / badly cropped low-quality image.\n\n` +
              `CRITICAL: Format your ENTIRE response EXACTLY like this — no other text outside these tags:\n` +
              `[TITLE]...[/TITLE]\n` +
              `[KEYWORDS]...[/KEYWORDS]\n` +
              `[CATEGORY]...[/CATEGORY]\n` +
              `[DESCRIPTION]...[/DESCRIPTION]\n` +
              `[POLICY]OK or FLAG: reason[/POLICY]`;

            const responseText = await callGeminiRpc(METADATA_PROMPT, attachment);

            // Parse response tags
            const getTagValue = (text, tag) => {
              // v27.10 tolerant parser: Gemini renders markdown, so "[ENHANCED_PROMPT]" can come back as
              // "**[ENHANCED PROMPT]**", "[ENHANCEDPROMPT]", with a ":" after it, or without its closing tag.
              // The old strict regex then returned '' and the caller silently used a fallback value.
              const t = tag.replace(/_/g, '[_ \\-]?');
              const open = new RegExp(`\\[\\s*${t}\\s*\\]\\s*:?`, 'i');
              const m = text.match(open);
              if (!m) return '';
              let rest = text.slice(m.index + m[0].length);
              const close = rest.match(new RegExp(`\\[\\s*\\/\\s*${t}\\s*\\]`, 'i'));
              if (close) rest = rest.slice(0, close.index);
              else { const nx = rest.match(/\[\s*\/?\s*(ENHANCED[_ -]?PROMPT|TITLE|KEYWORDS|CATEGORY|DESCRIPTION|POLICY)\s*\]/i); if (nx) rest = rest.slice(0, nx.index); }
              rest = rest.replace(/\*\*/g, '').replace(/^`+|`+$/g, '').replace(/^\s*:\s*/, '').trim();
              return /^(\.{3}|…)$/.test(rest) ? '' : rest;   // the literal "..." template placeholder counts as missing
            };

            const title       = cleanTitle(getTagValue(responseText, 'TITLE'))       || `Image ${key.slice(0, 8)}`;
            const tags        = cleanKeywords(getTagValue(responseText, 'KEYWORDS'));
            const category    = cleanCategory(getTagValue(responseText, 'CATEGORY'));
            const description = cleanDescription(getTagValue(responseText, 'DESCRIPTION'));

            console.log(`  ✨ Title    : "${title}"`);
            console.log(`  🏷️  Tags     : ${tags}`);
            console.log(`  📁 Category : ${category}`);
            console.log(`  📝 Desc     : ${description}`);

            const policy = getTagValue(responseText, 'POLICY');
            console.log(`  🛡️  Policy   : ${policy || '(no verdict)'}`);
            return { title, tags, category, description, policy };
          }

          // ─── MAIN ─────────────────────────────────────────────────────────────────
          console.log('============================================================');
          console.log('  🖼️   IMAGE METADATA GENERATOR → FIREBASE');
          console.log('============================================================');
          console.log('📋 Max images to process : All (unlimited)');
          console.log(`📂 Queue path            : ${IMAGE_QUEUE_PATH}`);
          console.log(`🎯 Target account        : ${TARGET_ACCOUNT}`);
          TARGET_DB_URLS.forEach(d => console.log(`   🔥 ${d.name}: ${d.url}`));
          console.log('🌐 Gemini Mode           : Web RPC (StreamGenerate — extension-style, no browser)');
          console.log('============================================================\n');

          // ─── VERIFY GEMINI RPC SESSION (OPTIONAL COOKIES -> LIVE BROWSER FALLBACK) ─
          let metaBrowserCtx = null;
          let metaVncTunnelProc = null;
          async function launchMetadataLiveBrowserLogin() {
            console.log('🌐 Starting Live Gemini Browser Login (no cookies required)...');
            const { spawn } = await import('child_process');
            try {
              execSync('pkill -f "Xvfb :99" || true; pkill -f "x11vnc" || true; pkill -f "websockify" || true', { stdio: 'ignore' });
            } catch {}
            spawn('Xvfb', [':99', '-screen', '0', '1280x800x24'], { detached: true, stdio: 'ignore' }).unref();
            await sleep(800);
            spawn('openbox', [], { env: { ...process.env, DISPLAY: ':99' }, detached: true, stdio: 'ignore' }).unref();
            spawn('x11vnc', ['-display', ':99', '-forever', '-shared', '-nopw', '-rfbport', '5900'], { detached: true, stdio: 'ignore' }).unref();
            spawn('websockify', ['--web=/usr/share/novnc/', '6080', 'localhost:5900'], { detached: true, stdio: 'ignore' }).unref();
            await sleep(1000);

            const vncUrl = await new Promise((resolve) => {
              let resolved = false;
              metaVncTunnelProc = spawn('cloudflared', ['tunnel', '--no-autoupdate', '--url', 'http://127.0.0.1:6080'], { stdio: ['ignore', 'pipe', 'pipe'] });
              const onOut = (chunk) => {
                const m = String(chunk).match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
                if (m && !resolved) { resolved = true; resolve(m[0] + '/vnc.html?autoconnect=1&resize=scale'); }
              };
              metaVncTunnelProc.stdout.on('data', onOut);
              metaVncTunnelProc.stderr.on('data', onOut);
              setTimeout(() => { if (!resolved) { resolved = true; resolve(''); } }, 20000);
            });

            const { chromium } = await import('patchright');
            const profileDir = '/tmp/gemini_meta_profile';
            fs.mkdirSync(profileDir, { recursive: true });
            metaBrowserCtx = await chromium.launchPersistentContext(profileDir, {
              channel: 'chrome',
              headless: false,
              env: { ...process.env, DISPLAY: ':99' },
              viewport: { width: 1260, height: 760 },
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = metaBrowserCtx.pages()[0] || await metaBrowserCtx.newPage();
            await page.goto('https://gemini.google.com/app', { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => {});

            console.log('\n============================================================');
            console.log(`  🔐 OPEN THIS LINK TO LOG INTO GMAIL FOR GEMINI:`);
            console.log(`  ${vncUrl || 'http://127.0.0.1:6080/vnc.html?autoconnect=1'}`);
            console.log('  Waiting up to 15 minutes for you to sign in...');
            console.log('============================================================\n');

            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              try {
                const liveCookies = await metaBrowserCtx.cookies(['https://gemini.google.com', 'https://google.com']).catch(() => []);
                const hasAuth = liveCookies.some(c => c && (c.name === '__Secure-1PSID' || c.name === '__Secure-3PSID' || c.name === 'SAPISID') && c.value);
                if (hasAuth) {
                  COOKIE_HEADER = buildCookieHeader({ cookies: liveCookies });
                  COOKIE_HEADER_MIN = buildMinimalCookieHeader({ cookies: liveCookies });
                  const activePage = metaBrowserCtx.pages().find(p => !p.isClosed() && /gemini\.google\.com/i.test(p.url() || '')) || page;
                  const html = await activePage.content().catch(() => '');
                  const at = (html.match(/"SNlM0e"\s*:\s*"([^"]+)"/) || [])[1] || '';
                  const bl = (html.match(/"cfb2h"\s*:\s*"([^"]+)"/) || [])[1] || 'boq_gemini-web-uiserver_20261122.16_p0';
                  const fSid = (html.match(/"FdrFJe"\s*:\s*"(-?\d+)"/) || [])[1] || '';
                  const uMatch = (activePage.url() || '').match(/\/u\/(\d+)/);
                  const authUser = uMatch ? parseInt(uMatch[1], 10) : 0;
                  if (at) {
                    cachedGeminiSession = { authUser, at, bl, fSid, fetchedAt: Date.now() };
                    console.log(`✅ Live Gemini Browser signed in! (u/${authUser}, bl=${bl})\n`);
                    return;
                  }
                  try {
                    cachedGeminiSession = await fetchGeminiSession(authUser, COOKIE_HEADER);
                    console.log(`✅ Live Gemini Browser signed in via cookies! (u/${cachedGeminiSession.authUser}, bl=${cachedGeminiSession.bl})\n`);
                    return;
                  } catch {}
                }
              } catch {}
              await sleep(3000);
            }
            throw new Error('Timed out waiting for Live Gemini Browser Gmail login (15m)');
          }

          if (COOKIE_HEADER) {
            console.log('🔐 Verifying optional Gemini cookie session (fetching SNlM0e token)...');
            try {
              await getGeminiSession(false);
              console.log('✅ Cookie session verified — Gemini RPC ready.\n');
            } catch (err) {
              console.warn(`⚠️  Optional cookie session failed (${err.message}) — launching Live Gemini Browser Login...`);
              await launchMetadataLiveBrowserLogin();
            }
          } else {
            console.log('ℹ️  No Gemini cookies provided — using Live Gemini Browser Login.');
            await launchMetadataLiveBrowserLogin();
          }

          // ─── PROCESS EACH DB TARGET ───────────────────────────────────────────────
          let totalSuccess = 0;
          let totalHeld = 0;
          let totalFailed  = 0;

          for (const db of TARGET_DB_URLS) {
            console.log(`\n🔥 Processing DB: ${db.name} (${db.url})`);

            let candidates;
            try {
              candidates = await scanImagesWithoutMetadata(db.url, IMAGE_QUEUE_PATH);
            } catch (err) {
              console.error(`  ❌ Failed to scan ${db.name}: ${err.message}`);
              continue;
            }

            if (candidates.length === 0) {
              console.log(`  ✅ ${db.name}: No images need metadata — all good!`);
              continue;
            }

            // Process ALL candidates — smart auto-scan, no artificial cap.
            // scanImagesWithoutMetadata() already filters out any image that has
            // all three metadata fields (title + tags + category) filled in.
            const toProcess = candidates;
            console.log(`  🚀 Auto-processing all ${toProcess.length} image(s) missing metadata...`);

            for (let i = 0; i < toProcess.length; i++) {
              const { key, record, kind } = toProcess[i];
              console.log(`\n  [${i + 1}/${toProcess.length}] Key: ${key} — ${kindLabel(kind)}`);

              let tmpImagePath = null;
              try {
                tmpImagePath = await imageToTempFile(record, key, kind);
                let metadata = await generateImageMetadata(tmpImagePath, key, kind);
                let check = zedgeEnforce(metadata, 'image');
                if (check.issues.length) {
                  console.warn(`  🚫 [${db.name}] [${key}] Zedge policy: ${check.issues.join('; ')} — regenerating metadata once`);
                  await sleep(2000);
                  metadata = await generateImageMetadata(tmpImagePath, key, kind);
                  check = zedgeEnforce(metadata, 'image');
                }
                const verdict = String(metadata.policy || '').trim();
                const flag = /^FLAG/i.test(verdict) ? verdict.replace(/^FLAG\s*:?\s*/i, '').trim() || 'flagged by policy review' : '';
                const patch = {
                  title: check.meta.title,
                  tags: check.meta.tags,
                  category: check.meta.category,
                  description: check.meta.description,
                  metadataGeneratedAt: Date.now(),
                  policyCheckedAt: Date.now()
                };
                const reason = flag || (check.issues.length ? `metadata could not be made policy-safe: ${check.issues.join('; ')}` : '');
                if (reason && (record.status || 'queued') === 'queued') {
                  // Hold the item: bots only upload status=queued. It appears in the panel/app
                  // Failed section with the reason; Requeue only if it is your own compliant work.
                  Object.assign(patch, {
                    status: 'failed',
                    policyCheck: 'held',
                    policyFlag: reason,
                    error: `Zedge policy hold — ${reason}. Review this item; Requeue only if it is your own original, policy-compliant work (uploading it may suspend the Zedge account).`,
                    failedAt: Date.now()
                  });
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.warn(`  🛑 [${db.name}] [${key}] HELD (not uploaded): ${reason}`);
                  totalHeld++;
                } else {
                  patch.policyCheck = reason ? 'review' : 'passed';
                  if (reason) patch.policyFlag = reason;
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.log(`  ✅ [${db.name}] [${key}] Metadata patched successfully! (policy ${patch.policyCheck})`);
                  totalSuccess++;
                }

              } catch (err) {
                console.error(`  ❌ [${db.name}] [${key}] Failed: ${err.message}`);
                totalFailed++;
              } finally {
                if (tmpImagePath && fs.existsSync(tmpImagePath)) {
                  try { fs.unlinkSync(tmpImagePath); } catch {}
                }
              }

              if (i < toProcess.length - 1) {
                console.log('  ⏳ Waiting 3s before next image...');
                await sleep(3000);
              }
            }
          }

          // ─── SUMMARY ──────────────────────────────────────────────────────────────
          console.log('\n============================================================');
          console.log('  🏁  IMAGE METADATA GENERATION COMPLETE');
          console.log('============================================================');
          console.log(`✅ Success  : ${totalSuccess}`);
          console.log(`❌ Failed   : ${totalFailed}`);
          console.log(`🛑 Held     : ${totalHeld} (Zedge policy — see Failed section, Requeue only if compliant)`);
          console.log(`⏭️  Already done: images with full metadata were skipped automatically`);
          console.log('============================================================');

          if (metaBrowserCtx) { try { await metaBrowserCtx.close(); } catch {} }
          if (metaVncTunnelProc) { try { metaVncTunnelProc.kill(); } catch {} }

          if (totalFailed > 0 && totalSuccess === 0) {
            process.exit(1);
          }
          IMGMETA_EOF
          node --experimental-vm-modules --max-http-header-size=262144 image_metadata.mjs

      - name: 📊 Upload Run Summary
        if: always()
        run: |
          echo "## 🖼️ Image Metadata Generator Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | Auto-scan (all images missing metadata) |" >> $GITHUB_STEP_SUMMARY
          echo "| Queue path | wallpaperQueue |" >> $GITHUB_STEP_SUMMARY
          echo "| Target DBs | All (zedge_1, zedge_2, zedge_3, zedge_4) |" >> $GITHUB_STEP_SUMMARY
          echo "| Gemini transport | Web RPC (StreamGenerate, extension-style — no browser) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Image metadata generated via Gemini Web RPC (resumable image upload + StreamGenerate) and patched back to Firebase." >> $GITHUB_STEP_SUMMARY
