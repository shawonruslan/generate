            const words = String(tags || '').split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z0-9-]{2,20}$/.test(w));
            const out = [];
            for (const w of words) if (!out.includes(w) && !POLICY_IP.test(w) && !POLICY_ADULT.test(w) && !POLICY_HARM.test(w) && !POLICY_PROMO.test(w)) out.push(w);
            return out.slice(0, 10);
          }

          function zedgeEnforce(meta, kind) {
            const issues = zedgePolicyIssues(meta);
            const tags = zedgeCleanTags(meta.tags);
            const fallback = kind === 'image' ? ['wallpaper', 'background', 'art', 'design', 'phone', 'screen'] : ['melody', 'tune', 'alert', 'phone', 'music', 'sound'];
            const cat = String(meta.category || '').toLowerCase().replace(/[^a-z]/g, '');
            if (cat && cat !== 'other' && !tags.includes(cat)) tags.unshift(cat);
            for (const w of fallback) { if (tags.length >= 2) break; if (!tags.includes(w)) tags.push(w); }
            return { issues, meta: { ...meta, tags: tags.slice(0, 10).join(', ') } };
          }

          // ─── STUDIO DEFAULT MASTER PROMPT & NEGATIVE PROMPT ────────────────────────
          const DEFAULT_NEGATIVE_PROMPT =
            'low quality, muddy, muffled, static, white noise, tape hiss, hum, harsh distortion, clipping, off-beat, arrhythmic, out of tune, dissonant, random chaotic notes, vocals, singing, talking, speech, gibberish voices, stock iPhone marimba, Samsung ringtone, Nokia tune, silence, abrupt cut-off, amateur recording, tinny, ear-piercing high frequencies';

          const DEFAULT_BANNED_WORDS =
            'Glitched, Echo, Electronic, Digital, Lo-fi, Synth, Pulse, Wave, Bass, Trap, Chill, Cool, Awesome, Ringtone, Beat, Sound, Vibe, Remix, DJ, Techno, EDM';

          const DEFAULT_MASTER_PROMPT = `You are an award-winning mobile sound designer and Zedge marketplace metadata specialist. Your ringtones and notification tones top charts because they are musical, crystal-clear, harmonically rich, and pleasant to hear every day.

          {{ZEDGE_POLICY_RULES}}

          {{RENDERER_RULES}}

          STUDIO PARAMETERS & CONSTRAINTS:
          - Target Format: {{SOUND_TYPE}} ({{DURATION}} seconds)
          - Tempo / BPM: {{BPM}}
          - Featured Instruments: {{INSTRUMENTS}}
          - Genre Direction: {{GENRE}}
          - Mood / Atmosphere: {{MOOD}}
          - Musical Key / Scale: {{KEY}}
          - Hook Structure: {{STRUCTURE}}
          - Production Mix: {{PRODUCTION}}
          - STRICT NEGATIVE CONSTRAINTS (NEVER include these in the sound): {{NEGATIVE_PROMPT}}

          {{CRAFT_RULES}}

          TASK:
          {{IDEA}}

          Based on the text-to-music prompt you craft, also generate marketplace metadata:
          1. A creative and UNIQUE title (max 25 characters). DO NOT USE THESE BANNED WORDS: {{BANNED_WORDS}}. No quotes.
          2. 10 relevant, descriptive SINGLE-WORD keywords (comma-separated) that truthfully describe THIS sound only. Every keyword must correspond to an instrument, genre, or mood present in the audio prompt.
          3. The most appropriate category selected ONLY from this list: {{VALID_CATEGORIES}}.
          4. An ULTRA-SHORT description in EXACTLY 2 TO 3 WORDS (max 25 chars) capturing the core sound. No punctuation, no filler.

          CRITICAL: Format your entire response EXACTLY like this template with no text outside these tags:
          [ENHANCED_PROMPT]...[/ENHANCED_PROMPT]
          [TITLE]...[/TITLE]
          [KEYWORDS]...[/KEYWORDS]
          [CATEGORY]...[/CATEGORY]
          [DESCRIPTION]...[/DESCRIPTION]`;

          const STUDIO_CONFIG = {
            defaultMasterPrompt: DEFAULT_MASTER_PROMPT,
            masterPrompt: DEFAULT_MASTER_PROMPT,
            defaultNegativePrompt: DEFAULT_NEGATIVE_PROMPT,
            negativePrompt: DEFAULT_NEGATIVE_PROMPT,
            defaultBannedWords: DEFAULT_BANNED_WORDS,
            bannedWords: DEFAULT_BANNED_WORDS,
            soundType: INITIAL_LENGTH_SEC < 6 ? 'Notification' : 'Ringtone',
            audioShape: INITIAL_LENGTH_SEC < 6 ? 'oneshot' : 'track',
            takesCount: 4,
            timeSignature: '4/4',
            lengthSeconds: INITIAL_LENGTH_SEC,
            targetAccount: INITIAL_TARGET_ACC,
            useGeminiEnhancer: true,
            bpm: 120,
            instruments: 'Auto',
            genre: 'Auto',
            mood: 'Auto',
            musicalKey: 'Auto',
            structure: 'Auto',
            production: 'crisp modern studio mastered production with clear mids',
            autoProcess: INITIAL_AUTO_PROCESS,
            trimSilence: true,
