name: "☁️ Generator Hub - Ringtone + Metadata (single workflow)"
run-name: "🎯 MODE: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "🎯 Which generator runs (ringtone = TryCloudflare Studio, metadata = Image Metadata)"
        required: true
        default: "ringtone"
        type: choice
        options:
          - ringtone
          - metadata

      gemini_session:
        description: "🌐 Gemini Cookies / Session JSON (OPTIONAL — leave empty to use Live Browser Gmail Login in both modes)"
        required: false
        default: ""


jobs:
  generate-ringtones:
    if: github.event.inputs.mode == 'ringtone'
    name: 🎵 Ringtone Studio Pro (Gemini Web RPC + TryCloudflare UI)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install Dependencies & Cloudflared (Fast)
        run: |
          npm init -y
          npm install --no-audit --no-fund node-fetch@3 fluent-ffmpeg @ffmpeg-installer/ffmpeg patchright
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "✅ Using pre-installed system Google Chrome (skipped 150MB browser download)"
          else
            npx patchright install chrome || true
          fi
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: 🛡️ Start Cloudflare WARP SOCKS5 Proxy (Fast 7MB Binary — No apt/WebKit Bloat)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/bepass-org/warp-plus/releases/latest/download/warp-plus_linux-amd64.zip -o /tmp/warp-plus.zip
          unzip -qo /tmp/warp-plus.zip -d /tmp/warp-plus-bin
          chmod +x /tmp/warp-plus-bin/warp-plus
          RUNNER_TRACKING_ID="" nohup /tmp/warp-plus-bin/warp-plus -b 127.0.0.1:40000 > /tmp/warp-plus.log 2>&1 </dev/null &
          for i in $(seq 1 12); do
            sleep 1
            TRACE=$(curl -x socks5h://127.0.0.1:40000 -s --max-time 4 https://www.cloudflare.com/cdn-cgi/trace || true)
            if echo "$TRACE" | grep -q "warp=on\|warp=plus"; then
              echo "✅ Cloudflare WARP SOCKS5 active in ${i}s on socks5://127.0.0.1:40000"
              echo "$TRACE" | grep -E "ip=|warp=|loc="
              echo "WARP_PROXY=socks5://127.0.0.1:40000" >> $GITHUB_ENV
              break
            fi
          done

      - name: 🎛️ Verify ffmpeg (skip slow apt install if already available)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ System ffmpeg already installed: $(ffmpeg -version | head -n 1)"
          elif node -e "const p=require('@ffmpeg-installer/ffmpeg').path; console.log(p)" >/dev/null 2>&1; then
            FFBIN=$(node -e "console.log(require('@ffmpeg-installer/ffmpeg').path)")
            echo "FFMPEG_PATH=${FFBIN}" >> $GITHUB_ENV
            echo "✅ Using bundled @ffmpeg-installer/ffmpeg (skipped 60MB apt download): $(${FFBIN} -version | head -n 1)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: 🖥️ Start Virtual Display + Live Gemini Login Browser (Xvfb + noVNC)
        run: |
          NEED_PKGS=""
          command -v Xvfb >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS xvfb"
          command -v x11vnc >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS x11vnc"
          command -v openbox >/dev/null 2>&1 || NEED_PKGS="$NEED_PKGS openbox"
          [ -d /usr/share/novnc ] || NEED_PKGS="$NEED_PKGS novnc websockify"
          if [ -n "$NEED_PKGS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $NEED_PKGS
          fi
          RUNNER_TRACKING_ID="" Xvfb :99 -screen 0 1366x820x24 >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:99 RUNNER_TRACKING_ID="" openbox >/dev/null 2>&1 &
          sleep 1
          RUNNER_TRACKING_ID="" x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -bg -o /tmp/x11vnc.log >/dev/null 2>&1 || true
          RUNNER_TRACKING_ID="" nohup websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 </dev/null &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "✅ Xvfb + x11vnc + noVNC live browser display ready on :99 (port 6080)"

      - name: 🌐 Start TryCloudflare Quick Tunnels (Studio Port 8787 + Gemini Login Browser Port 6080)
        run: |
          RUNNER_TRACKING_ID="" nohup cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate > /tmp/cloudflared.log 2>&1 </dev/null &
          RUNNER_TRACKING_ID="" nohup cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/cloudflared_vnc.log 2>&1 </dev/null &
          TUNNEL_URL=""
          VNC_BASE=""
          for i in $(seq 1 30); do
            sleep 1
            [ -z "$TUNNEL_URL" ] && TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            [ -z "$VNC_BASE" ] && VNC_BASE=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared_vnc.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ] && [ -n "$VNC_BASE" ]; then
              break
            fi
          done
          GEMINI_VNC_URL=""
          if [ -n "$VNC_BASE" ]; then
            GEMINI_VNC_URL="${VNC_BASE}/vnc.html?autoconnect=true&resize=scale"
          fi
          echo "=================================================================="
          echo "  🌐 RINGTONE STUDIO URL      : ${TUNNEL_URL}"
          echo "  🔐 GEMINI BROWSER LOGIN URL : ${GEMINI_VNC_URL}"
          echo "=================================================================="
          echo "TRYCLOUDFLARE_URL=${TUNNEL_URL}" >> $GITHUB_ENV
          echo "GEMINI_VNC_URL=${GEMINI_VNC_URL}" >> $GITHUB_ENV
          echo "## 🌐 Live Ringtone Studio Pro (TryCloudflare)" >> $GITHUB_STEP_SUMMARY
          if [ -n "$TUNNEL_URL" ]; then
            echo "- **Ringtone Studio Panel:** [${TUNNEL_URL}](${TUNNEL_URL})" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$GEMINI_VNC_URL" ]; then
            echo "- **Gemini Browser Login (Gmail Sign-In, No Cookies Needed):** [${GEMINI_VNC_URL}](${GEMINI_VNC_URL})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🎵 Launch Ringtone Web Studio & Gemini RPC Generator
        env:
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          ZEDGE1_DB_URL: ${{ secrets.ZEDGE1_DB_URL }}
          ZEDGE2_DB_URL: ${{ secrets.ZEDGE2_DB_URL }}
          ZEDGE3_DB_URL: ${{ secrets.ZEDGE3_DB_URL }}
          ZEDGE4_DB_URL: ${{ secrets.ZEDGE4_DB_URL }}
          STABLE_AUDIO_TOKEN: ${{ secrets.STABLE_AUDIO_TOKEN }}
          GEMINI_SESSION: ${{ secrets.GEMINI_SESSION }}
          GEMINI_SESSION_INPUT: ${{ github.event.inputs.gemini_session }}
          AUTO_GENERATE_COUNT: "0"
          STUDIO_PORT: "8787"
          STUDIO_MAX_MINUTES: "180"
          GEMINI_VNC_URL: ${{ env.GEMINI_VNC_URL }}
          NODE_OPTIONS: --max-http-header-size=262144
        run: |
          cat > studio.html << 'STUDIO_HTML_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Ringtone Studio Pro — Cloud Audio Workstation</title>
            <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121518' stroke='%2310b981' stroke-width='3'/%3E%3Cpath d='M14 32h4m6-12v24m6-18v12m6-22v32m6-16v8m6-14v20m6-10h4' stroke='%2310b981' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
            <style>
              :root {
                --bg-base: #0d0f11;
                --bg-panel: #14171a;
                --bg-card: #191d22;
                --bg-input: #111417;
                --bg-hover: #21262d;
                --border: #262c34;
                --border-focus: #10b981;
                --accent: #10b981;
                --accent-hover: #059669;
                --accent-soft: rgba(16, 185, 129, 0.12);
                --accent-border: rgba(16, 185, 129, 0.35);
                --text-main: #f3f4f6;
                --text-secondary: #9ca3af;
                --text-muted: #6b7280;
                --danger: #ef4444;
                --danger-soft: rgba(239, 68, 68, 0.12);
                --warning: #f59e0b;
                --radius-sm: 6px;
                --radius-md: 8px;
                --radius-lg: 10px;
                --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
              }

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
              }

              body {
                background-color: var(--bg-base);
                color: var(--text-main);
                font-family: var(--font-sans);
                font-size: 13px;
                line-height: 1.5;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                -webkit-font-smoothing: antialiased;
              }

              ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
              }
              ::-webkit-scrollbar-track {
                background: var(--bg-base);
              }
              ::-webkit-scrollbar-thumb {
                background: #2b323b;
                border-radius: 3px;
              }
              ::-webkit-scrollbar-thumb:hover {
                background: var(--accent);
              }

              /* LOGIN LOCK SCREEN OVERLAY */
              .login-overlay {
                position: fixed;
                inset: 0;
                background: var(--bg-base);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 500;
                padding: 20px;
              }

              .login-overlay.hidden {
                display: none;
              }

              .login-card {
                width: 100%;
                max-width: 400px;
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 28px 24px;
                display: flex;
                flex-direction: column;
                gap: 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
              }

              .login-header {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
              }

              .login-icon-box {
                width: 48px;
                height: 48px;
                border-radius: 12px;
                background: var(--accent-soft);
                border: 1px solid var(--accent-border);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent);
              }

              .pwd-input-wrap {
                position: relative;
                display: flex;
                align-items: center;
              }

              .pwd-input-wrap input {
                width: 100%;
                padding: 10px 38px 10px 12px;
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                color: var(--text-main);
                font-family: var(--font-mono);
                font-size: 13px;
                outline: none;
              }

              .pwd-input-wrap input:focus {
                border-color: var(--accent);
              }

              .pwd-toggle-btn {
                position: absolute;
                right: 8px;
                background: transparent;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 4px;
              }

              .pwd-toggle-btn:hover {
                color: var(--text-main);
              }

              .login-error {
                display: none;
                background: var(--danger-soft);
                border: 1px solid rgba(239, 68, 68, 0.35);
                color: var(--danger);
                padding: 8px 11px;
                border-radius: var(--radius-sm);
                font-size: 12px;
                align-items: center;
                gap: 7px;
              }

              .login-error.show {
                display: flex;
              }

              /* TOPBAR */
              .topbar {
                min-height: 56px;
                height: auto;
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px 14px;
                padding: 8px 18px;
                position: sticky;
                top: 0;
                z-index: 100;
              }

              .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
                white-space: nowrap;
              }

              .brand-logo {
                width: 32px;
                height: 32px;
                border-radius: 8px;
                background: var(--accent-soft);
                border: 1px solid var(--accent-border);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent);
                flex-shrink: 0;
              }

              .brand-title {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.3px;
                color: var(--text-main);
                display: flex;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
              }

              .badge-pro {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                padding: 2px 7px;
                border-radius: 4px;
                background: var(--accent-soft);
                color: var(--accent);
                border: 1px solid var(--accent-border);
                letter-spacing: 0.4px;
                white-space: nowrap;
              }

              .topbar-status {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
              }

              .topbar-status .btn {
                padding: 5px 9px;
                font-size: 11.5px;
                white-space: nowrap;
              }

              .status-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 9px;
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: 11.5px;
                color: var(--text-secondary);
                white-space: nowrap;
              }

              .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-muted);
              }
              .dot.online {
                background: var(--accent);
                box-shadow: 0 0 8px var(--accent);
              }
              .dot.busy {
                background: var(--warning);
                box-shadow: 0 0 8px var(--warning);
              }

              /* MAIN GRID */
              .workspace {
                display: grid;
                grid-template-columns: 490px 1fr;
                gap: 16px;
                padding: 16px 20px;
                flex: 1;
                max-width: 1920px;
                width: 100%;
                margin: 0 auto;
              }

              @media (max-width: 1180px) {
                .workspace {
                  grid-template-columns: 1fr;
                }
              }

              .panel {
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                display: flex;
                flex-direction: column;
                overflow: hidden;
              }

              .panel-header {
                padding: 13px 16px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: rgba(255, 255, 255, 0.01);
              }

              .panel-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-main);
                display: flex;
                align-items: center;
                gap: 8px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
              }

              .panel-title svg {
                color: var(--accent);
              }

              /* TABS */
              .tabs-nav {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                background: var(--bg-base);
                border-bottom: 1px solid var(--border);
                padding: 4px;
                gap: 4px;
              }

              .tab-btn {
                background: transparent;
                border: 1px solid transparent;
                color: var(--text-secondary);
                padding: 8px 6px;
                font-size: 11.5px;
                font-weight: 600;
                border-radius: var(--radius-sm);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                transition: all 0.15s ease;
              }

              .tab-btn:hover {
                color: var(--text-main);
                background: var(--bg-card);
              }

              .tab-btn.active {
                background: var(--accent-soft);
                color: var(--accent);
                border-color: var(--accent-border);
              }

              .tab-pane {
                display: none;
                padding: 16px;
                flex-direction: column;
                gap: 14px;
                overflow-y: auto;
                max-height: calc(100vh - 215px);
              }

              .tab-pane.active {
                display: flex;
              }

              /* FORM CONTROLS */
              .field-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
              }

              .field-label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 12px;
                font-weight: 600;
                color: var(--text-secondary);
              }

              .field-hint {
                font-size: 11px;
                color: var(--text-muted);
                font-weight: 400;
              }

              input[type="text"],
              input[type="number"],
              select,
              textarea {
                width: 100%;
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 9px 11px;
                color: var(--text-main);
                font-family: var(--font-sans);
                font-size: 12.5px;
                outline: none;
                transition: border-color 0.15s ease;
              }

              textarea.mono {
                font-family: var(--font-mono);
                font-size: 12px;
                line-height: 1.55;
              }

              input:focus,
              select:focus,
              textarea:focus {
                border-color: var(--border-focus);
              }

              .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
              }

              .grid-3 {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
              }

              /* SEGMENTED CONTROL */
              .segmented {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 3px;
                gap: 3px;
              }

              .seg-btn {
                background: transparent;
                border: none;
                color: var(--text-secondary);
                padding: 7px 8px;
                font-size: 11.5px;
                font-weight: 600;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                transition: all 0.15s;
              }

              .seg-btn.active {
                background: var(--accent);
                color: #06130e;
              }

              /* CHIPS */
              .chips-wrap {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
              }

              .chip {
                background: var(--bg-input);
                border: 1px solid var(--border);
                color: var(--text-secondary);
                padding: 4px 9px;
                border-radius: 4px;
                font-size: 11.5px;
                font-weight: 500;
                cursor: pointer;
                user-select: none;
                display: inline-flex;
                align-items: center;
                gap: 5px;
                transition: all 0.12s ease;
              }

              .chip:hover {
                border-color: #3b4452;
                color: var(--text-main);
              }

              .chip.selected {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent);
                font-weight: 600;
              }

              /* BUTTONS */
              .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                padding: 8px 14px;
                border-radius: var(--radius-sm);
                font-size: 12.5px;
                font-weight: 600;
                cursor: pointer;
                border: 1px solid transparent;
                transition: all 0.15s ease;
                text-decoration: none;
              }

              .btn-primary {
                background: var(--accent);
                color: #05140e;
                border-color: var(--accent);
              }

              .btn-primary:hover:not(:disabled) {
                background: var(--accent-hover);
                border-color: var(--accent-hover);
                color: #ffffff;
              }

              .btn-secondary {
                background: var(--bg-card);
                color: var(--text-main);
                border-color: var(--border);
              }

              .btn-secondary:hover:not(:disabled) {
                background: var(--bg-hover);
                border-color: #38414e;
              }

              .btn-ghost {
                background: transparent;
                color: var(--text-secondary);
                border-color: var(--border);
                padding: 5px 9px;
                font-size: 11.5px;
              }

              .btn-ghost:hover:not(:disabled) {
                color: var(--text-main);
                border-color: var(--accent);
                background: var(--accent-soft);
              }

              .btn-danger {
                background: var(--danger-soft);
                color: var(--danger);
                border-color: rgba(239, 68, 68, 0.35);
              }

              .btn-danger:hover:not(:disabled) {
                background: var(--danger);
                color: #ffffff;
              }

              .btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
              }

              .action-bar {
                padding: 13px 16px;
                border-top: 1px solid var(--border);
                background: var(--bg-base);
                display: flex;
                gap: 10px;
                align-items: center;
              }

              /* RANGE SLIDER */
              .range-row {
                display: flex;
                align-items: center;
                gap: 10px;
              }

              input[type="range"] {
                flex: 1;
                accent-color: var(--accent);
                height: 5px;
                background: var(--bg-input);
                border-radius: 3px;
                cursor: pointer;
              }

              .range-val {
                min-width: 58px;
                text-align: right;
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--accent);
                font-weight: 600;
              }

              /* SWITCH TOGGLE */
              .toggle-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 11px;
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
              }

              .switch {
                position: relative;
                display: inline-block;
                width: 36px;
                height: 20px;
              }

              .switch input {
                opacity: 0;
                width: 0;
                height: 0;
              }

              .slider {
                position: absolute;
                cursor: pointer;
                top: 0; left: 0; right: 0; bottom: 0;
                background-color: #2b313a;
                transition: 0.2s;
                border-radius: 20px;
              }

              .slider:before {
                position: absolute;
                content: "";
                height: 14px;
                width: 14px;
                left: 3px;
                bottom: 3px;
                background-color: #e5e7eb;
                transition: 0.2s;
                border-radius: 50%;
              }

              input:checked + .slider {
                background-color: var(--accent);
              }

              input:checked + .slider:before {
                transform: translateX(16px);
                background-color: #05140e;
              }

              /* RIGHT COLUMN: PROGRESS + AUDIO LIBRARY */
              .status-banner {
                padding: 12px 16px;
                background: var(--bg-card);
                border-bottom: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                gap: 8px;
              }

              .status-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
              }

              .status-msg {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text-main);
                display: flex;
                align-items: center;
                gap: 8px;
              }

              .progress-track {
                width: 100%;
                height: 6px;
                background: var(--bg-input);
                border-radius: 3px;
                overflow: hidden;
                border: 1px solid var(--border);
              }

              .progress-fill {
                height: 100%;
                background: var(--accent);
                width: 0%;
                transition: width 0.25s ease;
              }

              .terminal-box {
                background: #0a0c0e;
                border-bottom: 1px solid var(--border);
                padding: 10px 14px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: #9ca3af;
                max-height: 150px;
                overflow-y: auto;
                display: none;
                white-space: pre-wrap;
                line-height: 1.45;
              }

              .terminal-box.open {
                display: block;
              }

              .library-toolbar {
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                flex-wrap: wrap;
              }

              .filter-group {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
              }

              .audio-grid {
                padding: 16px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 14px;
                overflow-y: auto;
                max-height: calc(100vh - 245px);
              }

              .audio-card {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                transition: border-color 0.15s ease;
              }

              .audio-card.is-new {
                border-left: 3px solid var(--accent);
              }

              .pill.new-badge {
                background: var(--accent);
                color: #04130d;
                border-color: var(--accent);
                font-weight: 700;
                letter-spacing: 0.4px;
              }

              .pill.old-badge {
                background: #14181d;
                color: var(--text-muted);
                border-color: #262c34;
              }

              .lib-tabs {
                display: inline-flex;
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 3px;
                gap: 3px;
              }

              .lib-tab-btn {
                background: transparent;
                border: none;
                color: var(--text-secondary);
                padding: 5px 11px;
                font-size: 11.5px;
                font-weight: 600;
                border-radius: 4px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: all 0.15s ease;
              }

              .lib-tab-btn:hover {
                color: var(--text-main);
              }

              .lib-tab-btn.active {
                background: var(--accent-soft);
                color: var(--accent);
                border: 1px solid var(--accent-border);
              }

              .lib-count {
                font-family: var(--font-mono);
                font-size: 10.5px;
                padding: 1px 5px;
                border-radius: 3px;
                background: rgba(255, 255, 255, 0.06);
              }

              .audio-card:hover {
                border-color: #36404d;
              }

              .audio-card.playing {
                border-color: var(--accent);
                background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, var(--bg-card) 100%);
              }

              .card-top {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 8px;
              }

              .card-title {
                font-size: 14px;
                font-weight: 700;
                color: var(--text-main);
                word-break: break-word;
              }

              .card-badges {
                display: flex;
                align-items: center;
                gap: 5px;
                flex-wrap: wrap;
                margin-top: 3px;
              }

              .pill {
                font-size: 10.5px;
                font-weight: 600;
                padding: 2px 7px;
                border-radius: 4px;
                background: var(--bg-input);
                border: 1px solid var(--border);
                color: var(--text-secondary);
                font-family: var(--font-mono);
              }

              .pill.green {
                background: var(--accent-soft);
                border-color: var(--accent-border);
                color: var(--accent);
              }

              /* CUSTOM AUDIO PLAYER BAR */
              .player-box {
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 8px 10px;
                display: flex;
                align-items: center;
                gap: 10px;
              }

              .play-btn {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                background: var(--accent);
                border: none;
                color: #04120c;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                flex-shrink: 0;
                transition: background 0.15s;
              }

              .play-btn:hover {
                background: var(--accent-hover);
                color: #fff;
              }

              .seek-wrap {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
              }

              .seek-slider {
                width: 100%;
                height: 4px;
                accent-color: var(--accent);
                cursor: pointer;
              }

              .time-row {
                display: flex;
                justify-content: space-between;
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
              }

              .card-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
              }

              .tag-item {
                font-size: 10.5px;
                padding: 1px 6px;
                border-radius: 3px;
                background: #13171b;
                color: var(--text-secondary);
                border: 1px solid #222830;
              }

              .prompt-preview {
                font-size: 11.5px;
                color: var(--text-secondary);
                background: var(--bg-input);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 7px 9px;
                font-family: var(--font-mono);
                line-height: 1.4;
                max-height: 68px;
                overflow-y: auto;
              }

              .card-actions {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 6px;
                padding-top: 6px;
                border-top: 1px solid var(--border);
              }

              .empty-state {
                grid-column: 1 / -1;
                padding: 60px 20px;
                text-align: center;
                color: var(--text-muted);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
              }

              /* MODAL */
              .modal-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.72);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 200;
                padding: 20px;
              }

              .modal-backdrop.open {
                display: flex;
              }

              .modal-card {
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                width: 100%;
                max-width: 520px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
              }

              .modal-body {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }

              .toast-container {
                position: fixed;
                bottom: 18px;
                right: 18px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 300;
              }

              .toast {
                background: var(--bg-card);
                border: 1px solid var(--accent);
                color: var(--text-main);
                padding: 10px 14px;
                border-radius: var(--radius-sm);
                font-size: 12.5px;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
              }

              .toast.error {
                border-color: var(--danger);
              }
            </style>
          </head>
          <body>

            <!-- PASSWORD LOCK SCREEN OVERLAY -->
            <div class="login-overlay hidden" id="loginOverlay" style="display:none;">
              <form class="login-card" onsubmit="submitStudioLogin(event)">
                <div class="login-header">
                  <div class="login-icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                  </div>
                  <div>
                    <div style="font-size:16px; font-weight:700; letter-spacing:0.4px;">RINGTONE STUDIO PRO</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Password Protected Cloud Audio Workstation</div>
                  </div>
                </div>

                <div class="login-error" id="loginErrorBox">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  <span id="loginErrorText">Invalid studio password</span>
                </div>

                <div class="field-group">
                  <div class="field-label">
                    <span>Studio Access Password</span>
                  </div>
                  <div class="pwd-input-wrap">
                    <input type="password" id="studioPasswordInput" placeholder="Enter studio password..." autocomplete="current-password" required />
                    <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Show / Hide Password">
                      <svg id="pwdEyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="padding:10px 16px; width:100%;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
                  Unlock Studio Panel
                </button>
              </form>
            </div>

            <!-- TOPBAR -->
            <header class="topbar">
              <div class="brand">
                <div class="brand-logo">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>
                  </svg>
                </div>
                <div class="brand-title">
                  RINGTONE STUDIO PRO
                  <span class="badge-pro">WIZARD 2.5</span>
                </div>
              </div>

              <div class="topbar-status">
                <div class="status-pill" title="Live Gemini Browser Session Status">
                  <span class="dot busy" id="geminiDot"></span>
                  <span id="geminiStatusText">Gemini: Waiting Login</span>
                </div>
                <a class="btn btn-ghost" id="geminiVncBtn" href="#" target="_blank" rel="noopener" style="display:none; text-decoration:none;" title="Open live browser to sign in to Gmail / Gemini directly (no cookies needed)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                  Gemini Login
                </a>
                <div class="status-pill" title="Stable Audio Wizard Account &amp; Remaining Credits">
                  <span class="dot busy" id="saDot"></span>
                  <span id="saStatusText">Stable Audio: Init</span>
                </div>
                <button class="btn btn-ghost" onclick="rotateStableToken()" title="Auto-create or replace Stable Audio account token">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                  Rotate Token
                </button>
                <button class="btn btn-ghost" onclick="syncFirebaseAudios()" title="Reload generated audios from Firebase">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
                  Sync DB
                </button>
                <button class="btn btn-ghost" onclick="cleanR2Orphans()" title="Scan and delete orphaned files in R2 that are no longer in any Firebase queue">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                  Clean R2
                </button>
                <button class="btn btn-danger" onclick="shutdownServer()" title="Stop Studio Server and complete GitHub Action">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                  Finish Session
                </button>
              </div>
            </header>

            <!-- MAIN WORKSPACE -->
            <main class="workspace">

              <!-- LEFT PANEL: GENERATOR CONTROLS -->
              <section class="panel">
                <div class="panel-header">
                  <div class="panel-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                    Audio Generation Parameters
                  </div>
                  <span class="pill green" id="lineCountBadge">0 Prompt Lines</span>
                </div>

                <!-- NAVIGATION TABS -->
                <div class="tabs-nav">
                  <button class="tab-btn active" onclick="switchTab('prompts', this)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    Prompts
                  </button>
                  <button class="tab-btn" onclick="switchTab('sound', this)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    BPM / Inst
                  </button>
                  <button class="tab-btn" onclick="switchTab('negative', this)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                    Negative
                  </button>
                  <button class="tab-btn" onclick="switchTab('master', this)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Master
                  </button>
                  <button class="tab-btn" onclick="switchTab('dsp', this)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    Mastering
                  </button>
                </div>

                <!-- TAB 1: MULTI-LINE PROMPTS -->
                <div class="tab-pane active" id="tab-prompts">
                  <div class="field-group">
                    <div class="field-label">
                      <span>Tone Profile Mode</span>
                      <span class="field-hint">Auto-adjusts craft rules & duration</span>
                    </div>
                    <div class="segmented" id="toneModeSeg">
                      <button type="button" class="seg-btn active" id="mode-ringtone" onclick="setSoundMode('Ringtone', 20)">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        Ringtone (Full)
                      </button>
                      <button type="button" class="seg-btn" id="mode-notification" onclick="setSoundMode('Notification', 3)">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        Notification
                      </button>
                      <button type="button" class="seg-btn" id="mode-alarm" onclick="setSoundMode('Alarm', 20)">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
                        Alarm Tone
                      </button>
                    </div>
                  </div>

                  <div class="field-group">
                    <div class="field-label">
                      <span>Audio Shape (Stable Audio Wizard)</span>
                      <span class="field-hint">Track / Seamless Loop / One-Shot SFX</span>
                    </div>
                    <div class="segmented" id="shapeModeSeg">
                      <button type="button" class="seg-btn active" id="shape-track" onclick="setAudioShape('track')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
                        Track
                      </button>
                      <button type="button" class="seg-btn" id="shape-loop" onclick="setAudioShape('loop')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                        Loop
                      </button>
                      <button type="button" class="seg-btn" id="shape-oneshot" onclick="setAudioShape('oneshot')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        One-Shot
                      </button>
                    </div>
                  </div>

                  <div class="field-group">
                    <div class="field-label">
                      <span>Line-by-Line Prompts Input</span>
                      <div style="display:flex; gap:6px;">
                        <button type="button" class="btn btn-ghost" onclick="insertSamplePrompts()">Load Presets</button>
                        <button type="button" class="btn btn-ghost" onclick="clearPrompts()">Clear</button>
                      </div>
                    </div>
                    <textarea id="promptsInput" class="mono" rows="9" placeholder="Enter one ringtone or notification tone prompt per line...&#10;Example:&#10;Warm kalimba and soft Rhodes electric piano sunrise melody&#10;Crisp crystal glass marimba 3-note notification chime with lush reverb&#10;Spanish flamenco acoustic guitar rhythmic groove with cajon percussion&#10;Cinematic cello and pizzicato strings mysterious detective theme" oninput="updateLineCount()"></textarea>
                    <span class="field-hint">Each non-empty line generates a separate mastered audio & Zedge metadata record. Leave empty to use Auto-Discovery Count below.</span>
                  </div>

                  <div class="grid-2">
                    <div class="field-group">
                      <div class="field-label">
                        <span>Target Firebase Account</span>
                      </div>
                      <select id="targetAccount">
                        <option value="zedge_2">zedge_2</option>
                        <option value="zedge_1">zedge_1</option>
                        <option value="zedge_3">zedge_3</option>
                        <option value="zedge_4">zedge_4</option>
                        <option value="all_accounts">all_accounts (Unique per DB)</option>
                      </select>
                    </div>

                    <div class="field-group">
                      <div class="field-label">
                        <span>Fallback Auto-Count</span>
                        <span class="field-hint">If lines empty</span>
                      </div>
                      <input type="number" id="autoCountInput" min="1" max="100" value="5" />
                    </div>
                  </div>

                  <div class="field-group">
                    <div class="field-label">
                      <span>Desired Duration per Track (Seconds)</span>
                      <span class="range-val" id="durationLabel">20s</span>
                    </div>
                    <div class="range-row">
                      <input type="range" id="durationSlider" min="1" max="60" value="20" oninput="syncDuration(this.value)" />
                    </div>
                    <div class="chips-wrap" id="durationChips" style="margin-top:4px;">
                      <span class="chip" data-sec="3" onclick="syncDuration(3)">3s One-Shot</span>
