          function parseStreamGenerateResponse(rawText) {
            let assistantText = '';
            for (const line of String(rawText || '').split('\n')) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('[')) continue;
              try {
                const outer = JSON.parse(trimmed);
                if (!Array.isArray(outer)) continue;
                for (const entry of outer) {
                  if (Array.isArray(entry) && entry[0] === 'wrb.fr' && typeof entry[2] === 'string') {
                    try {
                      const inner = JSON.parse(entry[2]);
                      if (
                        Array.isArray(inner) &&
                        Array.isArray(inner[4]) &&
                        Array.isArray(inner[4][0]) &&
                        Array.isArray(inner[4][0][1]) &&
                        typeof inner[4][0][1][0] === 'string'
                      ) {
                        const candidateText = inner[4][0][1][0];
                        if (candidateText.trim().length >= assistantText.trim().length) {
                          assistantText = candidateText;
                        }
                      }
                    } catch (_) {}
                  }
                }
              } catch (_) {}
            }
            return assistantText.trim();
          }

          function buildTextStreamPayloads(promptText) {
            const inner1 = [
              [promptText, 0, null, null, null, null, 0],
              ['en'],
              ['', '', ''],
              null, null, null,
              [1],
              1,
              null, null, 1, 0
            ];
            const inner2 = [...inner1];
            while (inner2.length < 41) inner2.push(null);
            inner2[41] = [1];
            return [inner1, inner2];
          }

          async function callGeminiRpc(promptText) {
            console.log(`  Sending prompt via Gemini StreamGenerate RPC (${promptText.length} chars)...`);
            let session = await getGeminiSession(false);
            const variants = buildTextStreamPayloads(promptText);
            let lastErr = 'Empty response from Gemini RPC';

            for (let v = 0; v < variants.length; v++) {
              for (let attempt = 0; attempt < 2; attempt++) {
                try {
                  const reqId = Math.floor(100000 + Math.random() * 900000);
                  const fReq = JSON.stringify([null, JSON.stringify(variants[v])]);

                  if (session.fromBrowser && geminiBrowserPage && !geminiBrowserPage.isClosed()) {
                    const browserRes = await geminiBrowserPage.evaluate(async ({ bl, fSid, authUser, at, reqId, fReq }) => {
                      const qp = new URLSearchParams({ bl, hl: 'en', _reqid: String(reqId), rt: 'c', authuser: String(authUser) });
                      if (fSid) qp.set('f.sid', fSid);
                      const endpoint = `/u/${authUser}/_/BardChatUi/data/assistant.lamda.BardFrontendService/StreamGenerate?${qp.toString()}`;
                      const form = new URLSearchParams();
                      form.set('f.req', fReq);
                      form.set('at', at);
                      const r = await fetch(endpoint, {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                          'X-Same-Domain': '1'
                        },
                        body: form.toString()
                      });
                      return { ok: r.ok, status: r.status, text: await r.text() };
                    }, { bl: session.bl, fSid: session.fSid, authUser: session.authUser, at: session.at, reqId, fReq });

                    if (browserRes.status === 401 || browserRes.status === 403 || browserRes.status === 400) {
                      console.warn(`  In-browser StreamGenerate HTTP ${browserRes.status} — reloading live Gemini tab...`);
                      session = await getGeminiSession(true);
                      continue;
                    }
                    if (!browserRes.ok) {
                      lastErr = `Browser HTTP ${browserRes.status}`;
                      continue;
                    }
                    const textOut = parseStreamGenerateResponse(browserRes.text);
                    if (textOut && textOut.length > 0) {
                      console.log(`  Got Live Browser Gemini response (${textOut.length} chars)`);
                      return textOut;
                    }
                    lastErr = 'Empty assistant text in live browser response';
                    continue;
                  }

                  const doPost = async (sess) => {
                    const qp = new URLSearchParams({ bl: sess.bl, hl: 'en', _reqid: String(reqId), rt: 'c', authuser: String(sess.authUser) });
                    if (sess.fSid) qp.set('f.sid', sess.fSid);
                    const endpoint = `https://gemini.google.com/u/${sess.authUser}/_/BardChatUi/data/assistant.lamda.BardFrontendService/StreamGenerate?${qp.toString()}`;
                    const form = new URLSearchParams();
                    form.set('f.req', fReq);
                    form.set('at', sess.at);
                    return fetchWithTimeout(endpoint, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                        'X-Same-Domain': '1',
                        'Cookie': COOKIE_HEADER,
                        'User-Agent': GEMINI_UA
                      },
                      body: form.toString()
                    }, 90000);
                  };

                  let resp = await doPost(session);
                  if (resp.status === 401 || resp.status === 403 || resp.status === 400) {
                    session = await getGeminiSession(true);
                    resp = await doPost(session);
                  }
                  if (!resp.ok) {
                    lastErr = `HTTP ${resp.status}`;
                    continue;
                  }
                  const textOut = parseStreamGenerateResponse(await resp.text());
                  if (textOut && textOut.length > 0) {
                    console.log(`  Got Gemini RPC response (${textOut.length} chars)`);
                    return textOut;
                  }
                  lastErr = 'Empty assistant text in StreamGenerate response';
                } catch (e) {
                  lastErr = (e && e.message) || String(e);
                }
                await sleep(1200 * (attempt + 1));
              }
            }
            throw new Error(`Gemini RPC failed: ${lastErr}`);
          }

