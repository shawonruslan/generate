          async function fetchGeminiSession(authUser, cookieHeader = COOKIE_HEADER) {
            if (!cookieHeader) throw new Error('No Gemini cookies available — please sign in via the Gemini Login Browser link.');
            const appUrls = [
              `https://gemini.google.com/u/${authUser}/app?authuser=${authUser}`,
              `https://gemini.google.com/app?authuser=${authUser}`
            ];
            let lastErr = null;
            for (const appUrl of appUrls) {
              let res;
              try {
                res = await fetchWithTimeout(appUrl, {
                  method: 'GET',
                  redirect: 'follow',
                  headers: {
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    'Cookie': cookieHeader,
                    'User-Agent': GEMINI_UA
                  }
                }, 45000);
              } catch (e) {
                lastErr = e;
                continue;
              }
              const finalUrl = res.url || '';
              if (!res.ok || /accounts\.google\.com|ServiceLogin|\/signin|\/login/.test(finalUrl)) {
                lastErr = new Error(`u/${authUser} not signed in (HTTP ${res.status}, landed on ${finalUrl.slice(0, 80)})`);
                continue;
              }
              const html = await res.text();
              const atMatch   = html.match(/"SNlM0e":"([^"]+)"/);
              const blMatch   = html.match(/"cfb2h":"([^"]+)"/);
              const fSidMatch = html.match(/"FdrFJe":"([^"]+)"/);
              if (!atMatch || !atMatch[1]) {
                lastErr = new Error(`SNlM0e token not found in Gemini HTML for u/${authUser}`);
                continue;
              }
              return {
                authUser,
                at: atMatch[1],
                bl: blMatch ? blMatch[1] : 'boq_gemini-web-uiserver_20261122.16_p0',
                fSid: fSidMatch ? fSidMatch[1] : '',
                fetchedAt: Date.now(),
                fromBrowser: false
