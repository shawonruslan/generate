          function extractSixDigitOtp(subject = '', intro = '', text = '', html = '') {
            const cleanHtml = String(html || '')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<head[\s\S]*?<\/head>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/\s+/g, ' ');
            for (const src of [subject, intro, text, cleanHtml]) {
              if (!src) continue;
              const m = String(src).match(/\b(\d{6})\b/);
              if (m) return m[1];
            }
            return null;
          }

          async function pollTempMailForOtp(inbox, timeoutMs = 60000) {
            if (!inbox || !inbox.mailToken) return null;
            const deadline = Date.now() + timeoutMs;
            console.log(`  Polling ${inbox.provider} inbox (${inbox.email}) for 6-digit verification code...`);

            while (Date.now() < deadline) {
              try {
                if (inbox.provider === 'mailtm') {
                  const res = await fetch(`${inbox.apiBase}/messages`, {
                    headers: { 'Authorization': `Bearer ${inbox.mailToken}`, 'Accept': 'application/json' }
                  });
                  if (res.ok) {
                    const data = await res.json();
                    const msgs = Array.isArray(data) ? data : (data['hydra:member'] || []);
                    for (const msg of msgs) {
                      const quickCode = extractSixDigitOtp(msg.subject, msg.intro, '', '');
                      if (quickCode) return quickCode;

                      const detailRes = await fetch(`${inbox.apiBase}/messages/${msg.id}`, {
                        headers: { 'Authorization': `Bearer ${inbox.mailToken}`, 'Accept': 'application/json' }
                      });
                      if (detailRes.ok) {
                        const detail = await detailRes.json();
                        const htmlStr = Array.isArray(detail.html) ? detail.html.join(' ') : (detail.html || '');
                        const code = extractSixDigitOtp(detail.subject, detail.intro, detail.text, htmlStr);
                        if (code) return code;
                      }
                    }
                  }
                } else if (inbox.provider === 'guerrilla') {
                  const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=get_email_list&offset=0&sid_token=${encodeURIComponent(inbox.mailToken)}`);
                  if (res.ok) {
                    const data = await res.json();
                    const list = data?.list || [];
                    for (const msg of list) {
                      if (/guerrillamail/i.test(msg.mail_from || '')) continue;
                      const quickCode = extractSixDigitOtp(msg.mail_subject, msg.mail_excerpt, '', '');
                      if (quickCode) return quickCode;

                      const detailRes = await fetch(`https://api.guerrillamail.com/ajax.php?f=fetch_email&email_id=${msg.mail_id}&sid_token=${encodeURIComponent(inbox.mailToken)}`);
                      if (detailRes.ok) {
                        const detail = await detailRes.json();
                        const code = extractSixDigitOtp(detail.mail_subject, detail.mail_excerpt, '', detail.mail_body);
                        if (code) return code;
                      }
                    }
                  }
                }
              } catch {}
              await sleep(3000);
            }
            return null;
          }

