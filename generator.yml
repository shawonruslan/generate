            const romance = ['Soft Piano Serenade', 'Violin Love Theme', 'Heartbeat in Sync', 'Candlelight Jazz', 'Acoustic Love Song', 'Wedding Bells', 'Slow Dance Waltz', 'Sunset Guitar', 'Gentle Harp Melody', 'Whispering Lovers'];
