name: ai_image_studio
description: AI Image Studio - Cloudinary text-to-image and image-to-image generator for Windows and Android.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # Windows-only: embedded Edge WebView2 for the Gemini Web provider
  # (no API key needed). Guarded by Platform.isWindows at runtime; the
  # Dart API is pure method channels so Android builds are unaffected.
  webview_windows: ^0.4.0
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  archive: ^3.6.1
  # image 4.3.x: last line compatible with archive ^3.6.1
  # (image >=4.5.2 requires archive ^4.0.2, which conflicts).
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# App icons are pre-generated and committed (no icon tool needed):
#   assets/icon/app_icon.png              -> source artwork (MH monogram)
#   assets/icon/app_icon.ico              -> Windows exe + installer
#   assets/icon/android/mipmap-*/...png   -> Android launcher (mdpi-xxxhdpi)
#   assets/icon/android/mipmap-anydpi-v26 -> Android adaptive icon (API 26+)
#   assets/icon/android/values            -> adaptive icon background color
# CI copies them into the generated windows/ and android/ runners before building.
