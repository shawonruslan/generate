name: ai_image_studio
description: AI Image Studio - Cloudinary text-to-image and image-to-image generator for Windows and Android.
publish_to: "none"
version: 1.12.1+24

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # MediaType for multipart image uploads (already a dependency of http)
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  archive: ^3.6.1
  # image 4.3.x: last line compatible with archive ^3.6.1
  # (image >=4.5.2 requires archive ^4.0.2, which conflicts).
  image: ^4.3.0
  # sha256 for distribution dedup hashes (mirrors the workflow ledger)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
  # Inter (SIL Open Font License, assets/fonts/Inter-OFL.txt): the same
  # clean UI font on every phone, instead of each maker's system font.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icons are pre-generated and committed (no icon tool needed):
#   assets/icon/app_icon.png              -> source artwork (MH monogram)
#   assets/icon/app_icon.ico              -> Windows exe + installer
#   assets/icon/android/mipmap-*/...png   -> Android launcher (mdpi-xxxhdpi)
#   assets/icon/android/mipmap-anydpi-v26 -> Android adaptive icon (API 26+)
#   assets/icon/android/values            -> adaptive icon background color
# CI copies them into the generated windows/ and android/ runners before building.
