name: ai_image_studio
description: AI Image Studio - Cloudinary text-to-image and image-to-image generator for Windows and Android.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1B4B"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
