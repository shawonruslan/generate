name: teamdrive
description: Team Drive native app — Android + Windows. Full Flutter, zero WebView. Talks directly to the Cloudflare Worker API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  image: ^4.2.0
  flutter_svg: ^2.0.9
  video_player: ^2.8.6
  just_audio: ^0.9.40
  pdfrx: ^1.0.55
  archive: ^3.6.1
  cronet_http: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
