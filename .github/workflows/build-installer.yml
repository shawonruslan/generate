name: Build MH Virtualcam Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch DirectShow BaseClasses
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-classic-samples.git C:\dshow-samples
          cd C:\dshow-samples
          git sparse-checkout set Samples/Win7Samples/multimedia/directshow/baseclasses

      - name: Build DirectShow BaseClasses (x64 & Win32)
        shell: cmd
        run: |
          set DSHOW_DIR=C:\dshow-samples\Samples\Win7Samples\multimedia\directshow\baseclasses
          msbuild "%DSHOW_DIR%\baseclasses.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:ConformanceMode=false /m
          msbuild "%DSHOW_DIR%\baseclasses.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:ConformanceMode=false /m

      - name: Build MHVirtualCamFilter (x64 & Win32)
        shell: cmd
        env:
          DSHOW_BASE: C:\dshow-samples\Samples\Win7Samples\multimedia\directshow\baseclasses
        run: |
          msbuild filter\MHVirtualCamFilter.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          msbuild filter\MHVirtualCamFilter.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Publish MHVirtualCamApp (win-x64 self-contained)
        shell: pwsh
        run: |
          dotnet publish app\MHVirtualCamApp.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Build EXE Installer with Inno Setup
        shell: cmd
        run: |
          iscc installer\MHVirtualCam.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Virtualcam-Setup
          path: dist\MH-Virtualcam-Setup.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\MH-Virtualcam-Setup.exe
