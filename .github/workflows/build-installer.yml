name: Build MH Advanced Tool Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch DirectShow BaseClasses
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-classic-samples.git C:\dshow-samples
          cd C:\dshow-samples
          git sparse-checkout set Samples/Win7Samples/multimedia/directshow/baseclasses

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DirectShow Filter & Windows 11 MF Virtual Camera (x64)
        shell: pwsh
        run: |
          $dshow = "C:\dshow-samples\Samples\Win7Samples\multimedia\directshow\baseclasses"
          $objDir = "$dshow\obj_x64"
          $libDir = "$dshow\x64\Release"
          New-Item -ItemType Directory -Force -Path $objDir, $libDir, "filter\x64\Release", "mf\x64\Release" | Out-Null

          $cpps = Get-ChildItem "$dshow\*.cpp" | Where-Object { $_.Name -ne "dllentry.cpp" } | ForEach-Object { $_.FullName }
          cl /nologo /c /MT /O2 /EHsc /DWIN32 /DNDEBUG /D_WINDOWS /DUNICODE /D_UNICODE /Zc:strictStrings- /W0 /I"$dshow" "/Fo$objDir/" @cpps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          lib /nologo /OUT:"$libDir\strmbase.lib" "$objDir\*.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cl /nologo /LD /MT /O2 /EHsc /DWIN32 /DNDEBUG /D_WINDOWS /D_USRDLL /DUNICODE /D_UNICODE /Zc:strictStrings- /W3 /I"$dshow" filter\filter.cpp "$dshow\dllentry.cpp" "/Fo$objDir/" /Fe:"filter\x64\Release\MHVirtualCamFilter.dll" /link /DEF:filter\MHVirtualCamFilter.def "$libDir\strmbase.lib" strmiids.lib winmm.lib ole32.lib oleaut32.lib uuid.lib user32.lib advapi32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Windows 11 Media Foundation Virtual Camera COM Source DLL (x64)
          cl /nologo /LD /MT /O2 /EHsc /DWIN32 /DNDEBUG /D_WINDOWS /D_USRDLL /DUNICODE /D_UNICODE /W3 mf\mfsource.cpp "/Fomf\x64\Release/" /Fe:"mf\x64\Release\MHVirtualCamMF.dll" /link /DEF:mf\MHVirtualCamMF.def mfplat.lib mf.lib mfuuid.lib ole32.lib oleaut32.lib uuid.lib advapi32.lib user32.lib shell32.lib winmm.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Windows 11 Media Foundation Virtual Camera Registration Helper (x64)
          cl /nologo /MT /O2 /EHsc /DWIN32 /DNDEBUG /DUNICODE /D_UNICODE /W3 mf\register_mf.cpp "/Fomf\x64\Release/" /Fe:"mf\x64\Release\MHVirtualCamReg.exe" /link mfplat.lib mf.lib mfuuid.lib ole32.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build DirectShow BaseClasses & Filter (Win32)
        shell: pwsh
        run: |
          $dshow = "C:\dshow-samples\Samples\Win7Samples\multimedia\directshow\baseclasses"
          $objDir = "$dshow\obj_x86"
          $libDir = "$dshow\Release"
          New-Item -ItemType Directory -Force -Path $objDir, $libDir, "filter\Release" | Out-Null

          $cpps = Get-ChildItem "$dshow\*.cpp" | Where-Object { $_.Name -ne "dllentry.cpp" } | ForEach-Object { $_.FullName }
          cl /nologo /c /MT /O2 /EHsc /DWIN32 /DNDEBUG /D_WINDOWS /DUNICODE /D_UNICODE /Zc:strictStrings- /W0 /I"$dshow" "/Fo$objDir/" @cpps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          lib /nologo /OUT:"$libDir\strmbase.lib" "$objDir\*.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cl /nologo /LD /MT /O2 /EHsc /DWIN32 /DNDEBUG /D_WINDOWS /D_USRDLL /DUNICODE /D_UNICODE /Zc:strictStrings- /W3 /I"$dshow" filter\filter.cpp "$dshow\dllentry.cpp" "/Fo$objDir/" /Fe:"filter\Release\MHVirtualCamFilter.dll" /link /DEF:filter\MHVirtualCamFilter.def "$libDir\strmbase.lib" strmiids.lib winmm.lib ole32.lib oleaut32.lib uuid.lib user32.lib advapi32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish MH Advanced Tool & Virtual Camera (win-x64 self-contained)
        shell: pwsh
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          dotnet publish app\MHVirtualCamApp.csproj -c Release -r win-x64 -p:PlatformTarget=x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish browser\MHBrowser.csproj -c Release -r win-x64 -p:PlatformTarget=x64 --self-contained true -o publish_browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle Portable OpenVPN, TAP-Windows6 Driver & Userspace WireGuard (wireproxy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "vpn\openvpn", "vpn\wireguard", "C:\vpn-tmp\ovpn", "C:\vpn-tmp\wg", "C:\vpn-tmp\wp" | Out-Null

          # 1) Official OpenVPN 2.6.17 x64 binaries (openvpn.exe + tapctl.exe + OpenSSL DLLs)
          Invoke-WebRequest -Uri "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.17-I001-amd64.msi" -OutFile "C:\vpn-tmp\openvpn.msi"
          Start-Process msiexec.exe -ArgumentList "/a C:\vpn-tmp\openvpn.msi /qn TARGETDIR=C:\vpn-tmp\ovpn" -Wait
          $ovpnBin = Get-ChildItem -Path "C:\vpn-tmp\ovpn" -Recurse -Filter "openvpn.exe" | Select-Object -First 1
          if ($ovpnBin) {
            Copy-Item "$($ovpnBin.DirectoryName)\*" "vpn\openvpn\" -Recurse -Force
          }

          # 2) Official Microsoft attestation-signed TAP-Windows6 driver installer (silent /S during setup)
          Invoke-WebRequest -Uri "https://build.openvpn.net/downloads/releases/tap-windows-9.24.7-I601-Win10.exe" -OutFile "vpn\openvpn\tap-windows-setup.exe"

          # 3) Userspace WireGuard SOCKS5 proxy (wireproxy.exe) for per-profile isolated WireGuard
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/windtf/wireproxy/releases/latest" -Headers @{ "User-Agent" = "MHAdvancedTool-CI" }
            $asset = $rel.assets | Where-Object { $_.name -like "*windows*amd64*" } | Select-Object -First 1
            if ($asset) {
              $outArc = "C:\vpn-tmp\wp\$($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outArc
              if ($asset.name -like "*.zip") {
                Expand-Archive -Path $outArc -DestinationPath "C:\vpn-tmp\wp\out" -Force
              } else {
                New-Item -ItemType Directory -Force -Path "C:\vpn-tmp\wp\out" | Out-Null
                tar -xzf $outArc -C "C:\vpn-tmp\wp\out"
              }
              $wpExe = Get-ChildItem -Path "C:\vpn-tmp\wp\out" -Recurse -Filter "wireproxy.exe" | Select-Object -First 1
              if ($wpExe) {
                Copy-Item $wpExe.FullName "vpn\wireguard\wireproxy.exe" -Force
              }
            }
          } catch {
            Write-Warning "wireproxy bundle skipped: $_"
          }

          # 4) Official WireGuard x64 binaries (optional system-wide fallback)
          try {
            Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi" -OutFile "C:\vpn-tmp\wireguard.msi"
            Start-Process msiexec.exe -ArgumentList "/a C:\vpn-tmp\wireguard.msi /qn TARGETDIR=C:\vpn-tmp\wg" -Wait
            $wgBin = Get-ChildItem -Path "C:\vpn-tmp\wg" -Recurse -Filter "wireguard.exe" | Select-Object -First 1
            if ($wgBin) {
              Copy-Item "$($wgBin.DirectoryName)\*" "vpn\wireguard\" -Recurse -Force
            }
          } catch {
            Write-Warning "WireGuard MSI bundle skipped: $_"
          }

      - name: Bundle Real Chromium (Stable win64) & Patch Custom MH Browser Icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "chromium", "C:\cft-tmp" | Out-Null
          $meta = Invoke-RestMethod -Uri "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          $stableVer = $meta.channels.Stable.version
          $dl = ($meta.channels.Stable.downloads.chrome | Where-Object { $_.platform -eq "win64" } | Select-Object -First 1).url
          Write-Host "Bundling Real Chromium Stable win64 v$stableVer from $dl"
          Invoke-WebRequest -Uri $dl -OutFile "C:\cft-tmp\chrome-win64.zip"
          Expand-Archive -Path "C:\cft-tmp\chrome-win64.zip" -DestinationPath "C:\cft-tmp\out" -Force
          Copy-Item "C:\cft-tmp\out\chrome-win64\*" "chromium\" -Recurse -Force
          Set-Content -Path "chromium\version.txt" -Value $stableVer -NoNewline

          # Patch chrome.exe embedded PE icon with our custom MH Browser Globe logo (browser/browser.ico)
          try {
            $rcRel = Invoke-RestMethod -Uri "https://api.github.com/repos/electron/rcedit/releases/latest" -Headers @{ "User-Agent" = "MHAdvancedTool-CI" }
            $rcAsset = $rcRel.assets | Where-Object { $_.name -like "*x64.exe" } | Select-Object -First 1
            if ($rcAsset) {
              Invoke-WebRequest -Uri $rcAsset.browser_download_url -OutFile "C:\cft-tmp\rcedit-x64.exe"
              & "C:\cft-tmp\rcedit-x64.exe" "chromium\chrome.exe" --set-icon "browser\browser.ico"
              Write-Host "Patched chromium\chrome.exe icon with browser\browser.ico!"
            }
          } catch {
            Write-Warning "rcedit icon patch skipped (runtime WM_SETICON still applies): $_"
          }

      - name: Build EXE Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            iscc installer\MHVirtualCam.iss
          } else {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MHVirtualCam.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Advanced-Tool-Setup
          path: dist\MH-Advanced-Tool-Setup.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\MH-Advanced-Tool-Setup.exe
