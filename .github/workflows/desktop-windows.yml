name: Desktop (Windows) - Meta Hawladar

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/java/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Sync desktop sources from the Android module
        shell: pwsh
        run: |
          if (Test-Path desktop/sync-sources.ps1) { pwsh desktop/sync-sources.ps1 }

      - name: Build installers (.msi + .exe) and portable jar
        shell: pwsh
        run: |
          gradle :desktop:packageMsi :desktop:packageExe :desktop:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload portable JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-portable-jar
          path: desktop/build/compose/jars/*.jar
          if-no-files-found: warn
