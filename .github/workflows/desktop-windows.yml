name: Desktop (Windows) - Meta Hawladar

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/java/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Sync desktop sources from the Android module
        shell: pwsh
        run: |
          if (Test-Path desktop/sync-sources.ps1) { pwsh desktop/sync-sources.ps1 }

      - name: Build installers (.msi + .exe), portable app folder and portable jar
        shell: pwsh
        run: |
          gradle :desktop:packageMsi :desktop:packageExe :desktop:createDistributable :desktop:packageUberJarForCurrentOS --no-daemon --stacktrace

      # v31: ship the elevated-install helper next to the MSI (fixes error 2503/2502 on PCs with a broken Windows\Temp ACL)
      - name: Add install helper next to the MSI
        shell: pwsh
        run: |
          Copy-Item desktop/installer/Install-MetaHawladar.bat desktop/build/compose/binaries/main/msi/
          Copy-Item desktop/installer/INSTALL-README.txt desktop/build/compose/binaries/main/msi/

      # v31: portable build - no installer at all, unzip and run "Meta Hawladar.exe"
      - name: Zip portable app folder
        shell: pwsh
        run: |
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/Meta Hawladar" -DestinationPath "desktop/build/MetaHawladar-windows-portable.zip" -Force

      - name: Upload MSI (+ install helper)
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-windows-msi
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/msi/Install-MetaHawladar.bat
            desktop/build/compose/binaries/main/msi/INSTALL-README.txt
          if-no-files-found: error

      - name: Upload portable app (no installer)
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-windows-portable
          path: desktop/build/MetaHawladar-windows-portable.zip
          if-no-files-found: error

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload portable JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetaHawladar-portable-jar
          path: desktop/build/compose/jars/*.jar
          if-no-files-found: warn
