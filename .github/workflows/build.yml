name: Build APK and Windows EXE

# Builds Team Drive for Android (APK) and Windows (EXE) with Flutter.
# Triggers on every push to main and on manual dispatch.
# No WebView anywhere — 100% Flutter widgets, direct worker API calls.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # The repo ships only the Dart side (lib/, pubspec.yaml). Generate the
      # Android platform folder with the official "add a platform" flow so the
      # exact Flutter version in CI produces its own version-matched Gradle
      # project. Existing lib/, pubspec.yaml and assets are left untouched.
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.teamdrive --project-name teamdrive .

      # Ensure INTERNET + network + storage permissions are in the manifest.
      # (Missing INTERNET permission = "Failed host lookup" on device.)
      - name: Fix Android manifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for perm in "android.permission.INTERNET" "android.permission.ACCESS_NETWORK_STATE" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE" "android.permission.READ_MEDIA_IMAGES" "android.permission.READ_MEDIA_VIDEO" "android.permission.READ_MEDIA_AUDIO"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              if [ "$perm" = "android.permission.WRITE_EXTERNAL_STORAGE" ]; then
                sed -i "s|<manifest xmlns:android=.*|<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"$perm\" android:maxSdkVersion=\"28\"/>|" "$MANIFEST"
              else
                sed -i "s|<manifest xmlns:android=.*|<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"$perm\"/>|" "$MANIFEST"
              fi
            fi
          done
          grep "uses-permission" "$MANIFEST"

      # flutter create also drops in a default counter-app widget test that
      # references a non-existent MyApp class — it breaks analyze, delete it.
      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      # Custom Team Drive icon (repo ships the PNGs; CI copies them over the
      # flutter create defaults before the release build embeds them).
      - name: Install custom app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/icon/android/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Get dependencies (again, after platform files)
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamdrive-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    # windows-2022 carries complete VS2019 + VS2022 installs with the C++
    # workload — the combo Flutter 3.24's Windows build expects. windows-latest
    # (2025) only ships VS2022 and trips CMake's VS2019 generator lookup.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      # Same as Android: generate the Windows platform folder in CI so the
      # runner's Flutter version produces its own matched CMake project.
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.teamdrive --project-name teamdrive .

      # Same default counter-app test as on Android — breaks analyze, delete it.
      - name: Remove default widget test
        run: rm -Force test/widget_test.dart

      # Custom Team Drive icon (repo ships the .ico; CI copies it over the
      # flutter create default before the release build embeds it).
      - name: Install custom app icon
        shell: pwsh
        run: Copy-Item assets/icon/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Set up the MSVC compiler environment (INCLUDE/LIB/PATH) before CMake
      # runs — the standard prerequisite for Flutter Windows builds on CI.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release EXE
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (setup.exe)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split ':')[1].Trim().Split('+')[0] })
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAPP_VERSION=$ver" packaging/windows/teamdrive.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: teamdrive-windows-installer
          path: installer/TeamDrive-Setup-*.exe
          if-no-files-found: error

      - name: Zip the Windows release folder (portable)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split ':')[1].Trim().Split('+')[0] })
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "teamdrive-windows-portable-$ver.zip" -Force

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: teamdrive-windows-portable
          path: teamdrive-windows-portable-*.zip
          if-no-files-found: error
