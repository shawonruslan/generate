name: Build APK and Windows EXE

# Builds Team Drive for Android (APK) and Windows (EXE) with Flutter.
# Triggers on every push to main and on manual dispatch.
# No WebView anywhere — 100% Flutter widgets, direct worker API calls.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # The repo ships only the Dart side (lib/, pubspec.yaml). Generate the
      # Android platform folder with the official "add a platform" flow so the
      # exact Flutter version in CI produces its own version-matched Gradle
      # project. Existing lib/, pubspec.yaml and assets are left untouched.
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.teamdrive --project-name teamdrive .

      # flutter create also drops in a default counter-app widget test that
      # references a non-existent MyApp class — it breaks analyze, delete it.
      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Get dependencies (again, after platform files)
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamdrive-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      # Same as Android: generate the Windows platform folder in CI so the
      # runner's Flutter version produces its own matched CMake project.
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.teamdrive --project-name teamdrive .

      # Same default counter-app test as on Android — breaks analyze, delete it.
      - name: Remove default widget test
        run: rm -Force test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release EXE
        run: flutter build windows --release

      - name: Zip the Windows release folder
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split ':')[1].Trim().Split('+')[0] })
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "teamdrive-windows-$ver.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamdrive-windows-exe
          path: teamdrive-windows-*.zip
          if-no-files-found: error
