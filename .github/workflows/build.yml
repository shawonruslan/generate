name: Build Zedge Studio (Windows EXE + Android APK)

# Fully automatic: the repo only holds pubspec.yaml + lib/ + tool/ + installer/.
# The workflow itself installs the Flutter SDK, generates the native android/
# and windows/ projects, patches them, builds and packages everything.
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: Publish a GitHub Release with all artifacts
        type: boolean
        default: true
      flutter_version:
        description: Flutter SDK version to build with
        type: string
        default: 3.24.5
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  DEFAULT_FLUTTER_VERSION: 3.24.5
  APP_ORG: com.zedgeautomation
  PROJECT_NAME: zedge_studio

jobs:
  # ---------------------------------------------------------------
  # Shared metadata (version string used for every artifact name)
  # ---------------------------------------------------------------
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      flutter: ${{ steps.v.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          if [ -z "$VERSION" ]; then VERSION=1.0.0; fi
          FLUTTER="${{ github.event.inputs.flutter_version }}"
          if [ -z "$FLUTTER" ]; then FLUTTER="${{ env.DEFAULT_FLUTTER_VERSION }}"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "flutter=$FLUTTER" >> $GITHUB_OUTPUT
          echo "Building Zedge Studio $VERSION with Flutter $FLUTTER"

  # ---------------------------------------------------------------
  # ANDROID: split APKs + universal APK + Play Store AAB
  # ---------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.meta.outputs.flutter }}
          channel: stable
          cache: true

      - name: Generate + patch the native Android project
        run: |
          set -e
          flutter --version
          # keep our own sources safe from the template generator
          python3 tool/keep_sources.py save
          flutter create --project-name "$PROJECT_NAME" --org "$APP_ORG" \
            --platforms=android --description "Zedge Studio" .
          python3 tool/keep_sources.py restore
          python3 tool/patch_platforms.py android

      - name: Configure release signing (only if keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret found."
            echo "The release build will use the debug signing config - still installable."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          python3 tool/patch_platforms.py android-signing

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build split APKs (arm64 / arm / x86_64)
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Build Play Store bundle
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Collect artifacts
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/ZedgeStudio-$V-android-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$f" ] && cp "$f" "dist/ZedgeStudio-$V-android-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/ZedgeStudio-$V-android.aab"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------
  # WINDOWS: portable ZIP + professional Inno Setup installer EXE
  # ---------------------------------------------------------------
  windows:
    name: Windows (Installer EXE + Portable)
    needs: meta
    # VS 2022 (major 17) is the newest toolchain Flutter 3.24 can map to a
    # CMake generator. On windows-latest it finds a newer VS, fails to map it,
    # falls back to "Visual Studio 16 2019" and CMake then finds nothing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.meta.outputs.flutter }}
          channel: stable
          cache: true

      - name: Show the Visual Studio toolchain CMake will use
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "vswhere.exe not found - cannot inspect Visual Studio."
            exit 0
          }
          & $vswhere -products * -format json | ConvertFrom-Json |
            ForEach-Object { Write-Host ("{0} | {1} | {2}" -f $_.displayName, $_.installationVersion, $_.installationPath) }
          $cpp = & $vswhere -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -latest -property installationVersion
          Write-Host "C++ desktop workload version: $cpp"

      - name: Align Flutter with a newer Visual Studio (only if needed)
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { exit 0 }
          $version = & $vswhere -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -latest -property installationVersion
          if (-not $version) {
            Write-Host "No C++ desktop workload found - nothing to align."
            exit 0
          }
          $major = [int]($version.Split('.')[0])
          Write-Host "Visual Studio major version: $major"
          if ($major -le 17) {
            Write-Host "Flutter already maps this version - no patch needed."
            exit 0
          }
          $root = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          $file = Join-Path $root "packages\flutter_tools\lib\src\windows\visual_studio.dart"
          if (-not (Test-Path $file)) {
            Write-Host "visual_studio.dart not found - skipping."
            exit 0
          }
          $src = Get-Content $file -Raw
          if ($src -match 'ZEDGE_GENERATOR_PATCH') {
            Write-Host "Already patched."
            exit 0
          }
          $pattern = 'String\?\s+get\s+cmakeGenerator\s*\{'
          if ($src -notmatch $pattern) {
            Write-Host "cmakeGenerator getter not found - skipping."
            exit 0
          }
          $inject = "String? get cmakeGenerator {`n    // ZEDGE_GENERATOR_PATCH`n    if ((_majorVersion ?? 0) >= 18) {`n      return 'Visual Studio ' + _majorVersion.toString() + ' 2026';`n    }"
          $src = $src -replace $pattern, $inject
          Set-Content -Path $file -Value $src -NoNewline
          Remove-Item (Join-Path $root "bin\cache\flutter_tools.stamp") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root "bin\cache\flutter_tools.snapshot") -ErrorAction SilentlyContinue
          Write-Host "Patched Flutter's CMake generator mapping for VS $major."

      - name: Generate + patch the native Windows project
        shell: pwsh
        run: |
          flutter --version
          python tool/keep_sources.py save
          flutter config --enable-windows-desktop
          flutter create --project-name $env:PROJECT_NAME --org $env:APP_ORG `
            --platforms=android,windows --description "Zedge Studio" .
          python tool/keep_sources.py restore
          python tool/patch_platforms.py windows

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build release EXE
        run: >
          flutter build windows --release
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Package portable ZIP
        shell: pwsh
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\ZedgeStudio-$env:V-windows-x64-portable.zip" -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\zedge_studio.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------
  # RELEASE: attach every binary to a GitHub Release
  # ---------------------------------------------------------------
  release:
    name: Publish release
    needs: [meta, android, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build{1}', needs.meta.outputs.version, github.run_number) }}
          name: Zedge Studio ${{ needs.meta.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Native Flutter build of Zedge Studio - no WebView, no embedded browser.

            **Windows**
            - `ZedgeStudio-Setup-*.exe` - installer (Start menu + desktop shortcut + uninstaller)
            - `*-windows-x64-portable.zip` - unzip and run `ZedgeStudio.exe`

            **Android**
            - `*-android-arm64-v8a.apk` - almost every modern phone (smallest, recommended)
            - `*-android-universal.apk` - works on any CPU
            - `*.aab` - Play Store upload bundle
